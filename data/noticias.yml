  - data: "2022-10-06"
    categoria: "Institucional"
    titulo: "Atividade física no lazer e marcadores bioquímicos de alterações metabólicas durante a pandemia de covid-19: COVID-Inconfidentes"
    resumo: "O GPENSC relembra qualificação de doutorado da aluna Samara Silva de Moura (@mourasamara), que ocorreu no dia 16 de agosto de 2022, via Google Meet"
    conteudo: "O GPENSC relembra qualificação de doutorado da aluna Samara Silva de Moura (@mourasamara), que ocorreu no dia 16 de agosto de 2022, via Google Meet.\n.\n🔎 O projeto de doutorado da Samara, intitulado \"Atividade física no lazer e marcadores bioquímicos de alterações metabólicas durante a pandemia de covid-19: COVID-Inconfidentes\", tem como objetivo avaliar a prevalência da prática de atividade física no lazer em residentes da região dos Inconfidentes/MG durante a pandemia da covid-19 e seus fatores associados, assim como sua influência nos marcadores bioquímicos de alterações metabólicas. \n.\n👥 Seu estudo é orientado pela professora Dra. Adriana Meireles (@dri_meireles) e coorientação pela professora Dra. Júlia Carraro (@julia_carraro). O trabalho contou com as contribuições da banca formada pelos professores Drs. Lenice Becker - @lenice_becker (UFOP), Aline Dayrell - @dayrellferreira (UFMG), George Machado-Coelho - @georgellinsmachado (UFOP) e Pedro Hallal - pedrohallal (UFPEL).\n.\n👩🏻‍🏫 Os resultados preliminares evidenciam um aumento substancial na prevalência da inatividade física durante a restrição social devido a pandemia da covid-19, sendo observada maior vulnerabilidade entre os indivíduos com renda familiar mais baixa, baixo nível de escolaridade e cor de pele não branca.\n. \n💡 Esses achados reforçam a necessidade de programas que visem a promoção da qualidade de vida, para que os danos à saúde da população sejam mitigados em curto e longo prazo.\n.\n🎇 Parabenizamos a Samara pela aprovação na sua qualificação e pela contribuição na ciência do país. Desejamos à aluna sucesso nas próximas etapas!"
