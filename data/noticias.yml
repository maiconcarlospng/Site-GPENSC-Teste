    titulo: "O GPENSC relembra das defesas de TCCs do GPENSC que aconteceram em agosto desse ano, via Google Meet"
    resumo: "O GPENSC relembra das defesas de TCCs do GPENSC que aconteceram em agosto desse ano, via Google Meet"
    conteudo: "O GPENSC relembra das defesas de TCCs do GPENSC que aconteceram em agosto desse ano, via Google Meet.\n.\n👨🏻‍💻 No dia 26 de agosto, foi a defesa do Helton da Costa Paiva (@heltonpaiva05). O TCC, intitulado \"Mortalidade por doenças cardiovasculares e a carga atribuída ao consumo insuficiente de grãos integrais no Brasil, 1990-2019\", foi orientado pela profa. Dra. Adriana Meireles (@dri_meireles) e coorientado pela doutoranda Magda Parajára (@magdaparajara). Sua banca contou com a colaboração da profa. Dra. Júlia Carraro e da mestranda Carla Rocha (@carlaef.rocha).\n.\n👩🏻‍💻 No dia 30 de agosto, foi a defesa da Anna Luiza Polycarpo Cunha (@annapolycarpo). O TCC, intitulado \"Ácidos Graxos no tratamento do Lúpus Eritematoso Sistêmico: revisão sistemática\", foi orientado pela profa. Dra. Júlia Carraro e coorientado pela doutoranda Hillary Coletro (@hillarycoletro). A banca contou com as contribuições das profas. Dra. Renata Vieira (@renataadriellenutri) e Dra. Silvana Mara (@silluzturbino).\n.\n👩🏽‍💻 No dia 30 de agosto, também foi a defesa da Natalia Luisa Oliveira Gonzaga (@nataliagonzaga_). O TCC, intitulado “Consumo de bebidas açucaradas e seus determinantes em estudantes universitários: Estudo PADu”, foi orientado pela profa. Dra. Adriana Meireles e coorientado pela mestranda Bruna Barbosa (@brunabcrb18). O trabalho contou com as contribuições da banca composta pela profa. Dra. Marília Alfenas (@mariliaalfenas) e da doutoranda Hillary Coletro.\n.\n👩🏽‍💻 No dia 31 de agosto, foi a defesa da Roberta Luiza Silva Alves (@robertaluizasa). O TCC, intitulado “Prevalência de comportamento sedentário no lazer em estudantes universitários e seus fatores associados: Estudo PADu”, foi orientado pela profa. Dra. Adriana Meireles e coorientado pela doutoranda Magda Parajára. Sua banca contou com a colaboração da  profa. Dra. Raquel Mendonça (@raquelmendonca_enut) e da doutoranda Samara Moura (@mourasamara).\n.\n🎇 Parabenizamos os alunos pelas defesas dos TCCs e desejamos sucesso nas próximas etapas!"
