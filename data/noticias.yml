  - data: "2023-06-08"
    categoria: "Pesquisa"
    titulo: "Nessa semana, apresentamos para vocês a pesquisa da mestranda Jussara Quintão sobre Índice Inflamatório da Dieta (IID)"
    resumo: "Nessa semana, apresentamos para vocês a pesquisa da mestranda Jussara Quintão (@nutri.juquintao) sobre Índice Inflamatório da Dieta (IID)"
    conteudo: "Nessa semana, apresentamos para vocês a pesquisa da mestranda Jussara Quintão (@nutri.juquintao) sobre Índice Inflamatório da Dieta (IID). Mas qual a importância de estudar esse tema?\n.\n📕 O IID é um instrumento que analisa a dieta atribuindo pontuação que varia entre maximamente pró-inflamatório à maximamente anti-inflamatório. O instrumento foi proposto por Cavicchia e colaboradores (2009) e modificado por Shivappa e colaboradores (2014). \n.\n🎯 O objetivo deste artigo foi desenhar e desenvolver um índice dietético baseado na população, derivado da literatura, para comparar diversas populações quanto ao potencial inflamatório de suas dietas. Foram incluídos no algoritmo de pontuação do IID, artigos publicados até dezembro de 2010 sobre o efeito dos parâmetros dietéticos de seis marcadores inflamatórios.\n.\n📝 Foram identificados 11 estudos sobre consumo alimentar que permitiram expressar a ingestão em relação à faixa de ingestão dos 45 parâmetros alimentares observados. Foram 1.943 artigos qualificados e pontuados com base nos 45 parâmetros alimentares pró e anti-inflamatórios identificados na pesquisa.\n.\n🔎 Os achados do artigo evidenciam que a tentativa inédita de relacionar a ingestão de alimentos moduladores da inflamação em relação às normas globais, obteve sucesso. Dessa forma, o IID apresenta ser uma ferramenta efetiva de ser utilizada em estudos epidemiológicos e clínicos.\n.\n👉🏼 Arrasta para o lado para conferir o resumo do artigo."
    url: "https://www.instagram.com/p/CtPmz0Suf1K/"
    imagem: "img/instagram-acervo/CtPmz0Suf1K.webp"
  - data: "2023-06-06"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: mestranda Jussara Quintão Faria"
    resumo: "O GPENSC apresenta mais um de nossos pesquisadores, a mestranda Jussara Quintão Faria (@nutri.juquintao)"
    conteudo: "O GPENSC apresenta mais um de nossos pesquisadores, a mestranda Jussara Quintão Faria (@nutri.juquintao).\n.\n🧑🏻‍🎓Jussara é nutricionista formada pela Universidade Federal de Ouro Preto (UFOP). Ao longo de sua graduação, ingressou em vários projetos de extensão, e com o apoio da Escola de Nutrição (ENUT/UFOP) e do Centro Acadêmico Livre de Nutrição (CALNUT) fundou a Liga Acadêmica de Nutrição em Oncologia (@lanon.ufop). Atualmente, é mestranda no Programa de Pós-graduação em Saúde e Nutrição (PPGSN/UFOP - @ppgsn.ufop), na linha de pesquisa Saúde e Nutrição em indivíduos e coletividades. \n.\n📚 É pesquisadora do projeto HipertenSUS e sua pesquisa de mestrado é intitulada \"Avaliação do Índice Inflamatório do Dieta antes e depois de intervenção nutricional para manejo da pressão arterial: Projeto HipertenSUS\", sob orientação da professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut) e coorientação da professora Dra. Renata Adrielle Lima Vieira (@renataadriellenutri).\n.\n🔎 Quer saber mais sobre o tema da Jussara? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo!"
