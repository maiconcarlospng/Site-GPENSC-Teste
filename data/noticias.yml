  - data: "2025-07-22"
    categoria: "Multimídia"
    titulo: "Você sabia que o Guia Alimentar para a População Brasileira agora também inspira podcasts educativos?"
    resumo: "Você sabia que o Guia Alimentar para a População Brasileira agora também inspira podcasts educativos? Um estudo conduzido por Tainá Cristina Damasceno Silva (@tainacdamasceno), juntamente…"
    conteudo: "Você sabia que o Guia Alimentar para a População Brasileira agora também inspira podcasts educativos? \n\nUm estudo conduzido por Tainá Cristina Damasceno Silva (@tainacdamasceno), juntamente com outros pesquisadores do GPENSC, buscou validar podcasts sobre comensalidade e custo da alimentação pautados no Guia Alimentar para a População Brasileira. \n \nO que foi feito?\nForam desenvolvidos podcasts educativos que passaram por rigoroso processo de validação em 5 etapas: \n✔️ elaboração do instrumento de validação;\n✔️ avaliação pelos juízes de conteúdo e técnicos/especialistas;\n✔️ ajustes dos podcasts;\n✔️ avaliação pelo público-alvo;\n✔️ reajustes nos podcasts.\n\nParticiparam do estudo 7 juízes de conteúdo, 15 técnicos e especialistas e 27 usuários da Atenção Primária à Saúde. As análises foram realizadas por meio do Índice de Validade de Conteúdo (IVC) por item e global.\n\nConclusão:\nOs podcasts sobre comensalidade e custo da alimentação foram validados com sucesso e têm grande potencial para apoiar ações de Educação Alimentar e Nutricional em serviços de saúde e outros espaços educativos!\n\n🔗Acesse o artigo completo: https://pubs.sciepub.com/jfs/13/2/4/index.html"
    url: "https://www.instagram.com/p/DMbKdRMxkhl/"
    imagem: "img/instagram-acervo/DMbKdRMxkhl.webp"
