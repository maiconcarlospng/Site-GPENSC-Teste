    categoria: "Ensino"
    titulo: "O GPENSC apresenta as alunas de Iniciação Científica do “Projeto sobre Ansiedade e Depressão em Universitários” (PADu - @padufederais) e membros do GPENSC"
    resumo: "O GPENSC apresenta as alunas de Iniciação Científica do “Projeto sobre Ansiedade e Depressão em Universitários” (PADu - @padufederais) e membros do GPENSC"
    conteudo: "O GPENSC apresenta as alunas de Iniciação Científica do “Projeto sobre Ansiedade e Depressão em Universitários” (PADu - @padufederais) e membros do GPENSC.\n.\n🎓 A Isadora Dantas Sakr Khouri (@isadorasakr) é aluna do oitavo período do curso de Medicina da Universidade Federal de Ouro Preto (UFOP), orientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientada pela mestranda Bruna Carolina Rafael Barbosa (@brunabcrb18). Seu tema de pesquisa dentro do projeto PADu-COVID é “Impactos da pandemia na saúde mental da comunidade acadêmica da UFOP”.\n.\n🎓 A Wanessa Cecília de Oliveira (@_wanessa.o) é aluna do sexto período de Ciências Biológicas (bacharelado), da UFOP. Seu tema de pesquisa e do seu Trabalho de Conclusão de Curso (TCC) dentro desse projeto maior é \"Efeito da COVID-19 na utilização de fármacos pela comunidade acadêmica\". Wanessa é orientada pela professora Dra. Glenda Nicioli (@glenda_abcdef) e coorientada pela doutoranda Waléria de Paula (@waleria_dp).\n.\n🎓 A Mariana Cassemira Aparecida Vidigal (@mariana.vidigal) é aluna do sétimo período do curso de Nutrição (UFOP). No seu TCC, intitulado \"Preditores da percepção de saúde negativa em estudantes universitários\", foram utilizados os dados do PADu-Ingressantes. Na iniciação, a aluna trabalhará com o PADu-COVID. Mariana é orientada pela professora Dra. Adriana Lúcia Meireles e coorientada pela doutoranda Waléria de Paula.\n.\n🎓 A Larissa Menezes Santos Carvalho (@lissamenezes) é aluna do quinto período do curso de Nutrição (UFOP) e é orientada pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut) na sua iniciação. Seu estudo faz parte do PADu-COVID e seu tema de pesquisa é \"Pandemia de Covid-19 e o perfil nutricional da comunidade acadêmica\".\n.\n🗣 Continue nos acompanhando para saber mais sobre o nosso grupo e os projetos que desenvolvemos!"
