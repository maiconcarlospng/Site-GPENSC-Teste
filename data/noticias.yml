    titulo: "Equipe do GPENSC: mestranda Wanessa Cecília de Oliveira"
    resumo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a mestranda Wanessa Cecília de Oliveira (@_wanessa.o)"
    conteudo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a mestranda Wanessa Cecília de Oliveira (@_wanessa.o).\n.\n👩🏻‍🎓 A Wanessa é bióloga graduada pela Universidade Federal de Ouro Preto (UFOP). Atualmente, é mestranda do Programa de Pós Graduação em Saúde e Nutrição (PPGSN -@ppgsn.ufop), na linha de Pesquisa Saúde e Nutrição em Indivíduos e Coletividades. É pesquisadora do “Estudo dos fatores de risco cardiovasculares na população infantil de Ouro Preto – Projeto Coraçõezinhos de Ouro Preto”.\n.\n📚 Sua pesquisa de mestrado é intitulada \"Consumo alimentar infantil durante a covid-19 e fatores associados\", sob orientação da professora Dra. Adriana Lúcia Meireles (@dri_meireles). \n.\n🔎 Quer saber mais sobre o tema da Wanessa? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo!"
