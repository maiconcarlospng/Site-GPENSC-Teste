    categoria: "Pesquisa"
    titulo: "UFOP EXPLICA - ALIMENTAÇÃO SUSTENTÁVEL/ ALIMENTACIÓN SOSTENIBLE"
    resumo: "UFOP EXPLICA - ALIMENTAÇÃO SUSTENTÁVEL/ ALIMENTACIÓN SOSTENIBLE Alimentação sustentável é um modelo de dieta que promove a saúde humana ao mesmo tempo em que respeita…"
    conteudo: "UFOP EXPLICA - ALIMENTAÇÃO SUSTENTÁVEL/ ALIMENTACIÓN SOSTENIBLE\n\nAlimentação sustentável é um modelo de dieta que promove a saúde humana ao mesmo tempo em que respeita o meio ambiente. Ela se baseia em alimentos de origem vegetal, produzidos localmente e com baixo impacto ambiental. Ujué Fresán, pesquisadora do programa Sustainability in Biosystems do Institute of Research and Technology in Agro-Food - IRTA, Barcelona, na Espanha, nos apresenta informações sobre o tema.\n\nLa alimentación sostenible es un modelo de dieta que promueve la salud humana respetando el medio ambiente. Se basa en alimentos de origen vegetal, producidos localmente y con bajo impacto ambiental. Ujué Fresán, investigadora del programa de Sostenibilidad en Biosistemas del Instituto de Investigación y Tecnología Agroalimentaria (IRTA) de Barcelona, ​​España, ofrece información sobre el tema."
