  - data: "2020-07-21"
    categoria: "Pesquisa"
    titulo: "Queremos convidar os alunos e servidores/funcionários da UFOP para participarem da pesquisa “PADu COVID-19”!"
    resumo: "Queremos convidar os alunos e servidores/funcionários da UFOP para participarem da pesquisa “PADu COVID-19”!"
    conteudo: "Queremos convidar os alunos e servidores/funcionários da UFOP para participarem da pesquisa “PADu COVID-19”!\n.\nO estudo já começou!! 🚨📢\n.\nPesquisadoras da #UFOP e #UniBH se uniram pra entender o efeito da pandemia da #COVID-19 na comunidade acadêmica, surgindo assim o PADu COVID-19! 🦠\n.\nO estudo faz parte do Projeto de Ansiedade e Depressão em universitários (PADu) e busca compreender como você estudante ou servidor/funcionário tem enfrentado esse período de pandemia.\n.\nPara participar, basta responder ao questionário online 💻:\n• Estudantes: https://docs.google.com/forms/d/e/1FAIpQLSecv3SfG9gU0TPrfPN8iV6PbOCY0HDAX1I0RTeiy3j5cDsikQ/viewform\n• Servidores/funcionários: https://docs.google.com/forms/d/e/1FAIpQLSdX1KpgP5XOjeJg8yiDK2QEAiwEKr71qJIAGQvXJ-UQ7icQ7w/viewform?usp=sf_link\n.\nNão deixe de contribuir com a ciência realizada na sua instituição! \n \nPara maiores informações, entre em contato no e-mail 📧: paducovid.ppgsn@ufop.edu.br"
