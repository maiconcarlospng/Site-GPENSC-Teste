  - data: "2024-04-25"
    categoria: "Institucional"
    titulo: "O GPENSC relembra a defesa de doutorado da aluna Samara Moura, que ocorreu no dia 08 de março de 2024, no formato online"
    resumo: "O GPENSC relembra defesa de doutorado da aluna Samara Moura (@mourasamara), que ocorreu no dia 08 de março de 2024, no formato online"
    conteudo: "O GPENSC relembra defesa de doutorado da aluna Samara Moura (@mourasamara), que ocorreu no dia 08 de março de 2024, no formato online.\n.\n🔎 A tese de doutorado da Samara, intitulada “Atividade física durante a pandemia de covid-19: Interfaces com a saúde física, qualidade do sono e autoavaliação de saúde”, teve como objetivo avaliar os fatores associados à inatividade física (IF) em residentes da região dos Inconfidentes, Minas Gerais, durante a pandemia da Covid-19.\n.\n👥 Seu estudo foi orientado pela professora Dra. Adriana Lúcia Meireles - @dri_meireles (UFOP) e coorientado pelo professora Dra. Júlia Cristina Cardoso Carraro - @julia_carraro (UFOP). O trabalho contou com as contribuições da banca formada pelas professoras Dra. Aline Dayrell Ferreira Sales - @dayrellferreira (UFMG) e Dra. Lenice Kappes Becker - @lenice_becker (UFOP), pelo professor Luiz Menezes - @luizmenezes__ (UFOP) e pela pesquisadora Dra. Magda do Carmo Parajára - @magdaparajara (UFMG).\n.\n📊 Os resultados da tese da Samara mostram uma associação entre a IF e o aumento do risco cardiovascular. Adicionalmente, a IF demonstrou influenciar negativamente os fatores metabólicos, incluindo a elevação dos níveis séricos da hemoglobina glicada, contribuindo para o aumento das doenças crônicas, como diabetes. \n.\n📈 Além disso, ao buscar compreender a complexidade das interações entre atividade física(AF) e autoavaliação de saúde, observou que a AF não apenas atua na saúde física, mas também contribui para a melhoria em suas percepções individuais de bem-estar. Ademais, os seus achados indicam que uma boa qualidade de sono pode, por sua vez, influenciar positivamente a adesão consistente a prática de AF. \n.\n💡Esses achado reforçam que a prática regular de AF é uma estratégia fundamental associada a repercussões adversas na saúde física, bioquímica e mental durante a pandemia da covid-19.\n.\n🎆 Parabenizamos a Samara pela defesa de doutorado e pela contribuição na ciência do país. Sucesso sempre!"
    url: "https://www.instagram.com/p/C6Mtfh2ObUw/"
    imagem: "img/instagram-acervo/C6Mtfh2ObUw.webp"
  - data: "2024-04-12"
    categoria: "Institucional"
    titulo: "O dia de #tbt foi ontem, mas bora relembrar uma data especial para o GPENSC?"
    resumo: "O dia de #tbt foi ontem, mas bora relembrar uma data especial para o GPENSC?"
    conteudo: "O dia de #tbt foi ontem, mas bora relembrar uma data especial para o GPENSC? 🔙😍\n.\n🗓️ Nosso tbt de hoje é para lembrar da defesa de mestrado da Wanessa Cecília de Oliveira (@_wanessa.o), que ocorreu no dia 27 de março de 2024, no formato online.\n.\n🔎 A dissertação da Wanessa, intitulada “Consumo alimentar conforme a extensão e propósito de processamento e comportamento sedentário em crianças de cinco a dez anos”, teve como objetivo analisar a associação entre o comportamento sedentário e o consumo alimentar. \n.\n👥 Seu estudo foi orientado pela professora Dra. Adriana Meireles – UFOP (@dri_meireles) e coorientada pelo professor Dr. Luiz Antônio Menezes – UFOP (@luizmenezes__). O trabalho contou com a contribuição da banca formada pela professora Dra. Mayla Toffolo –  UFOP ( @maylanut) e pela pesquisadora Dra. Magda Parajará – (@magdaparajara).\n.\n💡Os resultados da dissertação da Wanessa reforçam a importância de promover práticas saudáveis desde a infância e destacam a necessidade de estratégias integradas entre famílias, escolas e autoridades de saúde. Priorizar ações que incentivem a atividade física regular, reduzam o tempo excessivo de tela e promovam o consumo de alimentos naturais e minimamente processados são passos fundamentais para garantir o bem-estar e a qualidade de vida das crianças, tanto no contexto atual quanto nas perspectivas futuras.\n.\n🎆 Parabenizamos a Wanessa pela defesa e pela contribuição na ciência do país."
    url: "https://www.instagram.com/p/C5qq6kquuLj/"
    imagem: "img/instagram-acervo/C5qq6kquuLj.webp"
