    conteudo: "No post de hoje, vamos rever e relembrar alguns momentos especiais do GPENSC no ano de 2022.\n.\n🎆 2022 foi um ano cheio de desafios para a ciência no Brasil. Apesar das dificuldades, juntos, vencemos mais um ano com muito trabalho, pesquisa científica e divulgando nossos resultados. Saímos de 2022 com extrema satisfação e orgulho e desejando que o ano de 2023 seja ainda melhor!\n.\n👉🏻 Arraste para o lado e confira a retrospectiva do GPENSC.\n.\n🫂 Somos imensamente gratos a cada um de vocês que seguem nosso perfil, que acompanha as nossas postagens e que acredita no nosso trabalho, na pesquisa e na ciência brasileira! Esperamos continuar juntos em 2023!"
