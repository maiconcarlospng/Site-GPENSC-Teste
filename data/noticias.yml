  - data: "2024-06-13"
    categoria: "Institucional"
    titulo: "Hoje, o #GPENSConvida é sobre o projeto CUME"
    resumo: "Hoje, o #GPENSConvida é sobre o projeto CUME"
    conteudo: "Hoje, o #GPENSConvida é sobre o projeto CUME. Sabia que você, ex-aluno(a) da UFV, UFMG, UFOP, UFLA, UFJF, UNIFAL e UFVJM, pode ajudar a compreender a relação da nutrição com alguns desfechos de saúde?\n.\n📑 Atualmente, o projeto CUME está em período de coleta de dados e os questionários estão sendo enviados para os egressos. A coleta de dados para a linha de base (Q_0) e para os seguimentos, que serão aplicados a cada dois anos, contempla um questionário autorrespondido, criado e preenchido em ambiente virtual.\n\n📌 O estudo longitudinal conta com mais de 8 mil participantes. Neste ano de 2024, o projeto se expandiu, dando início ao CUME Plus, que marca a inserção de instituições federais de ensino superior de outros estados brasileiros.\n.\n📲 Se você é ex aluno(a) de umas dessas universidades, participe respondendo o questionário que foi enviado para o seu e-mail ou acesse pelo site oficial do projeto CUME (na área do participante).\n.\n📝 Sua participação ajudará na elaboração de futuras intervenções de promoção, prevenção, controle e tratamento dessas doenças na população brasileira.\n.\n🗣️ Quer saber mais sobre o projeto CUME? Continue nos acompanhando e siga também o Instagram do @projeto_cume ."
