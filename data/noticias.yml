  - data: "2023-11-21"
    categoria: "Pesquisa"
    titulo: "Artigo: Mortality attributable to diets low in fruits, vegetables, and whole grains in Brazil in 2019: evidencing regional health inequalities"
    resumo: "O GPENSC apresenta o artigo intitulado “Mortality attributable to diets low in fruits, vegetables, and whole grains in Brazil in 2019: evidencing regional health inequalities”, de autoria da pesquisadora Magda do Carmo Parajára (@magdaparajara), juntamente com outros pesquisadores da UFOP, UERJ e University of…"
    conteudo: "O GPENSC apresenta o artigo intitulado “Mortality attributable to diets low in fruits, vegetables, and whole grains in Brazil in 2019: evidencing regional health inequalities”, de autoria da pesquisadora Magda do Carmo Parajára (@magdaparajara), juntamente com outros pesquisadores da UFOP, UERJ e University of Liverpool.\n.\n🎯 O artigo, um dos produtos da tese de Doutorado da Magda, teve como objetivo descrever a mortalidade por doenças crônicas não transmissíveis (DCNT) atribuíveis ao consumo insuficiente de frutas, hortaliças e grãos integrais no Brasil em 2019.\n.\n📝 Trata-se de um estudo ecológico com dados do Global Burden of Disease 2019. Foram investigados adultos (≥ 25 anos) de ambos os sexos.\n.\n📈 Foi observado um baixo consumo de frutas, hortaliças e grãos integrais pela população brasileira que resultou, respectivamente, em 11.488, 17.701 e 33.250 óbitos. A maior taxa de mortalidade padronizada por idade foi encontrada para o consumo insuficiente de grãos integrais (14,4/100.000), seguida do baixo consumo de hortaliças (7,6/100.000) e frutas (5,0/100.000). Os estados do Nordeste e Norte, com menor desenvolvimento sociodemográfico quando comparados às demais regiões, apresentaram as maiores taxas de mortalidade padronizadas e menor consumo dos três fatores de risco.\n.\n💡Os resultados do estudo da Magda evidenciam a importância de promover o consumo de alimentos saudáveis para a população brasileira, a fim de reduzir a carga de DCNT atribuída à alimentação e as desigualdades em saúde no país.\n.\n🔗 Para saber mais acesse o artigo em:\nhttps://www.sciencedirect.com/science/article/abs/pii/S0033350623003232."
    url: "https://www.instagram.com/p/Cz7Hqm3OPlR/"
    imagem: "img/instagram-acervo/Cz7Hqm3OPlR.webp"
