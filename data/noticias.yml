    titulo: "Hoje é dia de #tbt e vamos relembrar uma defesa recente e muito especial para nosso grupo"
    resumo: "Hoje é dia de #tbt e vamos relembrar uma defesa recente e muito especial para nosso grupo"
    conteudo: "Hoje é dia de #tbt e vamos relembrar uma defesa recente e muito especial para nosso grupo.\n.\nA defesa de mestrado do Luiz Antônio Alves de Menezes Júnior (@menezesnutri ), aconteceu de forma remota, via google meet, na última semana 💻🎊👏.\n.\nA  dissertação do Luiz, intitulada “Distúrbios do sono em trabalhadores de turno alternante: validação de método e associação com níveis de vitamina D”, foi desenvolvida sob a orientação da professora Dra. Adriana Lúcia Meireles (@dri_meireles ) e coorientação do professor Dr. Raimundo Marques do Nascimento Neto, no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN/UFOP).\n.\nO trabalho contou com as contribuições da banca avaliadora, composta pela professora Dra. Lunara da Silva Freitas (FAMP) e a professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro ) (UFOP)\n.\nParabenizamos o Luiz pela defesa de mestrado e sua valiosa contribuição para a ciência nacional! \n.\nTambém já aproveitamos para parabenizá-lo pela aprovação no doutorado no PPGSN/UFOP 📚👨‍🏫🎉\n.\n#defesa #mestrado #doutorado #saudeenutricao #ppgsn #tbt"
