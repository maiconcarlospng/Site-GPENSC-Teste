  - data: "2022-07-12"
    categoria: "Divulgação científica"
    titulo: "Hoje, finalizando a série de postagens sobre o Guia Alimentar para a População Brasileira, vamos falar sobre os cinco princípios que nortearam a elaboração do Guia"
    resumo: "Hoje, finalizando a série de postagens sobre o Guia Alimentar para a População Brasileira, vamos falar sobre os cinco princípios que nortearam a elaboração do Guia"
    conteudo: "Hoje, finalizando a série de postagens sobre o Guia Alimentar para a População Brasileira, vamos falar sobre os cinco princípios que nortearam a elaboração do Guia.\n.\n📝 Os princípios justificam o tratamento abrangente dado à relação entre alimentação e saúde, considerando os nutrientes, alimentos, combinações de alimentos, refeições e dimensões culturais e sociais das práticas alimentares. \n.\n📑 Além disso, os cinco princípios fundamentam a proposição de recomendações que consideram o cenário da evolução da alimentação e da saúde no Brasil e a interdependência entre alimentação adequada e saudável e sustentabilidade do sistema alimentar. \n.\n🥙 Por fim, esses princípios apoiam o uso que o Guia faz do conhecimento gerado por diferentes saberes e sustentam o compromisso com a ampliação da autonomia das pessoas nas escolhas alimentares e com a defesa do direito humano à alimentação adequada e saudável.\n.\n👉🏻 Arraste para o lado e confira.\n.\n🗣️ Gostou das nossas postagens sobre o Guia? Não deixe de conferir essa e as outras postagens e compartilhar com os amigos!"
