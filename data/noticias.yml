  - data: "2021-09-13"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: pós-doutoranda Ana Maria Sampaio Rocha"
    resumo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a pós-doutoranda Ana Maria Sampaio Rocha (@anasampaiorocha)"
    conteudo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a pós-doutoranda Ana Maria Sampaio Rocha (@anasampaiorocha).\n.\n👩🏼🎓 A Ana Maria é bióloga graduada pela Universidade Federal de Ouro Preto – UFOP (2012). Possui Mestrado na área de Saúde Coletiva pelo Programa de Pós-Graduação em Saúde e Nutrição (2015) e Doutorado pelo Programa de Pós-Graduação em Ciências Biológicas (2019), ambos realizados na UFOP. Realizou seu estágio pós-doutoral no projeto “Vigilância epidemiológica da COVID-19 na região dos Inconfidentes, Minas Gerais” (2021). \n.\n🔎 Tem experiência na condução de estudos epidemiológicos e no diagnóstico de doenças infecciosas (imunocromatografia, ensaios enzimáticos e molecular). Atua na área de Saúde Coletiva, onde desenvolve/colabora com projetos dentro das seguintes temáticas: soroepidemiologia da COVID-19, aspectos epidemiológicos das leishmanioses (reservatório e vetor), biologia molecular, doenças infecto-parasitárias, saúde indígena, educação em saúde, microbiologia de águas e educação ambiental. \n.\n📚 Sua pesquisa no pós-doutorado foi intitulada: “COVID-Inconfidentes: Prevalência da infecção por SARS-CoV-2, perfil sorológico e aspectos da vulnerabilidade social e de saúde em dois municípios de médio porte brasileiros”, sob orientação do professor Dr. George Luiz Lins Machado Coelho (@georgellinsmachado) e da professora Dra. Adriana Lúcia Meireles (@dri_meireles).\n.\n🗣 Quer saber mais sobre os trabalhos desenvolvidos pelo nosso grupo? Então, continue nos acompanhando."
