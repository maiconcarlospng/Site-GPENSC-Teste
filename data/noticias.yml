    titulo: "Você sabe o que aconteceu com o tempo de tela dos estudantes quando as aulas presenciais foram suspensas…"
    resumo: "Você sabe o que aconteceu com o tempo de tela dos estudantes quando as aulas presenciais foram suspensas durante a pandemia? Estudo conduzido por Érica…"
    conteudo: "Você sabe o que aconteceu com o tempo de tela dos estudantes quando as aulas presenciais foram suspensas durante a pandemia? \n\nEstudo conduzido por Érica Costa Rodrigues (@costta.erica ) juntamente com outros pesquisadores do GPENSC, buscou entender como o tempo de tela de estudantes de escolas públicas de Mariana e Ouro Preto mudou antes e durante a suspensão das aulas presenciais devido a pandemia da COVID-19. \n \nE o que encontraram?\n▫️O tempo de tela diário dos estudantes aumentou 150%, passando de 2 horas para 5 horas por dia.\n▫️Estudantes do sexo masculino, de áreas urbanas, com maior renda familiar ou que receberam auxílio emergencial passaram mais tempo em frente às telas.\n▫️ O comportamento dos responsáveis também teve grande influência: quanto mais tempo eles passavam em telas, mais os estudantes também passavam.\n\nConclusão:\nA pandemia escancarou como fatores sociodemográficos e familiares impactam o uso de tecnologia entre adolescentes. Entender esse cenário é fundamental para pensar políticas públicas que promovam um uso mais consciente dos meios digitais entre crianças e adolescentes.\n\n🔗 Link do artigo: https://bmcpublichealth.biomedcentral.com/articles/10.1186/s12889-025-22773-6\n \n👉🏻 Arrasta para o lado e confira. \n\n#comportamentosedentario #tempodetela #saudecoletiva #pesquisacientifica"
    url: "https://www.instagram.com/p/DMyVXSsOd_V/"
    imagem: "img/instagram-acervo/DMyVXSsOd_V.webp"
