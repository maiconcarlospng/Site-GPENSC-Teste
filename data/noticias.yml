  - data: "2023-10-03"
    categoria: "Pesquisa"
    titulo: "Artigo: Rotating shift work time is directly associated with excess body adiposity"
    resumo: "O GPENSC apresenta o artigo intitulado “Rotating shift work time is directly associated with excess body adiposity”, de autoria do mestrando Felipe Baudson (@felipebaudson) juntamente com outros pesquisadores da UFOP"
    conteudo: "O GPENSC apresenta o artigo intitulado “Rotating shift work time is directly associated with excess body adiposity”, de autoria do mestrando Felipe Baudson (@felipebaudson) juntamente com outros pesquisadores da UFOP.\n.\n🎯 O artigo teve como objetivo analisar a associação entre alterações na adiposidade corporal e tempo de serviço em regime de turnos rotativos.\n.\n📝 Trata-se de um estudo transversal realizado durante os anos de 2012, 2015 e 2018 com 1.423 trabalhadores de turnos alternantes. Dados sociodemográficos e comportamentais foram coletados juntamente com parâmetros antropométricos para cálculo do índice de massa corporal (IMC) e da relação cintura-estatura (RCE).\n.\n📊 Observou-se que trabalhadores com cinco anos ou mais em turnos alternantes possuíam maiores chances de terem excesso de adiposidade corporal em mais de um indicador antropométrico, principalmente, aqueles que apresentavam alguma comorbidade previamente, como hipertensão arterial e dislipidemia. \n.\n📈 Além disso, foi verificado um gradiente dose resposta com aumento gradual das alterações antropométricas em razão do aumento do tempo de trabalho, de forma que trabalhadores que tinham de 5 a 10, 10 a 15, e mais de 15 anos de trabalhos em turnos rotativos apresentavam chances 41 a 96% maiores de apresentar excesso de peso (IMC > 25,0 kg/ m 2 ); 71 a 82% de circunferência do pescoço alterada (> 40 cm); 33 a 120% de circunferência na cintura alterada (> 102 cm); e 57 a 214% de RCE alterada (> 0,5 cm).\n.\n💡 Os achados evidenciam que o tempo de trabalho em turnos alternantes tem impacto significativo nos indicadores antropométricos de adiposidade corporal, principalmente, se o trabalhador apresentar alguma comorbidade previamente estabelecida e se for exposto frequentemente ao trabalho noturno.\n. \n🔗 Acesse o artigo: https://pubmed.ncbi.nlm.nih.gov/37770792/"
    url: "https://www.instagram.com/p/Cx88q2CuSIf/"
    imagem: "img/instagram-acervo/Cx88q2CuSIf.webp"
  - data: "2023-09-19"
    categoria: "Pesquisa"
    titulo: "Hoje, no #compartilhaGPENSC vamos falar sobre um tema estudado por pesquisadores do grupo"
    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre um tema estudado por pesquisadores do grupo"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre um tema estudado por pesquisadores do grupo. Mas qual a importância de estudar a pratica de atividade física? \n.\n🏋🏻‍♀️ A atividade física está associada a uma melhor qualidade de vida e a redução da morbimortalidade por doenças crônicas, como diabetes tipo 2, doenças cardiovasculares e câncer. Embora seja amplamente promovido que 10.000 passos por dia trazem benefícios para a saúde, não existem diretrizes de saúde pública baseadas em evidências que recomendem um número específico de passos por dia para benefícios à saúde. \n.\n🎯 O objetivo do artigo foi determinar a associação entre o número de passos por dia e a taxa de passos com mortalidade por todas as causa.\n.\n📝 Trata-se de uma metanálise realizada com 15 estudos de coorte, que investigaram o efeito da contagem diária de passos na mortalidade por todas as causas em adultos (com idade ≥18 anos), por meio de uma revisão sistemática publicada anteriormente e do conhecimento de especialistas na área. \n.\n📈 Observou-se que dar mais passos por dia está associado a um risco progressivamente menor de mortalidade por todas as causas, com o risco estabilizando para adultos mais velhos (com idade ≥60 anos) em aproximadamente 6.000–8.000 passos por dia e para adultos mais jovens (com idade <60 anos) em aproximadamente 8.000–10.000 passos por dia. \n.\n💡 Os resultados contribuem para o conjunto de pesquisas sobre passos e saúde, descrevendo uma associação curvilínea e variação de passos por dia associada à mortalidade por todas as causas. Tais informações podem ser utilizadas para embasar a elaboração de diretrizes para a promoção da atividade física no âmbito da saúde pública\n.\n👉🏻 Arraste para o lado e confira o resumo do artigo. \n.\n🔗 Acesse: https://doi.org/10.1016/S2468-2667(21)00302-9"
    url: "https://www.instagram.com/p/CxY27NiuFK9/"
    imagem: "img/instagram-acervo/CxY27NiuFK9.webp"
  - data: "2023-09-12"
    categoria: "Pesquisa"
    titulo: "Artigo: Food consumption according to the level of processing and sleep quality during the COVID-19 pandemic"
    resumo: "O GPENSC apresenta o artigo intitulado “Food consumption according to the level of processing and sleep quality during the COVID-19 pandemic”, de autoria do pós-doutorando Luiz Menezes (@luizmenezes__) juntamente com outros pesquisadores da UFOP e UFMT"
    conteudo: "O GPENSC apresenta o artigo intitulado “Food consumption according to the level of processing and sleep quality during the COVID-19 pandemic”, de autoria do pós-doutorando Luiz Menezes (@luizmenezes__) juntamente com outros pesquisadores da UFOP e UFMT.\n.\n🎯 O artigo, um dos produtos da tese de doutorado do Luiz, teve como objetivo avaliar a associação entre a ingestão alimentar por frequência e grau de processamento e a qualidade do sono em adultos durante a pandemia da covid-19.\n.\n📊 Dos 1.762 indivíduos avaliados, a maioria apresentou qualidade de sono ruim (52,5%). As pontuações alimentares mínimas e máximas foram 0 e 30 pontos. Os maiores valores da pontuação corresponderam ao menor consumo de alimentos in natura e minimamente processados e ao maior consumo de alimentos ultraprocessados. \n.\n📈 Observou-se que indivíduos que estavam no terceiro escore de consumo alimentar (OR = 1,71; IC 95%: 1,03-2,85) e no quarto quartil (OR = 2,44; IC 95%: 1,32-2,44) tiveram mais chances de apresentarem má qualidade do sono. Além disso, verificou-se que a substituição do jantar por alimentos ultraprocessados cinco dias ou mais na semana também foi associada à má qualidade do sono. \n.\n💡Os achados do estudo do Luiz evidenciam que os indivíduos devem se atentar quanto ao grau de processamento dos alimentos, uma vez que o maior consumo de alimentos ultraprocessados concomitante ao menor consumo de alimentos in natura e minimamente processados está associado a maior chance de má qualidade do sono.\n. \n🔗 Acesse o artigo: https://clinicalnutritionespen.com/article/S2405-4577(22)00205-4/fulltext"
    url: "https://www.instagram.com/p/CxG5mo3O_7u/"
    imagem: "img/instagram-acervo/CxG5mo3O_7u.webp"
  - data: "2023-09-05"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: doutorando Selso Ananias Sitoe"
    resumo: "O GPENSC apresenta mais um de nossos pesquisadores, o doutorando Selso Ananias Sitoe (@selsositoe)"
    conteudo: "O GPENSC apresenta mais um de nossos pesquisadores, o doutorando Selso Ananias Sitoe (@selsositoe).\n.\n👨🏽‍🎓 Selso é profissional de Educação Física formado pela Universidade Pedagógica de Moçambique (UP), mestre em Educação Física pelo Programa de Pós-Graduação em Educação Física da Universidade Estadual de Maringá (UEM) e especialista em Educação. Possui experiência nas áreas de Educação Física escolar, monitoria e treinamento esportivo juvenil. É membro do Grupo de Estudos de Psicologia do Esporte e Desempenho Humano (GEPEDH-UEM) com pesquisas nas temáticas de desempenho motor e psicologia do esporte.\n.\n👨🏾‍💻 Atualmente é doutorando no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN) da Universidade Federal de Ouro Preto (UFOP), na linha de Pesquisa Saúde e Nutrição em indivíduos e coletividades. Sua pesquisa de doutorado é sobre ambiente alimentar urbano e consumo alimentar em países de baixa renda, sob orientação da Profa. Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes). \n.\n🔎 Quer saber mais sobre o tema da Selso? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo."
