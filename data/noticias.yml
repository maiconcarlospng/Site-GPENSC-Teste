  - data: "2024-03-21"
    categoria: "Institucional"
    titulo: "O GPENSC relembra a defesa de mestrado da aluna Mariana Cassemira Aparecida Vidigal, que aconteceu no dia 20 de fevereiro de 2024, no formato online"
    resumo: "O GPENSC relembra defesa de mestrado da aluna Mariana Cassemira Aparecida Vidigal (@mariana.vidigal), que aconteceu no dia 20 de fevereiro de 2024, no formato online"
    conteudo: "O GPENSC relembra defesa de mestrado da aluna Mariana Cassemira Aparecida Vidigal (@mariana.vidigal), que aconteceu no dia 20 de fevereiro de 2024, no formato online.\n.\n🔎 A dissertação de mestrado da Mariana, intitulada “Consumo de bebidas adoçadas e sintomas de ansiedade, depressão e estresse entre estudantes universitários de Minas Gerais: PADu-multicêntrico”, teve como objetivo analisar os fatores associados ao consumo regular de bebidas adoçadas e sua interface com os sintomas de ansiedade, depressão e estresse.\n. \n👥 Seu estudo foi orientado pela professora Dra. Adriana Lúcia Meireles - @dri_meireles (UFOP) e coorientado pelo professor Dr. Luiz Antônio Menezes - @luizmenezes__ (UFOP). O trabalho contou com a contribuição da banca formada pela professora Dra. Daniela Silva Canella - @dani_canella (UERJ) e pela professora Dra. Raquel de Deus Mendonça - @raquelmendonca_enut (UFOP).\n. \n📊 Os resultados da dissertação da Mariana mostraram que o sexo masculino, consumo irregular de frutas, inatividade física, consumo de tabaco e excesso de peso foram fatores associados ao consumo regular de bebidas adoçadas. Além disso, encontrou que o consumo regular de bebidas adoçadas foi associado aos três sintomas avaliados no presente estudo. Por fim, observou-se um padrão dose-resposta para os sintomas de depressão e estresse, ou seja, os resultados indicam um aumento proporcional desses sintomas, conforme aumento na frequência semanal do consumo das bebidas adoçadas.\n .\n💡Esses achado reforçam a importância da Educação Alimentar e Nutricional (EAN) e de medidas preventivas sobre saúde mental dentro das universidades.\n.\n🎆 Parabenizamos a Mariana pela defesa de mestrado e pela contribuição na ciência do país. Queremos também parabenizá-la pela aprovação no doutorado no PPGSN/UFOP! Sucesso sempre!"
    url: "https://www.instagram.com/p/C4ynYP-uO5H/"
    imagem: "img/instagram-acervo/C4ynYP-uO5H.webp"
  - data: "2024-02-22"
    categoria: "Institucional"
    titulo: "O GPENSC relembra a defesa de doutorado da aluna Erica Costa Rodrigues, que aconteceu no dia 06 de dezembro de 2023, no formato online"
    resumo: "O GPENSC relembra defesa de doutorado da aluna Erica Costa Rodrigues (@costta.erica), que aconteceu no dia 06 de dezembro de 2023, no formato online"
    conteudo: "O GPENSC relembra defesa de doutorado da aluna Erica Costa Rodrigues (@costta.erica), que aconteceu no dia 06 de dezembro de 2023, no formato online. \n.\n🔎 A tese de doutorado da Erica, intitulada “Determinantes Sociodemográficos da Insegurança Alimentar nos domicílios de estudantes de escolas públicas: uma investigação longitudinal”, teve como objetivo examinar a trajetória de mudança na situação de insegurança alimentar e seus fatores associados nos domicílios de estudantes da rede municipal de ensino de Mariana e Ouro Preto entre 2020 e 2022.\n.\n👥 Seu estudo foi orientado pela professora Dra. Adriana Lúcia Meireles - @dri_meireles (UFOP) e coorientado pela professora Dra. Raquel de Deus Mendonça -  @raquelmendonca_enut (UFOP). O trabalho contou com as contribuições da banca formada pelas professoras Dra. Anelise Andrade de Souza - @andradeanelise (UFOP), Maria Del Carmen Bisi Molina - @mdcarmen.molina (UFOP), Larissa Loures Mendes - @larissalouresmendes (UFMG) e pelo professor Dr. Eliseu Verly Junior - @eliseuverly (UERJ).\n.\n📊 Os resultados da tese da Erica mostraram que durante o período de suspensão das aulas presenciais em função da pandemia de covid-19, foi encontrado elevada prevalência de insegurança alimentar, sendo associada à diminuição da renda familiar, recebimento de cesta básica de alimentos e maior número de crianças no domicílio. Longitudinalmente, observou-se que embora tenha havido redução da insegurança alimentar ao longo do tempo, esse declínio não ocorreu para as famílias extremamente pobres. Fatores interseccionais do chefe da família, como mulheres não brancas, não casadas e residentes em área rural foram significativos para pior situação de insegurança alimentar ao longo do tempo.\n.\n💡Espera-se contribuir com evidências científicas para subsidiar ações de mitigação da fome e da insegurança alimentar adequados as necessidades regionais. \n.\n🎆 Parabenizamos a Erica pela sua defesa de doutorado e pela contribuição com o PPGSN e para a ciência do país. Desejamos muito sucesso!"
    url: "https://www.instagram.com/p/C3qhGRrOdH0/"
    imagem: "img/instagram-acervo/C3qhGRrOdH0.webp"
