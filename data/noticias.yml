  - data: "2021-03-09"
    categoria: "Pesquisa"
    titulo: "Há alguns dias, apresentamos para vocês a pesquisa da Ana Cláudia"
    resumo: "Há alguns dias, apresentamos para vocês a pesquisa da Ana Cláudia (@anaclaudiamorito)"
    conteudo: "Há alguns dias, apresentamos para vocês a pesquisa da Ana Cláudia (@anaclaudiamorito). Mas qual a importância de estudar o comer emocional, ansiedade e sua relação com o ganho de peso?\n.\n🍽 Comer emocional é um termo usado para descrever o aumento da ingestão de alimentos em resposta às emoções negativas, sendo que essas emoções são reguladas pela ingestão de alimentos. Por exemplo, emoções como ansiedade e depressão podem interferir nos motivos ou desejos de comer e, consequentemente, podem estar associadas à falha no controle de peso.\n.\n🎯 O objetivo deste artigo foi oferecer uma revisão abrangente das associações relatadas entre emoções e comportamento alimentar em adultos com e sem excesso de peso. \n.\n📈 As evidências demonstram que os indivíduos que reportaram emoções negativas tiveram uma pontuação mais alta no comer emocional e no consumo de alimentos com maior densidade energética comparado com aqueles que apresentaram emoções neutras.\n.\n🔎 Diante disso, faz-se necessário pesquisas sobre a associação entre emoções negativas e comportamentos alimentares, sendo ainda identificada uma necessidade de investigar essas relações com a mudança de status do peso. \n.\n🗣 Continue nos acompanhando para saber mais sobre a temática de pesquisa da Ana Cláudia e sobre outros projetos desenvolvidos pelo nosso grupo."
    url: "https://www.instagram.com/p/CMNheIcgNT4/"
    imagem: "img/instagram-acervo/CMNheIcgNT4.webp"
  - data: "2021-03-04"
    categoria: "Pesquisa"
    titulo: "Associação do comer emocional e ansiedade com o ganho de peso durante a pandemia do COVID-19"
    resumo: "O GPENSC relembra de três qualificações de membros do nosso grupo, que acontecerem no mês de fevereiro desse ano"
    conteudo: "O GPENSC relembra de três qualificações de membros do nosso grupo, que acontecerem no mês de fevereiro desse ano.\n.\nNo dia 12 de fevereiro, ocorreu a qualificação da aluna de mestrado Ana Cláudia Morito (@anaclaudiamorito), via Google Meet.\n.\n🔎 O projeto de mestrado da Ana Cláudia, intitulado \"Associação do comer emocional e ansiedade com o ganho de peso durante a pandemia do COVID-19\", é orientado pela professora Dra. Júlia Cristina Carraro (UFOP) e contou com as contribuições da banca composta pelas professoras Dra. Elaine Machado (@lili_mach - UFMG) e Dra. Adriana Lúcia Meireles (@dri_meireles - UFOP).\n.\nNo dia 19 de fevereiro, aconteceu a qualificação da aluna de mestrado Larissa Fernanda Fonseca Guedes (@larissaguedesnutri), via Google Meet.\n.\n🔎 O projeto de mestrado da Larissa, intitulado “Impactos financeiros e à saúde da população brasileira relacionados ao consumo excessivo de sódio”, é orientado pela professora Dra. Ísis Eloah Machado (@isiseloah - UFOP) e contou com as contribuições da banca composta pelas professoras Dra. Mariana Felisbino (@nana.sfm - UFMG) e pela professora Dra. Maria Del Carmen (@mdcarmenmolina - UFOP).\n.\nNo dia 25 de fevereiro, ocorreu a qualificação da aluna de mestrado Joice Silva Vieira Leal (@joicesvleal), via Google Meet.\n.\n🔎 O projeto de mestrado da Joice, intitulado “Carga de doenças crônicas atribuível ao consumo elevado de bebidas açucaradas, série temporal 1990-2019, e o impacto financeiro ao Sistema Único de Saúde”, é orientado pela professora Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes - UFOP) e contou com as contribuições da banca composta pelas professoras Dra. Mariana Felisbino (UFMG) e Dra. Ísis Eloah Machado (UFOP).\n.\nParabenizamos as alunas pela aprovação na banca de qualificação e pela contribuição na ciência do país. Sucesso, meninas! 👏🎉✨"
