    conteudo: "Vem aí o VI CISeN!\n.\n🆕 Com muita alegria, divulgamos para vocês a sexta edição do Curso de Integração em Saúde e Nutrição (CISeN), com o tema “Saúde e Nutrição Além das Fronteiras”.\n.\n🎯 O CISeN tem o objetivo de divulgar as linhas de pesquisa e atividades do Programa de Pós-Graduação em Saúde e Nutrição da UFOP - PPGSN/UFOP (@ppgsn.ufop) para os interessados em ingressar nos cursos de mestrado e doutorado do programa. Além disso, outras temáticas relevantes para a carreira acadêmica também são abordadas durante o evento.\n.\n🗓️ O evento acontecerá presencialmente, e de forma gratuita, entre os dias 03 e 07 de outubro de 2022, no Auditório do Bloco de Salas de Aula da UFOP.\n.\n👩🏻‍🏫 A sexta edição contará com a participação de alunos e professores do GPENSC ministrando palestras e minicursos. Serão 5 dias de muito conteúdo, troca e aprendizado! \n.\n📌 Inscreva-se e fique por dentro de todas as novidades sobre o VI CISeN no perfil do evento @integracaosaudenutricao e do PPGSN!"
