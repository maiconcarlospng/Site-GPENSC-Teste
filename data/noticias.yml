  - data: "2020-10-07"
    categoria: "Ensino"
    titulo: "Artigo: Práticas alimentares de estudantes universitários da área da saúde, de acordo com as recomendações do Guia Alimentar para a População Brasileira"
    resumo: "Estão lembrados que na semana passada apresentamos a mestranda Bruna (@brunabcrb18)?"
    conteudo: "Estão lembrados que na semana passada apresentamos a mestranda Bruna (@brunabcrb18)? Pois bem, hoje trazemos para vocês um estudo publicado por ela e por outras pesquisadoras do GPENSC. Esse artigo é proveniente do trabalho de conclusão de curso da Bruna 📄.\n\nO artigo intitulado “Práticas alimentares de estudantes universitários da área da saúde, de acordo com as recomendações do Guia Alimentar para a População Brasileira”, é de autoria das integrantes Bruna Barbosa (@brunabcrb18), Waléria de Paula (@waleria_dp) e da professora Dra. Adriana Lúcia Meireles (@dri_meireles). O estudo também contou com a participação da pós-doutoranda do PPGSN, Nathalia Sernizon Guimarães.\n.\n🎯 O objetivo do artigo foi avaliar as práticas alimentares de estudantes universitários de acordo com as recomendações da segunda edição do Guia Alimentar para a População Brasileira.\n\n📌 Trata-se de um estudo transversal realizado com estudantes ingressantes do 1º semestre de 2019 dos cursos presenciais de graduação em Educação Física, Farmácia, Medicina e Nutrição da Universidade Federal de Ouro Preto (UFOP). A pesquisa é parte integrante de um estudo intitulado “Sintomas de ansiedade e depressão entre estudantes universitários de Minas Gerais: estudo longitudinal”, também conhecido como PADu-Longitudinal.\n.\n🔎 As práticas alimentares foram obtidas por meio da escala desenvolvida e validada por Kamila Gabe e Patrícia Jaime. Os resultados do artigo destacam que as práticas alimentares dos estudantes universitários correlacionam-se positivamente com a variável “sexo” e que os estudantes universitários apresentam elevado percentual de práticas alimentares de risco (52,0%) e inadequadas (75,7%).\n\n💡Dessa forma, faz-se necessário desenvolver políticas públicas e programas que visem à promoção da saúde e da alimentação saudável, a fim de auxiliar a prática de alimentação adequada e saudável pelos estudantes universitários, tendo em vista que muitos hábitos alimentares adquiridos pelos estudantes se mantêm posteriormente.\n\n🗣️O artigo na íntegra pode ser encontrado no nosso drive ou acessado pelo link  \nhttps://www.e-publicacoes.uerj.br/index.php/demetra/article/view/45855"
    url: "https://www.instagram.com/p/CGDmo_KgOI3/"
    imagem: "img/instagram-acervo/CGDmo_KgOI3.webp"
