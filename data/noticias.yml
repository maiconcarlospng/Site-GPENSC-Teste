  - data: "2024-06-25"
    categoria: "Pesquisa"
    titulo: "Artigo: Vitamin D deficiency and VDR gene polymorphism FokI (rs2228570) are associated with diabetes mellitus in adults: COVID-inconfidentes study"
    resumo: "O GPENSC apresenta o artigo intitulado “Vitamin D deficiency and VDR gene polymorphism FokI (rs2228570) are associated with diabetes mellitus in adults: COVID-inconfidentes study”, de autoria da pós-doutoranda Samara Silva de Moura (@mourasamara ) juntamente com outros pesquisadores do GPENSC e da UFOP"
    conteudo: "O GPENSC apresenta o artigo intitulado “Vitamin D deficiency and VDR gene polymorphism FokI (rs2228570) are associated with diabetes mellitus in adults: COVID-inconfidentes study”, de autoria da pós-doutoranda Samara Silva de Moura (@mourasamara ) juntamente com outros pesquisadores do GPENSC e da UFOP.\n.\n🎯 O artigo teve como objetivo avaliar a associação do polimorfismo do gene VDR (rs2228570) FokI e níveis de vitamina D com diabetes em adultos.\n.\n📝 Trata-se de um estudo transversal de base populacional em adultos, realizado de outubro a dezembro de 2020 em duas cidades brasileiras. A variável desfecho foi diabetes (DM), caracterizada por hemoglobina glicada ≥ 6,5% ou diagnóstico médico autorrelatado ou uso de hipoglicemiantes orais. A vitamina D (25-hidroxivitamina D) foi classificada como deficiência quando 25(OH)D < 20 ng/mL. Todos os participantes foram genotipados para o polimorfismo VDR FokI por qPCR.\n.\n📊 Os resultados mostraram que a prevalência de DM foi de 9,4% e a deficiência de vitamina D (DDV) foi de 19,9%. Observou-se associação positiva entre deficiência de vitamina D e DM [OR:2,19 (IC 95%: 1,06–4,50)]. Indivíduos com o alelo alterado (ff) apresentaram prevalência 1,78 maior de DM [OR: 1,78 (IC 95%; 1,10–2,87)]. Além disso, análises combinadas revelaram que indivíduos com deficiência de vitamina D estavam associados ao DM independentemente do genótipo. Enquanto indivíduos com presença do alelo alterado (ff) e suficiência de vitamina D não foram associados ao DM.\n.\n💡Os achados sugerem que a deficiência de vitamina D e o polimorfismo FokI estão associados ao desenvolvimento de DM. \n.\n🔗 Acesse o artigo: https://dmsjournal.biomedcentral.com/articles/10.1186/s13098-024-01328-6"
    url: "https://www.instagram.com/p/C8pzuhzPmel/"
    imagem: "img/instagram-acervo/C8pzuhzPmel.webp"
