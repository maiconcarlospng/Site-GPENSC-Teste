    categoria: "Institucional"
    titulo: "Equipe do GPENSC: pós-doutoranda Nara Nunes Lage"
    resumo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a pós-doutoranda Nara Nunes Lage (@narinhalage)"
    conteudo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a pós-doutoranda Nara Nunes Lage (@narinhalage).\n.\n👩🏼‍🎓 A Nara é nutricionista graduada pela Universidade Federal de Ouro Preto (UFOP), mestre pelo Programa de Pós-Graduação em Saúde e Nutrição (PPGSN), com ênfase em Bioquímica e Fisiopatologia da Nutrição (2014), e doutora pelo Programa de Pós-Graduação em Ciências Biológicas (CBIOL), com ênfase em Bioquímica Metabólica e Fisiológica (2018), ambos realizados na UFOP. Em 2017, teve a oportunidade de realizar o seu doutorado sanduíche no Department of Nutrition and Food Science, Texas A&M University (EUA). Foi professora no curso de Nutrição da UFOP (2018-2019) e da Faculdade Santa Rita (FaSaR-2020). Atualmente, é nutricionista na Secretaria Municipal de Saúde da Prefeitura Municipal de Mariana, MG. \n.\n👩🏼‍🔬 Como pesquisadora, possui experiência em Bioquímica Metabólica e Biologia Molecular, atuando nos seguintes temas: alimentos funcionais, antioxidantes, estresse oxidativo, diabetes, esteatose hepática, metabolismo de lipídios, microbiota e câncer de mama.\n.\n🧫 De 2020 a 2021, realizou seu estágio pós-doutoral voluntário no projeto “Vigilância epidemiológica da COVID-19 na região dos Inconfidentes, Minas Gerais” do PPGSN da UFOP, no qual esteve envolvida nas análises laboratoriais do projeto, sob orientação da professora Dra. Adriana Lúcia Meireles (@dri_meireles) e do professor Dr. George Luiz Lins Machado Coelho (@georgellinsmachado). \n.\n🗣️ Quer saber mais sobre os trabalhos desenvolvidos pelo nosso grupo? Então, continue nos acompanhando!"
