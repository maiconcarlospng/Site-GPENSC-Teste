    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre os cuidados com a saúde mental: caminhos e estratégias, tema apresentado pela mestrada Marana Luiza Duarte Avelar (@maranaduarte_psicologa )"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre os cuidados com a saúde mental: caminhos e estratégias, tema apresentado pela mestrada Marana Luiza Duarte Avelar (@maranaduarte_psicologa ). Afinal, quais são as estratégias para cuidar da saúde mental durante a pós-graduação?\n.\n🧠 A saúde mental é essencial para o bem-estar geral e influencia todos os aspectos da vida, incluindo o desempenho acadêmico. Adotar estratégias como estabelecer uma rotina e incorporar hábitos de lazer podem ser fundamentais nesse processo.\n.\n✨ Lembre-se que o apoio de um profissional capacitado é essencial para a orientação condutas e estratégias eficazes.\n.\n👉🏼 Arraste para o lado e confira as dicas para cuidar da sua saúde mental.\n.\n🗣️ Gostou do post de hoje? Aproveite para salvar e compartilhar com quem precisa de ver esse post!"
