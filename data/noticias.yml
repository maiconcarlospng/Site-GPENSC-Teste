    titulo: "Episódio: Sindemia global: obesidade, desnutrição e mudanças climáticas"
    resumo: "O GPENSC recomenda o episódio “Sindemia global: obesidade, desnutrição e mudanças climáticas”, do podcast “Ciência da Nutrição” (@podcastcienciadanutricao)"
    conteudo: "O GPENSC recomenda o episódio “Sindemia global: obesidade, desnutrição e mudanças climáticas”, do podcast “Ciência da Nutrição” (@podcastcienciadanutricao).\n.\n🍽️ O episódio aborda sobre o conceito de sindemia global, que é a combinação sinérgica entre as pandemias de obesidade, desnutrição e mudanças climáticas, as três decorrentes, principalmente, do sistema agroalimentar global, além de outros fatores sociais em comum. O encontro de pandemias interligadas torna-se um chamado urgente para pensarmos e agirmos em ação conjunta.\n.\n📚 O episódio conta com a participação da Dra. Tais Arizo Alpino (@tatariza), que é Doutora em Saúde Pública e pesquisadora do Centro de Estudos e Pesquisas em Emergências e Desastres em Saúde (CEPEDES/ Fiocruz).\n.\n🔎 Esse episódio do podcast Ciência da Nutrição está disponível no Spotify, Deezer, Youtube e Google Spotify. E pode ser acessado pelo link: https://www.youtube.com/watch?v=3Ra5oN1yL_Y\n.\n🗣️ Gostou da dica? Compartilha com os amigos e aproveite para salvar essa recomendação."
