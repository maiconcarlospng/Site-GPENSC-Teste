    imagem: "img/instagram-acervo/Ckty3V6OskC.webp"
  - data: "2022-10-31"
    categoria: "Pesquisa"
    titulo: "Hoje, no #compartilhaGPENSC vamos falar sobre a insegurança alimentar e os resultados do 2º Inquérito Nacional sobre Insegurança Alimentar no Contexto da Pandemia da Covid-19…"
    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre a insegurança alimentar e os resultados do 2º Inquérito Nacional sobre Insegurança Alimentar no Contexto da Pandemia da Covid-19 no Brasil (II VIGISAN), que retrata o cenário nacional e destaca a vulnerabilidade de grupos específicos"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre a insegurança alimentar e os resultados do 2º Inquérito Nacional sobre Insegurança Alimentar no Contexto da Pandemia da Covid-19 no Brasil (II VIGISAN), que retrata o cenário nacional e destaca a vulnerabilidade de grupos específicos.\n.\n🍽️ A insegurança alimentar é definida como a falta de acesso físico, econômico e social a alimentos de qualidade e em quantidade adequada que satisfaça as necessidades nutricionais. A insegurança alimentar pode ser classificada em leve, moderada ou grave, sendo essa última, a experiência com a fome.\n.\n📄 A escalada da fome no Brasil está em rápida ascensão. De acordo com dados do II VIGISAN, em 2022, 14 milhões de novos brasileiros foram incorporados à situação de fome em pouco mais de um ano. A ascensão foi iniciada pela crise econômica e desestruturação de políticas públicas nacionais, e ainda agravada pela pandemia da covid-19. \n.\n💡 Os resultados evidenciam a necessidade de reorientação das estruturas econômicas e políticas que visem à redução das desigualdades e da melhoria das condições de vida da população.\n. \n👉🏻 Arraste para o lado e confira mais sobre esse tema.\n.\n🗣️ Gostou da postagem? Não deixe de conferir essa e as outras postagens e compartilhar com os amigos!"
