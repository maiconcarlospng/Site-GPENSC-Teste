    titulo: "O GPENSC atualmente conta com quatro linhas principais de pesquisa. Ficou curioso?"
    resumo: "O GPENSC atualmente conta com quatro linhas principais de pesquisa. Ficou curioso? Vamos falar um pouquinho sobre cada uma delas a seguir. . Análise do…"
    conteudo: "O GPENSC atualmente conta com quatro linhas principais de pesquisa. Ficou curioso? Vamos falar um pouquinho sobre cada uma delas a seguir. .\nAnálise do Consumo Alimentar e Estado Nutricional de Populações: nesta linha de pesquisa, estão sendo desenvolvidos trabalhos sobre ingestão de polifenóis e consumo de alimentos ultraprocessados entre egressos de universidades mineiras.\n.\nEpidemiologia das Doenças Crônicas Não Transmissíveis: esta linha de pesquisa conta com estudos sobre fatores de risco e proteção (como prática de atividade física, comportamento sedentário, práticas alimentares e outros hábitos de vida de universitários, egressos e trabalhadores de turnos alternantes) associados ao acometimento de doenças crônicas não transmissíveis.\n.\t\nCarga Global de Doenças (GBD): nesta linha, estão sendo conduzidos estudos sobre a carga das doenças crônicas não transmissíveis na população adulta brasileira relacionada à alimentação inadequada e ao excesso de peso e seus custos financeiros para o Sistema Único de Saúde.\n. \nAmbiente Alimentar: esta linha de estudo compreende a avaliação da mudança temporal do ambiente comunitário de uma metrópole.\n.\nPara saber mais detalhes sobre as linhas de pesquisa e sobre os projetos que estão em andamento, continuem acompanhando nossa página!\n.\n#gpensc #ufop #pesquisa #ensino #extensão #nutrição #saúdecoletiva #saúde"
