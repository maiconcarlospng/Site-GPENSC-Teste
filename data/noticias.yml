  - data: "2021-11-16"
    categoria: "Pesquisa"
    titulo: "Na semana passada, apresentamos para vocês a pesquisa da pós-doutoranda Aline Siqueira Fogal Vegi"
    resumo: "Na semana passada, apresentamos para vocês a pesquisa da pós-doutoranda Aline Siqueira Fogal Vegi (@alinesfv)"
    conteudo: "Na semana passada, apresentamos para vocês a pesquisa da pós-doutoranda Aline Siqueira Fogal Vegi (@alinesfv). Mas qual a importância de estudar a carga de doenças e agravos devido ao consumo de álcool? \n.\n🚫 O consumo de álcool é um dos maiores fatores de risco evitáveis para morte e invalidez, mas sua associação geral com a saúde permanece complexa, dados os possíveis efeitos protetores do baixo consumo sobre doenças isquêmicas do coração, diabetes e outras.\n.\n🎯 O objetivo do artigo foi acrescentar aos estudos existentes e abordar as limitações de pesquisas anteriores, gerando melhores estimativas do uso de álcool e carga associada em termos de mortes e anos de vida perdidos ajustados por incapacidade (DALYs) em 195 locais, entre 1990 e 2016. \n.\n👥 As estimativas de exposição e das mortes e DALYs atribuíveis ao álcool foram baseadas em 694 fontes de consumo individual e populacional de álcool, junto com 592 estudos sobre o risco do uso de álcool. \n.\n📈 O consumo de álcool foi o sétimo principal fator de risco para morte e doença prematura considerando a população mundial em 2016, sendo responsável por 2,2% das mortes em mulheres e 6,8% em homens, considerando as taxas padronizadas por idade. Em pessoas mais jovens, de 15 a 49 anos, o álcool foi o principal fator de risco de quase uma em cada 10 mortes em pessoas nessa faixa etária e apresentou DALYs de 2,3% para as mulheres e 8,9% para os homens. \n.\n⚠️ As três principais causas de mortes atribuíveis nesta faixa etária foram tuberculose, acidentes de trânsito e lesões autoprovocadas. Para a população com 50 anos ou mais, cânceres foram responsáveis por uma grande proporção do total de mortes atribuíveis ao álcool (27,1% para mulheres e 18,9% para homens). Verificou-se que o nível de consumo de álcool que minimizou os danos nos desfechos de saúde foi de zero bebidas padrão por semana.\n.\n💡 Conclui-se que o uso de álcool é o principal fator de risco para a carga global de doenças e causa perdas substanciais à saúde. Os resultados sugerem que as políticas de controle do álcool precisam focar em reduzir o consumo geral no nível da população.\n.\n👉🏻 Arraste para o lado e confira o resumo do artigo."
    url: "https://www.instagram.com/p/CWWfv13PHOb/"
    imagem: "img/instagram-acervo/CWWfv13PHOb.webp"
  - data: "2021-11-12"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: pós-doutoranda Aline Siqueira Fogal Vegi"
    resumo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a pós-doutoranda Aline Siqueira Fogal Vegi (@alinesfv)"
    conteudo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a pós-doutoranda Aline Siqueira Fogal Vegi (@alinesfv).\n.\n👩🏻‍🎓 A Aline é nutricionista graduada pela Universidade Federal de Viçosa – UFV (2011), mestre (2014) e doutora (2019) pelo Programa de Pós-Graduação em Ciência da Nutrição (PPGCN), com ênfase em saúde e nutrição de indivíduos e populações, ambos realizados na UFV. O tema de sua dissertação e tese envolveu o estudo do impacto do ambiente alimentar de varejo e do ambiente para a atividade física em idosos, com foco no excesso de peso e na capacidade funcional. \n.\n👩🏻‍💻 Atualmente, é pós-doutoranda pelo Programa de Pós-Graduação em Saúde e Nutrição (PPGSN), da Universidade Federal de Ouro Preto (UFOP), e pesquisadora do projeto “Impactos financeiros e à saúde devidos à alimentação inadequada e ao excesso de peso no Brasil e Unidades Federativas\". \n.\n🔎 Sua pesquisa de pós-doutorado, intitulada \"Carga de doenças e agravos e custos com hospitalizações devidos ao uso de álcool no Brasil”, é supervisionada pela professora Dra. Ísis Eloah Machado (@isiseloah) e tem como objetivo quantificar o impacto nos custos para o Sistema Único de Saúde (SUS) e na carga de doenças e agravos devido ao consumo de álcool no Brasil e Unidades Federativas, usando dados do Global Burden of Disease (GBD) e do DATASUS.\n.\n🗣️ Quer saber mais sobre o trabalho da Aline e de outros  trabalhos desenvolvidos pelo nosso grupo? Então, continue nos acompanhando!"
