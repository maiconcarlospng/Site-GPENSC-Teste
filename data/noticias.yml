    titulo: "Projeto: Cartas para um acadêmico em tempos de recolhimento"
    resumo: "Ontem aconteceu nossa última reunião de 2020 e gostaríamos de compartilhar com vocês alguns momentos do nosso grupo"
    conteudo: "Ontem aconteceu nossa última reunião de 2020 e gostaríamos de compartilhar com vocês alguns momentos do nosso grupo.\n.\n💟 Foi um encontro muito especial, em que tivemos a oportunidade de compartilhar algumas das nossas dificuldades, alegrias e conquistas alcançadas durante esse ano. Sabemos que foi um ano desafiador para todos, mas fizemos desse momento algo acolhedor e super especial!\n.\n💌 Durante a reunião, também finalizamos o projeto \"Cartas para um acadêmico em tempos de recolhimento\". Vamos fazer outro post para contar um pouco mais dessa experiência, que foi tão incrível para o nosso grupo. \n.\n📆 Diante de tudo que vivemos, percebemos que o ano de 2020 foi uma oportunidade de nos reinventarmos, passamos por vários desafios, mas crescemos muito como pessoas, profissionais e amigos. O nosso grupo vai além de um grupo de pesquisa, é um grupo também de acolhimento, afeto e companheirismo.\n.\n🌻 Agradecemos a todos vocês que acompanharam nosso trabalho e participaram dos nossos eventos. Gratidão é a palavra que nos define! \n.\n🎇 Que o próximo ano seja de muito crescimento para todos nós!"
