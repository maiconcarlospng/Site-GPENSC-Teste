    conteudo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a mestranda Ariane Pedrosa Diniz. \n.\n👩🏻🎓 Ariane é fisioterapeuta formada pela Universidade Federal de Alfenas (UNIFAL-MG) e especialista em Acupuntura pelo Instituto Superior de Ciências e Saúde (INCISA). Possui experiência na área da Saúde Coletiva, tanto no setor público quanto privado, acompanhando pacientes em diversos níveis de complexidade. Atualmente, é mestranda no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN) da Universidade Federal de Ouro Preto (UFOP), na linha de pesquisa Saúde e Nutrição em Indivíduos e Coletividades.\n.\n📚 É pesquisadora do projeto Coorte das Universidades Mineiras – CUME (@projetocume), sob orientação da professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut). No mestrado, Ariane vai analisar a saúde de mulheres na idade fértil na Coorte CUME.\n.\n🔎 Quer saber mais sobre o tema da Ariane? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo!"
