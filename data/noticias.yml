    conteudo: "Hoje iremos falar sobre o PADu-COVID.\n.\n📆 No mês de fevereiro, ocorreu a coleta da terceira onda (seguimento T2) do PADu-COVID.\n.\n📝 Pensando em validar uma escala de suporte social adaptada para a pandemia de COVID-19,  iniciamos uma segunda etapa da coleta de dados do seguimento T2. \n.\n📌 Você, estudante ou servidor da UFOP, que respondeu o último questionário do PADu-COVID, continue colaborando conosco. Você gastará em torno de 5 minutos para responder essa etapa!\n.\n🧬 Contribua para o avanço da ciência brasileira e para pesquisa da sua Universidade!\n.\n🔎 Quer saber mais sobre o projeto? Continue nos acompanhando. \n.\n📧 Para maiores informações, entre em contato pelo e-mail: paducovid.ppgsn@ufop.edu.br"
