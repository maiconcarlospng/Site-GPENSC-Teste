    conteudo: "Hoje, o #GPENSConvida é sobre o PADu-Multicêntrico. Sabia que você, estudante de graduação, pode ajudar a entender a saúde mental dos universitários de Minas Gerais?\n.\n🏛️ A UFOP, em parceira com sete universidades mineiras (UFMG, UFLA, UFSJ, UFJF, UFU, UFVJM e Unifal), está realizando um estudo para a avaliar a saúde mental e os fatores associados entre estudantes universitários.\n.\n📝 A coleta de dados teve início no dia 15 de setembro de 2021 e agora está na reta final.\n.\n📲 Se você é aluno(a) de graduação de umas dessas universidades, participe respondendo o questionário que está disponível na bio do Instagram do @padufederais.\n.\n🗣️ Quer saber mais sobre o PADu-Multicêntrico? Continue nos acompanhando e siga também o Instagram do @padufederais"
