    titulo: "Vem aí o WebCISeN!"
    resumo: "Vem aí o WebCISeN!"
    conteudo: "Vem aí o WebCISeN! \n.\n🆕 Com muita alegria, anunciamos a quinta edição do Curso de Integração em Saúde e Nutrição (CISeN).\n. \n🎯 O WebCISeN tem o objetivo de divulgar as linhas de pesquisa e atividades do Programa de Pós-Graduação em Saúde e Nutrição da UFOP (PPGSN/UFOP) para os interessados em ingressar nos cursos de mestrado e doutorado do programa. Além disso, outras temáticas relevantes para a carreira acadêmica também são abordadas durante o evento.\n.\n🗓️ O evento acontecerá entre os dias 06 e 10 de dezembro de 2021 e será totalmente online e gratuito. \n.\n📌 Inscreva-se e fique por dentro de todas as novidades sobre o WebCISeN no perfil do @integracaosaudenutricao.\n.\nVai ser imperdível! 🤩"
