  - data: "2022-07-05"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: doutoranda Bruna Avelar"
    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre ambiente alimentar e suas dimensões"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre ambiente alimentar e suas dimensões. O resumo foi elaborado pela doutoranda Bruna Avelar (@brunnaavelar), que é uma das pesquisadoras do grupo que estuda essa temática.\n.\n🔎 Você sabia que as escolhas alimentares são influenciadas por diversos fatores? Entre esses fatores, destaca-se o ambiente alimentar, que é caracterizado como um determinante das escolhas ou não escolhas alimentares. \n.\n🏘️ Nos últimos anos, o interesse em estudar ambiente alimentar vem crescendo entre os pesquisadores. Os estudos buscam entender e explicar como o ambiente alimentar está associado com as nossas escolhas alimentares, uma vez que o ambiente pode influenciar, por exemplo, nos tipos de estabelecimentos de venda de alimentos, os valores atribuídos aos alimentos, o acesso àquele local, como se a pessoa vai de carro ou a pé.\n. \n👉🏻 Arraste para o lado e confira mais sobre o tema.\n.\n🗣️ Continue nos acompanhando para saber mais sobre ambiente alimentar!"
