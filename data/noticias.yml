  - data: "2022-06-17"
    categoria: "Institucional"
    titulo: "O dia de #tbt foi ontem, mas bora relembrar uma data especial para o GPENSC?"
    resumo: "O dia de #tbt foi ontem, mas bora relembrar uma data especial para o GPENSC?"
    conteudo: "O dia de #tbt foi ontem, mas bora relembrar uma data especial para o GPENSC? 🔙😍\n.\n🗓️ Nosso #tbt é bem recente, para lembrar da defesa de mestrado da aluna Joice Silva Vieira Leal (@joicesvleal), que ocorreu no dia 12 de maio, via Google Meet.\n.\n🔎 A dissertação da Joice, intitulada \"Carga de doenças crônicas atribuível ao consumo de bebidas açucaradas no Brasil\", teve como objetivo estimar a carga (financeira e na saúde) das doenças crônicas não transmissíveis (DCNT) atribuíveis ao consumo de bebidas açucaradas para a população brasileira, em 2019, e a mudança entre os anos de 1990 e 2019.\n.\n👥 Seu trabalho foi orientado pela profa. Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes) e contou com as contribuições da banca formada pelas professoras Dras. Ísis Eloah Machado – @isiseloah (UFOP) e Mariana Santos Felisbino Mendes – @nana.sfm (UFMG).\n.\n📊 Os resultados da dissertação da Joice apontam que, em 2019, o consumo de bebidas açucaradas causou uma perda de 233.436,09 (II95% 157.094,89 – 302.483,29) anos de vida perdidos ajustados pela incapacidade (DALY) e 7.657,9 (II95% 5.131,26 – 9.795,68) óbitos por DCNT no Brasil. Unidades Federativas da região Nordeste, além de indivíduos do sexo masculino e em faixas etárias superiores, apresentaram maior carga de DCNT relacionadas ao consumo de bebidas açucaradas. \n.\n💰 Além disso, cerca de $ 14.116.240,55 (equivalente a R$ 55.674.452,74) foram gastos com procedimentos de média e alta complexidade no tratamento de DCNT atribuídas ao consumo de bebidas açucaradas no Sistema Único de Saúde (SUS), em 2019. Esses valores foram maiores para o sexo masculino e nas regiões Sudeste e Sul.\n.\n💡 Esses achados reforçam a urgência da implantação de ações e políticas articuladas para a redução do consumo de bebidas açucaradas, tanto em âmbito nacional como estadual. \n.\nParabenizamos a Joice pela defesa de mestrado e pela contribuição na ciência do país! 👏🏻🎉✨"
