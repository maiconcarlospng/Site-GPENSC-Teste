    titulo: "Equipe do GPENSC: doutoranda Renata Bento"
    resumo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a doutoranda Renata Bento (@renatabentoo)"
    conteudo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a doutoranda Renata Bento (@renatabentoo).\n.\n👩🏻‍🎓 Renata é nutricionista formada pela Universidade Federal de Ouro Preto (UFOP) e mestre em Ciências Biológicas pela mesma instituição, pelo Núcleo de Pesquisa em Ciências Biológicas (NUPEB). Atualmente, é doutoranda no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN/UFOP), na linha de pesquisa Saúde e Nutrição em indivíduos e coletividades. Possui experiência na área da Nutrição Clínica Hospitalar e Ambulatorial, com ênfase em comportamentos alimentares e emagrecimento. \n.\n📚 É pesquisadora do projeto “NutricionalMente: compreendendo o comportamento alimentar e sua interface com o manejo da obesidade”, e sua pesquisa de doutorado é intitulada \"Associação entre as estratégias de enfrentamento, satisfação das necessidades psicológicas básicas e as escolhas alimentares em adultos\"  sob orientação da professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro).\n.\n🔎 Quer saber mais sobre o tema da Renata? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo."
