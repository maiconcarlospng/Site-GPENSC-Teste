  - data: "2024-06-20"
    categoria: "Institucional"
    titulo: "Associação do polimorfismo do gene BDNF Associação do polimorfismo do gene BDNF com escolhas e preferências alimentares mediada pela presença de depressão (Projeto CUME)"
    resumo: "O GPENSC relembra defesa de qualificação de mestrado da aluna Hiliane Karolline de Oliveira Silva (@nutrikarolloliveira), que ocorreu no dia 24 de abril de 2024, no formato online"
    conteudo: "O GPENSC relembra defesa de qualificação de mestrado da aluna Hiliane Karolline de Oliveira Silva (@nutrikarolloliveira), que ocorreu no dia 24 de abril de 2024, no formato online.\n.\n🔎 O projeto de mestrado da Hiliane, intitulado “Associação do polimorfismo do gene BDNF Associação do polimorfismo do gene BDNF com escolhas e preferências alimentares mediada pela presença de depressão (Projeto CUME)”, tem como objetivo avaliar a associação do  polimorfismo de nucleotídeo único do gene BDNF com as escolhas e preferências alimentares e o possível papel mediador da depressão nesta associação. \n.\n👥 Seu estudo é orientado pela professora Dra. Júlia Cristina Cardoso Carraro - @julia_carraro (UFOP) e coorientado pelo Dr. Luiz Menezes - @menezesnutri (UFOP). O trabalho contou com as contribuições da banca formada pelas professoras Dra. Carolina Ferreira Nicoletti - @carolnicolettif (USP) e Dra. Aline Silva de Aguiar - @aline.saguiar (UFF).\n.\n📊 Espera-se que os polimorfismos no gene do BDNF estejam relacionados a diferentes perfis que determinam as escolhas alimentares e preferência por alimentos mais palatáveis (como ricos em açúcar e gordura), e que esta associação seja parcialmente explicada pela presença de depressão.\n.\n🎆 Parabenizamos a Hiliane pela defesa da qualificação de mestrado e pela contribuição na ciência do país. Sucesso sempre!"
