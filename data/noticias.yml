  - data: "2023-05-04"
    categoria: "Pesquisa"
    titulo: "Artigo: High levels of glycated hemoglobin (HbA1c) are associated with physical inactivity, and part of this association is mediated by being overweight"
    resumo: "O GPENSC apresenta o artigo intitulado “High levels of glycated hemoglobin (HbA1c) are associated with physical inactivity, and part of this association is mediated by being overweight ”, de autoria da doutoranda Samara Moura (@mourasamara) juntamente com outros pesquisadores do GPENSC e da UFOP"
    conteudo: "O GPENSC apresenta o artigo intitulado “High levels of glycated hemoglobin (HbA1c) are associated with physical inactivity, and part of this association is mediated by being overweight ”, de autoria da doutoranda Samara Moura (@mourasamara) juntamente com outros pesquisadores do GPENSC e da UFOP.\n.\n🎯 O artigo, um dos produtos da tese de doutorado da Samara, teve como objetivo avaliar os níveis séricos de hemoglobina glicada (HbA1c) e sua associação com o excesso de peso relacionado à inatividade física.\n.\n🔎 A variável desfecho foi a HbA1c, o intervalo normal adotado foi de 6,4% e concentrações superiores a 6,5% foram classificados como níveis elevados. A variável exposição foi a inatividade física no lazer, sendo avaliada por meio do autorrelato e categorizada em ativos e inativos fisicamente no lazer. O excesso de peso foi utilizado como variável de mediação e o ponto de corte adotado foi \"sem excesso de peso\" e com \"excesso de peso\".\n.\n📈 Observou que 7,1% dos indivíduos apresentavam alterações glicêmicas, 69,2% eram fisicamente inativos no lazer e 56,5% apresentavam excesso de peso. Os indivíduos inativos tinham 2,62 vezes mais chance de terem níveis elevados de HbA1c. Na análise de mediação, foi possível verificar que 26,87% deste efeito foi mediado pelo excesso de peso.\n.\n💡 Os dados sugerem que a pratica de atividade física (AF) pode atenuar o risco de desenvolver diabetes mellitus tipo 2, em parte por meio do controle do excesso de peso, mas também independentemente da adiposidade. As alterações glicêmicas requerem atenção regular, dadas as suas implicações no agravamento da saúde da população e os elevados custos para o sistema público de saúde. Acredita-se que a manutenção da AF regular é essencial para a gestão do controle glicêmico.\n.\n🔗 Acesse o artigo: https://www.mdpi.com/2072-6643/15/5/1191#"
    url: "https://www.instagram.com/p/Cr1iaLvuqOn/"
    imagem: "img/instagram-acervo/Cr1iaLvuqOn.webp"
