    titulo: "Doutorado sanduíche - GPENSC pelo mundo ✈️🌍🇵🇹"
    resumo: "Doutorado sanduíche - GPENSC pelo mundo ✈️🌍🇵🇹 Em setembro, a pesquisadora do GPENSC e doutoranda do PPGSN/UFOP (@ppgsn.ufop), Tainá Damasceno, embarcou para realizar seu doutorado…"
    conteudo: "Doutorado sanduíche - GPENSC pelo mundo ✈️🌍🇵🇹\n\nEm setembro, a pesquisadora do GPENSC e doutoranda do PPGSN/UFOP (@ppgsn.ufop), Tainá Damasceno, embarcou para realizar seu doutorado sanduíche na Faculdade de Ciências da Nutrição e Alimentação da Universidade do Porto (FCNAUP), em Portugal, com bolsa da CAPES.\n\nNo período, Tainá desenvolverá o tema: “Concepções acerca do comportamento alimentar e escolhas alimentares na perspectiva de usuários da Atenção Primária à Saúde”, sob a supervisão do Dr. Rui Manuel Almeida Pinhos (Universidade do Porto) e das Profas. Dra. Raquel de Deus Mendonça (UFOP) e Dra. Júlia Cristina Cardoso Carraro (UFOP). \n\n💬 Para Tainá, essa experiência é uma oportunidade de crescimento pessoal, por ser meu primeiro contato com a pesquisa fora da UFOP, e também profissional, ao me possibilitar aprender com novos pesquisadores e aprofundar meus conhecimentos em análise qualitativa. Sempre foi meu sonho estudar comportamento alimentar e compreender como podemos ajudar as pessoas a partir dessa perspectiva. Poder realizar isso em outro país, com uma cultura que dialoga com a brasileira, me inspira e motiva ainda mais a seguir nesse caminho.\n\nContinue nos acompanhando para saber mais sobre a pesquisa da Tainá! ❤️\n\n#doutorado #doutoradosanduiche #universidadedoporto #universidade #cienciabrasileira #capes"
