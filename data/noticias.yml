    conteudo: "Nosso #tbt de hoje é recente, para lembrar de duas qualificações de mestrado que ocorreram no dia 07 de março de 2022, via Google Meet.\n.\n🔎 O projeto de mestrado da aluna Sarah Beatriz Resende Tinoco (@sarahbeatrizrt), intitulado “Associação da inatividade física e do comportamento sedentário com o ganho de peso em egressos das universidades mineiras (Projeto CUME)”, é orientado pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientado pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut). Sua banca de qualificação contou com a colaboração do professor Dra. Adriano Marçal Pimenta –@adrianompimenta (UFPR) e da professora Dra. Lenice Kappes Becker Oliveira – @lenice_becker (UFOP).\n.\n🔎 O projeto de mestrado da aluna Thaís Calcagno Vidon Bruno, intitulado \"Associação da percepção de suporte social em tempos de pandemia de covid-19 com hábitos alimentares e ganho de peso: PADU-COVID\", é orientado pela professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro) e coorientado pela professora Dra. Sabrina Martins Barroso – @sabarroso (UFTM). Sua banca de qualificação contou com as contribuições da professora Dra. Isis Danyelle Dias Custódio (UFU) e da professora Dra. Maria Del Carmen Bisi Molina – @mdcarmenmolina (UFOP).\n.\n🎇 Parabenizamos a Sarah e a Thaís pela aprovação na sua qualificação e pela contribuição na ciência do país. Desejamos sucesso nas próximas etapas!"
