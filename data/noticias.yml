  - data: "2024-09-23"
    categoria: "Pesquisa"
    titulo: "Artigo: Isotemporal substitution analysis of time between sedentary behavior and physical activity on sleep quality in younger adults: a multicenter study"
    resumo: "O GPENSC apresenta o artigo intitulado \"Isotemporal substitution analysis of time between sedentary behavior and physical activity on sleep quality in younger adults: a multicenter study\", de autoria do Luiz Menezes-Júnior (@luizmenezes_jr) juntamente com pesquisadores do GPENSC e de outras universidades"
    conteudo: "O GPENSC apresenta o artigo intitulado \"Isotemporal substitution analysis of time between sedentary behavior and physical activity on sleep quality in younger adults: a multicenter study\", de autoria do Luiz Menezes-Júnior (@luizmenezes_jr) juntamente com pesquisadores do GPENSC e de outras universidades.\n.\n🎯 O artigo teve como objetivo avaliar como a substituição do comportamento sedentário (CS) por atividade física moderada a vigorosa (AFMV) pode melhorar a qualidade do sono de jovens adultos.\n.\n📝 Trata-se de um estudo multicêntrico realizado com 8.059 estudantes de universidades brasileiras. A análise de substituição isotemporal foi utilizada para examinar os efeitos de substituir o CS pela AFMV.\n.\n🔍 O que é a análise isotemporal? É um método estatístico usado para avaliar o impacto de substituir uma atividade por outra dentro de um limite de tempo fixo, considerando que um dia tem 24 horas. Isso permite avaliar os efeitos de \"substituir\" o tempo gasto em CS por AFMV, sem alterar o total de horas disponíveis.\n.\n📊 Os principais resultados encontrados foram:\n- Aproximadamente 6 a cada 10 participantes relataram uma qualidade de sono ruim.\n- Indivíduos fisicamente inativos e com longos períodos de CS (≥ 9 horas/dia) foram mais propensos a relatar sono ruim.\n- Na análise isotemporal, substituir o tempo de CS por AFMV resultou em uma redução significativa nas chances de má qualidade do sono, com uma redução de até 56% para AF moderada e 68% para AF vigorosa.\n.\n💡Esses resultados indicam que reduzir o CS e substituí-lo pela prática de AF pode melhorar a qualidade do sono e contribuir para a saúde geral.\n. 🔗 Acesse o artigo: https://doi.org/10.1186/s12889-024-19995-5"
