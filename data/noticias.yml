  - data: "2022-12-15"
    categoria: "Institucional"
    titulo: "Hoje, vamos compartilhar com vocês mais um pouquinho sobre o doutorado sanduíche de uma aluna do PPGSN/UFOP e pesquisadora do nosso grupo, a Magda do Carmo Parajára, que foi…"
    resumo: "Hoje, vamos compartilhar com vocês mais um pouquinho sobre o doutorado sanduíche de uma aluna do PPGSN/UFOP (@ppgsn.ufop) e pesquisadora do nosso grupo, a Magda do Carmo Parajára (@magdaparajara), que foi para a Universidade de Liverpool (@livuni), Reino Unido, com bolsa pela CAPES (@capes_oficial)"
    conteudo: "Hoje, vamos compartilhar com vocês mais um pouquinho sobre o doutorado sanduíche de uma aluna do PPGSN/UFOP (@ppgsn.ufop) e pesquisadora do nosso grupo, a Magda do Carmo Parajára (@magdaparajara), que foi para a Universidade de Liverpool (@livuni), Reino Unido, com bolsa pela CAPES (@capes_oficial).\n.\n✨ Para Magda, esse período foi uma experiência ímpar de crescimento pessoal e acadêmico. Segundo a aluna, essa etapa foi cheia de desafios e dúvidas quanto ao novo, mas também uma oportunidade para ter mais confiança, conhecer pessoas de diversas partes do mundo, vivenciar outras culturas, além de praticar uma segunda língua e aprender com um grupo de pesquisa internacional.\n.\n👥 A aluna teve reuniões frequentes com seu supervisor estrangeiro Martin O’Flaherty e a pós-doutoranda Zoé Colombet para discutir sobre sua pesquisa e aprender sobre a técnica de modelagem. A partir do uso dessa metodologia, ela segue junto com os pesquisadores na elaboração de um manuscrito sobre sua temática de estudo.\n.\n👩🏻‍💻 Magda também participou das reuniões mensais do Non-Communicable Disease Prevention and Food Policy Research Group, reuniões semanais e eventos do Department of Public Health, Policy & Systems e apresentou um trabalho na conferência “Society for Social Medicine & Population Health 66th Annual Scientific Meeting”. \n.\n🏫 A orientadora da aluna e uma das líderes do GPENSC, a professora Dra. Adriana Meireles (@dri_meireles), fez uma visita técnica à Universidade de Liverpool, onde teve a oportunidade de conhecer mais de perto o trabalho do grupo de pesquisa no exterior, apresentar os projetos do nosso grupo e discutir sobre parcerias futuras.\n.\n👉🏻 Arraste para o lado e confira alguns desses momentos!\n.\n🌌 Desejamos um bom retorno para a Magda e que essa etapa tenha sido um período de muito aprendizagem e trocas de conhecimento!\n.\n🗣️ Continue nos acompanhando para saber mais sobre as novidades e trabalhos desenvolvidos pelo nosso grupo!"
