    conteudo: "No dia 10 de dezembro, aconteceu a última reunião do ano do GPENSC, no formato online.\n.\n❣️ Neste encontro, para lá de especial e emocionante, tivemos um momento para compartilhar uns com os outros algo importante ou marcante de 2021, como uma foto ou uma história, algo que nos inspirou ou que nos manteve fortes.\n.\n💭 Foram trocas e histórias lindas! Sabemos que os momentos bons existem, assim como as dificuldades, mas que possamos sempre permanecer esperançosos, flexíveis e resilientes nessa caminhada. \n.\n🌟 Como grupo, que possamos permanecer unidos, cultivando as boas amizades e recordações. Que os laços que nos unem sejam fortalecidos para que possamos ir cada vez mais longe, colhendo os frutos do nosso trabalho.\n.\n💚 Finalizamos o ano de 2021 gratos pelo que passou e por tudo que foi conquistado. Agradecemos cada membro que contou sua história nesse ano e que possamos continuar  contando a história do GPENSC por muitos anos!"
