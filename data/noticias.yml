  - data: "2025-06-18"
    categoria: "Pesquisa"
    titulo: "🔍 Avaliar o risco cardiovascular com perguntas simples?"
    resumo: "🔍 Avaliar o risco cardiovascular com perguntas simples? Sim, é possível! Estudo conduzido por Luiz Antônio Alves de Menezes Júnior (@luizmenezes_jr) juntamente com outros pesquisadores…"
    conteudo: "🔍 Avaliar o risco cardiovascular com perguntas simples? Sim, é possível! \n\nEstudo conduzido por Luiz Antônio Alves de Menezes Júnior (@luizmenezes_jr) juntamente com outros pesquisadores do GPENSC, com amostra de mais de 1.400 trabalhadores de uma mineradora para investigar se o Framingham Risk Score (FRS) — uma ferramenta usada para prever risco de doenças cardiovasculares — poderia ser adaptado para contextos onde medidas clínicas (como colesterol e pressão arterial) não estão disponíveis.\n\nO que foi feito?\nOs pesquisadores compararam a versão tradicional do FRS (com exames laboratoriais) com versões adaptadas que usaram informações autorreferidas, como diagnóstico médico de hipertensão ou dislipidemia e uso de medicamentos.\n\nE o que encontraram?\n A versão adaptada com apenas a hipertensão autorreferida (FRS-SAH) teve alta correlação com a original (r = 0,90). Todos os modelos adaptados apresentaram alta precisão, com área sob a curva (AUC) acima de 0,85. A FRS-SAH foi a que mais se destacou, mostrando ser uma alternativa eficaz e confiável.\n\nMesmo sem exames laboratoriais, é possível avaliar com segurança o risco cardiovascular usando informações que podem ser coletadas por meio de entrevistas ou questionários. \n\n🔗 Acesse o artigo completo: https://bmccardiovascdisord.biomedcentral.com/articles/10.1186/s12872-025-04579-x"
    url: "https://www.instagram.com/p/DLDnQEmxQy3/"
    imagem: "img/instagram-acervo/DLDnQEmxQy3.webp"
