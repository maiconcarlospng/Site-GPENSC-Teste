  - data: "2023-03-09"
    categoria: "Pesquisa"
    titulo: "Como vocês têm acompanhado, em fevereiro o projeto HipertenSUS iniciou a última etapa da coleta de dados"
    resumo: "Como vocês têm acompanhado, em fevereiro o projeto HipertenSUS iniciou a última etapa da coleta de dados"
    conteudo: "Como vocês têm acompanhado, em fevereiro o projeto HipertenSUS iniciou a última etapa da coleta de dados. E concluir mais essa etapa, só foi possível graças a toda equipe, colaboradores e paciente que estiveram juntos nessa caminhada! \n.\n❤️ A equipe do HipertenSUS expressa seu sincero agradecimento aos usuários que participaram do nosso projeto, as Unidades Básicas de Saúde (UBS), ao Centro de Referência de Assistência Social (CRAS) Padre Faria, a Paróquia Nossa Senhora da Conceição e aos funcionários dessas unidades por nos apoiarem na interação com a comunidade. \n.\n🫂 O apoio das UBS, do CRAS e da Paróquia foi fundamental para que pudéssemos fornecer informações valiosas e conscientizar sobre a importância de ações de cuidado na pressão arterial. E agradecemos a todos os usuários que participaram, compartilhando suas histórias e experiências.\n.\n📝 Esperamos que as informações fornecidas durante o projeto tenham ajudado a melhorar a saúde e o bem-estar de todos os participantes e de suas famílias. Mais uma vez, obrigada pela sua disponibilidade, esforço e por nos permitir aperfeiçoar cada vez mais o nosso trabalho. \n.\n✨ Também parabenizamos toda a equipe de professoras, pesquisadores, alunos e voluntários por todo empenho dedicado ao HipertenSUS. Que possamos continuar fazendo pesquisa com ética, amor e dedicação! ❤️"
