  - data: "2021-05-11"
    categoria: "Divulgação científica"
    titulo: "Hoje, o #IndicaGPENSC traz como recomendação o “Glossário Lourdes Almeida da Consolidação de Normas do Sistema Único de Saúde”, que foi lançado em abril deste ano pelo Ministério da Saúde e pelo Instituto Oswaldo Cruz – Brasília"
    resumo: "Hoje, o #IndicaGPENSC traz como recomendação o “Glossário Lourdes Almeida da Consolidação de Normas do Sistema Único de Saúde”, que foi lançado em abril deste ano pelo Ministério da Saúde e pelo Instituto Oswaldo Cruz – Brasília"
    conteudo: "Hoje, o #IndicaGPENSC traz como recomendação o “Glossário Lourdes Almeida da Consolidação de Normas do Sistema Único de Saúde”, que foi lançado em abril deste ano pelo Ministério da Saúde e pelo Instituto Oswaldo Cruz – Brasília.\n.\n🔠 De A a V, ou melhor, de “Abordagem Multiprofissional Interdisciplinar” a “Vulnerabilidade”, o glossário conta com 1.808 termos, 2.314 definições e 318 siglas. Todas as definições contêm as fontes normativas correspondentes referenciadas, o que permite o conhecimento integral das definições normativas do #SUS e sua correspondência com as informações do texto publicado no Diário Oficial da União. \n.\n🔎 O material na íntegra pode ser acessado na Biblioteca Virtual em  Saúde, do Ministério da Saúde, ou pelo link na nossa bio. Vale a pena conferir!\n.\n📌 Aproveita e já salve esse post. Também não deixe de marcar aqui nos comentários ou compartilhar essa publicação para aquele amigo ou amiga que precisa conhecer esse glossário."
    url: "https://www.instagram.com/p/COvxhurAbSV/"
    imagem: "img/instagram-acervo/COvxhurAbSV.webp"
  - data: "2021-04-27"
    categoria: "Divulgação científica"
    titulo: "Neste mês de abril, a professora Dra"
    resumo: "Neste mês de abril, a professora Dra"
    conteudo: "Neste mês de abril, a professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut), uma das coordenadoras do ESANP (Estudo da Segurança Alimentar e Nutricional na Pandemia da COVID-19), concedeu uma entrevista na forma de podcast para a Rádio UFOP (@radioufop) explicando sobre o ESANP, que tem como objetivo monitorar a situação de segurança alimentar e nutricional nos domicílios dos alunos de escolas públicas de Ouro Preto (@prefeituraouropreto) e Mariana (@prefmariana) durante a pandemia da COVID-19.\n.\n🎙️ Na reportagem, a professora Raquel fala sobre:\n▪️O que é segurança alimentar e nutricional\n▪️A finalidade do estudo, o ESANP\n▪️Como será feito o monitoramento da segurança alimentar e nutricional nos domicílios\n▪️Resultados preliminares sobre o perfil das famílias, distribuição de alimentos e insegurança alimentar\n▪️Possíveis formas de resolver os problemas relacionados à alimentação\n.\n🗣️ Quer saber mais sobre a entrevista? Acesse a reportagem completa pelo link disponível na nossa bio! Não deixa de conferir, pois está imperdível!"
