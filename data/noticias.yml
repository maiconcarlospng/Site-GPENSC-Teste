    conteudo: "✨ Conheça mais uma integrante do GPENSC!\n\nApresentamos Lorena Pinto Andrade (@lorenaandradenutricionista), nutricionista, mestre em Ciência dos Alimentos pela Universidade Federal de Lavras (UFLA) e, atualmente, doutoranda em Saúde e Nutrição pela Universidade Federal de Ouro Preto (UFOP).\n\nLorena é integrante do GPENSC e doutoranda vinculada ao Programa de Pós-Graduação em Saúde e Nutrição (PPGSN – @ppgsn.ufop) da UFOP, sob orientação da Prof.ª Dr.ª Camila Carvalho Menezes Salierno (@menezescamilacarvalho).\n\n📚 Linha/Projeto de pesquisa:\nLorena desenvolve pesquisas na área de rotulagem nutricional, alimentos ultraprocessados, composição de alimentos e saúde pública. Seu projeto de doutorado avalia a conformidade da rotulagem nutricional e o teor de sódio de hambúrgueres processados e seus análogos plant-based comercializados no Brasil.\n\n👉 Continue nos acompanhando para conhecer mais membros do GPENSC e as pesquisas que desenvolvemos!\n\n#GPENSC #Ciencia #Nutricao #SaudeColetiva #Pesquisa"
