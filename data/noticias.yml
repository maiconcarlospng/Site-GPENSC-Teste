    resumo: "O GPENSC apresenta alguns alunos de Iniciação Científica (IC) que estão colaborando com o PADu-Multicêntrico (Estudo das Federais de Minas Gerais) e que são membros do GPENSC"
    conteudo: "O GPENSC apresenta alguns alunos de Iniciação Científica (IC) que estão colaborando com o PADu-Multicêntrico (Estudo das Federais de Minas Gerais) e que são membros do GPENSC.\n.\n👩🏻‍🎓 A Fernanda Vimieiro (@fernandavimieiro) é aluna do sétimo e oitavo período de Nutrição da Universidade Federal de Ouro Preto (UFOP), orientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientada pela mestranda Bruna Carolina Barbosa (@brunabcrb18).\n.\n👨🏻‍🎓 Matheus Santos Cordeiro (@mathheuscor) é aluno do sexto período de Nutrição da UFOP. Na IC, pretende trabalhar com Insegurança Alimentar e Nutricional e ambiente alimentar nos domicílios de escolares, tema de estudo que desenvolverá seu Trabalho de Conclusão de Curso (TCC), sob orientação da professora Dra. Adriana Lúcia Meireles.\n.\n👩🏽‍🎓 A Mídian de Oliveira Silva (@mihcardoso2) é aluna do sétimo período de Nutrição da UFOP. Seu tema de pesquisa é intitulado “Consumo de alimentos ultraprocessados associado ao sono entre estudantes universitários durante a pandemia da COVID-19”. Mídian é orientada pela professora Dra. Adriana Lúcia Meireles.\n.\n👩🏻‍🎓 A Nádia da Silva Luz (@nadias.luz) é aluna do quarto período de Nutrição da UFOP, orientada pela professora Dra. Adriana Lúcia Meireles. Na IC, pretende trabalhar com os impactos socioeconômicos na alimentação durante a pandemia da COVID-19. É orientada pela professora Dra. Adriana Lúcia Meireles.\n.\n👩🏻‍🎓 A Scarlarty Silveira Correa (@scarlartys) é aluna do sétimo período de Nutrição da UFOP. Seu tema de pesquisa e do TCC dentro do PADu-Multicêntrico é “Hábito de beliscar e comportamento sedentário entre estudantes universitários”. Scarlarty é orientada pela professora Dra. Adriana Lúcia Meireles e coorientada pela mestranda Bruna Carolina Barbosa.\n.\n🗣️ Continue nos acompanhando para saber mais sobre o nosso grupo e os projetos que estamos desenvolvendo!"
