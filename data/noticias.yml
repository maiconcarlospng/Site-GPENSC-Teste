  - data: "2024-06-18"
    categoria: "Institucional"
    titulo: "Hoje, nosso post é para compartilhar com vocês sobre o doutorado sanduíche de uma pesquisadora do nosso grupo, a Priscila Pena Camargo, discente do PPGSN/UFOP, orientada pela…"
    resumo: "Hoje, nosso post é para compartilhar com vocês sobre o doutorado sanduíche de uma pesquisadora do nosso grupo, a Priscila Pena Camargo (@priscilapenacamargo), discente do PPGSN/UFOP (@ppgsn.ufop), orientada pela professora Dra"
    conteudo: "Hoje, nosso post é para compartilhar com vocês sobre o doutorado sanduíche de uma pesquisadora do nosso grupo, a Priscila Pena Camargo (@priscilapenacamargo), discente do PPGSN/UFOP (@ppgsn.ufop), orientada pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut) e coorientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles).\n.\n✈️ Priscila foi contemplada com uma bolsa da Coordenação de Aperfeiçoamento de Pessoal de Nível Superior (CAPES - @capes_oficial), pelo Programa de Doutorado Sanduíche no Exterior (PDSE), para realizar sua mobilidade acadêmica em Boston, EUA, entre abril e setembro de 2024.\n.\n🏫 A instituição de destino foi a Boston University (@bostonu). A orientadora estrangeira da discente é a Dra. Ana Poblacion, pesquisadora associada do Instituto Children’s HealthWatch, que investiga a nutrição pediátrica e a erradicação da insegurança alimentar (IA) em domicílios com crianças, por meio da melhoria do acesso a alimentos saudáveis.\n.\n📚No doutorado sanduíche, Priscila realizará estudos sobre como ações de proteção social implementadas podem determinar diferentes desfechos na situação de IA e são importantes para investigar os avanços/retrocessos, as lacunas e os obstáculos a serem vencidos para a mitigação da IA e a redução da fome e pobreza em diversos âmbitos.\n.\n👉🏼 Arrasta para o lado e confira!\n.\n🗣️ Continue nos acompanhando para saber mais novidades e trabalhos desenvolvidos pelo nosso grupo!"
