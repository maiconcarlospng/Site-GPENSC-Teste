    categoria: "Ensino"
    titulo: "Prevalência de comportamento sedentário entre estudantes de escolas públicas antes e durante a pandemia do COVID-19"
    resumo: "O GPENSC apresenta os alunos de Iniciação Científica (ICs) do ESANP (Estudo da Segurança Alimentar e Nutricional na pandemia da COVID-19: situação domiciliar dos alunos de Mariana e Ouro Preto) e membros do GPENSC"
    conteudo: "O GPENSC apresenta os alunos de Iniciação Científica (ICs) do ESANP (Estudo da Segurança Alimentar e Nutricional na pandemia da COVID-19: situação domiciliar dos alunos de Mariana e Ouro Preto) e membros do GPENSC.\n.\n🎓 A Natália de Freitas Tavares (@nataliaftavares) é aluna do sexto período de Nutrição da Universidade Federal de Ouro Preto (UFOP). Orientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientada pela doutoranda Erica Costa Rodrigues, seu tema de pesquisa da iniciação científica é intitulado \"Prevalência de comportamento sedentário entre estudantes de escolas públicas antes e durante a pandemia do COVID-19\".\n.\n🎓 A Chrislaine Corraide Dias dos Santos (@chris.cordis) é aluna do sexto período do curso de Nutrição (UFOP). Seu tema de pesquisa e do seu Trabalho de Conclusão de Curso (TCC) dentro desse projeto maior é “Disponibilidade de alimentos nos domicílios dos alunos atendidos pela rede municipal de ensino de Mariana e Ouro Preto/MG na pandemia de SARS-CoV-2”. Chrislaine é orientada pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut) e coorientado pela doutoranda Priscila Pena Camargo (@priscilapenacamargo).\n.\n🎓 O Matheus Felipe Chagas Batista (@matheusfeleal) é aluno do segundo período do curso de Nutrição (UFOP), orientado pela professora Dra. Raquel de Deus Mendonça e coorientada pela doutoranda Priscila Pena Camargo. Seu tema de pesquisa é “Estudo da Segurança Alimentar e Nutricional na Pandemia da Covid-19”.\n.\n👥 Agradecemos aos ICs e também aos demais voluntários que vêm contribuindo para que esse projeto se torne realidade, são eles: Berenice, Carol Constantino, Helton, Mariana Cassemiro, Larissa Menezes, Tainá, Júlia, Lorran, Railane e Edilaine.\n.\n🗣 Continue nos acompanhando para saber mais sobre o nosso grupo e os projetos que desenvolvemos!"
