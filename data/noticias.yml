  - data: "2026-06-16"
    categoria: "Pesquisa"
    titulo: "🧠☀️ Você sabia que a relação entre vitamina D e depressão pode depender de fatores genéticos e do estilo…"
    resumo: "🧠☀️ Você sabia que a relação entre vitamina D e depressão pode depender de fatores genéticos e do estilo de vida? Estudo conduzido por Thaís…"
    conteudo: "🧠☀️ Você sabia que a relação entre vitamina D e depressão pode depender de fatores genéticos e do estilo de vida?\n\nEstudo conduzido por Thaís da Silva Sabião (@thasabiao), juntamente com outros pesquisadores do GPENSC, investigou a interação entre polimorfismos em genes da via metabólica da vitamina D, os níveis séricos dessa vitamina e a presença de sintomas depressivos em adultos brasileiros durante a pandemia de COVID-19.\n\n💡 O que foi investigado?\nFoi realizado um estudo transversal de base populacional com 1.637 participantes. Os pesquisadores avaliaram sintomas depressivos por meio do Patient Health Questionnaire-9 (PHQ-9), identificaram a deficiência de vitamina D (valores inferiores a 20 ng/mL) e construíram um escore de risco genético com base em polimorfismos dos genes envolvidos no metabolismo da vitamina D (DHCR7, GC e VDR).\n\n📊 Principais achados:\n✔️ Não foi observada associação direta entre deficiência de vitamina D e sintomas depressivos na população geral;\n✔️ Indivíduos com predisposição genética para deficiência de vitamina D apresentaram maior prevalência de sintomas depressivos quando associados a fatores como:\n• cor da pele não branca;\n• não utilização de suplementação de vitamina D;\n• exposição insuficiente ao sol.\n\n✅ Conclusão:\nA deficiência de vitamina D esteve associada a uma maior prevalência de sintomas depressivos em brasileiros geneticamente predispostos, especialmente entre aqueles com a cor da pele não branca, com menor exposição solar e sem suplementação. Esses achados reforçam a necessidade de estratégias de promoção da saúde mental que considerem fatores biológicos e hábitos de vida, contribuindo para abordagens mais personalizadas e eficazes.\n\n#GPENSC #PesquisaCientífica #VitaminaD #SaúdeMental #Depressão\n\nLink do artigo: https://www.sciencedirect.com/science/article/abs/pii/S0899900725001200?via%3Dihub"
    url: "https://www.instagram.com/p/DZqTiL_FU0p/"
    imagem: "img/instagram-acervo/DZqTiL_FU0p.webp"
  - data: "2026-06-10"
    categoria: "Pesquisa"
    titulo: "A presença de alguns termos como “sem adição de açúcar”  na embalagem do alimento te influencia na escolha…"
    resumo: "A presença de alguns termos como “sem adição de açúcar” na embalagem do alimento te influencia na escolha dos alimentos? O estudo realizado por Francine…"
    conteudo: "A presença de alguns termos como “sem adição de açúcar”  na embalagem do alimento te influencia na escolha dos alimentos?\n\nO estudo realizado por Francine Rubim de Resende (@fracinerubimnutri), coorientada pelo Dr. Eduardo Beazorte e orientada pela Dra. Camila Carvalho Meneses investigaram exatamente isso.\n\n🔍  Os pesquisadores investigaram se a presença de alegações nutricionais referente ao teor de açúcar (sem adição, baixo ou reduzido em açúcar) influencia na escolha de alimentos.\n\n📌Neste estudo, realizado com 622 responsáveis por crianças de primeira infância (menores de 6 anos), os pesquisadores apresentaram dois protótipos de rótulos de um biscoito de chocolate, um tradicional e um sem adição de açúcar. \n\n📊 Os autores verificaram que mesmo sem terem acesso a lista de ingredientes ou tabela de informação nutricional, a maioria do participantes relataram maior intenção de compra para o protótipo de rótulo com a alegação “sem adição de açúcar”. \n\n📈 Além disso, relataram que permitiriam que a criança consumisse uma maior porção do biscoito sem adição de açúcar quando comparado ao tradicional.\n\n✅ A análise qualitativa mostrou que, ao avaliar o protótipo “sem adição de açúcar”, os responsáveis descreveram esse alimento como “mais saudável” e “bom para a saúde”, atribuindo-lhes maior saudabilidade. \n\n📝Conclusão: Embora a legislação brasileira regule o uso dessa alegação, sua presença em rótulos de alimentos pode induzir os consumidores a erro, favorecendo o maior consumo desses alimentos industrializados.\n\n💡 Destaca-se assim, a necessidade de que os consumidores avaliem de forma crítica e completa o rótulo dos alimentos, para realizarem escolhas mais conscientes.\n\nFicou interessado em ler o artigo? Escaneie o Qr Code para ter acesso ao conteúdo na integra."
    url: "https://www.instagram.com/p/DZa87SzkQxb/"
    imagem: "img/instagram-acervo/DZa87SzkQxb.webp"
  - data: "2026-06-03"
    categoria: "Pesquisa"
    titulo: "🧠 Você sabia que mais da metade dos universitários brasileiros apresentaram sintomas de ansiedade e…"
    resumo: "🧠 Você sabia que mais da metade dos universitários brasileiros apresentaram sintomas de ansiedade e depressão durante o período de ensino remoto na pandemia? 📚💻…"
    conteudo: "🧠 Você sabia que mais da metade dos universitários brasileiros apresentaram sintomas de ansiedade e depressão durante o período de ensino remoto na pandemia? 📚💻\n\nEstudo conduzido por Bruna Carolina Rafael Barbosa (@brunabcrb,) juntamente com outros pesquisadores do GPENSC, investigou a saúde mental de estudantes universitários de diferentes regiões do Brasil durante a suspensão das aulas presenciais na pandemia de COVID-19.\n\n💡 O que foi investigado?\nFoi realizado um estudo multicêntrico, transversal e online com 8.650 estudantes de graduação regularmente matriculados em 8 universidades públicas brasileiras, entre outubro de 2021 e fevereiro de 2022.\n\nAs análises estimaram a prevalência de sintomas de ansiedade e depressão e sua relação com características sociodemográficas e acadêmicas dos participantes.\n\n📊 Principais achados:\n✔️ 59,7% dos estudantes apresentaram sintomas de ansiedade;\n✔️ 63,0% apresentaram sintomas de depressão;\n✔️ os sintomas foram mais frequentes entre mulheres, estudantes mais jovens, pessoas com redução de renda durante a pandemia, minorias sexuais e de gênero, além de estudantes de diferentes áreas do conhecimento.\n\nOs achados revelam um cenário preocupante de sofrimento psicológico entre universitários durante o período de ensino remoto.\n\n✅ Conclusão:\nOs resultados reforçam a necessidade de ações institucionais e políticas públicas voltadas à promoção da saúde mental e do bem-estar de estudantes universitários, especialmente em contextos de vulnerabilidade social e mudanças no ambiente acadêmico.\n\nLink do artigo: https://www.scielo.br/j/spmj/a/BjJH7Mnb9FzcSccs3TdWTgK/?lang=en"
    url: "https://www.instagram.com/p/DZI2ie9EeTM/"
    imagem: "img/instagram-acervo/DZI2ie9EeTM.webp"
