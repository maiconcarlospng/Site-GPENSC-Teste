    imagem: "img/instagram-acervo/CLfKjaVg0_N.webp"
  - data: "2021-02-16"
    categoria: "Pesquisa"
    titulo: "Hoje iremos falar sobre o Estudo da Segurança Alimentar e Nutricional na Pandemia de COVID-19 (ESANP)"
    resumo: "Hoje iremos falar sobre o Estudo da Segurança Alimentar e Nutricional na Pandemia de COVID-19 (ESANP)"
    conteudo: "Hoje iremos falar sobre o Estudo da Segurança Alimentar e Nutricional na Pandemia de COVID-19 (ESANP).\n.\n🎯 O ESANP é uma pesquisa longitudinal com o objetivo de analisar a situação de segurança alimentar e nutricional, a disponibilidade de alimentos e o ambiente alimentar nos domicílios dos alunos da rede municipal de ensino de Mariana e Ouro Preto, durante e após a pandemia da COVID-19.\n.\n👥  A pesquisa é coordenada pelas profas. Dra. Raquel de Deus Mendonça (@raquelmenonca_enut), Dra. Adriana Lúcia Meireles (@dri_meireles), Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes) e Dra. Natália Caldeira de Carvalho (@ncaldeira1). O estudo também conta com a participação das doutorandas Erica Costa Rodrigues e Priscila Pena Camargo (@priscilapenacamargo).\n.\n📋 Foram coletados e analisados dados sobre o perfil sociodemográfico, a situação de segurança alimentar e a disponibilidade e o acesso a alimentos nos domicílios dos alunos da rede municipal dos municípios.\n.\n▶️ Arraste para o lado e confira os resultados preliminares do estudo.\n.\n📷 Créditos das artes: @chris.cordis\n.\n🔍 Quer saber mais sobre esse e outros projetos? Continue nos acompanhando."
    url: "https://www.instagram.com/p/CLXbNZSgXS9/"
    imagem: "img/instagram-acervo/CLXbNZSgXS9.webp"
  - data: "2021-02-12"
    categoria: "Pesquisa"
    titulo: "Estamos selecionando entrevistadores para o Estudo de Segurança Alimentar e Nutricional na Pandemia de COVID-19 (ESANP), coordenado pela profa"
    resumo: "Estamos selecionando entrevistadores para o Estudo de Segurança Alimentar e Nutricional na Pandemia de COVID-19 (ESANP), coordenado pela profa"
    conteudo: "Estamos selecionando entrevistadores para o Estudo de Segurança Alimentar e Nutricional na Pandemia de COVID-19 (ESANP), coordenado pela profa. Dra. Raquel de Deus Mendonça (@raquelmendonca_enut).\n.\n📋 A atividade a ser realizada consiste em entrevistas sobre Segurança Alimentar e Nutricional.\n.\n👥 Os entrevistadores receberão treinamento para a realização da atividade.\n.\n📱 A coleta de dados será feita pelo celular, com chip e plano de ligações fornecidos pelo projeto. \n.\n⏰ Os voluntários precisarão dedicar 2 horas/dia, em horários variados e de acordo com a disponibilidade. \n. \n🗓 O início das atividades será em 01/03/2021 e a previsão de encerramento das entrevistas é até o dia 16/04/2021. \n.\n🔸 Quem pode participar?\nAlunos de Nutrição.\n.\n🔸 Como realizar a inscrição?\nPara realizar a inscrição, e para mais informações, entre em contato com as pesquisadoras responsáveis em um dos seguintes e-mails: erica.costa@aluno.ufop.edu.br ou priscila.camargo@aluno.ufop.edu.br\n.\n🔸Qual o prazo máximo das inscrições?\nAté dia 19/02/2021.\n. \n⚠️ Haverá emissão de certificado de horas.\n.\n🗣️ Não perca essa chance, venha fazer pesquisa com a gente!"
