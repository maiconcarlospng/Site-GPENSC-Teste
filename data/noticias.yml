    categoria: "Divulgação científica"
    titulo: "Desmistificando dúvidas sobre alimentação e nutrição"
    resumo: "O GPENSC recomenda o material “Desmistificando dúvidas sobre alimentação e nutrição”, lançado em 2016, pela Coordenação-Geral de Alimentação e Nutrição do Ministério da Saúde (CGAN/MS), em parceria com a Universidade Federal de Minas Gerais (@gin.ufmg) e com o apoio da Organização Pan-Americana da Saúde (Opas/Brasil)"
    conteudo: "O GPENSC recomenda o material “Desmistificando dúvidas sobre alimentação e nutrição”, lançado em 2016, pela Coordenação-Geral de Alimentação e Nutrição do Ministério da Saúde (CGAN/MS), em parceria com a Universidade Federal de Minas Gerais (@gin.ufmg) e com o apoio da Organização Pan-Americana da Saúde (Opas/Brasil).\n.\n📚 O material traz os principais temas abordados pela mídia, esclarece dúvidas sobre dietas da moda e tem sugestões de leituras adicionais, considerando evidências científicas e a legislação.\n.\n📝 A publicação pretende orientar e subsidiar a prática dos profissionais de saúde, assim como ampliar a autonomia das pessoas, famílias e comunidades, facilitando o acesso a conhecimentos sobre alimentação e nutrição e possibilitando que reflitam de forma crítica sobre hábitos e práticas que muitas vezes podem causar riscos à saúde.\n.\n🔗 O material na íntegra pode ser acessado na Biblioteca Virtual em Saúde, do Ministério da Saúde, ou pelo link disponível na nossa bio. Não deixe de conferir!\n.\n📌 Aproveita e salve esse post! Também não deixe de marcar nos comentários ou compartilhar essa publicação com aquele(a) amigo(a) que precisa esclarecer dúvidas sobre nutrição."
