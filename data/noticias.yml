  - data: "2022-04-19"
    categoria: "Pesquisa"
    titulo: "Projeto: Efetividade de intervenção nutricional para controle da Hipertensão Arterial Sistêmica na Atenção Primária à Saúde"
    resumo: "Estamos com inscrições abertas para o preenchimento de vaga para nutricionista bolsista CNPq (Conselho Nacional de Desenvolvimento Tecnológico e Industrial) no projeto intitulado \"Efetividade de intervenção nutricional para controle da Hipertensão Arterial Sistêmica na Atenção Primária à Saúde\" (HipertenSUS)"
    conteudo: "Estamos com inscrições abertas para o preenchimento de vaga para nutricionista bolsista CNPq (Conselho Nacional de Desenvolvimento Tecnológico e Industrial) no projeto intitulado \"Efetividade de intervenção nutricional para controle da Hipertensão Arterial Sistêmica na Atenção Primária à Saúde\" (HipertenSUS).\n. \n❤️ O HipertenSUS é realizado pela Escola de Nutrição da Universidade Federal de Ouro Preto (ENUT/UFOP - @enut_ufop) em parceria com a Secretaria Municipal de Saúde de Ouro Preto (@prefeituraouropreto), com coordenação das profas. Dras. Júlia Cristina Cardoso Carraro (@julia_carraro), Raquel de Deus Mendonça (@raquelmendonca_enut) e Renata Adrielle Lima Vieira (@renataadriellenutri).\n.\n🔸 Quem pode participar? \nNutricionista com registro ativo no Conselho Regional de Nutricionistas (CRN) e que tenha disponibilidade de 12 (doze) horas semanais. \n.\n🔸 Quais os documentos necessários?\nHistórico escolar, comprovante de registro no CRN e currículo lattes atualizado.\n.\n🔸 Como realizar a inscrição?\nPara realizar a inscrição, e para mais informações, entre em contato pelo seguinte e-mail: projetohipertensus.enut@ufop.edu.br\n.\n🔸 Qual o prazo máximo das inscrições?\nAté dia 25/04/2022.\n.\n🔗 O edital está disponível no site do Programa de Pós-Graduação em Saúde e Nutrição (PPGSN) da UFOP. Leia o edital completo acessando o link na nossa bio.\n.\n🗣️ Não perca essa chance, venha fazer pesquisa com a gente!"
