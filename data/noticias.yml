  - data: "2020-11-06"
    categoria: "Pesquisa"
    titulo: "Há alguns dias, apresentamos a pesquisa da Carla"
    resumo: "Há alguns dias, apresentamos a pesquisa da Carla (@carlaef.rocha )"
    conteudo: "Há alguns dias, apresentamos a pesquisa da Carla (@carlaef.rocha ). Mas qual a importância de estudar a carga de doenças atribuível à dieta rica em carnes processadas e o seu custo financeiro para o SUS?\n.\n📌 A carne vermelha está na lista dos alimentos mais consumidos pelos brasileiros, com destaque para as carnes processadas.\n.\n🎯 O objetivo desse artigo foi investigar a associação entre o consumo de carne vermelha processada e a ocorrência de novos casos de resistência insulínica e diabetes mellitus em participantes do Estudo Longitudinal de Saúde do Adulto (ELSA-Brasil).\n.\n📚 Observou-se que homens e participantes com menor renda e escolaridade relataram maior consumo de carne vermelha e processada. O maior consumo de carne processada associou-se a novos casos de resistência insulínica em homens e mulheres. O alto consumo de carne vermelha aumentou em 40% a chance de novos casos de diabetes mellitus em homens.\n.\n💡O consumo de carnes vermelhas processadas está diretamente relacionado à carga de doenças crônicas não transmissíveis (DCNT), que por sua vez, impactam nos sistemas de saúde. Diante da escassez de estudos que analisam o impacto financeiro no SUS em decorrência das DCNT atribuídas à dieta rica em carnes processadas, o estudo da Carla vem para contribuir com o avanço da ciência brasileira e subsidiar discussões no âmbito das políticas públicas."
