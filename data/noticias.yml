    categoria: "Divulgação científica"
    titulo: "GPENSC compartilha material educativo com receitas do projeto ESANP"
    resumo: "O grupo divulgou o material Receitas do ESANP: uma coletânea da nossa trajetória juntos, elaborado por pesquisadores do GPENSC e da UFOP."
    conteudo: "Olá, pessoal! . Hoje, a nossa recomendação no #indicaGPENSC é o material educativo “Receitas do ESANP: uma coletânea da nossa trajetória juntos”, desenvolvido por pesquisadores do GPENSC e da UFOP, sob supervisão das professoras Dra. Adriana Meireles (@dri_meireles) e Dra. Raquel Mendonça (@raquelmendonca_enut). 🍛 O material educativo aborda uma breve apresentação sobre o projeto HipertenSUS e traz informações sobre alimentação adequada e saudável, dando ênfase em algumas receitas. 👉🏻 Arraste para o lado e confira. 🗣️ Gostou da dica? Compartilha com os amigos e aproveitar para salvar essa recomendação."
