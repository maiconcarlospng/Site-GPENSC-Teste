    titulo: "O GPENSC relembra a defesa de doutorado da Hillary Nascimento Coletro, que ocorreu no dia 26 de julho de 2023, de forma híbrida"
    resumo: "O GPENSC relembra defesa de doutorado da Hillary Nascimento Coletro (@hillarycoletro), que ocorreu no dia 26 de julho de 2023, de forma híbrida"
    conteudo: "O GPENSC relembra defesa de doutorado da Hillary Nascimento Coletro (@hillarycoletro), que ocorreu no dia 26 de julho de 2023, de forma híbrida.\n.\n🔎 A tese de doutorado da Hillary, intitulada: “Consumo alimentar segundo processamento e suas interfaces com a saúde humana durante a pandemia da covid-19: um estudo sobre saúde mental e insegurança alimentar”, teve como objetivo principal avaliar a associação entre o consumo alimentar segundo extensão e propósito de processamento com desfechos relacionados à saúde durante a pandemia da covid-19, em adultos de duas cidades da região sudeste do Brasil.\n.\n👥 Seu estudo foi orientado pela professora Dra. Mariana Carvalho de Menezes - @maricarvalhomenezes (UFOP). O trabalho contou com as contribuições da banca formada pelas professoras Dra. Anelise de Souza - @andradeanelise (UFOP), Dra. Renata Adrielle Lima - @renataadriellenutri (UFOP), Dra. Mariana Souza Lopes (UFPB) e Dra. Naiza Nayla Bandeira de Sá (UFPA). \n.\n📊 O doutorado da Hillary originou três artigos. Os achados evidenciam que o maior consumo de alimentos ultraprocessados pode ter impactos negativos à saúde mental e à segurança alimentar, uma vez que os alimentos in natura/minimamente processados são benéficos para ambas as situações.\n.\n💭 Mais detalhes sobre os resultados dos artigos, podem ser conferidos nos comentários.\n.\n🎆 Parabenizamos a Hillary pela finalização do doutorado e pela contribuição com o PPGSN e para a ciência do país. Desejamos muito sucesso!"
