    categoria: "Institucional"
    titulo: "Instrutivo de Abordagem Individual para o Manejo da Obesidade no SUS"
    resumo: "O GPENSC recomenda o material “Instrutivo de Abordagem Individual para o Manejo da Obesidade no SUS”, elaborado pelo Grupo de Pesquisa de Intervenções em Nutrição da Universidade Federal de Minas Gerais (GIN/UFMG - @gin.ufmg) em parceria com a Coordenação Geral de Alimentação e Nutrição do Ministério da Saúde…"
    conteudo: "O GPENSC recomenda o material “Instrutivo de Abordagem Individual para o Manejo da Obesidade no SUS”, elaborado pelo Grupo de Pesquisa de Intervenções em Nutrição da Universidade Federal de Minas Gerais (GIN/UFMG - @gin.ufmg) em parceria com a Coordenação Geral de Alimentação e Nutrição do Ministério da Saúde (CGAN/DEPROS/SAPS/MS).\n.\n🎯 O objetivo deste instrutivo é servir como uma ferramenta de suporte e apoio para gestores e profissionais da saúde, promovendo a inovação e a qualificação do manejo da obesidade no SUS.\n.\n📚 O instrutivo conta com 8 capítulos que abordam os seguintes temas: o cuidado da pessoa com obesidade no SUS; a perspectiva teórica na abordagem individual da pessoa com obesidade; os desafios no cuidado da pessoa com obesidade; a abordagem individual da pessoa com obesidade no SUS; a avaliação da pessoa com obesidade; a abordagem individual da pessoa com obesidade na prática; a abordagem nutricional individual na prática do/a nutricionista; e, por fim, um estudo de caso sobre a abordagem individual da pessoa com obesidade.\n .\n💡Em resumo, o material apresenta perspectivas teóricas e práticas para o manejo da obesidade no SUS, promovendo uma abordagem individualizada e uma avaliação integral da pessoa com obesidade, com respeito, competência e empatia.\n.\n🔗 Para conferir o documento na íntegra, acesse: https://drive.google.com/file/d/1lcIz12nMhFJziub06c8POUmrSPb7RONF/view?fbclid=PAZXh0bgNhZW0CMTEAAaZSpcZsRZU8kqeBDdKC-OBYrkQtZUzr-XstXdTO3kivRM6kVD9rxN5x2e4_aem_ztj1qMrUWU06qFBTh2XTjg\n.\n🗣️ Gostou do conteúdo? Compartilha com os amigos e aproveita para salvar essa recomendação."
    url: "https://www.instagram.com/p/DAWsz8mvWDF/"
    imagem: "img/instagram-acervo/DAWsz8mvWDF.webp"
  - data: "2024-09-12"
    categoria: "Institucional"
    titulo: "O #tbt de hoje é para lembrar da defesa de doutorado da Thaís Sabião, que ocorreu no dia 30 de julho de 2024, no formato híbrido"
    resumo: "O #tbt de hoje é para lembrar da defesa de doutorado da Thaís Sabião (@thasabiao), que ocorreu no dia 30 de julho de 2024, no formato híbrido"
    conteudo: "O #tbt de hoje é para lembrar da defesa de doutorado da Thaís Sabião (@thasabiao), que ocorreu no dia 30 de julho de 2024, no formato híbrido.\n.\n🔎 A tese, intitulada “Associação de fatores sociais e biológicos com transtornos de ansiedade e depressão: Ênfase na insegurança alimentar e no metabolismo da vitamina D”, teve como objetivo analisar a associação entre os sintomas de transtornos de ansiedade e depressão com a insegurança alimentar, os níveis séricos de vitamina D e polimorfismos genéticos relacionados ao metabolismo da vitamina D. O estudo resultou em quatro artigos originais.\n.\n👥 O estudo foi orientado pela Dra. Júlia Carraro - UFOP (@julia_carraro) e coorientado pelo Dr. George Coelho - UFOP (@georgelinsmachadocoelho). A banca da defesa foi composta pelas Dras. Aline Aguiar - UFOP (@aline.saguiar), Anelise Andrade - UFOP (@andradeanelise) e Carolina Nicoletti - USP (@carolnicolettif), e pelo Dr. Adriano Pimenta - UFPR (@adrianopimenta).\n.\n📊 Os resultados mostraram uma forte associação entre insegurança alimentar e sintomas de ansiedade e depressão, influenciada por características sociodemográficas. Além disso, embora não tenha sido identificada uma associação direta entre a deficiência de vitamina D e os sintomas de ansiedade e depressão, a pesquisa evidenciou que a interação com variações genéticas e hábitos de vida pode influenciar os sintomas desses transtornos.\n.\n💡 As descobertas do estudo evidenciam a complexidade dos fatores associados aos transtornos de saúde mental e seus sintomas, que são desafiadores de gerenciar devido à sua multidimensionalidade. O estudo abordou de maneira particular os aspectos sociais e biológicos, ressaltando a importância de integrá-los na promoção da saúde mental e na prevenção de transtornos mentais.\n.\n🎆 Parabenizamos a Thaís pela defesa de doutorado e por sua valiosa contribuição ao PPGSN e à ciência do país. Desejamos muito sucesso!"
    url: "https://www.instagram.com/p/C_1eARqOY-p/"
    imagem: "img/instagram-acervo/C_1eARqOY-p.webp"
