  - data: "2022-04-05"
    categoria: "Ensino"
    titulo: "Equipe do GPENSC: pós-doutoranda Anabele Pires Santos"
    resumo: "Hoje, é dia de apresentar para vocês mais uma de nossas pesquisadoras, a pós-doutoranda Anabele Pires Santos (@piresanabele)"
    conteudo: "Hoje, é dia de apresentar para vocês mais uma de nossas pesquisadoras, a pós-doutoranda Anabele Pires Santos (@piresanabele).\n.\n👩🏻‍🎓 A Anabele é nutricionista graduada pela Universidade Federal de Ouro Preto (UFOP), possui especialização em Saúde Indígena e é doutora em Ciências da Saúde pelo Programa de Pós-Graduação em Medicina Translacional, ambos pela Escola Paulista de Medicina, da Universidade Federal de São Paulo (UNIFESP).\n.\n📝 Trabalha com saúde indígena há 15 anos. Foi professora do curso de Nutrição da UFOP entre 2019 e 2021. Membro do Núcleo Executivo do Grupo de Trabalho Promoção da Saúde e Desenvolvimento Sustentável da Associação Brasileira de Saúde Coletiva (ABRASCO). Tem experiência na área de Saúde Coletiva, com ênfase em Saúde de Populações Indígenas, Políticas Públicas Saúde e Nutrição, Educação em Saúde, Agricultura Familiar e Segurança Alimentar e Nutrição. \n.\n👩🏻‍💻 Atualmente, é pós-doutoranda pelo Programa de Pós-Graduação em Saúde e Nutrição (PPGSN), da UFOP, e pesquisadora do projeto \"Efetividade de intervenção nutricional para controle da Hipertensão Arterial Sistêmica na Atenção Primária à Saúde\" (Projeto HipertenSUS), sob supervisão da professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut).\n.\n🗣️ Quer saber mais sobre o trabalho da Anabele e de outros trabalhos desenvolvidos pelo nosso grupo? Então, continue nos acompanhando!"
