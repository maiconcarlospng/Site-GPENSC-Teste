    conteudo: "Nosso #tbt é bem recente, para lembrar de uma qualificação que aconteceu semana passada.\n.\nNo dia 05 de março, ocorreu a qualificação da aluna de mestrado Ana Flávia Martins Silva (@ananutrifuncional), via Google Meet.\n.\n🔎 O projeto de mestrado da Ana Flávia, intitulado \"Interação do aleitamento materno exclusivo com polimorfismo associado à hipertensão arterial\", é orientado pela professora Dra. Júlia Cristina Carraro (UFOP) e coorientado pela professora Dra. Karina Barbosa de Queiroz (@prof.karina_queiroz - UFOP). O trabalho contou com as contribuições da professora Dra. Adriana Lúcia Meireles (@dri_meireles - UFOP) e do professor Dr. José Luiz Marques Rocha (@zeluiz.rocha - UFES). \n.\nParabenizamos a Ana Flávia pela aprovação na sua qualificação e pela contribuição na ciência do país. Sucesso nas próximas etapas! 👏🎉✨"
