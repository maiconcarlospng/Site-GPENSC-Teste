  - data: "2020-12-02"
    categoria: "Pesquisa"
    titulo: "Há alguns dias, apresentamos para vocês a pesquisa da Joice"
    resumo: "Há alguns dias, apresentamos para vocês a pesquisa da Joice (@joicesvleal)"
    conteudo: "Há alguns dias, apresentamos para vocês a pesquisa da Joice (@joicesvleal). Mas qual a importância de estudar a carga de doenças crônicas não transmissíveis atribuível ao consumo de bebidas açucaradas (SSBs)?\n.\n📌 As SSBs são consideradas de baixo valor nutricional. Existem evidências científicas que relacionam a ingestão de SSBs ao ganho de peso, diabetes mellitus tipo 2 (DM2) doenças cardiovasculares e alguns tipos de câncer.\n.\n📝 Esse artigo de revisão fornece uma atualização sobre as evidências que ligam as SSBs e desfechos cardiometabólicos, incluindo a síndrome metabólica. \n.\n📚 Evidências conclusivas de estudos de coorte e ensaios clínicos sobre fatores de risco apóiam um papel etiológico das SSBs em relação ao ganho de peso e risco de DM2 e doença cardíaca coronária. \n.\n💡 Esforços contínuos para reduzir a ingestão de SSBs devem ser encorajados para melhorar a saúde cardiometabólica de indivíduos e populações. Nesse sentido, a pesquisa da Joice trará uma contribuição importante para ciência e sociedade brasileira."
    url: "https://www.instagram.com/p/CIT4f3_A7f8/"
    imagem: "img/instagram-acervo/CIT4f3_A7f8.webp"
  - data: "2020-11-30"
