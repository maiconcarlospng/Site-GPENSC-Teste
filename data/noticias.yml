  - data: "2022-06-23"
    categoria: "Pesquisa"
    titulo: "Artigo: Effects and implications of the covid-19 pandemic on medicine use by employees of a Brazilian public university: a cross-sectional study"
    resumo: "O GPENSC apresenta o artigo intitulado \"Effects and implications of the covid-19 pandemic on medicine use by employees of a Brazilian public university: a cross-sectional study\" de autoria da doutoranda Waléria de Paula (@waleria_dp), juntamente com outras integrantes do GPENSC e pesquisadores da UFOP"
    conteudo: "O GPENSC apresenta o artigo intitulado \"Effects and implications of the covid-19 pandemic on medicine use by employees of a Brazilian public university: a cross-sectional study\" de autoria da doutoranda Waléria de Paula (@waleria_dp), juntamente com outras integrantes do GPENSC e pesquisadores da UFOP.\n.\n🎯 O objetivo do estudo, que é um dos produtos da tese de doutorado da Waléria, é avaliar o perfil de uso de medicamentos pelos servidores da UFOP durante a pandemia da covid-19. \n.\n📝 Os servidores foram convidados a responder um questionário on-line, com questões sociodemográficas, hábitos de vida e condições de saúde.\n.\n📊 Participaram do estudo 372 servidores, sendo o uso de medicamentos relatado por 53,2%. Entre os professores, tentativas de suicídio (RP 1,81; IC95% 1,20-2,74), atividade física (RP 1,53; IC95% 1,11-2,11) e autoavaliação de saúde negativa (RP 1,29; IC95% 1,01-1,66) permaneceram positivamente associadas ao uso de medicamentos. Entre os técnicos, diminuição da carga de trabalho durante a pandemia da covid-19 (RP 1,41; IC95% 1,00-1,99), excesso de peso corporal (RP 1,39; IC95% 1,02-1,88) e autoavaliação de saúde negativa (RP 1,48; IC95% 1,14-1,92) estiveram associados ao uso de medicamentos.\n.\n💡 Esses achados indicam que fatores associados podem ter sido influenciados pela pandemia da covid-19, destacando a necessidade de examinar este tema em um estudo longitudinal.\n.\n🔗 Acesse na íntegra: https://doi.org/10.1590/1516-3180.2021.0367.R1.23072021"
    url: "https://www.instagram.com/p/CfKavHsuZ1c/"
    imagem: "img/instagram-acervo/CfKavHsuZ1c.webp"
