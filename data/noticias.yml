    titulo: "Há alguns dias apresentamos para vocês a pesquisa da Larissa.Mas, por que estimar a carga de doenças crônicas não transmissíveis relacionada à dieta com elevado teor de sódio e…"
    resumo: "Há alguns dias apresentamos para vocês a pesquisa da Larissa (@lalaguedes_ ).Mas, por que estimar a carga de doenças crônicas não transmissíveis relacionada à dieta com elevado teor de sódio e seu custo financeiro para o Sistema Único de Saúde (SUS)?"
    conteudo: "Há alguns dias apresentamos para vocês a pesquisa da Larissa (@lalaguedes_ ).Mas, por que estimar a carga de doenças crônicas não transmissíveis relacionada à dieta com elevado teor de sódio e seu custo financeiro para o Sistema Único de Saúde (SUS)? \n.\n📍 Esse artigo propõe uma ferramenta de custeio para hipertensão e doenças cardiovasculares (DCV), adaptando as metodologias de custo da doença para estimar a carga atribuível à  ingestão excessiva de sal nas DCV.\n.\n📚 A metodologia estima as mudanças na pressão arterial que resultam de cada grama alterado na ingestão de sal, relacionando a dieta aos custos diretos e indiretos de DCV.\n.\n💸A ferramenta de custeio propôs em seus achados que, em 2013, US $102,0 milhões em hospitalizações públicas poderiam ser economizados se a ingestão média de sal dos brasileiros fosse reduzida para 5 g/dia.\n.\n💡 O conhecimento sobre o custo das doenças é imprescindível para medir e comparar os encargos econômicos que elas acarretam para o SUS e para a sociedade, além de auxiliar os gestores a estabelecer e priorizar políticas e intervenções em saúde, face ao cenário de escassez de recursos. Dessa forma, a pesquisa da Larissa trará uma contribuição importante para a ciência e sociedade brasileira.\n\nDOI: 10.1111 / jch.13836"
