    categoria: "Pesquisa"
    titulo: "Hoje, no #compartilhaGPENSC vamos falar sobre fichamento de materiais acadêmicos, apresentado pela professora Dra"
    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre fichamento de materiais acadêmicos, apresentado pela professora Dra"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre fichamento de materiais acadêmicos, apresentado pela professora Dra. Raquel Mendonça (@raquelmendonca_enut). O resumo foi elaborado pelo mestrando Felipe (@felipebaudson).\n.\n🗃️ O fichamento de materiais científicos é uma técnica que consiste em resumir as principais ideias contidas em materiais acadêmicos, como livros e artigos científicos, visando melhorar a organização das informações.\n.\n🗂️ O objetivo dessa técnica é realizar a síntese e resumo das principais referências, facilitando a pesquisa científica e a construção do conhecimento. Além disso, essa técnica consiste em criterioso processo de leitura e registro de materiais sobre um tema, que pode ser realizado, por exemplo, no formato físico (papéis e fichas) ou eletrônico. Logo, quem decide sobre o melhor formato de fichamento é o responsável por confeccionar o material. \n.\n👉🏻 Arraste para o lado e confira mais sobre o tema.\n.\n🗣️ Gostou das nossas postagens? Não deixe de conferir essa e as outras postagens e compartilhar com os amigos!"
