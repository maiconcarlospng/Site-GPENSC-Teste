  - data: "2023-10-26"
    categoria: "Pesquisa"
    titulo: "Artigo: Poor sleep quality and working from home influence the prevalence of leisure time physical inactivity during the COVID-19 pandemic: COVID-Inconfidentes study"
    resumo: "O GPENSC apresenta o artigo intitulado “Poor sleep quality and working from home influence the prevalence of leisure time physical inactivity during the COVID-19 pandemic: COVID-Inconfidentes study”, de autoria da doutoranda Samara Moura (@mourasamara) em parceria com outros pesquisadores do GPENSC e da UFOP"
    conteudo: "O GPENSC apresenta o artigo intitulado “Poor sleep quality and working from home influence the prevalence of leisure time physical inactivity during the COVID-19 pandemic: COVID-Inconfidentes study”, de autoria da doutoranda Samara Moura (@mourasamara) em parceria com outros pesquisadores do GPENSC e da UFOP.\n.\n🎯 O artigo, um dos produtos da tese de doutorado da Samara, teve como objetivo explorar possíveis associações entre a qualidade do sono, home office e inatividade física durante a pandemia da covid-19.\n.\n📈 Dos 1.750 adultos avaliados, 69,1% eram fisicamente inativos, 51,9% apresentavam má qualidade de sono e 79,8% não estavam em home office. A inatividade física foi associada à má qualidade do sono e não esteve associada ao trabalho em home office. Na análise combinada entre esses dois fatores, observou-se que indivíduos que relataram não estar em home office e má qualidade de sono tiveram 4 vezes mais a prevalência de inatividade física quando comparados com aqueles que relataram estar em home office e ter boa qualidade de sono.\n.\n💡Os achados do estudo da Samara indicam que a má qualidade do sono e não estar trabalhando em home office estão associados à inatividade física durante a restrição social devido a pandemia da covid-19. Uma maior compreensão das relações diárias entre esta modalidade de trabalho e a atividade física no lazer pode melhorar a eficácia para futuras intervenções comportamentais.\n.\n🔗 Acesse o artigo: https://journals.lww.com/joem/fulltext/2023/10000/poor_sleep_quality_and_working_from_home_influence.17.aspx"
    url: "https://www.instagram.com/p/Cy4K1WsupZ5/"
    imagem: "img/instagram-acervo/Cy4K1WsupZ5.webp"
