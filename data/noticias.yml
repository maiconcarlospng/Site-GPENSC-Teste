    conteudo: "O GPENSC recomenda o episódio “Vitamina D - efeitos fisiológicos e desafios atuais”, do podcast Alimente: Nutrição e Ciência (@alimente.nutricaociencia), iniciativa dos professores e nutricionistas Aline Silva de Aguiar (@aline.saguiar) e Renato Moreira Nunes, com apoio da Pró-Reitorias de Extensão da Universidade Federal de Juiz de Fora (UFJF) e Universidade Federal Fluminense (UFF). \n.\n📝 O episódio faz parte de uma série que aborda informações sobre vitamina D, incluindo suas funções no organismo, deficiência como problema de saúde pública, as recomendações para ingestão e fatores que podem influenciar no metabolismo e absorção. Você sabia que a vitamina D pode afetar a qualidade do sono e a saúde mental? \n.\n📚 Na indicação de hoje, você terá a oportunidade de aprender mais informações sobre a importância da vitamina D para o organismo humano. \n.\n👥 O episódio conta com a participação do professor Luiz Antônio Alves de Menezes Júnior (luizmenezes__), que é doutor em Saúde e Nutrição, e da pesquisadora Thaís Sabião (@thasabiao), nutricionista e doutoranda em Saúde e Nutrição pelo Programa de Pós Graduação em Saúde e Nutrição (@ppgsn.ufop).\n.\n🔎 Esse e outros episódios do podcast “Alimente: Nutrição e Ciência” estão disponíveis no Spotify.\n.\n🗣️ Gostou da dica? Compartilha com os amigos e aproveitar para salvar essa recomendação."
