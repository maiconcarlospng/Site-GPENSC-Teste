  - data: "2024-07-18"
    categoria: "Institucional"
    titulo: "Polimorfismos genéticos, escolhas e preferências alimentares associados à mudança de peso em graduados brasileiros (Estudo CUME)"
    resumo: "O GPENSC relembra qualificação de doutorado da aluna Ana Cláudia Morito Neves (@anaclaudiamorito ), que ocorreu no dia 13 de maio de 2024, no formato online"
    conteudo: "O GPENSC relembra qualificação de doutorado da aluna Ana Cláudia Morito Neves (@anaclaudiamorito ), que ocorreu no dia 13 de maio de 2024, no formato online.\n.\n🔎 O projeto de doutorado da Ana Cláudia, intitulado “Polimorfismos genéticos, escolhas e preferências alimentares associados à mudança de peso em graduados brasileiros (Estudo CUME)”, tem como objetivo avaliar a associação entre fatores genéticos e comportamentais relacionados à mudança de peso em egressos de universidades mineiras.\n.\n👥 Seu estudo é orientado pela professora Dra. Júlia Carraro - @julia_carraro (UFOP). O trabalho contou com as contribuições da banca formada pelas professoras Dra. Helen Hermana Miranda Hermsdorff - @helenhermana (UFV), Dra. Renata Adrielle Lima Vieira - @renataadriellenutri (UFPB) e Dra. Erika Cardoso dos Reis - @erikacareis (UFOP).\n.\n📊 Os resultados preliminares indicam um efeito significativamente menor sobre a média de peso dos indivíduos no quintil mais alto de IQC (maior qualidade de consumo de carboidratos). \n.\n💡Espera-se com os achados do estudo uma melhor compreensão dessas associações, objetivando subsidiar estratégias para aconselhamento nutricional adaptado ao genótipo do indivíduo no manejo da obesidade, escolhas e preferências alimentares, ampliando o entendimento sobre os fatores individuais.\n.\n🎆 Parabenizamos a Ana Cláudia pela defesa da qualificação de doutorado e pela contribuição na ciência do país. Sucesso sempre!"
