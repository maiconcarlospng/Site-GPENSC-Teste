    conteudo: "✨ Conheça mais um integrante do GPENSC!\n\nApresentamos Nayara Resende Gomes (@nayararesendeg), nutricionista e mestre pela Universidade Federal de Ouro Preto (UFOP).\n\nAtualmente, é doutoranda vinculada ao GPENSC, na linha de Saúde e Nutrição em indivíduos e coletividades do Programa de Pós-Graduação em Saúde e Nutrição (PPGSN – @ppgsn.ufop) da UFOP, sob orientação das Prof.ª Dra. Camila Carvalho Menezes (@menezescamilacarvalho)\n\n📚 Linha/Projeto de pesquisa:\nNayara atua na área de pesquisa em comportamento alimentar, com foco em entender como os rótulos dos alimentos, especialmente termos como ‘fit’ e alegações de proteína, influenciam a percepção e as escolhas dos consumidores.\n\n👉 Continue nos acompanhando para conhecer mais membros do GPENSC e as pesquisas que desenvolvemos!\n\n#GPENSC #ciencia #nutricao #saudecoletiva #pesquisa"
