  - data: "2023-10-05"
    categoria: "Institucional"
    titulo: "O GPENSC relembra a defesa de mestrado da Sarah Beatriz Resende Tinoco, que ocorreu no dia 08 de agosto de 2023, via Google Meet"
    resumo: "O GPENSC relembra defesa de mestrado da Sarah Beatriz Resende Tinoco (@sarahbeatriz_rt), que ocorreu no dia 08 de agosto de 2023, via Google Meet"
    conteudo: "O GPENSC relembra defesa de mestrado da Sarah Beatriz Resende Tinoco (@sarahbeatriz_rt), que ocorreu no dia 08 de agosto de 2023, via Google Meet.\n.\n🔎 A dissertação da Sarah, intitulada: “Associação da inatividade física e do comportamento sedentário com a hipertensão em egressos de universidades mineiras após seis anos de seguimento (Estudo CUME)”, teve como objetivo analisar a prevalência de inatividade física e comportamento sedentário e sua associação com a incidência de hipertensão arterial (HA) em egressos de universidades mineiras.\n.\n👥 Seu estudo foi orientado pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientado pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut). O trabalho contou com as contribuições da banca formada pelos professores Dr. Adriano Marçal Pimenta - @adrianompimenta (UFPR) e Dra. Lenice Kappes Becker Oliveira - @lenice_becker (UFOP).\n.\n📊 Os resultados da dissertação da Sarah demonstraram que a inatividade física não se mostrou associada à HA. Além disso, observou-se que dentre os participantes com 45 anos ou mais, os que apresentavam comportamento sedentário maior ou igual a 6h/dia tinham 41% mais chances de desenvolver HA.\n.\n🎆 Parabenizamos a Sarah pela defesa de mestrado e pela contribuição com o PPGSN e para a ciência do país!"
