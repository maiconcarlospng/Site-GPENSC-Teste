  - data: "2020-07-15"
    categoria: "Pesquisa"
    titulo: "Are neighborhood characteristics associated with sedentary behavior in adolescents? A systematic review"
    resumo: "Hoje, trazemos para vocês um estudo já publicado por pesquisadoras do GPENSC 📄"
    conteudo: "Hoje, trazemos para vocês um estudo já publicado por pesquisadoras do GPENSC 📄.\n.\nO artigo de revisão sistemática intulado “Are neighborhood characteristics associated with sedentary behavior in adolescents? A systematic review” é de autoria da integrante Magda do Carmo Parajára (@magdaparajara) e da professora Dra Adriana Lúcia Meireles (@dri_meireles). O estudo contou também com a participação dos coautores Bruno Magalhães de Castro (@brunodemagalhaes) (UFOP) e professor Dr. Daniel Barbosa Coelho (@danielcoelhoc) (UFOP).\n.\n🎯 O objetivo foi reunir evidências sobre a associação entre o comportamento sedentário (CS) em adolescentes (entre 10 e 19 anos) e características da vizinhança.\n.\n📊 Dezesseis artigos foram incluídos. As variáveis insegurança durante o dia, maior incidência de crimes, presença de desordens físicas e sociais, maior nível socioeconômico da vizinhança e tempo gasto com colegas foram associados a maiores níveis de CS. Por outro lado, tráfego, disponibilidade de um ambiente favorável à prática de atividade física e maior densidade residencial foram associados a menores níveis de CS.\n.\n📌 Apesar da grande variabilidade nos pontos de corte do CS e dos métodos utilizados para avaliar as características do CS e da vizinhança entre os estudos, as evidências mostraram que o CS entre adolescentes pode ser influenciado pelas características da vizinhança.\n \n👏👏👏\n \nO artigo na íntegra pode ser encontrado no nosso Drive ou acessado pelo link: https://www.tandfonline.com/eprint/PVICWS8CACDKYEPAXKXP/full?target=10.1080/09603123.2019.1597833"
    url: "https://www.instagram.com/p/CCrbL0rgP1Y/"
    imagem: "img/instagram-acervo/CCrbL0rgP1Y.webp"
  - data: "2020-07-08"
    categoria: "Pesquisa"
    titulo: "Lembram que na semana passada, apresentamos para vocês a pesquisa de mestrado da Irene, sobre o ambiente alimentar comunitário?"
    resumo: "Lembram que na semana passada, apresentamos para vocês a pesquisa de mestrado da Irene (@irenecsj_), sobre o ambiente alimentar comunitário?"
    conteudo: "Lembram que na semana passada, apresentamos para vocês a pesquisa de mestrado da Irene (@irenecsj_), sobre o ambiente alimentar comunitário? Mas por que investigar esse tema? 🤔\n.\nA crescente prevalência de obesidade está associada a maior oferta e consumo de alimentos com alta densidade calórica, pobres em nutrientes e altamente palatáveis 🍩🍔🍕🍫. Vários estudos já demonstraram associações entre o ambiente alimentar, dieta e obesidade entre adultos. Porém, pouco se sabe como as mudanças ocorridas no ambiente alimentar ao longo do tempo influenciam o consumo alimentar dos indivíduos e os desfechos em saúde.\n. \n🎯 No artigo apresentado, os autores buscaram avaliar a mudança do ambiente alimentar comunitário da cidade de Melbourne (Austrália) entre 2008 e 2016.\n.\nUtilizando dados secundários, os estabelecimentos que comercializavam alimentos na cidade foram classificados de acordo com a localização, tipo e qualidade dos alimentos ofertados. Foram avaliadas a densidade (número de pontos de venda por 10.000 habitantes) e a proporção entre estabelecimentos “não saudáveis”, “menos saudáveis” e “mais saudáveis” em áreas administrativas através de modelos ajustados. \n.\n📈 Os resultados indicam que no período avaliado houve um aumento de 35% no número total de pontos de venda de alimentos na cidade (10.777/2008 - 13.580/2016), e também um aumento na densidade (24,9 para 28,0). Um grande aumento foi observado para hipermercados (226%) e franquias de fast-food (59%). Quando analisado por área, a proporção de estabelecimentos saudáveis e não saudáveis foi maior em áreas localizadas próximo ao centro comercial da cidade. \n.\nDe forma geral, o estudo demonstra um aumento do número de estabelecimentos não saudáveis e um desequilíbrio entre a densidade de estabelecimentos saudáveis, podendo influenciar negativamente os comportamentos alimentares e, por sua vez, a prevalência de sobrepeso e obesidade."
    url: "https://www.instagram.com/p/CCZXQD7gDV1/"
    imagem: "img/instagram-acervo/CCZXQD7gDV1.webp"
