    titulo: "O GPENSC recomenda a plataforma de cursos da Universidade Aberta do Sistema Único de Saúde (UNA-SUS)"
    resumo: "O GPENSC recomenda a plataforma de cursos da Universidade Aberta do Sistema Único de Saúde (UNA-SUS)"
    conteudo: "O GPENSC recomenda a plataforma de cursos da Universidade Aberta do Sistema Único de Saúde (UNA-SUS). Criado em 2010, o sistema UMA-SUS é uma iniciativa do Ministério da Saúde que oferece diversos cursos de qualificação para profissionais de saúde de forma, de forma totalmente gratuita, on-line e com certificado.\n.\n💻 Na plataforma, vocês encontram cursos sobre abordagem profissional em diferentes contextos de saúde, atualizações sobre manejo de saúde, entre outros temas.\n.\n📚 Na indicação de hoje, selecionamos 10 cursos disponíveis que abrangem as áreas de Saúde, Nutrição e Pesquisa. São eles:\n\n1º) Abordagem do sobrepeso e obesidade na atenção primária à saúde. Inscrições até o dia 20/05/2025;\n\n2º) Amamenta e alimenta Brasil: recomendações baseadas no Guia Alimentar para crianças brasileiras menores de 2 anos. Inscrições até o dia 30/08/2024;\n\n3º) Aspectos operacionais I: organização de documentos e dados de pesquisa. Inscrições até o dia 23/08/2024;\n\n4º) Aspectos operacionais II: estruturação da equipe e tópicos regulatórios em pesquisa. Inscrições até o dia 23/08/2024;\n\n5º) Aspectos operacionais III: implementação e acompanhamento do estudo. Inscrições até o dia 23/08/2024;\n\n6º) Aspectos operacionais IV: gerenciamento e conclusão do estudo. Inscrições até o dia 23/08/2024;\n\n7º) Cuidado da criança e adolescente com sobrepeso e obesidade na Atenção Primária à Saúde. Inscrições até o dia 30/08/2024;\n\n8º) Estratégia de prevenção e controle da obesidade infantil (PROTEJA). Inscrições até o dia 05/07/2025;\n\n9º) População em situação de rua. Inscrições até o dia 23/08/2024;\n\n10º) Reconhecendo o sobrepeso e a obesidade no contexto da Atenção Primária à Saúde. Inscrições até o dia 20/05/2025.\n.\n🔗 Esse e outros cursos da UNA-SUS estão disponíveis no site https://www.unasus.gov.br. \n.\n🗣️ Gostou da dica? Compartilha com os amigos e aproveita para salvar essa recomendação."
