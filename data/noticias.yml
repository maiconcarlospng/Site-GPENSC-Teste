  - data: "2021-02-09"
    categoria: "Pesquisa"
    titulo: "Há alguns dias, apresentamos para vocês a pesquisa da Ana Flávia"
    resumo: "Há alguns dias, apresentamos para vocês a pesquisa da Ana Flávia (@ananutrifuncional )"
    conteudo: "Há alguns dias, apresentamos para vocês a pesquisa da Ana Flávia (@ananutrifuncional ). Mas qual a importância de se estudar o efeito da interação do aleitamento materno exclusivo com polimorfismos genéticos da hipertensão arterial? \n.\n📚 A hipertensão arterial sistêmica (HAS) é uma condição clínica multifatorial, tendo o componente genético como um importante fator. A interação da genética com o meio ambiente e os hábitos de vida é responsável pela causa de um grande número de doenças, como a HAS. \n.\n📝O aleitamento materno está associado com a programação metabólica, podendo influenciar positivamente na genética da HAS. \n.\n📍O primeiro artigo, de revisão, aborda sobre as características ômicas (genômica, transcriptômica epigenômica, proteômica e metabolômica) da hipertensão. A epigenômica diz respeito a mecanismos que influenciam a expressão de genes que são hereditários, modificações epigenéticas importantes ocorrem durante o desenvolvimento embrionário fetal e nos estágios iniciais do desenvolvimento. \n.\n📍O segundo artigo, também de revisão, aborda sobre os benefícios claros da amamentação, tanto em curto quanto em longo prazo. Os autores apontam que a alimentação infantil pode influenciar o desenvolvimento de doenças crônicas não transmissíveis na idade adulta, e que a amamentação reduziria a pressão arterial. O estudo também discute sobre os possíveis mecanismos propostos para a amamentação, e sobre um possível efeito de confusão causado pelo status socioeconômico. \n.\n💡A pesquisa da Ana Flávia terá uma contribuição importante para a ciência e também para a saúde pública, garantindo conhecimento para estimular ainda mais o aleitamento materno exclusivo.\n.\n🗣️ Arrasta para o lado e confira os resumos desses artigos."
    url: "https://www.instagram.com/p/CLFaOm1g6mT/"
    imagem: "img/instagram-acervo/CLFaOm1g6mT.webp"
  - data: "2021-02-05"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: mestranda Ana Flávia"
    resumo: "Hoje é dia de apresentar para vocês outra pesquisadora do nosso grupo, a mestranda Ana Flávia (@ananutrifuncional )"
    conteudo: "Hoje é dia de apresentar para vocês outra pesquisadora do nosso grupo, a mestranda Ana Flávia (@ananutrifuncional ).\n.\n👩🏻‍🎓 Ana Flávia é graduada em Nutrição pela Universidade Federal de Ouro Preto (UFOP), pós-graduada em Nutrição Clínica Funcional (2014) e Fitoterapia Funcional (2015), pela VP Centro de Nutrição Funcional. Tem experiência na área clínica hospitalar e consultório. Atualmente, é mestranda do Programa de Pós-Graduação em Saúde e Nutrição, da UFOP, na linha de pesquisa Bases experimentais em Saúde, Alimentos e Nutrição. \n.\n📌 Sua pesquisa de mestrado é intitulada “Interação do aleitamento materno exclusivo com polimorfismos dos genes relacionados à hipertensão arterial”, sob orientação da professora Dra. Júlia Cristina Cardoso Carraro e coorientação da professora Dra. Karina Barbosa de Queiroz.\n.\n🔍 Quer saber mais sobre o tema de pesquisa da Ana Flávia? Continue nos acompanhando e fique por dentro deste e de outros trabalhos desenvolvidos pelo nosso grupo!"
