  - data: "2022-02-24"
    categoria: "Institucional"
    titulo: "Equipe do GPENSC: pós-doutorando Frederico Machado Almeida"
    resumo: "O GPENSC apresenta mais um de nossos pesquisadores, o pós-doutorando Frederico Machado Almeida (@falmeida856)"
    conteudo: "O GPENSC apresenta mais um de nossos pesquisadores, o pós-doutorando Frederico Machado Almeida (@falmeida856).\n.\n👨🏾‍🎓 Frederico é licenciado em estatística pela Universidade Eduardo Mondlane (UEM), formado em ensino de Matemática pela Universidade Pedagógica (UP), mestre e doutor em Estatística pelo Programa de Pós-Graduação em Estatística da Universidade Federal de Minas Gerais (DEST-UFMG). Tem experiência nas linhas de pesquisa: análise de sobrevivência e confiabilidade; inferência Bayesiana; estatística não-paramétrica; e modelo de regressão para respostas binárias e de contagem.\n.\n🗂️ Atualmente, é pós-doutorando no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN) da Universidade Federal de Ouro Preto (UFOP), sob a orientação da professora Dra. Adriana Lúcia Meireles (@dri_meireles). De modo geral, no pós-doutorado, Frederico tem como objetivo dar suporte na parte de análise estatística para os alunos do programa que estão vinculados em diferentes projetos de pesquisa.\n.\n🔎 Quer saber mais sobre os trabalhos desenvolvidos pelo nosso grupo? Continue nos acompanhando."
    url: "https://www.instagram.com/p/CaYCehmOyz9/"
    imagem: "img/instagram-acervo/CaYCehmOyz9.webp"
