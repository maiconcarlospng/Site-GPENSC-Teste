  - data: "2022-08-02"
    categoria: "Pesquisa"
    titulo: "Projeto: Coorte de Universidades Mineiras – Projeto CUME"
    resumo: "O GPENSC apresenta o projeto “Coorte de Universidades Mineiras – Projeto CUME” (@projeto_cume), que é um estudo longitudinal que tem como objetivo analisar a influência da dieta mediterrânea em desfechos de saúde"
    conteudo: "O GPENSC apresenta o projeto “Coorte de Universidades Mineiras – Projeto CUME” (@projeto_cume), que é um estudo longitudinal que tem como objetivo analisar a influência da dieta mediterrânea em desfechos de saúde.\n.\n👥 Quem pode participar? \nOs participantes do Projeto CUME são ex-alunos da Universidade Federal de Viçosa (UFV), da Universidade Federal de Minas Gerais (UFMG), da Universidade Federal de Ouro Preto (UFOP), da Universidade Federal de Lavras (UFLA), da Universidade Federal de Juiz de Fora (UFJF), da Universidade Federal de Alfenas (UNIFAL) e da Universidade Federal dos Vales de Jequitinhanha e Mucuri (UFVJM). Por ser um estudo longitudinal, os participantes são acompanhados ao longo do tempo.\n.\n💡Qual a sua importância?\n Com a participação dos ex-alunos dessas universidades, a equipe do Projeto CUME poderá avaliar o impacto do padrão alimentar brasileiro, de grupos de alimentos e fatores dietéticos específicos no desenvolvimento de doenças crônicas não transmissíveis (DCNT), como diabetes, hipertensão e outras condições crônicas. Além disso, a participação ajudará na elaboração de futuras intervenções de promoção, prevenção, controle e tratamento dessas doenças na população brasileira.\n.\n🗣️ Para o sucesso do Projeto CUME, contamos com a participação ativa de todos os ex-alunos!"
    url: "https://www.instagram.com/p/CgxXxVkOq-N/"
    imagem: "img/instagram-acervo/CgxXxVkOq-N.webp"
  - data: "2022-07-19"
    categoria: "Pesquisa"
    titulo: "Artigo: Retail food environment in a Brazilian metropolis over the course of a decade: evidence of restricted availability of healthy foods"
    resumo: "O GPENSC apresenta o artigo intitulado “Retail food environment in a Brazilian metropolis over the course of a decade: evidence of restricted availability of healthy foods”, de autoria da doutoranda Irene Justiniano (@irenecsj_), juntamente com outras integrantes do GPENSC e do GEPPAAS (@geppaasufmg)"
    conteudo: "O GPENSC apresenta o artigo intitulado “Retail food environment in a Brazilian metropolis over the course of a decade: evidence of restricted availability of healthy foods”, de autoria da doutoranda Irene Justiniano (@irenecsj_), juntamente com outras integrantes do GPENSC e do GEPPAAS (@geppaasufmg).\n.\n🎯 O objetivo do estudo, que é um produto da dissertação de mestrado da Irene, foi avaliar as mudanças no perfil do ambiente alimentar comunitário de Belo Horizonte durante um período de 10 anos.\n.\n📝 Para isso, os estabelecimentos formais de alimentos da cidade de Belo Horizonte foram geocodificados e classificados como saudáveis, mistos ou não saudáveis. As alterações de perfil foram avaliadas de acordo com a vizinhança, dimensão da população, nível de renda e distribuição geoespacial pela cidade.\n.\n📈 Os principais resultados demonstram que no período avaliado, houve uma maior proporção de estabelecimentos não saudáveis em relação aos saudáveis, principalmente em áreas de menor renda, indicando uma piora do ambiente alimentar ao longo do tempo.\n.\n💡 O estudo evidenciou que as mudanças ocorridas foram desfavoráveis ao acesso adequado a alimentos saudáveis nos bairros mais vulneráveis, reforçando a necessidade de intervenções que ampliem a oferta de alimentos saudáveis na cidade. \n.\n🔗 Acesse o artigo: https://doi.org/10.1017/S1368980022000787"
    url: "https://www.instagram.com/p/CgNUt2puwn9/"
    imagem: "img/instagram-acervo/CgNUt2puwn9.webp"
  - data: "2022-07-06"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: mestrando Felipe Reis Stavaux Baudson"
    resumo: "O GPENSC apresenta mais um de nossos pesquisadores, o mestrando Felipe Reis Stavaux Baudson (@felipebaudson)"
    conteudo: "O GPENSC apresenta mais um de nossos pesquisadores, o mestrando Felipe Reis Stavaux Baudson (@felipebaudson).\n.\n🧑🏻‍🎓 O Felipe possui graduação em Nutrição pela Universidade Federal de Ouro Preto (UFOP). Atualmente, é mestrando do Programa de Pós-Graduação em Saúde e Nutrição (PPGSN/UFOP - @ppgsn.ufop), na linha de pesquisa Saúde e Nutrição em Indivíduos e Coletividades. É pesquisador do projeto \"Efetividade de intervenção nutricional para controle da Hipertensão Arterial Sistêmica na Atenção Primária à Saúde\" (Projeto HipertenSUS) e da Coorte de Universidades Mineiras (CUME - @projeto_cume).\n.\n📚 Sua pesquisa de mestrado é intitulada “Consumo de alimentos segundo a classificação NOVA e a prevalência de insônia entre os participantes do projeto Coorte de Universidades Mineiras (CUME)”, sob orientação da professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut) e coorientação da professora Dra. Renata Adrielle Lima Vieira (@renataadriellenutri).\n.\n🔎 Quer saber mais sobre o tema do Felipe? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo!"
