  - data: "2022-02-01"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: doutoranda Raíssa de Melo Matos Ferreira"
    resumo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a doutoranda Raíssa de Melo Matos Ferreira (@raissa.mmatos)"
    conteudo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a doutoranda Raíssa de Melo Matos Ferreira (@raissa.mmatos).\n.\n👩🏻‍🎓 Raíssa é nutricionista, graduada (2014) pela Universidade de Rio Verde (UniRV), com especialização (2017) em Nutrição Esportiva e Fisiologia do Exercício pela Universidade Federal de Goiás (UFG). Mestre (2021) em Tecnologia de Alimentos pelo Instituto Federal Goiano (IFGOIANO). \n.\n👩🏻‍💻 Atualmente, é pós-graduanda em Nutrição Funcional aplicada à Clínica, pela Universidade Federal do Rio de Janeiro (UFRJ), e doutoranda na Universidade Federal de Ouro Preto (UFOP), na linha de pesquisa Saúde e Nutrição em Indivíduos e Coletividades. \n.\n🔎 É pesquisadora do projeto “HipertenSUS” e seu trabalho de doutorado é intitulado “Efetividade de intervenção nutricional para controle da hipertensão arterial sistêmica na Atenção Primária à Saúde: metodologia inovadora pautada na entrevista motivacional e no guia alimentar vs. convencional dietoterápica”, sob a orientação da professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro).\n.\n🗣️ Quer saber mais sobre o trabalho da Raíssa e de outros trabalhos que estão sendo desenvolvidos pelo nosso grupo? Então, continue nos acompanhando!"
