  - data: "2023-06-20"
    categoria: "Divulgação científica"
    titulo: "Livro: Alimentos com propriedades funcionais e de saúde: evidências e pretensos efeitos"
    resumo: "O GPENSC recomenda o livro “Alimentos com propriedades funcionais e de saúde: evidências e pretensos efeitos”, lançado em 2023"
    conteudo: "O GPENSC recomenda o livro “Alimentos com propriedades funcionais e de saúde: evidências e pretensos efeitos”, lançado em 2023.\n.\n🍽️ A alimentação saudável, equilibrada e variada é importante na promoção da saúde e bem-estar de indivíduos e coletividades. Além disso, considerando o contexto da pandemia da covid-19, é imprescindível promover educação em saúde a partir de informações científicas, incentivar hábitos alimentares saudáveis e a inclusão de alimentos que reforçam e potencializam a ação do nosso sistema imunológico frente a diversas patologias e doenças oportunistas.\n.\n📢 O intuito do livro é divulgar informações sobre as propriedades funcionais dos alimentos, considerando uma dieta à base de alimentos mais naturais e minimamente processados. O conteúdo do livro é abrangente e atualizado, incluindo temas como: legislação brasileira, guia alimentar para a população brasileira e biodisponibilidade e bioacessibilidade de compostos bioativos, além de alimentos típicos da cultura brasileira, como açaí e feijão. Também foram incluídos alimentos que ganharam destaque recentemente: o kefir e os alimentos probióticos. \n.\n🔎 Para conferir mais sobre o livro acesse o link: https://repositorio.ifes.edu.br/handle/123456789/3239\n.\n🗣️ Gostou da dica? Compartilha com os amigos e aproveitar para salvar essa recomendação."
