  - data: "2023-05-09"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: doutorando Anilson Júnior da Silva de Campos"
    resumo: "O GPENSC apresenta mais um de nossos pesquisadores, o doutorando Anilson Júnior da Silva de Campos (@anilsonjrc)"
    conteudo: "O GPENSC apresenta mais um de nossos pesquisadores, o doutorando Anilson Júnior da Silva de Campos (@anilsonjrc).\n.\n👨‍🎓 Anilson é nutricionista graduado pela Universidade Federal de Ouro Preto (UFOP) e mestre em Ciências da Saúde pela Universidade Federal de Minas Gerais (UFMG). Atualmente, é doutorando no Programa de Pós-Graduação em Saúde e Nutrição - PPGSN/UFOP (@ppgsn.ufop), na linha Saúde e Nutrição em Indivíduos e Coletividades. Atuou como Nutricionista/Agente do PNAE no Centro Colaborador em Alimentação e Nutrição do Escolar (CECANE/UFOP), assessorando municípios de Minas Gerais e Espírito Santo por quatro anos. Hoje é servidor público da UFOP.\n.\n📚 É pesquisador do projeto HipertenSUS e sua pesquisa de doutorado é intitulado \"Efeito da intervenção nutricional nas práticas alimentares saudáveis e sua associação com o consumo de alimentos conforme o grau de processamento em usuários com hipertensão arterial sistêmica da atenção primária à saúde de Ouro Preto/MG\", sob orientação da professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro). \n.\n🔎 Quer saber mais sobre o tema do Anilson? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo."
