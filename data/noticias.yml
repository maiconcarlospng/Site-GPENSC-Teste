  - data: "2021-08-13"
    categoria: "Ensino"
    titulo: "Equipe do GPENSC: pós-doutoranda Bárbara Simões"
    resumo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a pós-doutoranda Bárbara Simões (@barbaradossantossimoes)"
    conteudo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a pós-doutoranda Bárbara Simões (@barbaradossantossimoes).\n.\n👩🏻‍🎓 A Bárbara é graduada em Nutrição pela Universidade Federal do Ouro Preto (UFOP), especialista em Gestão de Serviços de Saúde pela Universidade Federal de Juiz de Fora (UFJF), mestre em Ciências Biológicas pela UFOP e doutora em Saúde Pública pela Universidade Federal de Minas Gerais (UFMG), com realização de período sanduíche na Universidade de Nova Iorque (08/2017-12/2017). É professora do curso de Medicina, coordenadora do bloco Abdome Agudo, pesquisadora do Grupo de Pesquisa em Atenção Primária à Saúde e membro do Núcleo Docente Estruturante do curso de Medicina da Universidade José do Rosário Vellano (UNIFENAS_BH). Tem experiência nas áreas de: epidemiologia, saúde pública, metodologia científica, metodologias ativas de ensino, fisiologia humana, análise do consumo alimentar e estado nutricional de populações.\n.\n📚 Atualmente, é pós-doutoranda na linha de pesquisa Saúde e Nutrição em Indivíduos e Coletividades pelo Programa de Pós-Graduação em Saúde e Nutrição (PPGSN) e pesquisadora do projeto “Vigilância Epidemiológica da COVID-19 na região dos Inconfidentes, Minas Gerais (COVID-Inconfidentes)\". Sua pesquisa de pós-doutorado, intitulada \"Validação do questionário de frequência alimentar (QFA)”, tem orientação da professora Dra. Adriana Lúcia Meireles (@dri_meireles). A Bárbara é membro do GPENSC e da  Comissão de Acolhimento do PPGSN.\n.\n🔎 Quer saber mais sobre o projeto da Bárbara e de outros trabalhos desenvolvidos pelo nosso grupo? Continue nos acompanhando."
    url: "https://www.instagram.com/p/CShwCsoH3_S/"
    imagem: "img/instagram-acervo/CShwCsoH3_S.webp"
  - data: "2021-08-10"
    categoria: "Ensino"
    titulo: "Hoje, vamos divulgar o III Seminário Latino-Americano sobre Ambiente Alimentar e Saúde: Avanços em Pesquisas e Políticas e Novos Desafios\", que conta com a organização e…"
    resumo: "Hoje, vamos divulgar o III Seminário Latino-Americano sobre Ambiente Alimentar e Saúde: Avanços em Pesquisas e Políticas e Novos Desafios\", que conta com a organização e colaboração do GPENSC, GEPPAAS (@geppaasufmg) e PENSAP (@grupopensap)"
    conteudo: "Hoje, vamos divulgar o III Seminário Latino-Americano sobre Ambiente Alimentar e Saúde: Avanços em Pesquisas e Políticas e Novos Desafios\", que conta com a organização e colaboração do GPENSC, GEPPAAS (@geppaasufmg) e PENSAP (@grupopensap).\n.\n📚 Vocês já ouviram falar a respeito do Seminário Latino-Americano sobre Ambiente Alimentar e Saúde (SEMLAAAS)? O SEMLAAAS (@semlaaas) é um evento técnico-científico que tem como objetivo reunir estudantes, pesquisadores, profissionais, gestores e ativistas das áreas de Nutrição e Saúde Pública que estudam a relação entre ambiente alimentar e saúde, bem como abordar reflexões sobre os novos desafios inerentes ao tema. \n.\n🎯 Esse ano, em função da pandemia de COVID-19, a terceira edição do SEMLAAAS será realizada em formato virtual nos dias 28 e 29 de outubro de 2021.  O evento será gratuito e as mesas temáticas contarão com tradução simultânea para o idioma Inglês.\n.\n👥 Nesta edição, o Comitê Organizador é formado por representantes da Fundação Oswaldo Cruz (Fiocruz), Universidade do Estado do Rio de Janeiro (UERJ) e Universidades Federais do Rio de Janeiro (UFRJ), de Santa Catarina (UFSC), de Ouro Preto (UFOP) e de Minas Gerais (UFMG).\n.\n🗓️ As inscrições já estão abertas e a submissão de trabalhos vai até o dia 20 de agosto de 2021. \n.\n🗣️ Participe do III Seminário Latino-Americano sobre Ambiente Alimentar e Saúde! Inscreva-se gratuitamente acessando o link que está disponível na nossa bio."
    url: "https://www.instagram.com/p/CSaBLx2HkHB/"
    imagem: "img/instagram-acervo/CSaBLx2HkHB.webp"
