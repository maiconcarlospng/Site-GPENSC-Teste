    conteudo: "Conheça a Profa. Dra. Ariene Silva do Carmo (@ariene.carmo), uma das líderes do GPENSC!\n\nProfessora do Departamento de Nutrição Clínica e Social da Escola de Nutrição da Universidade Federal de Ouro Preto (DENCS/ENUT/UFOP). Nutricionista e Mestre em Saúde e Enfermagem (UFMG). Doutora em Ciências da Saúde na área de concentração Saúde da Criança e do Adolescente pela Universidade Federal de Minas Gerais (UFMG). Residência pós-doutoral em Saúde Pública (UFMG). Residência Pós-doutoral em andamento no Programa de Pós-Graduação em Alimentação, Nutrição e Saúde da Universidade do Estado do Rio de Janeiro (UERJ). \n\nAs pesquisas da Profa. Ariene têm como foco de investigação: políticas de alimentação e nutrição e de segurança alimentar e nutricional, os ambientes alimentares (especialmente os ambientes comunitários e ambientes escolares), saúde e nutrição de crianças e adolescentes, epidemiologia nutricional, obesidade e impacto dos eventos climáticos nos desfechos nutricionais.\n\nContinue acompanhando nosso perfil e fique por dentro dos projetos desenvolvidos pela Profa. Ariene."
