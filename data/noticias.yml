    categoria: "Institucional"
    titulo: "Associação do consumo alimentar segundo grau de processamento e prevalência dos sintomas de ansiedade e depressão entre estudantes universitários durante a pandemia da covid-19"
    resumo: "Nosso #tbt é bem recente, para lembrar das defesas de trabalhos de conclusão de curso (TCCs) de três alunas do GPENSC, que aconteceram em junho de 2022"
    conteudo: "Nosso #tbt é bem recente, para lembrar das defesas de trabalhos de conclusão de curso (TCCs) de três alunas do GPENSC, que aconteceram em junho de 2022.\n.\n👩🏻‍💻 No dia 22 de junho, ocorreu a defesa de TCC da aluna Milena Martins de Oliveira (@mi_martinns), via Google Meet.  O trabalho da Milena, intitulado “Associação do consumo alimentar segundo grau de processamento e prevalência dos sintomas de ansiedade e depressão entre estudantes universitários durante a pandemia da covid-19”, foi orientado pela professora Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes) e coorientado pela doutoranda Hillary Coletro Nascimento (@hillarycoletro). Sua banca contou com a colaboração da professoras Dras. Adriana Lúcia Meireles (@dri_meireles) e Renata Adrielle Lima Vieira (@renataadriellenutri).\n.\n👩🏻‍🏫 No dia 23 de junho, aconteceu a defesa da aluna Chrislaine Corraide Dias dos Santos (@chris.cordis), de modo presencial, na Escola de Nutrição da UFOP. O TCC da Chrislaine, intitulado “Disponibilidade de alimentos nos domicílios dos alunos atendidos pelas redes municipais de ensino de Mariana e Ouro Preto - Minas Gerais na pandemia de covid-19”, foi orientado pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut) e coorientado pela doutoranda Priscila Pena Camargo (@priscilapenacamargo). Sua banca contou as contribuições da pós-doutoranda Anabele Pires Santos (@piresanabele) e da doutoranda Bruna Carolina Rafael Barbosa (@brunabcrb). \n.\n👩🏻‍💻 No dia 23 de junho, também ocorreu a defesa de TCC da aluna Larissa Menezes Santos Carvalho (@lissamenezes), via Google Meet. O trabalho da Larissa, intitulado “Alterações do peso e do índice de massa corporal entre estudantes universitários: Projeto PADu-Covid”, foi orientado pela professora Dra. Raquel de Deus Mendonça e coorientado pela professora Dra. Adriana Lúcia Meireles. Sua banca contou com a colaboração da professora Dra. Anelise Andrade de Souza (@andradeanelise) e da pós-doutoranda Anabele Pires Santos. \n.\n🎇 Parabenizamos as alunas pelas defesas dos TCCs e desejamos sucesso nas próximas etapas!"
