    resumo: "Estamos com inscrições abertas para o preenchimento de vaga para bolsista DTI-CNPq (Desenvolvimento Tecnológico e Industrial-CNPq), no estudo intitulado “Impactos financeiros e à saúde devidos à alimentação inadequada e ao excesso de peso no Brasil e Unidades Federativas”, coordenado pela Profa"
    conteudo: "Estamos com inscrições abertas para o preenchimento de vaga para bolsista DTI-CNPq (Desenvolvimento Tecnológico e Industrial-CNPq), no estudo intitulado “Impactos financeiros e à saúde devidos à alimentação inadequada e ao excesso de peso no Brasil e Unidades Federativas”, coordenado pela Profa. Dra. Ísis Eloah Machado (@isiseloah).\n.\n🔸 Quem pode participar?\nAqueles que já tenham graduação concluída em cursos das áreas da Saúde ou Estatística.\n.\n🔸 Quais os documentos necessários?\nCurrículo Lattes e carta de interesse.\n.\n🔸 Como realizar a inscrição?\nPara realizar a inscrição, e para mais informações, entre em contato com a pesquisadora responsável, Profa. Dra. Ísis Eloah Machado, no seguinte endereço de e-mail: isis.machado@ufop.edu.br\n.\n🔸 Qual o prazo máximo das inscrições?\nAté dia 29/01/2021.\n. \n🗣️ Não perca essa chance, venha fazer pesquisa com a gente!"
