    conteudo: "Conheça a Dra. Sandhi Barreto!\nÉ com grande alegria que recebemos a Professora Visitante Sandhi Barreto no Programa de Pós-Graduação em Saúde e Nutrição da UFOP (@ppgsn.ufop).\n\nAlém de sua atuação no Programa, Sandhi também passa a integrar o GPENSC, contribuindo com sua ampla experiência para fortalecer nossas atividades de pesquisa e ensino.\n\nAcompanhe nosso perfil para conhecer os projetos desenvolvidos com a participação da professora Sandhi e ficar por dentro das novidades do nosso grupo de pesquisa!\n\n#SaúdeColetiva #Epidemiologia #UFOP #PósGraduação #DCNTs #PesquisaEmSaúde #GPENSC"
