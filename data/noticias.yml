    titulo: "Episódio: Como o Guia Alimentar mudou a saúde dos brasileiros?"
    resumo: "O GPENSC recomenda o episódio “Como o Guia Alimentar mudou a saúde dos brasileiros?” do podcast “A saúde é coletiva”, que é uma iniciativa da Associação Brasileira de Saúde Coletiva - Abrasco (@abrascooficial) com produção da rádio Tertúlia (@tertulia.radio)"
    conteudo: "O GPENSC recomenda o episódio “Como o Guia Alimentar mudou a saúde dos brasileiros?” do podcast “A saúde é coletiva”, que é uma iniciativa da Associação Brasileira de Saúde Coletiva - Abrasco (@abrascooficial) com produção da rádio Tertúlia (@tertulia.radio). A edição foi publicada em parceria com o Núcleo de Pesquisas Epidemiológicas em Nutrição e Saúde-Nupens/USP (@nupensusp) e apoio da Organização Pan- Americana de Saúde- OPAS/Brasil.\n.\n📝 O episódio da segunda temporada do podcast, que oferece entrevistas exclusivas sobre saúde coletiva e seus reflexos na saúde, economia, política, direito, cultura, entre outros.\n.\n📚 Na indicação de hoje, você terá a oportunidade de entender melhor a importância do Guia Alimentar para a População Brasileira e seu impacto na saúde após 10 anos de lançamento.\n.\n👥 O episódio conta com a participação da Patrícia Jaime, que é professora titular do Departamento de Nutrição e vice -diretora da Faculdade de Saúde Pública da USP. Além disso, Patrícia é membro do conselho deliberativo da Abrasco, coordenadora científica do Nupens e participou do processo de elaboração e implementação das diretrizes do Guia.\n.\n🔎 Esse e outros episódios do podcast “A saúde é coletiva” estão disponíveis no Spotify.\n.\n🗣️ Gostou da dica? Compartilha com os amigos e aproveita para salvar essa recomendação."
