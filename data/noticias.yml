  - data: "2021-08-31"
    categoria: "Ensino"
    titulo: "No dia 31 de agosto, comemoramos o dia do Nutricionista"
    resumo: "No dia 31 de agosto, comemoramos o dia do Nutricionista"
    conteudo: "No dia 31 de agosto, comemoramos o dia do Nutricionista. Você sabia que essa data foi escolhida devido à criação da Associação Brasileira de Nutrição (ABN), nesse mesmo dia, no ano de 1949? A ideia da criação dessa associação foi para fortalecer o campo de nutrição, assim como os estudos acerca da qualidade da alimentação. O curso de nutrição, no entanto, só foi regulamentado no país em 1967. Algum tempo depois, a ABN foi alterada para a Federação Brasileira de Nutricionistas, que nos dias de hoje é a Associação Brasileira de Nutrição - ASBRAN (@asbran.brasil). \n.\n📝 Muitas vezes, o profissional de nutrição é lembrado pela prescrição de dietas, não é mesmo? Porém, vale lembrar que o nutricionista tem o papel fundamental, por meio da alimentação adequada e saudável, de promover saúde, qualidade de vida e bem-estar, além de contribuir na prevenção e tratamento de doenças. Isso pode ser feito por meio da sua atuação nas áreas de nutrição em saúde coletiva, clínica, alimentação coletiva e em esportes e exercício físico. \n.\n❤️ Fica nossa homenagem para todos esses profissionais que se empenham para promover uma vida com mais saúde, sabor e amor. \n.\n🎇 Parabéns a todos os Nutricionistas! Com carinho, GPENSC."
    url: "https://www.instagram.com/p/CTQDdYPvyPT/"
    imagem: "img/instagram-acervo/CTQDdYPvyPT.webp"
