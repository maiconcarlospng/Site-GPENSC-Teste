  - data: "2022-12-24"
    categoria: "Institucional"
    titulo: "Hoje, no #compartilhaGPENSC vamos falar sobre um tema estudado por pesquisadores do grupo"
    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre um tema estudado por pesquisadores do grupo"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre um tema estudado por pesquisadores do grupo. Mas por que estudar sobre comer emocional?\n.\nA alimentação emocional é caracterizada pela tendência de comer demais em resposta a emoções negativas e tem sido frequentemente associada ao ganho de peso.\n.\n🎯 O objetivo do artigo foi avaliar a relação entre fatores individuais e socioeconômicos, comportamentos de saúde e autorregulação com padrões alimentares emocionais entre adultos americanos.\n.\n📈 Foi realizada um estudo transversal com 5.863 participantes da Pesquisa de Hábitos de Saúde da Família. A regressão logística multivariada e ordenada foram utilizadas para examinar a relação entre a frequência do desejo de comer quando emocionalmente perturbado (nunca, raramente, às vezes, frequentemente e muito frequentemente) e as variáveis independentes.\n.\n📊 Os achados do estudo indicam que 20,5% dos participantes tendiam a comer emocionalmente frequentemente ou muito frequentemente. Ser do sexo feminino, branco não hispânico e de idade mais jovem foram fatores relacionados a uma maior probabilidade de comer emocionalmente. Além disso, a incapacidade de adiar a gratificação (impaciência) foi relacionada a um aumento de 18,0% na probabilidade do comer emocional (IC95% 1,05-1,33). Além disso, a alimentação emocional foi significativamente relacionada ao consumo mais frequente de fast-food. \n.\n🔎 Em conclusão, foi observado que um quinto dos adultos americanos relataram comportamento alimentar emocional frequentemente ou muito frequentemente, sendo mais comum entre os mais jovens adultos, brancos não hispânicos, aqueles com diploma universitário e com dificuldade em atrasar gratificação imediata. \n. \n💡 Os resultados ressaltam a importância da elaboração e implementação de programas e intervenções direcionadas que melhorem as habilidades de regulação emocional, e que também sejam voltadas à abordagem de comportamentos não saudáveis, como o consumo de fast-food.\n.\n👉🏻 Arraste para o lado e confira o resumo do artigo."
