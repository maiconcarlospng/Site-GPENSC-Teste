    titulo: "Vamos falar sobre ciência?"
    resumo: "Vamos falar sobre ciência?"
    conteudo: "Vamos falar sobre ciência? \n.\n\n🗣 Resultados preliminares da pesquisa “Efeito da pandemia do COVID-19 na saúde mental e nutricional da comunidade acadêmica - PADuCOVID” mostram elevada prevalência de sintomas de ansiedade, depressão e estresse na comunidade acadêmica da UFOP. \n.\n\nArraste pro lado e confira os resultados!\n.\n\nO link do questionário está disponível na nossa bio (@gpensc).\n.\n\nNos ajude a entender e buscar melhorias para sua saúde mental!\n.\n\nPara maiores informações você pode enviar um e-mail para: paducovid.ppgsn@ufop.edu.br"
