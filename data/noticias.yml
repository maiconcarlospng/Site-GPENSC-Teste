    conteudo: "O GPENSC, em parceria com o PADu (@padufederais) e o PET Nutrição UFOP (@petnutricaoufop), convidam para o VI Webinar PADu, com o tema “A importância da alimentação para a saúde mental”.\n.\n🗓 Nosso encontro será no dia 29 de junho (terça-feira), às 18h00. Nesse webinar, contaremos com a participação da doutora (UFMG) e pesquisadora (Santa Casa/BH) Helem Sena Ribeiro (@helemsenaphd) e da mestranda (PPGSN/UFOP) e membro do PADu, Bruna Carolina Rafael Barbosa (@brunabcrb18).\n.\n🌐 Participe conosco! No dia do evento, basta acessar o link que estará disponível aqui na nossa bio ou na bio do @padufederais.\n.\n📲 Vocês também podem participar enviando perguntas para a nossa palestrante. O formulário está disponível aqui na nossa bio e na bio do @petnutricaoufop.\n.\n🗣 Aproveite e já marque aquele amigo(a) que não pode perder esse webinar! Esperamos vocês!"
