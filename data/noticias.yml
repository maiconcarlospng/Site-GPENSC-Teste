  - data: "2022-11-15"
    categoria: "Pesquisa"
    titulo: "Hoje, no #compartilhaGPENSC vamos falar sobre um estudo conduzido por pesquisadores brasileiros em parceria com pesquisadores de Santiago do Chile, que realizou, pela primeira…"
    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre um estudo conduzido por pesquisadores brasileiros em parceria com pesquisadores de Santiago do Chile, que realizou, pela primeira vez, uma estimativa do número de mortes prematuras entre pessoas de 30 a 69 anos atribuíveis ao consumo de alimentos ultrapassados (AUP)…"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre um estudo conduzido por pesquisadores brasileiros em parceria com pesquisadores de Santiago do Chile, que realizou, pela primeira vez, uma estimativa do número de mortes prematuras entre pessoas de 30 a 69 anos atribuíveis ao consumo de alimentos ultrapassados (AUP) no Brasil. \n.\n🍽️ OS AUP são formulações industriais de substâncias que contêm pouco ou nenhum alimento integral, com a adição de corantes, aromatizantes, emulsificantes e outros aditivos. São alimentos de baixo custo, extremamente palatáveis e convenientes. O consumo desses alimentos tem sido associado à desfechos negativos de saúde, como a ocorrência de doenças crônicas não transmissíveis.\n.\n📄 No geral, os estudos anteriores demonstram os impactos na saúde de alguns nutrientes específicos, como açúcar, sódio e gordura saturada. O ineditismo da recente publicação está em estimar o número de mortes associadas ao consumo de AUP em geral.\n.\n💡 Em 2019 houve 541,1 mil mortes prematuras na faixa de 30 a 69 anos no Brasil. Desse total, 57 mil, foram atribuídas ao consumo de AUP. A frequência das mortes foi maior entre os homens e entre pessoas mais velhas.\n.\n👉🏻 Arraste para o lado e confira mais sobre esse tema.\n.\n🔗 Acesse o artigo na íntegra: https://doi.org/10.1016/j.amepre.2022.08.013\t\n.\n🗣️ Gostou da postagem? Não deixe de conferir essa e as outras postagens e compartilhar com os amigos!"
