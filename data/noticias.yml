  - data: "2020-07-29"
    categoria: "Pesquisa"
    titulo: "Estão lembrados que na semana passada apresentamos a pesquisa de mestrado da Bianca, sobre abordagem nutricional coletiva na atenção básica?"
    resumo: "Estão lembrados que na semana passada apresentamos a pesquisa de mestrado da Bianca (@bia.nca.bl), sobre abordagem nutricional coletiva na atenção básica?"
    conteudo: "Estão lembrados que na semana passada apresentamos a pesquisa de mestrado da Bianca (@bia.nca.bl), sobre abordagem nutricional coletiva na atenção básica? Pois é, hoje vamos falar um pouco mais desse tema! \n.\n🎯 O artigo apresentado objetivou revisar de forma sistemática a produção científica sobre intervenções de educação alimentar e nutricional (EAN) com indivíduos adultos no campo da Atenção Primária à Saúde (APS) no Brasil, no período de 2006 a 2016. Foram selecionados 11 artigos que responderam aos critérios de elegibilidade. \n.\n🗣️ Este estudo demonstra a relevância da EAN para o fortalecimento das ações de nutrição, auxiliando no empoderamento dos indivíduos e no desenvolvimento da autonomia diante de suas escolhas alimentares. Entretanto, para que alcancem tais objetivos de forma efetiva, são necessários estudos que descrevam de forma detalhada as técnicas aplicadas, com uso de ferramentas coesas e validadas, a serem empregadas nas diferentes situações.\n.\n💬 Faz-se também necessária uma deliberação política para o desenvolvimento das ações de EAN dentro da APS, com descrição dessas atividades nos planos municipais de saúde e no planejamento das práticas educativas nas unidades, possibilitando o investimento e o apoio gerencial e logístico necessário para o seu efetivo desenvolvimento a fim de garantir não só a realização, mas também a continuidade dessas atividades dentro dos serviços de saúde.\n.\n📌 Nessa perspectiva, ressalta-se a urgência de redirecionamento das pesquisas relacionadas com a EAN no âmbito da APS no Brasil, sendo pertinente a necessidade de maiores esforços para o delineamento e a condução de estudos que evidenciem modelos de intervenção com métodos ativos e inovadores de educação em saúde."
    url: "https://www.instagram.com/p/CDPd8EQgeei/"
    imagem: "img/instagram-acervo/CDPd8EQgeei.webp"
  - data: "2020-07-24"
    categoria: "Pesquisa"
    titulo: "Oi, pessoal! Hoje vamos apresentar para vocês uma de nossas integrantes 😍📚. . A Bianca é formada em…"
    resumo: "Oi, pessoal! Hoje vamos apresentar para vocês uma de nossas integrantes 😍📚. . A Bianca é formada em Nutrição (UFJF-Campus Governador Valadares) e mestranda no…"
    conteudo: "Oi, pessoal! Hoje vamos apresentar para vocês uma de nossas integrantes 😍📚.\n.\nA Bianca é formada em Nutrição (UFJF-Campus Governador Valadares) e mestranda no Programa de Pós-Graduação em Saúde e Nutrição (UFOP), na linha de pesquisa Nutrição em Saúde Coletiva. Atualmente, é bolsista de Apoio Técnico no projeto Global Burden of Disease (GBD) e pesquisadora do GPENSC.\n.\n📌 Sua pesquisa de mestrado é em parceria com o GIN-UFMG (Grupo de Pesquisa de Intervenções em Nutrição - @gin.ufmg). O estudo é intitulado “Abordagem Nutricional Coletiva na Atenção Básica: É um Desafio que Vale a Pena” e conta com a orientação da professora Dra. Mariana Carvalho de Menezes - @maricarvalhomenezes (UFOP).\n.\n🔎 Em sua pesquisa, Bianca busca avaliar a efetividade da intervenção baseada na Promoção da Alimentação Adequada e Saudável (PAAS) na mudança do perfil alimentar e antropométrico nas cidades de Nova Lima e Carmo do Cajuru (MG).\n.\n👏 O seu trabalho permite avaliar a implementação de intervenções nutricionais que promovam autonomia e resultados duradouros na mudança da alimentação na Atenção Básica.\n.\nQuer saber mais sobre esse tema e sobre a pesquisa? Continue nos acompanhando."
    url: "https://www.instagram.com/p/CDChpCCAa1n/"
    imagem: "img/instagram-acervo/CDChpCCAa1n.webp"
  - data: "2020-07-22"
    categoria: "Pesquisa"
    titulo: "O GPENSC apresenta mais um membro do GPENSC!"
    resumo: "O GPENSC apresenta mais um membro do GPENSC!"
    conteudo: "O GPENSC apresenta mais um membro do GPENSC! Conheçam um pouco mais sobre a Professora Ísis 😍😍\n.\nA professora Ísis Eloah Machado possui graduação em Nutrição pela Universidade Federal de Minas Gerais (UFMG) 🏢,Mestrado e Doutorado em Enfermagem pela UFMG, na linha de pesquisa Prevenção e Controle de Agravos à Saúde.\n.\nDurante o Doutorado, fez estágio sanduíche na Organização Pan Americana de Saúde em sua sede em Washington, DC, EUA, e atou como consultora na mesma instituição 👏🏻👏🏻. O seu pós-doutorado ocorreu na UFMG, no Estudo Global Burden of Disease no Brasil (GBD - Brasil) 🌍🌏🌎\n.\nAtua em pesquisas com foco nas Doenças Crônicas Não Transmissíveis e seus fatores de risco utilizando bases nacionais tais como o Sistema de Vigilância de Fatores de Risco e Proteção para Doenças Crônicas por Inquérito Telefônico - VIGITEL, Pesquisa Nacional de Saúde do Escolar - PeNSE, Pesquisa Nacional de Saúde - PNS, Vigilância de Acidentes e Violências – VIVA, Sistema de Informações em Mortalidade – SIM e Sistema de Informações Hospitalares do SUS - SIH-SUS.\n.\nObrigada professora Ísis pelo seu empenho e dedicação ao grupo!\nContinuem nos acompanhando para conhecer mais dos integrantes do @gpenscufop"
