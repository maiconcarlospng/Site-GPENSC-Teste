  - data: "2020-09-30"
    categoria: "Pesquisa"
    titulo: "Hoje, trazemos para vocês um artigo publicado por pesquisadores do GPENSC"
    resumo: "Hoje, trazemos para vocês um artigo publicado por pesquisadores do GPENSC"
    conteudo: "Hoje, trazemos para vocês um artigo publicado por pesquisadores do GPENSC.\n\nO artigo intitulado “Inequalities in the spatial concentration of agricultural crops among the micro- and mesoregions of Minas Gerais, Brazil é de autoria da integrante Érica Costa Rodrigues e da professora Dra. Adriana Lúcia Meireles (@dri_meireles). O estudo também contou com a participação do professor Dr. Ricardo Tavares.\n.\n📌 Os estudos sobre a densidade da produção agrícola, realizados por pesquisadores da área da saúde, têm se intensificado no intuito de conhecer quais os possíveis impactos da intensa produtividade agrícola para a saúde da população que vive nas proximidades de áreas plantadas.\n.\n🎯 O artigo refere-se ao primeiro estudo do projeto de pesquisa que avalia possíveis relações entre produção agrícola intensa e impactos para a saúde e teve como objetivo mapear e estimar a autocorrelação espacial das culturas agrícolas de café, milho, soja, cana-de-açúcar e feijão no estado de Minas Gerais, analisadas no período de 2011 a 2015.\n.\n🔎 Observou-se que as regiões com maior concentração de área plantada estão localizadas na porção oeste do estado, nas mesorregiões Triângulo Mineiro/Alto Paranaíba, Sul/Sudoeste, além de alguns municípios na Zona da Mata situada a Leste do estado. As regiões de plantio menos expressivas foram aquelas dos municípios localizados na regiões do Jequitinhonha e Vale do Mucuri. As evidências apontam para uma desigualdade micro e mesorregional da distribuição das atividades agrícolas no território mineiro, que parece refletir o processo de modernização agrícola incompleta que ocorreu no estado nas décadas de 70 e 80.\n.\n💡 Esse estudo contribui para o conhecimento das diferenças na produtividade agrícola do estado de culturas específicas e direciona as novas investigações para avaliação dos possíveis impactos na saúde da população residente no entorno das plantações, que deverá ser publicado em breve!!\n.\n🗣️ O artigo na íntegra pode ser encontrado no nosso drive."
    url: "https://www.instagram.com/p/CFxk_1IguFz/"
    imagem: "img/instagram-acervo/CFxk_1IguFz.webp"
  - data: "2020-09-18"
    categoria: "Pesquisa"
    titulo: "Hoje é dia de apresentar para vocês mais um de nossos integrantes ☺️"
    resumo: "Hoje é dia de apresentar para vocês mais um de nossos integrantes ☺️"
    conteudo: "Hoje é dia de apresentar para vocês mais um de nossos integrantes ☺️\n.\n🎓 A Magda é graduada em Nutrição pela Universidade Federal do Espírito Santo (UFES), com período sanduíche no Athlone Institute of Technology (AIT, Irlanda). Mestre em Saúde e Nutrição pela Universidade Federal de Ouro Preto (UFOP) e atualmente é Doutoranda na mesma instituição, no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN-UFOP).\n.\n📌 Sua pesquisa de Doutorado intitulada: “Doenças crônicas não transmissíveis atribuíveis a fatores alimentares: carga e custo financeiro para o Sistema Único de Saúde no Brasil e Unidades Federativas” é orientada pela professora Dra Adriana Lúcia Meireles (@dri_meireles )\n.\n🔎 Em sua pesquisa, Magda irá estimar a carga e o custo financeiro para o Sistema Único de Saúde das doenças crônicas não transmissíveis atribuíveis ao consumo excessivo de gorduras trans e ao consumo insuficiente de grãos integrais, frutas e hortaliças pela população adulta brasileira.\n.\n🗣️Continue nos acompanhando e fique por dentro deste e de outros trabalhos desenvolvidos pelo nosso grupo!"
