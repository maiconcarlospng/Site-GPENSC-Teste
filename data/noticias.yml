  - data: "2022-01-18"
    categoria: "Ensino"
    titulo: "Depois de alguns dias off, estamos de volta com as nossas postagens!"
    resumo: "Depois de alguns dias off, estamos de volta com as nossas postagens!"
    conteudo: "Depois de alguns dias off, estamos de volta com as nossas postagens! \n.\n🚀 E para começar o ano com tudo, hoje é dia de #IndicaGPENSC. Ah, especialmente nesse mês de janeiro, preparamos para vocês algumas outras recomendações. Então, fiquem de olho no nosso perfil!\n.\n🌐 Hoje, queremos indicar o site da Universidade Aberta do SUS - UNA-SUS (@se_unasus). Criado em 2010, o sistema da UNA-SUS é coordenado pelo Ministério da Saúde. Os cursos da UNA-SUS têm a finalidade de capacitar e fornecer educação permanente aos profissionais que atuam no Sistema Único de Saúde (SUS). \n.\n👩🏾‍⚕️ Os profissionais de saúde que atendam aos pré-requisitos dos cursos oferecidos poderão se inscrever. Além disso, o sistema UNA-SUS também têm cursos voltados para estudantes da área da saúde e de livre acesso. Os temas ofertados são diversos, incluindo desde diagnóstico e tratamento de doenças até a gestão e políticas públicas em saúde.\n.\n💻 Os cursos são a distância e gratuitos. Vale a pena conferir os cursos na página da UNA-SUS e ficar de olho nas novidades! \n.\n🔗 Acesse em: www.unasus.gov.br\n.\n📌 Gostou da dica? Aproveite para salvar e compartilhar esse post!"
    url: "https://www.instagram.com/p/CY4xeCmusVG/"
    imagem: "img/instagram-acervo/CY4xeCmusVG.webp"
