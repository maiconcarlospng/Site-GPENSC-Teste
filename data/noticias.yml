  - data: "2021-04-07"
    categoria: "Pesquisa"
    titulo: "Há alguns dias, apresentamos para vocês a pesquisa da Priscila Pena Camargo"
    resumo: "Há alguns dias, apresentamos para vocês a pesquisa da Priscila Pena Camargo (@priscilapenacamargo)"
    conteudo: "Há alguns dias, apresentamos para vocês a pesquisa da Priscila Pena Camargo (@priscilapenacamargo). Mas qual a importância de estudar a disponibilidade de alimentos e a segurança alimentar e nutricional nos domicílios de alunos de escolas públicas?\n.\n🎯 O objetivo deste artigo foi caracterizar a disponibilidade domiciliar de alimentos a partir da classificação adotada no Guia Alimentar para a População Brasileira (2014) e analisar sua relação com a (in)segurança alimentar, em 95 domicílios do Estado do Tocantins.\n.\n📈 As evidências demonstraram que a prevalência de insegurança alimentar foi de 55,79%. Observou-se que os alimentos dos grupos in natura e ultraprocessados foram os que mais contribuíram para a disponibilidade domiciliar de alimentos. Verificou-se relação positiva e estatisticamente significativa do grau de segurança alimentar com a disponibilidade dos seguintes alimentos: leite, gordura animal, enlatados e pão de queijo. Nos domicílios com maior grau de segurança alimentar, a disponibilidade de leite, gordura animal, enlatados e pão de queijo foi significativamente maior.\n.\n🔎 Além da necessidade de políticas públicas que promovam melhorais na condição socioeconômica das famílias, acredita-se que estratégias que valorizem o consumo de alimentos regionais, que incentivem o plantio e fortaleçam a produção local de alimentos e que ainda promovam a formação/mudança de hábitos alimentares saudáveis das famílias, podem contribuir para diminuir o consumo de alimentos ultraprocessados e aumentar o consumo de alimentos in natura. \n.\n🗣 Continue nos acompanhando para saber mais sobre a temática de pesquisa da Priscila Camargo e sobre outros projetos desenvolvidos pelo nosso grupo."
    url: "https://www.instagram.com/p/CNYK15sAE-8/"
    imagem: "img/instagram-acervo/CNYK15sAE-8.webp"
  - data: "2021-03-30"
    categoria: "Pesquisa"
    titulo: "Artigo: Prevalence of anxiety, depression, and suicidal ideation symptoms among university students: a systematic review"
    resumo: "Hoje trazemos para vocês um artigo publicado por pesquisadoras do GPENSC e colaboradores"
    conteudo: "Hoje trazemos para vocês um artigo publicado por pesquisadoras do GPENSC e colaboradores. Trata-se de um artigo de revisão sistemática sobre prevalência de ansiedade, depressão e ideação suicida entre estudantes universitários. \n.\n📄 O artigo intitulado “Prevalence of anxiety, depression, and suicidal ideation symptoms among university students: a systematic review” é de autoria da doutoranda Waléria de Paula (@waleria_dp) e da professora Dra. Adriana Lúcia Meireles (@dri_meireles). O estudo também contou com a colaboração do Dr. Gustavo Silveira Breguez (@gustavo_breguez) e da professora Dra. Elaine Leandro Machado (@lili_mach).\n.\n🎯 Vários estudos têm indicado aumento da prevalência de transtornos mentais e ideação suicida entre estudantes universitários. Assim, esta revisão tem por objetivo determinar as  prevalências globais dos sintomas de ansiedade, depressão e ideação suicida entre estudantes universitários. \n.\n🔎 Foi realizada uma busca na literatura por estudos, em inglês e português, nas bases eletrônicas Science Direct, PubMed, PsycInfo, Medline e Lilacs, publicados entre 2013 e 2018, utilizando os seguintes descritores (em português e inglês): saúde mental, transtorno de ansiedade, depressão, ideação suicida, estudantes universitários.\n.\n📑 Foram selecionados 48 artigos envolvendo 40 países e 56.816 estudantes universitários. Os resultados mostraram uma prevalência de 24,5% para sintomas de ansiedade, 26,1% para sintomas de depressão e 18,8% para ideação suicida. Além disso, as prevalências destas condições foram superiores em universitários da área da saúde em relação à população universitária em geral. \n.\n📈 Esta revisão apresentou um perfil atualizado das prevalências globais de distúrbios psicológicos, realçando as elevadas taxas encontradas e demonstrando a importância da execução de estratégias de prevenção, intervenção e tratamento destes transtornos nesta população.\n.\n🗣 O artigo na íntegra pode ser encontrado no nosso drive ou acessado pelo link https://www.brazilianjournals.com/index.php/BJHR/article/view/13518"
    url: "https://www.instagram.com/p/CNDmfesgJki/"
    imagem: "img/instagram-acervo/CNDmfesgJki.webp"
  - data: "2021-03-24"
    categoria: "Pesquisa"
    titulo: "Hoje trouxemos para vocês um resumo apresentado por membros do nosso grupo de colaboradores no Congresso Brasileiro de Nutrição, edição 2020, que ocorreu em janeiro de 2021"
    resumo: "Hoje trouxemos para vocês um resumo apresentado por membros do nosso grupo de colaboradores no Congresso Brasileiro de Nutrição, edição 2020, que ocorreu em janeiro de 2021"
    conteudo: "Hoje trouxemos para vocês um resumo apresentado por membros do nosso grupo de colaboradores no Congresso Brasileiro de Nutrição, edição 2020, que ocorreu em janeiro de 2021. As autoras do resumo são Hillary Coletro (@hillarycoletro), Amanda Diniz (@amandapopolinonutricionista), Nathália Guimarães, Júlia Cararro, Raquel Mendonça (@raquelmendonca_enut) e Adriana Meireles (@dri_meireles).\n.\n📚 O trabalho intitulado \"Efeitos terapêuticos dos polifenóis em doenças reumáticas: Revisão Sistemática\" teve como objetivo sintetizar os ensaios clínicos randomizados que abrangem os estudos da administração de polifenóis e sua relação com a melhora dos sintomas das doenças reumáticas.\n.\n📈 Como resultado, foi observada uma melhora dos sintomas em 94,12% dos artigos, melhora da atividade da doença em 64,70% e melhora da dor com base na escala visual analógica e melhora da inflamação em 58,82% dos estudos.\n. \n📌 As autoras concluíram sinalizando que são necessárias mais pesquisas que proponham quantidades mínimas do consumo desse composto para que assim, seja possível a criação de medidas profiláticas e de tratamento.\n.\n🗣️ Continue nos acompanhando para saber mais sobre os trabalhos  desenvolvidos pelo nosso grupo."
    url: "https://www.instagram.com/p/CM0HpcpAba0/"
