    categoria: "Institucional"
    titulo: "Nosso #tbt de hoje é bem recente, para lembrar da defesa de mestrado da aluna Ana Cláudia Morito, que ocorreu no dia 24 de fevereiro, via Google Meet"
    resumo: "Nosso #tbt de hoje é bem recente, para lembrar da defesa de mestrado da aluna Ana Cláudia Morito (@anaclaudiamorito), que ocorreu no dia 24 de fevereiro, via Google Meet"
    conteudo: "Nosso #tbt de hoje é bem recente, para lembrar da defesa de mestrado da aluna Ana Cláudia Morito (@anaclaudiamorito), que ocorreu no dia 24 de fevereiro, via Google Meet. \n.\n🔎 A dissertação da Ana Cláudia, intitulada \"Associação dos sintomas de transtorno de ansiedade com a mudança dos escores de alimentação e do peso corporal em universitários durante a pandemia da covid-19 (Projeto PADu-COVID) teve como objetivo avaliar a associação entre os sintomas de transtorno de ansiedade com a mudança dos escores de alimentação e do peso corporal durante a pandemia da covid-19 em universitários de uma instituição de ensino superior. \n.\n👥 Seu trabalho foi orientado pela professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro) e coorientado pela professora Dra. Adriana Lúcia Meireles (@dri_meireles). O trabalho contou com as contribuições da professora Dra. Carolina Gomes Coelho e da professora Dra. Maria del Carmen Bisi Molina (@mdcarmenmolina). \n.\n📈 Os resultados da dissertação da Ana Cláudia indicam que, embora um pequeno aumento dos sintomas de ansiedade e do peso corporal tenha sido observado, as mudanças dos hábitos alimentares e de peso corporal dos estudantes não estiveram associadas à ansiedade.\n.\nParabenizamos a Ana Cláudia pela defesa de mestrado e pela contribuição na ciência do país. Queremos também parabenizá-la pela aprovação no doutorado no PPGSN/UFOP! Sucesso sempre! 👏🎉✨"
    url: "https://www.instagram.com/p/CbyHAqMuBIC/"
    imagem: "img/instagram-acervo/CbyHAqMuBIC.webp"
  - data: "2022-03-24"
    categoria: "Institucional"
    titulo: "Nosso #tbt de hoje é bem recente, para lembrar da defesa de mestrado da aluna Ana Flávia Martins, que aconteceu no dia 23 de fevereiro, via Google Meet"
    resumo: "Nosso #tbt de hoje é bem recente, para lembrar da defesa de mestrado da aluna Ana Flávia Martins (@ananutrifuncional), que aconteceu no dia 23 de fevereiro, via Google Meet"
    conteudo: "Nosso #tbt de hoje é bem recente, para lembrar da defesa de mestrado da aluna Ana Flávia Martins (@ananutrifuncional), que aconteceu no dia 23 de fevereiro, via Google Meet.\n.\n🔎 A dissertação da Ana Flávia, intitulada “Efeito da interação entre o aleitamento materno e o polimorfismo in/del da eca sobre o risco de hipertensão arterial em adultos jovens”, teve como objetivo avaliar a interação do aleitamento (AME) com o polimorfismo In/Del ECA sobre os níveis de angiotensina II (ANG II) e o desenvolvimento de hipertensão arterial sistêmica (HAS) em adultos de 20 a 30 anos.\n.\n👥 Seu trabalho foi orientado pela professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro) e coorientado pela professora Dra. Karina Barbosa de Queiroz (@prof.karina_queiroz). O trabalho contou com as contribuições da professora Dra. Carolina Nicoletti Ferreira (USP), Helen hermana Miranda Hermsdorff (UFV) e Joana Ferreira do Amaral (UFOP).\n.\n📊 A prevalência de HAS nessa população foi de 24,75%, sendo maior no sexo masculino. Essa prevalência não teve relação com o genótipo do gene da ECA. A frequência cardíaca foi maior nos indivíduos do grupo de genótipo de homozigose para deleção + heterozigotos (DD + ID). Observou-se que os níveis de ANG II foram maiores no grupo de genótipo de homozigose para inserção e não houve relação com os valores pressóricos, bem como com a classificação de HAS. \n.\n📈 A maior parte da população foi amamentada exclusivamente por menos de 6 meses, tempo recomendado pela OMS. Com relação a interação do AME e o genótipo, os indivíduos portadores do genótipo de homozigose de inserção e que foram amamentados por 6 meses tiveram uma redução dos níveis séricos de ANG II, sugerindo um efeito protetor do AM.\n.\nParabenizamos a Ana Flávia pela defesa de mestrado e por sua contribuição na ciência do país. Queremos também parabenizá-la pela aprovação no doutorado no PPGSN/UFOP! Sucesso sempre! 👏🎉✨"
    url: "https://www.instagram.com/p/CbgN3Cuuxcc/"
    imagem: "img/instagram-acervo/CbgN3Cuuxcc.webp"
  - data: "2022-03-23"
    categoria: "Institucional"
    titulo: "Artigo: Total Polyphenol Intake, Polyphenol Subtypes, and Prevalence of Hypertension in the CUME Cohort"
    resumo: "Hoje, trazemos para vocês o artigo intitulado “Total Polyphenol Intake, Polyphenol Subtypes, and Prevalence of Hypertension in the CUME Cohort”, de autoria da doutoranda Hillary Nascimento Coletro (@hillarycoletro), sob a orientação das professoras Dras"
    conteudo: "Hoje, trazemos para vocês o artigo intitulado “Total Polyphenol Intake, Polyphenol Subtypes, and Prevalence of Hypertension in the CUME Cohort”, de autoria da doutoranda Hillary Nascimento Coletro (@hillarycoletro), sob a orientação das professoras Dras. Júlia Carraro (@julia_carraro), Raquel Mendonça (@raquelmendonca_enut) e Adriana Meireles (@dri_meireles), juntamente com participação de outros pesquisadoress da UFOP e UFMG.\n.\n🎯 Esse artigo é produto do mestrado da Hillary e teve como objetivo avaliar a existência de associação entre o consumo de polifenóis totais, suas classes e subclasses com a presença de hipertensão arterial sistêmica.\n.\n💻 Para isso, foram realizadas análises com dados da linha de base da Coorte das Universidades de Minas Gerais (CUME). Os participantes preencheram um questionário online de frequência alimentar e os dados da composição fenólica dos alimentos foi avaliado usando o banco de dados Phenol Explorer. A hipertensão foi determinada pelo relato de diagnóstico médico da morbidade, relato de pressão arterial ≥ 130 mmHg/80 mmHg ou relato de uso de anti-hipertensivo. Modelos de regressão logística ajustados foram usados para estimar odds ratios e intervalos de confiança 95% para verificar a associação existente entre a exposição (consumo alimentar de polifenóis) e o desfecho (hipertensão).\n.\n💡 Após análise, foi observado que o consumo de flavonoides, flavonóis e ácido hidroxibenzoico está associado a uma menor chance de ter hipertensão.\n.\n🔗 Acesse o artigo no link abaixo:\nhttps://www.tandfonline.com/doi/full/10.1080/07315724.2021.1977735"
    url: "https://www.instagram.com/p/CbdfELVOaX4/"
    imagem: "img/instagram-acervo/CbdfELVOaX4.webp"
