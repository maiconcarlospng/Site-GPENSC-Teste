  - data: "2021-02-19"
    categoria: "Pesquisa"
    titulo: "Projeto: Impactos financeiros e à saúde devidos à alimentação inadequada e ao excesso de peso no Brasil e Unidades Federativas"
    resumo: "O GPENSC apresenta o projeto “Impactos financeiros e à saúde devidos à alimentação inadequada e ao excesso de peso no Brasil e Unidades Federativas”, coordenado pela profa"
    conteudo: "O GPENSC apresenta o projeto “Impactos financeiros e à saúde devidos à alimentação inadequada e ao excesso de peso no Brasil e Unidades Federativas”, coordenado pela profa. Dra. Ísis Eloah Machado (@isiseloah ). Este projeto também conta com a participação das professoras Dra. Adriana Lúcia Meireles (@dri_meireles ) e Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes ), de alunas de mestrado e doutorado do Programa de Pós-Graduação em Saúde e Nutrição, além de alunos de iniciação científica.\n.\n🎯 O estudo tem como enfoque a agenda de alimentação e nutrição do Sistema Único de Saúde (SUS) e tem parceria com pesquisadores da Universidade Federal de Minas Gerais (UFMG), da Escola Nacional de Saúde Pública/Fundação Oswaldo Cruz (ENSP/FIOCRUZ) e da Universidade do Estado do Rio de Janeiro (UERJ).\n.\n📈 O projeto tem como objetivo descrever a carga de doenças crônicas não transmissíveis (DCNT) atribuível à dieta rica em carnes processadas, bebidas açucaradas, sódio e gorduras trans, bem como ao excesso de peso, na população adulta brasileira em 2019 e sua tendência no período de 1990 a 2019. Além disso, pretende-se estimar os custos financeiros para o SUS relacionados à alimentação inadequada e ao excesso de peso em 2019.\n.\n➡️ Estamos na expectativa de resultados promissores para contribuir na construção de políticas públicas mais eficazes para o controle das DCNT.\n.\n🗣️ Continue nos acompanhando para saber mais sobre esta e outras pesquisas desenvolvidas pelo nosso grupo!"
