    conteudo: "O GPENSC relembra defesa do Trabalho de Conclusão de Curso (TCC) da aluna Mariana Silva Araújo, que aconteceu no dia 04 de novembro de 2021, via Google Meet.\n.\n🔎 O TCC da Mariana, intitulado \"Fatores sociais e econômicos associados à insegurança alimentar na pandemia da covid-19: domicílio dos alunos da rede municipal dos distritos de Mariana e Ouro Preto – MG\", foi orientado pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut) e coorientado pela doutoranda Erica Costa Rodrigues (@costta.erica), ambas da UFOP. \n. \n👥 Seu trabalho contou com as contribuições da banca composta pela professora Dra. Érika Cardoso dos Reis (@erikacareis - UFOP) e pela doutoranda Magda do Carmo Parajára (@magdaparajara - UFOP).\n.\n🎇 Parabenizamos a Mariana pela aprovação e desejamos sucesso nas próximas etapas!"
