  - data: "2020-05-20"
    categoria: "Pesquisa"
    titulo: "Lembram da pesquisa da Hillary, sobre polifenóis?"
    resumo: "Lembram da pesquisa da Hillary, sobre polifenóis? A professora Dra. Raquel Mendonça, do nosso grupo de pesquisa, também trabalha com este composto e tem um…"
    conteudo: "Lembram da pesquisa da Hillary, sobre polifenóis? A professora Dra. Raquel Mendonça, do nosso grupo de pesquisa, também trabalha com este composto e tem um artigo interessantíssimo publicado.\n\nDá uma olhada ➡️ Dietas ricas em polifenóis têm sido associadas a um risco reduzido de doença cardiovascular (DCV). Dessa forma, o objetivo da professora Raquel em seu artigo foi avaliar a associação entre a ingestão de polifenóis e o risco de grandes eventos cardiovasculares em uma coorte prospectiva espanhola.\n\nPara isso, foram incluídos 17.065 universitários acompanhados por média de 10,1 anos. A ingestão de polifenóis foi avaliada na linha de base usando um questionário validado semiquantitativo de frequência alimentar de 136 itens e comparando os dados de consumo alimentar com o banco de dados do Phenol-Explorer.\n\nComo resultado, cerejas, chocolate, café, maçãs e azeitonas foram as principais fontes de variabilidade ingestão de polifenóis, bem como os participantes com maior ingestão (quinto quintil) de flavonóides (subclasse de polifenóis) tiveram uma incidência 47% menor de eventos cardiovasculares em comparação com os do quintil mais baixo.\n\nConclui-se, portanto, que a ingestão de flavonóides mostrou associação inversa ao risco de eventos cardiovasculares em uma coorte prospectiva de universitários espanhóis adultos de meia-idade 👏"
    url: "https://www.instagram.com/p/CAbPQd4gZJ8/"
    imagem: "img/instagram-acervo/CAbPQd4gZJ8.webp"
  - data: "2020-04-23"
    categoria: "Pesquisa"
    titulo: "🔸Quem somos nós? Somos o Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva (GPENSC), da Universidade…"
    resumo: "🔸Quem somos nós? Somos o Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva (GPENSC), da Universidade Federal de Ouro Preto (UFOP), criado em…"
    conteudo: "🔸Quem somos nós?\nSomos o Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva (GPENSC), da Universidade Federal de Ouro Preto (UFOP), criado em 2019.\n.\n🔸Qual o nosso objetivo?\nNosso objetivo é discutir temas de Nutrição e Saúde Coletiva no âmbito da pesquisa, ensino e extensão.\n.\n🔸Quem participa?\nComo grupo, temos características multidisciplinares e contamos com a participação de pesquisadores com interesse nas áreas de Nutrição e Saúde Coletiva. Sendo assim, nosso grupo conta com a colaboração de alunos de graduação, mestrado, doutorado e professores da UFOP. \nO GPENSC é conduzido pelas professoras Adriana Lúcia Meireles, Júlia Cristina Cardoso Carraro, Mariana Carvalho de Menezes e Raquel de Deus Mendonça, todas da Escola de Nutrição (ENUT) da UFOP. \nO grupo também conta com a colaboração das professoras Ísis Eloah Machado, da Escola de Medicina (EMED) da UFOP, e Renata Cristina Rezende Macedo do Nascimento, da Escola de Farmácia (EFAR) da UFOP.\n.\n🔸Qual o propósito da nossa página?\nAqui, iremos compartilhar nossas experiências e conhecimentos, mostrar nossas ideias, publicações, defesas, qualificações, eventos, encontros e outras atividades realizadas enquanto grupo, e ainda, trazer conteúdos diversos relacionados às temáticas de Nutrição e Saúde Coletiva.\n.\nFiquem ligadinhos na nossa página e sejam todos bem-vindos!\n.\n#gpensc #ufop #pesquisa #ensino #extensão #nutrição #saudecoletiva #saude"
    url: "https://www.instagram.com/p/B_VsDAlgvnu/"
    imagem: "img/instagram-acervo/B_VsDAlgvnu.webp"
