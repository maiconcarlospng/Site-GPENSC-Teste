    conteudo: "Hoje, nosso post é para compartilhar com vocês sobre o doutorado sanduíche de uma pesquisadora do nosso grupo, a Thaís Sabião (@thasabiao), discente do PPGSN/UFOP (@ppgsn.ufop), orientada pela professora Dra. Júlia Carraro (@julia_carraro). \n.\n✈️ A Thaís foi contemplada com uma bolsa do Conselho Nacional de Desenvolvimento Científico e Tecnológico (CNPq - @cnpq_oficial) de Apoio à Pesquisa Científica, Tecnológica e de Inovação no exterior, para realizar sua mobilidade acadêmica em Pamplona, Espanha, entre janeiro e julho de 2023.\n.\n🏫 A instituição de destino foi a Universidade de Navarra (@universidaddenavarra), na qual a aluna irá desenvolver uma análise longitudinal sobre os fatores associados à depressão utilizando dados da coorte Seguimiento Universidad de Navarra (Projeto SUN). Na foto, a aluna acompanhada da Profa. Dra Maira Bes Rastrollo, sua orientadora no exterior, e do Prof. Dr. Miguel Ángel Martínez González, fundador do projeto SUN. \n.\n📚 Durante esse período, foi oportunizado à aluna a integração em grupos de estudos, acompanhamento de disciplinas e aprendizagem de novas análises estatísticas.\n.\n👉🏻 Arraste para o lado e confira!\n.\n🗣️ E continue nos acompanhando, para saber mais sobre as novidades e trabalhos desenvolvidos pelo nosso grupo!"
