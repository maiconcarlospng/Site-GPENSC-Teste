  - data: "2021-05-14"
    categoria: "Divulgação científica"
    titulo: "Hoje, é dia de divulgar o V CONAN – Edição Online"
    resumo: "Hoje, é dia de divulgar o V CONAN – Edição Online"
    conteudo: "Hoje, é dia de divulgar o V CONAN – Edição Online.\n.\n📚 Vocês já ouviram falar sobre o CONAN? O CONAN (Congresso Nacional de Alimentos e Nutrição) é um evento nas áreas de saúde, nutrição e ciências de alimentos, realizado pela Escola de Nutrição - ENUT (@enut_ufop) da Universidade Federal de Ouro Preto (UFOP) e que acontece na cidade histórica de Ouro Preto.\n.\n📌 Entretanto, em função da pandemia da COVID-19, a quinta edição do CONAN será realizada em formato online nos dias 04 a 8 de outubro de 2021.\n.\n🗓️ As inscrições já estão abertas e o primeiro lote pode ser garantido até dia 07 de junho. \n.\n🗣️ Garanta sua inscrição pelo site do congresso: conan.ufop.br (link na Bio do perfil oficial do V CONAN @conan_enut)."
