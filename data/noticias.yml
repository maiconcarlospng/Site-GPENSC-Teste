  - data: "2022-11-10"
    categoria: "Pesquisa"
    titulo: "Hoje, no #compartilhaGPENSC vamos falar sobre plágio e autoplágio no meio acadêmico"
    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre plágio e autoplágio no meio acadêmico"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre plágio e autoplágio no meio acadêmico. Afinal, você sabe o que é e como evitar?\n.\n👩🏻‍💻 Plágio e autoplágio são situações recorrentes na comunidade acadêmica, principalmente, na produção científica. Essas situações ocorrem, na maioria das vezes, quando um indivíduo reproduz, copia ideias ou partes do texto que está lendo, sem dar os devidos créditos a todas as fontes que fundamentam a escrita do seu trabalho. \n.\n📑 Tanto o plágio quanto o autoplágio são práticas que devem ser evitadas, pois causam impacto negativo em todo o processo de produção do conhecimento, além de serem passíveis de prisão em alguns casos. \n.\n🔎 No intuito de verificar a presença de plágio em trabalhos científicos, alguns softwares são utilizados. Dentre eles, destacam-se: Plagiarism Detector; CopySpider; Plagius.\n.\n📣 Para evitar possíveis transtornos, é importante que os profissionais, pesquisadores e estudantes utilizem as normas preconizadas pela Associação Brasileira de Normas Técnicas (ABNT). Além dessas normas, existem outras formas de citar e referenciar os trabalhos. Por isso, fique atento as normas exigidas pelos diferentes tipos de revistas e meios de divulgação científica.\n.\n👉🏻 Arraste para o lado e confira.\n.\n🎯 Quando os meios éticos, legais e honestos são utilizados para o desenvolvimento da ciência, toda a comunidade científica agradece!\n.\n🔗 Para mais informações acesse: http://nutciencia.blogspot.com/2020/06/cuidado-com-o-plagio.html\n.\n🗣️ Gostou desta postagem? Não deixe de compartilhar com os amigos"
    url: "https://www.instagram.com/p/Cky_shgODzC/"
    imagem: "img/instagram-acervo/Cky_shgODzC.webp"
  - data: "2022-11-08"
    categoria: "Pesquisa"
    titulo: "Artigo: COVID-Inconfdentes: how did COVID-19 and work from home infuence the prevalence of leisure-time physical inactivity? An analysis of before and during the pandemic"
    resumo: "O GPENSC apresenta o artigo intitulado “COVID-Inconfdentes: how did COVID-19 and work from home infuence the prevalence of leisure-time physical inactivity?"
    conteudo: "O GPENSC apresenta o artigo intitulado “COVID-Inconfdentes: how did COVID-19 and work from home infuence the prevalence of leisure-time physical inactivity? An analysis of before and during the pandemic”, de autoria da doutoranda Samara Moura (@mourasamara), juntamente com outros pesquisadores do GPENSC e da UFOP.\n.\n🎯 O artigo, um dos produtos do doutorado da Samara, teve como objetivo avaliar a prevalência da inatividade física (IF) e os fatores associados antes e durante a pandemia da covid-19.\n.\n🔎 A prática de atividade física foi avaliada por meio do autorrelato e categorizada em ativos e inativos fisicamente. Foram analisados três momentos: M0 (antes da pandemia), M1 (de março a julho de 2020) e M2 (de outubro a dezembro de 2020). \n.\n📈 Observou-se que cerca de dois a cada cinco indivíduos eram inativos antes da pandemia e que houve um aumento de 27,6% no M1 e 19,0% no M2, quando comparado ao período antes da pandemia da covid-19.\n.\n📊 Quando os momentos M1 e M2 foram avaliados, observou-se que a prevalência de IF foi de 8,6%, sendo maior no M1 quando comparado ao M2. Indivíduos com menor escolaridade, sobrepeso e obesidade têm mais chances de serem inativos. Além disso, o trabalho em home-office favoreceu a prática de atividade física.\n.\n💡 Os achados reforçam a importância de compreender as alterações na prática de atividade física durante o período de restrição social, de modo que os efeitos negativos possam ser revertidos, como a criação e implementação de políticas efetivas e viáveis para aumentar a prática de atividade física em todos os níveis populacionais. \n.\n🔗 Acesse o artigo: https://doi.org/10.1186/s12889-022-14145-1"
