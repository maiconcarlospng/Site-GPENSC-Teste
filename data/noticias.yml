    titulo: "O post de hoje é muito especial porque temos motivos em dobro para comemorar"
    resumo: "O post de hoje é muito especial porque temos motivos em dobro para comemorar"
    conteudo: "O post de hoje é muito especial porque temos motivos em dobro para comemorar. Neste mês de abril, o GPENSC completa dois anos, e ainda, comemoramos um ano do nosso Instagram.\n.\n❤️ Diante do atual cenário epidemiológico no qual estamos passando, infelizmente não poderemos estar juntos nesse momento tão especial para nós. No entanto, seguimos confiantes em dias melhores e ficamos felizes e orgulhosos, pois mesmo diante desses desafios que a pandemia nos trouxe, o grupo vem se fortalecendo e trabalhando arduamente em prol da ciência no país. Queremos deixar registrado o nosso agradecimento a cada membro do GPENSC! Vocês são essenciais para nós!\n.\n🧡 Também não podemos deixar de agradecer a cada um de vocês que nos acompanha por aqui, que acredita no trabalho que desenvolvemos e que interage nas nossas publicações. Cada  postagem é feita com muito carinho para vocês. Sintam-se “em casa” neste espaço que é de vocês também, pois queremos estar sempre próximos!\n.\n🤍 Agora, pedimos que contem pra gente aqui nos comentários o que o GPENSC representa para vocês! Esperamos ansiosos para saber como temos motivado cada um de vocês! \n.\nCom carinho, Equipe GPENSC."
    url: "https://www.instagram.com/p/COBXqTzguXM/"
