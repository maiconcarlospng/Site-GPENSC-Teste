    categoria: "Institucional"
    titulo: "Hoje, vamos compartilhar com vocês mais um pouquinho sobre o doutorado sanduíche de uma pesquisadora do nosso grupo, a Priscila Pena Camargo, discente do PPGSN/UFOP, que foi…"
    resumo: "Hoje, vamos compartilhar com vocês mais um pouquinho sobre o doutorado sanduíche de uma pesquisadora do nosso grupo, a Priscila Pena Camargo (@priscilapenacamargo), discente do PPGSN/UFOP (@ppgsn.ufop), que foi para a Boston University (@bostonu), Estados Unidos, com bolsa pela CAPES (@capes_oficial)"
    conteudo: "Hoje, vamos compartilhar com vocês mais um pouquinho sobre o doutorado sanduíche de uma pesquisadora do nosso grupo, a Priscila Pena Camargo (@priscilapenacamargo), discente do PPGSN/UFOP (@ppgsn.ufop), que foi para a Boston University (@bostonu), Estados Unidos, com bolsa pela CAPES (@capes_oficial).\n.\n✨ Para Priscila, esse período foi uma importante oportunidade de crescimento pessoal e acadêmico. Segundo a discente, foi uma experiência desafiadora e repleta de novidades, que aumentou sua confiança e proporcionou a oportunidade de conhecer e aprender com pesquisadores renomados de diversas partes dos EUA. Além disso, Priscila pôde praticar uma segunda língua, ter contato com outras culturas - já que a cidade recebe imigrantes de todas as partes do mundo - e ter a vivência em uma cidade com diversas atividades culturais, como Boston.\n.\n👥 A doutoranda trabalhou em colaboração direta com o grupo de pesquisa do Instituto Children’s HealthWatch para desenvolver, implementar e analisar os dados de uma pesquisa on-line voltada para a equipe de recepção e médicos assistentes do Departamento de Pediatria do Boston Medical Center. Essa pesquisa fez parte das ações da Força-Tarefa de Segurança Alimentar e teve como objetivo entender as barreiras e facilitadores da implementação de uma ferramenta de triagem de necessidades sociais relacionadas à saúde para famílias de pacientes pediátricos que buscam atendimento na atenção primária do hospital.\n.\n📚 Durante seu estágio no exterior, Priscila apresentou a pesquisa que desenvolveu no Brasil na Reunião do Conselho Executivo do instituto e teve a oportunidade de participar de seminários organizados por diversos órgãos de pesquisa, com os temas “Hunger Vital Sign” e “Food is Medicine”.\n.\n👩🏻‍💻 A discente teve reuniões frequentes com sua supervisora estrangeira, Dra. Ana Poblacion, e teve a oportunidade de integrar o grupo de estudos do instituto, participando de suas reuniões e aprendendo sobre Insegurança Alimentar e políticas públicas para sua mitigação. Essas experiências certamente impactarão positivamente sua tese de doutorado, assim como sua carreira acadêmica.\n.\n👉🏻 Arraste para o lado e confira al"
