    categoria: "Institucional"
    titulo: "O dia de #tbt foi ontem, mas bora relembrar uma data especial para o GPENSC?"
    resumo: "O dia de #tbt foi ontem, mas bora relembrar uma data especial para o GPENSC?"
    conteudo: "O dia de #tbt foi ontem, mas bora relembrar uma data especial para o GPENSC? 🔙😍\n.\n🗓️ Nosos #tbt de hoje é para lembrar da defesa de mestrado da Tainá Cristina Damasceno Silva (@tainacdamasceno), que ocorreu dia no dia 16 de fevereiro de 2023, de forma híbrida.\n.\n🔎 A dissertação da Tainá, intitulada “Validação de materiais educativos digitais para o manejo da hipertensão arterial na Atenção Primária à Saúde pautados no Guia Alimentar para a População Brasileira”, teve como objetivo validar materiais educativos de apoio elaborados baseados no Guia Alimentar para a População Brasileira para usuários com diagnóstico de hipertensão arterial (HA) na Atenção Primária à Saúde (APS).\n.\n👥 Seu estudo foi orientado pela professora Dra. Raquel de Deus Mendonça -  @raquelmendonca_enut (UFOP) e coorientado pela professora Dra. Júlia Cristina Cardoso Carraro - @julia_carraro (UFOP). O trabalho contou com as contribuições da banca composta pelas professoras Dra. Mariana Carvalho de Menezes - @maricarvalhomenezes (UFOP) e Dra. Renata Andrade de Medeiros Moreira (UFT).\n.\n💡Os resultados da dissertação da Tainá demonstram que os materiais educativos digitais foram validados para serem utilizados no manejo da HA como apoio ao atendimento nutricional individual.\n.\n🎆 Parabenizamos a Tainá pela defesa de mestrado e pela contribuição na ciência do país. Queremos também parabenizá-la pela aprovação no doutorado no PPGSN/UFOP! Sucesso sempre!"
    url: "https://www.instagram.com/p/Cqd7vvuuLaX/"
