  - data: "2020-10-23"
    categoria: "Pesquisa"
    titulo: "Projeto: Vigilância epidemiológica da COVID-19 na região dos Inconfidentes"
    resumo: "No último final de semana (16 a 18 de outubro), iniciamos a coleta de dados do projeto “Vigilância epidemiológica da COVID-19 na região dos Inconfidentes” (COVID-Inconfidentes-UFOP)"
    conteudo: "No último final de semana (16 a 18 de outubro), iniciamos a coleta de dados do projeto “Vigilância epidemiológica da COVID-19 na região dos Inconfidentes” (COVID-Inconfidentes-UFOP).\n.\n🏘 Os pesquisadores irão visitar 1500 domicílios nos meses de outubro, novembro e dezembro para conhecer a prevalência da COVID-19 e as condições de saúde dos moradores de Mariana e Ouro Preto. \n.\n💉 Para isso, os profissionais de saúde, entrevistadores, supervisores e coordenadores de campo irão percorrer os bairros dos municípios para realizar a coleta de sangue e entrevistas com moradores, a fim de investigar o aparecimento de sintomas, hábitos de vida, condições socioeconômicas, alimentação e nutrição e prática de atividade física. As visitas estão acontecendo aos fins de semana (sexta, sábado e domingo).\n.\n👉 Arraste para o lado e confira as fotos do painel I realizado na cidade de Mariana no último final de semana (16 a 18 de outubro).\n.\n🔬A pesquisa irá ajudar a compreender a realidade da pandemia na região e seus possíveis impactos na saúde. Se seu domicílio foi selecionado, receba nossos pesquisadores e esteja conosco na luta contra a COVID-19. \n.\n🔍 Continue nos acompanhando para saber mais sobre esse projeto.\n.\n📧 Qualquer dúvida, entre em contato pelo e-mail: covid.inconfidentes.ppgsn@ufop.edu.br"
