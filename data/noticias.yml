    resumo: "📢 O GPENSC agora está no ar! 🎙️ Temos uma grande novidade para compartilhar! Com o compromisso de levar conhecimento científico à sociedade, o GPENSC…"
    conteudo: "📢 O GPENSC agora está no ar! 🎙️\n\nTemos uma grande novidade para compartilhar! Com o compromisso de levar conhecimento científico à sociedade, o GPENSC no Ar chega como um programa de rádio em parceria com a Rádio Província FM @radioprovincia.fm.\n\nA cada 15 dias, aos sábados, às 12h, professores e pesquisadores do nosso grupo de estudos trarão temas essenciais para a saúde e o bem-estar da população, abordando desde alimentação e comportamento até saúde planetária e genética.\n\n📌 Entre os assuntos que serão discutidos, estão:\n✅ Importância da pesquisa para a sociedade\n✅ Consumo alimentar e insegurança alimentar\n✅ Alimentação sustentável e saúde planetária\n✅ Sono\n✅ Risco cardiovascular e consumo alimentar\n✅ Comportamento alimentar e comportamento de movimento\n✅ Genética e comportamento alimentar\n\nNosso objetivo é aproximar a ciência do dia a dia, trazendo informações confiáveis e acessíveis para todos.✨\n\n🔊 Sintonize na Rádio Província FM 98,7MHz e acompanhe essa iniciativa!"
