    categoria: "Institucional"
    titulo: "Percepção de usuários com diagnóstico de hipertensão arterial quanto às mudanças nas práticas alimentares após acompanhamento nutricional individual na Atenção Primária à Saúde"
    resumo: "O GPENSC relembra de duas qualificações de mestrado, que ocorreram no mês de abril de 2024, no formato online"
    conteudo: "O GPENSC relembra de duas qualificações de mestrado, que ocorreram no mês de abril de 2024, no formato online.\n.\n🔎 O projeto de mestrado da aluna Verônica Magalhães Silva (@nutri.veronica_mag), intitulado “Percepção de usuários com diagnóstico de hipertensão arterial quanto às mudanças nas práticas alimentares após acompanhamento nutricional individual na Atenção Primária à Saúde”, é orientado pela professora Dra. Raquel Mendonça - @raquelmendonca_enut (UFOP) e coorientado pelo Dra. Anabele Pires - @piresanabele (UFLA). O trabalho contou com as contribuições da banca formada pelas professoras Dra. Fernanda Penaforte (UFTM) e Dra. Júlia Carraro - @julia_carraro (UFOP).\n.\n🔎 O projeto de mestrado aluna Jussara Quintão Faria (@nutri.jussaraquintao), intitulado “Índice inflamatório da dieta e incidência de síndrome metabólica: ELSA-Brasil”, é orientado pela professora Dra. Raquel Mendonça e coorientado pela professora Dra. Renata Adrielle Lima Vieira - @renatadriellenutri (UFPB). O trabalho contou com as contribuições da banca formada pela professora Dra. Júlia Carraro e pelo Dr. Oscar Geovanny Enriquez-Martinez (UFES).\n.\n🎆 Parabenizamos a Verônica e a Jussara pela aprovação na qualificação de mestrado e pela contribuição na ciência do país. Desejamos sucesso nas próximas etapas!"
