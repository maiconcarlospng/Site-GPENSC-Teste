  - data: "2021-12-06"
    categoria: "Pesquisa"
    titulo: "Pandemia da covid-19 e insegurança alimentar"
    resumo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC"
    conteudo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC.\n.\n📄 Neste resumo, vamos falar sobre “Pandemia da covid-19 e insegurança alimentar”, apresentado pela doutoranda Erica Costa Rodrigues (@costta.erica), sob orientação da professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut).\n.\n📝 Na apresentação, a aluna abordou sobre as prevalências mundiais, nacionais e regionais/locais de insegurança alimentar durante a pandemia da covid-19 e alguns fatores associados.\n.\n📊 Os indicadores de insegurança alimentar já apresentavam piora desde 2014, segundo a Food and Agriculture Organization (FAO). Entretanto, com as medidas de restrição social, associadas às mudanças nos sistemas de abastecimento alimentar e a desaceleração econômica impostas pela pandemia da covid-19, é esperado um incremento de 660 milhões de pessoas em situação de fome até o ano de 2030.\n.\n🦠 A pandemia da covid-19 provavelmente impactou a prevalência de múltiplas formas de desnutrição e pode ter efeitos duradouros após 2020.  Além fome, outros fatores associados à má nutrição como anemia em mulheres com idade reprodutiva, aumento do baixo peso ao nascer, redução da taxa de aleitamento materno exclusivo, aumento da prevalência de obesidade em adultos e do excesso de peso em crianças, têm distanciado globalmente o alcance da meta 2 dos Objetivos de Desenvolvimento Sustentável (ODS). \n.\n👉🏻 Arraste para o lado e confira mais sobre o tema. Acesse as referências disponibilizadas no post.\n.\n🗣️ Continue nos acompanhando para saber mais sobre os resultados do Estudo da Segurança Alimentar e Nutricional na Pandemia da Covid-19 (ESANP) e sobre os trabalhos desenvolvidos pelo nosso grupo!"
