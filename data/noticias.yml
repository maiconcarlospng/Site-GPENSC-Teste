  - data: "2024-08-08"
    categoria: "Pesquisa"
    titulo: "Artigo: Sedentary behavior is associated with the mental health of university students during the Covid-19 pandemic, and not practicing physical activity accentuates its adverse effects: cross-sectional study"
    resumo: "O GPENSC apresenta o artigo intitulado “Sedentary behavior is associated with the mental health of university students during the Covid-19 pandemic, and not practicing physical activity accentuates its adverse effects: cross-sectional study”, de autoria da doutoranda Bruna Carolina Rafael Barbosa (@brunabcrb)…"
    conteudo: "O GPENSC apresenta o artigo intitulado “Sedentary behavior is associated with the mental health of university students during the Covid-19 pandemic, and not practicing physical activity accentuates its adverse effects: cross-sectional study”, de autoria da doutoranda Bruna Carolina Rafael Barbosa (@brunabcrb) juntamente com outros pesquisadores do GPENSC.\n.\n🎯 O artigo teve como objetivo avaliar a associação do comportamento sedentário (CS) e da atividade física de lazer moderada a vigorosa (AFMV) com a presença de sintomas de transtornos mentais durante a pandemia de covid-19.\n.\n📝 Trata-se de um estudo multicêntrico realizado com 8.650 estudantes de graduação de oito universidades brasileiras, entre outubro de 2021 e fevereiro de 2022, utilizando um questionário online. A variável desfecho foi sintomas de ansiedade e depressão, avaliados pela DASS-21. O CS foi mensurado pelo tempo total sentado, sendo que indivíduos com ≥ 9 h/dia foram classificados com CS elevado. A prática de AFMV foi avaliada com base na frequência semanal, duração e tipo de exercício. Foi calculada a razão entre o tempo gasto em AFMV (min/dia) e o tempo gasto em CS (horas/dia), sendo considerado como ponto de corte a prática de 2,5 min de AFMV para cada hora sedentária.\n.\n📊 Os resultados do estudo indicam que as chances de sintomas de ansiedade [OR: 1,37 (IC 95%: 1,24–1,50)] e depressão [OR: 1,61 (IC 95%: 1,47–1,77)] foram maiores em estudantes com ≥ 9 h de CS por dia. Na análise da razão entre AFMV e CS, observou-se que não se envolver em 2,5 min de AFMV por hora de CS aumenta as chances de sintomas de ansiedade [OR: 1,44 (IC 95%: 1,31–1,58)] e depressão [OR: 1,74 (IC 95%: 1,59–1,92)].\n.\n💡Os achados reforçam a necessidade de políticas públicas e ações de intervenção integradas focadas na redução do tempo gasto em CS e na melhoria da prática de atividade física no ambiente universitário. \n.\n🔗 Acesse o artigo: https://doi.org/10.1186/s12889-024-19345-5"
    url: "https://www.instagram.com/p/C-bPC4oOUFR/"
    imagem: "img/instagram-acervo/C-bPC4oOUFR.webp"
  - data: "2024-08-01"
