  - data: "2023-04-18"
    categoria: "Pesquisa"
    titulo: "Alimentação e Nutrição no Brasil: perspectivas na segurança e soberania alimentar"
    resumo: "O GPENSC recomenda o livro digital “Alimentação e Nutrição no Brasil: perspectivas na segurança e soberania alimentar”, lançado em 2023"
    conteudo: "O GPENSC recomenda o livro digital “Alimentação e Nutrição no Brasil: perspectivas na segurança e soberania alimentar”, lançado em 2023.\n.\n🧾Este livro é mais uma publicação que tem o intuito de contribuir para o processo de planejamento, definição de prioridades e estratégias políticas do sistema de saúde brasileiro, utilizando como base o documento das Nações Unidas, a Agenda 2030 para o Desenvolvimento Sustentável.\n.\n🎯 O livro foi idealizado pela iniciativa “Brasil Saúde Amanhã”, que é uma rede de pesquisa que examina e projeta caminhos para o setor de saúde em conjunto com a Estratégia Fiocruz para Agenda 2030 em direção aos Objetivos de Desenvolvimento Sustentável. \n.\n💻 Em um cenário do aumento da fome e da desnutrição, presente antes da pandemia da covid-19 e intensificado durante, o livro foi escrito com o intuito de compreender os desafios diante de nós, para garantir a segurança e a soberania alimentar, hoje e no futuro.\n.\n🔗 Para conferir o documento na íntegra, acesse: https://portolivre.fiocruz.br/node/2192\n.\n🗣️ Gostou da dica? Compartilha com os amigos e aproveita para salvar essa recomendação."
