    titulo: "Hoje, iniciamos uma série de postagens sobre a segunda edição do Guia Alimentar para a População Brasileira, em comemoração aos oito anos de lançamento"
    resumo: "Hoje, iniciamos uma série de postagens sobre a segunda edição do Guia Alimentar para a População Brasileira, em comemoração aos oito anos de lançamento"
    conteudo: "Hoje, iniciamos uma série de postagens sobre a segunda edição do Guia Alimentar para a População Brasileira, em comemoração aos oito anos de lançamento.\n.\n📘 O Guia Alimentar para a População Brasileira oferece informações confiáveis, baseadas em evidências científicas, sobre as dimensões da alimentação e nutrição, a fim de promover a saúde das famílias, comunidades e da sociedade brasileira como um todo. Tudo isso em uma linguagem bem simples e acessível!\n.\n🥙 O Guia é uma das estratégias para para implementação da diretriz de promoção da alimentação adequada e saudável que integra a Política Nacional de Alimentação e Nutrição.\n.\n📍No post de hoje, vamos falar um pouquinho sobre esse importante instrumento, seu objetivo e princípios.\n.\n🗣️ Não deixe de conferir e continuar acompanhando as próximas postagens dessa série para lá de especial."
