  - data: "2023-04-11"
    categoria: "Pesquisa"
    titulo: "Artigo: Influence of sunlight on the association between 25-hydroxyvitamin D levels and sleep quality in Brazilian adults: A population-based study"
    resumo: "O GPENSC apresenta o artigo intitulado \"Influence of sunlight on the association between 25-hydroxyvitamin D levels and sleep quality in Brazilian adults: A population-based study\", de autoria do pós-doutorando Luiz Antônio Alves Menezes (@luizmenezes__) juntamente com outros pesquisadores do GPENSC e da UFOP"
    conteudo: "O GPENSC apresenta o artigo intitulado \"Influence of sunlight on the association between 25-hydroxyvitamin D levels and sleep quality in Brazilian adults: A population-based study\", de autoria do pós-doutorando Luiz Antônio Alves Menezes (@luizmenezes__) juntamente com outros pesquisadores do GPENSC e da UFOP.\n.\n🎯 O artigo, um dos produtos da tese de doutorado do Luiz, teve como objetivo avaliar a associação da vitamina D com a qualidade do sono durante a pandemia da covid-19 e a influência da luz solar diária nesta associação.\n.\n📝 Trata-se de um estudo transversal realizado com adultos da região do Quadrilátero Ferrífero. Os dados foram coletados de outubro a dezembro de 2020, utilizando como desfecho a qualidade do sono, que foi avaliado pelo instrumento Pittsburgh Sleep Quality Index.\n.\n📈 Os resultados mostraram que a prevalência de deficiência de vitamina D foi de 19,8% e a de má qualidade do sono foi de 52,5%. Além disso, os pesquisadores encontraram que a vitamina D não estave associada à má qualidade do sono nos indivíduos com exposição solar suficiente (> 30 min/dia). No entanto, nos indivíduos com exposição solar insuficiente (<30 min/dia), a deficiência de vitamina D estave associada à má qualidade do sono, sugerindo que indivíduos que se expõem menos que 30 minutos por dia ao sol, devem ficar atentos aos níveis de vitamina D. \n. 💡Os resultados ressaltam a importância de uma bom nível de vitamina D para uma boa qualidade de sono. Lembrando que antes de tomar qualquer suplemento, é importante consultar um nutricionista. \n.\n🔗 Acesse o artigo: https://doi.org/10.1016/j.nut.2023.112008"
    url: "https://www.instagram.com/p/Cq6QOR3u8ST/"
    imagem: "img/instagram-acervo/Cq6QOR3u8ST.webp"
  - data: "2023-03-28"
    categoria: "Pesquisa"
    titulo: "Na semana passada, apresentamos para vocês a pesquisa da doutoranda Deisyane Fumian Bouzada (deisyanebouzada)"
    resumo: "Na semana passada, apresentamos para vocês a pesquisa da doutoranda Deisyane Fumian Bouzada (deisyanebouzada)"
    conteudo: "Na semana passada, apresentamos para vocês a pesquisa da doutoranda Deisyane Fumian Bouzada (deisyanebouzada). Mas qual a importância de estudar o rápido crescimento do mercado de alimentos ultraprocessados (AUP) e sua influência na prevalência de doenças crônicas não transmissiveis (DCNT)? \n.\n🍽️ Os AUP são produtos alimentícios fabricados por meio do uso de múltiplas técnicas industriais, como pré-fritura, adição de corantes e conservantes. Evidências apontam para uma forte associação entre o consumo de AUP e sobrepeso/obesidade, hipertensão, doença cardiovascular, diabetes tipo 2, câncer e risco de mortalidade por todas as causas.\n.\n🎯 O objetivo deste artigo foi avaliar as tendências atuais na América Latina com relação ao consumo de AUP e doenças cardiometabólicas, destacando a importância desta conexão desfavorável, bem como possíveis mecanismos.\n.\n📝 Trata-se de um estudo realizado em conjunto pela Organização Mundial de Saúde e a Organização Pan-Americana de Saúde em 13 países da América Latina: Argentina, Bolívia, Brasil, Chile, Colômbia, Costa Rica, República Dominicana, Equador, México, Peru, Uruguai, Venezuela e Guatemala.\n.\n📊 Os resultados indicam associação positiva entre as vendas no varejo de AUP e a prevalência de obesidade na América Latina. No Brasil, o aumento da ingestão de alimentos processados, bebidas açucaradas e carboidratos refinados ocorreu em conjunto com o aumento da prevalência de sobrepeso e obesidade. Essas tendências simultâneas foram identificadas como principais causas de morte por doenças cardiometabólicas no Brasil. \n.\n📈 Entre 2002 e 2009, o consumo de AUP nos domicílios brasileiros aumentou de 20,8% do total de calorias consumidas para 25,4%. Com a ingestão de AUP aumentada, a ingestão de alimentos minimamente processados também diminuiu. \n.\n💡 O aumento da popularidade dos UAP na América Latina está associado com a prevalência de DCNT e configura-se como reflexo da crescente urbanização e interação com os mercados externos na economia latino-americana. \n.\n👉🏻 Arraste para o lado e confira o resumo do artigo."
    url: "https://www.instagram.com/p/CqWNy7AuBLl/"
    imagem: "img/instagram-acervo/CqWNy7AuBLl.webp"
  - data: "2023-03-23"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: doutoranda Deisyane Fumian Bouzada"
    resumo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a doutoranda Deisyane Fumian Bouzada (@deisyanebouzada)"
    conteudo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a doutoranda Deisyane Fumian Bouzada (@deisyanebouzada). \n.\n👩🏻‍🎓 A Deisyane é enfermeira graduada pela Universidade Federal de Minas Gerais (UFMG) e mestre em Saúde e Nutrição pelo Programa de Pós Graduação em Saúde e Nutrição - PPGSN/UFOP (@ppgsn.ufop). Atualmente, é doutoranda na mesma instituição, na linha de pesquisa Saúde e Nutrição em indivíduos e coletividades. Atuou como enfermeira de equipe de Estratégia de Saúde da Família e como coordenadora da Atenção Primária a Saúde no município de Ouro Preto por cinco anos, além de experiência na área hospitalar.\n.\n 📚 É pesquisadora do Projeto de Ansiedade e Depressão em Universitários - PADu multicêntrico (@padufederais) e sua pesquisa de doutorado é intitulada \"Consumo de ultraprocessados e suas interfaces com a saúde mental e qualidade de vida de estudantes universitários de Minas Gerais\", sob a orientação da professora Dra. Adriana Lúcia Meireles (@dri.meireles).\n.\n🔎 Quer saber mais sobre o tema da Deisyane? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo!"
