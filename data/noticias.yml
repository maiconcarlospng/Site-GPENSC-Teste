  - data: "2023-05-16"
    categoria: "Pesquisa"
    titulo: "Na semana passada, apresentamos para vocês a pesquisa do doutorando Anilson Júnior"
    resumo: "Na semana passada, apresentamos para vocês a pesquisa do doutorando Anilson Júnior (@anilsonjrc)"
    conteudo: "Na semana passada, apresentamos para vocês a pesquisa do doutorando Anilson Júnior (@anilsonjrc). Mas por que é importante estudar os impactos de guias alimentares?\n.\n📓 Guias alimentares são baseados em evidências científicas e tem como objetivo estabelecer recomendações para alimentação saudável, uma vez que refletem os conhecimentos atuais sobre saúde e nutrição. Estudar os impactos dos guias é essencial para avaliação da eficácia das orientações, identificar lacunas, compreender os efeitos socioeconômicos e as mudanças comportamentais.\n.\n🎯 O objetivo deste artigo foi desenvolver e testar uma escala de mensuração de práticas alimentares saudáveis de acordo com as recomendações do guia alimentar para a população brasileira.\n.\n📈 Trata-se de um estudo metodológico baseado em psicometria, ciência que estuda a medição de fenômenos não observáveis diretamente que podem ser caracterizados usando um conjunto de outros atributos. O estudo foi conduzido em fases: F1: com base nas recomendações do guia, foi criado um conjunto de frases/itens com respostas por meio de escala do tipo Likert de quatro pontos; F2: foram realizados testes de validade por meio de análise fatorial exploratória e confirmatória utilizando o software R-Studio; e F3: foi avaliada a consistência interna e reprodutibilidade do instrumento, calculando os coeficientes α de Cronbach e ω de McDonald's.\n.\n📊 Dos 96 itens iniciais, 24 foram excluídos e 55 reescritos após as validações. Na análise exploratória foram identificadas quatro dimensões: escolha de alimentos, modos de comer, organização e planejamento. Essa solução explicou 41% da variância e mantidos 34 itens. Na análise confirmatória, após ajustes o modelo final teve 24 itens, com confiabilidade ω-t=0,83, com propriedades psicométricas satisfatórias. No teste-reteste, a diferença média entre os dois momentos foi próxima de zero, indicando boa reprodutibilidade.\n.\n🔎 Concluiu-se que a escala desenvolvida é válida e confiável e pode ser aplicada tanto em papel quanto eletronicamente.\n.\n👉🏻 Arraste para o lado e veja o resumo do artigo."
    url: "https://www.instagram.com/p/CsUf8eAusZ0/"
