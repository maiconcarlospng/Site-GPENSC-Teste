  - data: "2021-10-22"
    categoria: "Pesquisa"
    titulo: "Consumo de bebidas alcoólicas durante a pandemia da COVID-19"
    resumo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC"
    conteudo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC.\n.\n📄 Neste resumo, vamos falar sobre “Consumo de bebidas alcoólicas durante a pandemia da COVID-19”, apresentado pela doutoranda Amanda Popolino Diniz (@amandapopolinonutricionista), sob orientação da professora Dra. Adriana Lúcia Meireles (@dri_meireles).\n.\n🎯 Na apresentação, a aluna abordou sobre os aspectos do consumo de bebidas alcoólicas na população brasileira, sobretudo, durante o período da pandemia. Isso porque as mudanças ocorridas no estilo de vida e na situação socioeconômica dos indivíduos durante a pandemia favoreceram o aumento do consumo de álcool. Além disso, a aluna traz informações sobre o padrão de consumo, fatores que influenciam na relação dose-efeito, efeitos do consumo abusivo, os impactos da pandemia sobre o consumo de álcool, e dados da pesquisa ConVid. \n.\n📝 Existem diversos fatores do estilo de vida que estão diretamente ligados a maiores riscos de doença e mortalidade, entre eles estão o uso nocivo de álcool. Pesquisas demonstraram que comportamentos de risco à saúde como o consumo de bebidas alcoólicas tornaram-se mais frequentes durante a pandemia.\n.\n👉🏻 Arraste para o lado e confira mais sobre esse tema.\n.\n🗣️ Continue nos acompanhando para saber mais sobre os resultados do trabalho da Amanda e sobre os trabalhos desenvolvidos pelo nosso grupo!"
