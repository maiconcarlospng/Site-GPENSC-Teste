  - data: "2022-11-28"
    categoria: "Pesquisa"
    titulo: "Coocorrência de comportamentos obesogênicos e sintomas de ansiedade e depressão durante os meses iniciais da pandemia da covid-19: PADu-COVID, um estudo com universitários"
    resumo: "O GPENSC apresenta um #infográfico sobre o tema de dissertação da Bruna Carolina (@brunabcrb)"
    conteudo: "O GPENSC apresenta um #infográfico sobre o tema de dissertação da Bruna Carolina (@brunabcrb).\n.\n👩🏻‍💻 O trabalho da Bruna, intitulado “Coocorrência de comportamentos obesogênicos e sintomas de ansiedade e depressão durante os meses iniciais da pandemia da covid-19: PADu-COVID, um estudo com universitários”, foi orientado pela professora Dra. Adriana Meireles – UFOP (@dri_meireles) e coorientado pela professora Dra. Elaine Machado – UFMG (@lili_mach).\n.\n🧠 A saúde mental dos estudantes universitários tornou-se um tema de interesse, tanto pela vulnerabilidade a uma série de estressores psicossociais relacionados as dificuldades da rotina acadêmica quanto pelas diferentes mudanças que ocorrem na vida do estudante, influenciando, inclusive, na adoção de múltiplos comportamentos obesogênicos.\n.\n🎯 O objetivo do estudo foi estimar a prevalência dos sintomas de ansiedade e de depressão e verificar a associação com a coocorrência de comportamentos obesogênicos em estudantes de graduação de uma Instituição Federal de Ensino Superior durante os primeiros meses da pandemia da covid-19.\n.\n📝 O estudo foi realizado com 1.353 estudantes de graduação da UFOP, entre julho a agosto de 2020, por meio de um questionário online. Os sintomas de ansiedade e sintomas de depressão (desfechos do estudo) foram avaliados por meio da escala DASS-21. A coocorrência dos comportamentos obesogênicos foi mensurada a partir do somatório de quatro comportamentos de risco: consumo irregular de frutas e hortaliças (FH), consumo frequente de alimentos ultraprocessados (AUP), inatividade física no lazer e comportamento sedentário (CS).\n.\n📈 Os resultados do presente estudo indicam que os transtornos mentais são altamente frequentes entre os estudantes. A combinação mais prevalente de comportamentos obesogênicos foi o consumo frequente de AUP, inatividade física no lazer e CS. Verificou-se que quanto maior o número de comportamentos obesogênicos simultâneos, maior a chance de os estudantes apresentarem sintomas de ansiedade e de depressão.\n.\n👉🏻 Arraste para o lado e confira!\n.\n🗣 Continue nos acompanhando para saber mais sobre os trabalhos desenvolvidos pelo nosso!"
