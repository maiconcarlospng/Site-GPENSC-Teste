  - data: "2022-08-11"
    categoria: "Pesquisa"
    titulo: "Artigo: Food insecurity and symptoms of anxiety and depression disorder during the covid-19 pandemic: COVID-Inconfidentes, a population-based survey"
    resumo: "O GPENSC apresenta o artigo intitulado “Food insecurity and symptoms of anxiety and depression disorder during the covid-19 pandemic: COVID-Inconfidentes, a population-based survey”, de autoria da doutoranda Thaís Sabião (@thasabiao), juntamente com outros pesquisadores do GPENSC e da UFOP"
    conteudo: "O GPENSC apresenta o artigo intitulado “Food insecurity and symptoms of anxiety and depression disorder during the covid-19 pandemic: COVID-Inconfidentes, a population-based survey”, de autoria da doutoranda Thaís Sabião (@thasabiao), juntamente com outros pesquisadores do GPENSC e da UFOP.\n.\n🎯 O artigo, um dos produtos do doutorado da Thaís, teve como objetivo avaliar a associação entre a insegurança alimentar (IA) e sintomas de transtorno de ansiedade e depressão durante a pandemia da covid-19 e comparar as possíveis associações de fatores sociodemográficos.\n.\n🔎 Para avaliar os sintomas de ansiedade e depressão, foram utilizadas as escalas GAD-7 e PHQ-9, respectivamente. A IA foi avaliada por meio da Escala Brasileira de Insegurança Alimentar (EBIA).\n.\n📈 Observou-se associação linear positiva entre os níveis de IA e os desfechos de saúde mental, com IA grave apresentando prevalência 3,56 vezes maior de sintomas de ansiedade e prevalência 3,03 vezes maior de sintomas de depressão. Associações mais fortes foram observadas para indivíduos não brancos, sem filhos e com menor renda. Além disso, indivíduos em IA experimentaram mais emoções negativas. \n.\n💡 Os achados do estudo evidenciam a importância do aprimoramento das políticas públicas de saúde, proteção social para pessoas em IA e promoção da saúde mental.\n.\n🔗 Acesse o artigo: https://doi.org/10.1016/j.ssmph.2022.101156"
    url: "https://www.instagram.com/p/ChIhxPgOphS/"
    imagem: "img/instagram-acervo/ChIhxPgOphS.webp"
  - data: "2022-08-04"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: mestranda Mariana Cassemira Aparecida Vidigal"
    resumo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a mestranda Mariana Cassemira Aparecida Vidigal (@mariana.vidigal)"
    conteudo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a mestranda Mariana Cassemira Aparecida Vidigal (@mariana.vidigal).\n.\n👩🏻‍🎓 A Mariana é nutricionista graduada pela Universidade Federal de Ouro Preto (UFOP). Atualmente, é mestranda na mesma instituição, pelo Programa de Pós-Graduação em Saúde e Nutrição (PPGSN - @ppgsn.ufop), na linha de pesquisa Saúde e Nutrição em Indivíduos e Coletividades. É pesquisadora do \"Projeto sobre ansiedade e depressão em universitários\" (PADu - @padufederais).\n.\n👩🏻‍💻 Sua pesquisa de mestrado, intitulada \"Consumo de bebidas açucaradas e sua associação com sintomas de transtorno de ansiedade e depressão em estudantes universitários de Minas Gerais\", é orientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles).\n.\n🔎 Quer saber mais sobre o trabalho da Mariana? Continue nos acompanhando e fique por dentro deste e de outros estudos desenvolvidos pelo nosso grupo!"
