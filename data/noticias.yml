  - data: "2026-10-08"
    categoria: "Ensino"
    titulo: "Curso de análise espacial integra ações formativas do GPENSC"
    resumo: "O grupo divulgou curso de Análise Espacial Introdutória ministrado por Fernando Luiz Pereira de Oliveira em outubro de 2026."
    conteudo: "📚 Curso gratuito: Análise Espacial Introdutória 🧑‍🏫 Ministrante: Prof. Dr. Fernando Luiz Pereira de Oliveira do Departamento de Estatística da Universidade Federal de Ouro Preto (UFOP). Data/Horário/Carga horária (CH): 16, 23 e 30 de outubro de 2026 de 13:30 às 16:30 e mais 3 horas em atividades remotas (CH: 12 horas). 📍 Local: Laboratório de Informática do Departamento de Estatística – UFOP 📌 Sobre o curso: A proposta deste curso é introduzir alguns conceitos de Geoprocessamento e da Análise Espacial aplicados à saúde pública e à epidemiologia. Os participantes aprenderão a visualizar, modelar e analisar dados de saúde que possuem uma componente geográfica (como endereço de pacientes e taxas de determinadas doenças por município). Assim, espera-se que os participantes sejam capazes de converter mapas e modelagens estatísticas em ferramentas estratégicas de tomada de decisão. 📢 Este curso é ofertado no âmbito do Projeto de Extensão intitulado: “Capacitação em epidemiologia e análises de dados: uma atividade conduzida pelo Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva (GPENSC)” 🔔 Inscrições gratuitas pelo link: https://forms.gle/yijA7phoAdPD34Xi7 ⚠️ Vagas limitadas!"
    url: "https://www.instagram.com/p/DeP3KdYR31s/"
