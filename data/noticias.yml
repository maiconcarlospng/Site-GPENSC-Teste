    titulo: "Hoje, no #compartilhaGPENSC vamos falar sobre qualidade e distúrbios do sono, além de abordar alguns aspectos da importância do sono na vida dos indivíduos"
    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre qualidade e distúrbios do sono, além de abordar alguns aspectos da importância do sono na vida dos indivíduos"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre qualidade e distúrbios do sono, além de abordar alguns aspectos da importância do sono na vida dos indivíduos. O resumo foi elaborado pelo pós-doutorando Luiz Menezes (@luizmenezes__), que é um dos pesquisadores do grupo que estuda essa temática. \n.\n💤 Nos últimos anos, o interesse em estudar a temática sono vem crescendo entre os pesquisadores. O sono é um comportamento natural e essencial para nosso bem-estar físico, mental e emocional. Além de dormir uma quantidade razoável de horas durante a noite, é importante que as fases do sono sejam bem distribuídas e equilibradas, para que o indivíduo acorde se sentindo descansado e revigorado.\n.\n💭 Você sabia que o sono de má qualidade pode causar impactos negativos na nossa saúde? Conhece os principais problemas relacionados ao sono? Se não dormirmos de forma adequada, o que pode acontecer?\n.\n👉🏻 Arraste para o lado e confira mais sobre o tema.\n.\n🗣️ Gostou das nossas postagens? Não deixe de conferir essa e as outras postagens e compartilhar com os amigos!"
