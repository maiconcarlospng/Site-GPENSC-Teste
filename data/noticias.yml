  - data: "2025-09-24"
    categoria: "Pesquisa"
    titulo: "🧠 Você sabia? Substituir o tempo de comportamento sedentário por atividade física pode reduzir a chance de…"
    resumo: "🧠 Você sabia? Substituir o tempo de comportamento sedentário por atividade física pode reduzir a chance de sintomas de ansiedade e depressão! Um estudo conduzido…"
    conteudo: "🧠 Você sabia? Substituir o tempo de comportamento sedentário por atividade física pode reduzir a chance de sintomas de ansiedade e depressão! \n\nUm estudo conduzido por Bruna Carolina Rafael Barbosa (@brunabcrb) e pesquisadores do GPENSC e de mais sete universidades públicas de Minas Gerais avaliou os efeitos da substituição do tempo gasto em comportamento sedentário (CS) por atividade física de intensidade moderada (AFM) e intensidade vigorosa (AFV) sobre os sintomas de ansiedade e depressão entre estudantes universitários.\n\nPrincipais achados:\n▫️55% dos estudantes passam mais de 9h/dia em CS e cerca de 48% são fisicamente inativos.\n▫️Os estudantes que não aderiram as diretrizes de movimento tem mais chance de apresentar sintomas de ansiedade [OR: 1,89 (IC 95%: 1,67–2,14)] e depressão [OR: 2,49 (IC 95%: 2,19–2,82)]. \n▫️Modelos de substituição isotemporal mostraram que aumentar o tempo gasto em AFM e AFV e reduzir o tempo dedicado ao CS diminuiu as chances de os estudantes apresentarem sintomas de ansiedade e depressão, com efeito protetor mais pronunciado quanto maior a substituição dos comportamentos (p < 0,05).\n\nConclusão: \nOs comportamentos de movimento avaliados estão associados à presença de sintomas de ansiedade e depressão em adultos jovens. Aumentar os níveis de AF e reduzir o CS deve ser uma prioridade de saúde pública para melhorar a saúde mental e física dos estudantes. \n\n🔗 Link do artigo: https://doi.org/10.1186/s12889-025-23523-4\n\n👉🏻 Arrasta para o lado e confira.\n\n#saudemental #atividadefisica #comportamentosedentario #estudante #universidade #pesquisacientifica #saudecoletiva"
    url: "https://www.instagram.com/p/DPAFzNCkWD9/"
    imagem: "img/instagram-acervo/DPAFzNCkWD9.webp"
