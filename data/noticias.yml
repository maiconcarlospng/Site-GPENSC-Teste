    titulo: "Hoje, no #compartilhaGPENSC vamos falar sobre mapa falante ou mapeamento participativo"
    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre mapa falante ou mapeamento participativo"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre mapa falante ou mapeamento participativo. Afinal, você sabe o que é e qual o objetivo? \n.\n📚 Mapa falante é uma técnica utilizada para fazer uma leitura de um determinado fenômeno, situação ou território, a partir de características específicas e suas múltiplas dimensões. \n.\n📝 Na sua construção, os participantes visualizam o cenário que irão mapear e fazem uma representação coletiva de como percebem aquele território, considerando o espaço físico e as suas particularidades. Isso permite a compreensão, análise crítica da situação encontrada e o aprofundamento de questões para propor ações voltadas especificamente para o espaço analisado. \n.\n👉🏻 Arraste para o lado e confira mais sobre o tema.\n.\n🗣️ Gostou da postagem? Já tinha escutado falar sobre esse tema? Não deixe de conferir essa e as outras postagens e compartilhar com os amigos."
