  - data: "2024-11-26"
    categoria: "Pesquisa"
    titulo: "Artigo: Interaction between FokI polymorphism and vitamin D deficiency in the symptoms of mental disorders in adults: a population-based study"
    resumo: "O GPENSC apresenta o artigo intitulado “Interaction between FokI polymorphism and vitamin D deficiency in the symptoms of mental disorders in adults: a population-based study”, de autoria de Thaís Sabião (@thasabiao) em parceria com pesquisadores do GPENSC"
    conteudo: "O GPENSC apresenta o artigo intitulado “Interaction between FokI polymorphism and vitamin D deficiency in the symptoms of mental disorders in adults: a population-based study”, de autoria de Thaís Sabião (@thasabiao) em parceria com pesquisadores do GPENSC.\n.\n🎯 O artigo teve como objetivo avaliar a possível associação entre a deficiência de vitamina D e os sintomas de ansiedade e depressão m em adultos, considerando o polimorfismo FokI (rs2228570) do gene receptor de vitamina D.\n.\n✏️ Trata-se de um estudo transversal de base populacional, com amostragem estratificada e por conglomerados, envolvendo 1637 adultos. Os níveis de vitamina D, analisados por eletroquimioluminescência, foram considerados deficientes se <20 ng/mL em uma população saudável ou <30 ng/mL em grupos de risco. A genotipagem foi feita por PCR em tempo real utilizando sondas TaqMan.\n.\n📊 Os resultados mostraram que a prevalência de sintomas de ansiedade foi de 23,5%, de sintomas de depressão foi de 15,8% e de deficiência de vitamina D foi de 30,9%. Embora não tenha sido observada uma associação direta entre a deficiência de vitamina D e os sintomas de ansiedade ou depressão, a análise de interação revelou um efeito combinado entre a deficiência de vitamina D e o polimorfismo FokI nos sintomas de depressão, mas não nos sintomas de ansiedade. Indivíduos com deficiência de vitamina D e uma ou duas cópias do alelo alterado de FokI apresentaram maior prevalência de sintomas de depressão do que aqueles com o alelo selvagem e níveis adequados de vitamina D.\n.\n💡Os achados destacam a importância de considerar a interação entre fatores bioquímicos e genéticos nos sintomas de depressão. \n.\n📚 Acesse o artigo completo aqui: https://pubmed.ncbi.nlm.nih.gov/38519539/"
