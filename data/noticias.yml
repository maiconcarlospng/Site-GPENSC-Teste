  - data: "2023-04-13"
    categoria: "Institucional"
    titulo: "O GPENSC relembra a defesa de mestrado da Michelle Izabel Ferreira Mendes, que ocorreu no dia 14 de março de 2023, via Google Meet"
    resumo: "O GPENSC relembra defesa de mestrado da Michelle Izabel Ferreira Mendes (@michellef80mendes), que ocorreu no dia 14 de março de 2023, via Google Meet"
    conteudo: "O GPENSC relembra defesa de mestrado da Michelle Izabel Ferreira Mendes (@michellef80mendes), que ocorreu no dia 14 de março de 2023, via Google Meet.\n.\n📕 A dissertação da Michelle, intitulada \" Consumo de carne vermelha e processada e a incidência de hipertensão arterial: ELSA-Brasil coorte\", teve como objetivo investigar a associação entre o consumo de carne vermelha e processada e a ocorrência de novos casos de hipertensão arterial (HA) em participantes do Estudo Longitudinal de Saúde do Adulto (ELSA-Brasil).\n.\n👥 Seu estudo foi orientado pela professora Dra. Maria del Carmen Bisi Molina - @mdcarmen.molina (UFES) e coorientado pela professora Dra. Raquel de Deus Mendonça - @raquelmendonca_enut (UFOP) e Dra. Taísa Sabrina Silva Pereira - taisa.sabrina (Universidad de las Américas Puebla).\n.\n📊 Os resultados da dissertação da Michelle demonstram que após 3,9 anos de seguimento, identificou-se 1.186 novos casos de HA. Além disso, os resultados indicam que o consumo de carne vermelha não apresentou impacto negativo na saúde dos participantes. Todavia, foi visto que o consumo elevado de carne processada aumentou o risco de desenvolvimento de HA em 1,3 vezes.\n.\n🎉 Parabenizamos a Michelle pela sua defesa de mestrado e pela contribuição para a ciência do país!"
    url: "https://www.instagram.com/p/Cq_j4vyuzoW/"
    imagem: "img/instagram-acervo/Cq_j4vyuzoW.webp"
