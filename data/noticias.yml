    titulo: "Estamos selecionando dois alunos de Iniciação Científica para Projetos do Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva (GPENSC), coordenados pela Profa"
    resumo: "Estamos selecionando dois alunos de Iniciação Científica para Projetos do Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva (GPENSC), coordenados pela Profa"
    conteudo: "Estamos selecionando dois alunos de Iniciação Científica para Projetos do Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva (GPENSC), coordenados pela Profa. Dra. Adriana Lúcia Meireles (@dri_meireles).\n.\n▪️ Quem pode participar?\nAlunos do curso de Nutrição da UFOP a partir do quarto período e que tenham coeficiente maior que 6,0.\n.\n▪️ Como realizar a inscrição?\nPara realizar a inscrição, entre em contato pelo e-mail: gpensc.ppgsn@aluno.ufop.edu.br\n.\n▪️ Qual o prazo máximo das inscrições?\nAté dia 27/08/2021.\n. \n👉 Arraste para o lado e confira mais informações a respeito dessa seleção.\n.\n🗣 Não perca essa chance, venha fazer pesquisa com a gente!"
