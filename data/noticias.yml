    titulo: "Em Discussão"
    resumo: "Nessa semana, a professora Dra"
    conteudo: "Nessa semana, a professora Dra. Adriana Lúcia Meireles (@dri_meireles), coordenadora do Projeto sobre Ansiedade e Depressão em Universitários - PADu (@padufederais), concedeu uma entrevista para o “Em Discussão”, da UFOP (@minhaufop), sobre alimentação e saúde mental.\n.\n🎙️ Na reportagem, a professora Dra. Adriana falou sobre:\n▪️ O que é o PADu \n▪️ A associação entre hábitos alimentares e saúde mental\n▪️ Resultados preliminares do PADu-COVID, mostrando o impacto da pandemia sobre a alimentação e saúde mental dos estudantes e servidores da UFOP\n▪️ Dicas de hábitos para que os estudantes e servidores possam manter a saúde mental durante a pandemia.\n.\n🔗 Para acessar a entrevista na íntegra, acesse o link disponível na nossa bio. Não deixe de conferir, pois está imperdível!"
