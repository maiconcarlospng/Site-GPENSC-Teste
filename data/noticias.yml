    titulo: "The mediating role of sun exposure on the association between sedentary behavior and sleep quality: A population-based crosssectional study"
    resumo: "O GPENSC apresenta o artigo, em formato de carta ao editor, intitulado “The mediating role of sun exposure on the association between sedentary behavior and sleep quality: A population-based crosssectional study”, de autoria do pós-doutorando Luiz Menezes (@luizmenezes__) juntamente com outros pesquisadores da…"
    conteudo: "O GPENSC apresenta o artigo, em formato de carta ao editor, intitulado “The mediating role of sun exposure on the association between sedentary behavior and sleep quality: A population-based crosssectional study”, de autoria do pós-doutorando Luiz Menezes (@luizmenezes__) juntamente com outros pesquisadores da UFOP e UFMT.\n.\n💭 Vocês sabiam que ficar muito tempo sentado ou deitado pode prejudicar a qualidade do sono? E que não expor ao sol durante o dia também pode afetar o sono à noite? Essas são algumas das conclusões que o Luiz encontrou em seu estudo realizado com dados pesquisa COVID-Inconfidentes conduzido durante a pandemia de covid-19.\n.\n📈 Observou-se que indivíduos que passavam mais de 9 horas por dia sentadas ou deitadas, ou seja, em comportamento sedentário, tinham mais chances de ter um sono ruim quando comparados com aqueles que passavam menos, e que, parte deste efeito era mediado pela exposição solar. Isto é, indivíduos que ficavam mais tempo parados se expunham menos ao sol, e isso fazia com que eles dormissem pior. \n.\n☀️ Isso acontece porque o sol é o principal regulador do ritmo biológico, que é o ciclo de 24 horas que controla várias funções do nosso corpo, como o sono. Quando o indivíduo recebe luz solar durante o dia, o cérebro entende que é hora de ficar acordado e ativo. Quando a luz diminui à noite, o cérebro entende que é hora de dormir e relaxar. Mas se o indivíduo fica muito tempo sem ver a luz do sol, ou se fica exposto à luz artificial à noite, o ritmo biológico pode se desajustar e atrapalhar o sono.\n.\n💡 Os achados do estudo do Luiz demonstram que os indivíduos devem se preocupar em manter um equilíbrio entre a atividade física e o repouso, e entre a exposição ao sol e à escuridão. Essas são estratégias simples, mas eficazes, para melhorar a qualidade do sono e da saúde.\n.\n🔗 Acesse o artigo: https://doi.org/10.1016/j.sleep.2023.05.024"
    url: "https://www.instagram.com/p/CwQ0JRauCxP/"
    imagem: "img/instagram-acervo/CwQ0JRauCxP.webp"
