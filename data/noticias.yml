    titulo: "🌍✨ Internacionalização, ciência e sustentabilidade caminhando juntas!"
    resumo: "🌍✨ Internacionalização, ciência e sustentabilidade caminhando juntas! ✨🌱 O GPENSC tem a honra de receber a Drª. Ujué Fresán (@ujuefresan), pesquisadora do programa Sustainability in…"
    conteudo: "🌍✨ Internacionalização, ciência e sustentabilidade caminhando juntas! ✨🌱\n\nO GPENSC tem a honra de receber a Drª. Ujué Fresán (@ujuefresan), pesquisadora do programa Sustainability in Biosystems do Institute of Research and Technology in Agro-Food - IRTA, Barcelona, Espanha (@irtacat) 🇪🇸\n\nCom ampla experiência em sustentabilidade alimentar e impacto ambiental dos sistemas alimentares, a pesquisadora Ujué Fresán vem contribuindo internacionalmente para o avanço de pesquisas sobre dietas sustentáveis, políticas públicas e alimentação saudável 🌿🍎📚\n\n🤝 Esta visita representa um importante passo para o fortalecimento de parcerias científicas internacionais e construção de soluções inovadoras para sistemas alimentares mais sustentáveis.\n\nEN: 🎯 Main goals of this scientific exchange:\n\nStrengthen internationalization and scientific exchange in sustainable food systems; develop high-impact joint scientific publications; enhance student training through academic activities; and foster innovative approaches with potential impact on public policies and sustainable diets.\n\nES: 🎯 Principales objetivos de este intercambio científico:\nFortalecer la internacionalización y el intercambio científico en sistemas alimentarios sostenibles; desarrollar producción científica conjunta de alto impacto; cualificar la formación de estudiantes mediante actividades académicas; y estimular enfoques innovadores con potencial impacto en políticas públicas y alimentación sostenible.\n\n🌎💡 Ciência sem fronteiras para transformar os sistemas alimentares do futuro!\n\n#SustainableFoodSystems #SustainableDiets #FoodSustainability #InternationalCollaboration #PesquisaCientífica AlimentaçãoSustentável FoodSystems PublicHealth Science NutritionResearch"
