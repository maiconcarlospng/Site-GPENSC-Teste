    conteudo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a mestranda Sarah Beatriz Resende Tinoco (@sarahrtinoco).\n.\n🎓 A Sarah é graduada em Educação Física pela Faculdade Santa Rita – FASAR (2017). Atualmente, é aluna de mestrado do Programa de Pós-Graduação em Saúde e Nutrição da UFOP (PPGSN/UFOP), na linha de pesquisa Saúde e Nutrição em Indivíduos e Coletividades.\n.\n📚 Seu projeto de mestrado tem como título “Inatividade física e comportamento sedentário como fatores de risco do ganho de peso entre egressos das universidades mineiras (Projeto CUME)” e tem a orientação da professora Adriana Lúcia Meireles (@dri_meireles).\n.\n🔎 Quer saber mais sobre o projeto da Sarah e de outros trabalhos desenvolvidos pelo nosso grupo? Continue nos acompanhando."
