    titulo: "Consumo de alimentos segundo classificação nova e prevalência de insônia em egressos de universidades mineiras: Coorte CUME"
    resumo: "O GPENSC relembra de três qualificações de mestrado que ocorreram em março de 2023"
    conteudo: "O GPENSC relembra de três qualificações de mestrado que ocorreram em março de 2023.\n.\n🗓️ No dia 15 de março, de forma online, aconteceu a qualificação de mestrado do aluno Felipe Reis Stravaux (@felipebauson).\n.\n🔎 O projeto de mestrado do Felipe, intitulado “Consumo de alimentos segundo classificação nova e prevalência de insônia em egressos de universidades mineiras: Coorte CUME”, é orientado pela professora Dra. Raquel de Deus Mendonça - @raquelmendonca_enut (UFOP) e coorientado pela professora Dra. Renata Adrielle Lima Vieira - @renataadriellenutri (UFOP). Sua banca de qualificação contou com a colaboração do professor Dr. Adriano Marçal Pimenta - @adrianompimenta (UFPR) e da professora Dra. Adriana Lúcia Meireles – @dri_meireles (UFOP).\n.\n🗓️ No dia 27 de março, de forma presencial, ocorreu a qualificação da mestranda Wanessa Cecília de Oliveira (@_wanessa.o).\n.\n🔎 O projeto de mestrado da Wanessa, intitulado “Consumo alimentar segundo o propósito e a extensão do processamento durante a pandemia da Covid-19, em crianças de cinco a dez anos em Ouro Preto, MG”, é orientado pela professora Dra. Adriana Lúcia Meireles – @dri_meireles. Sua banca de qualificação contou com as contribuições da professora Dra. Mayla Cardoso - @maylanut (UFOP) e do Dr. Luiz Antônio Menezes - @luizmenezes__ (UFOP).\n\n🗓️ No dia 28 de março, de forma híbrida, ocorreu a qualificação da mestranda Mariana Vidigal (@mariana.vidigal).\n.\n🔎 O projeto de mestrado da Mariana, intitulado “Consumo de bebidas açucaradas e sintomas de transtorno de ansiedade, depressão e estresse entre estudantes universitários de Minas Gerais: PADu-Multicêntrico”, é orientado pela professora Dra. Adriana Lúcia Meireles. Sua banca de qualificação contou com as contribuições da professora Dra. Daniela Canella - @dani_canella (UERJ) e do Dr. Luiz Antônio Menezes.\n.\n🎇 Parabenizamos o Felipe, a Wanessa e a Mariana pela aprovação em suas qualificações e pela contribuição na ciência do país. Desejamos sucesso nas próximas etapas!"
