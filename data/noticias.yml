    titulo: "Adesão à intervenção nutricional individual entre usuários com Hipertensão Arterial Sistêmica na Atenção Primária à Saúde de Ouro Preto, Minas Gerais"
    resumo: "O GPENSC apresenta as alunas de Iniciação Científica (IC) que estão colaborando no Projeto HipertenSUS e que são membros do GPENSC"
    conteudo: "O GPENSC apresenta as alunas de Iniciação Científica (IC) que estão colaborando no Projeto HipertenSUS e que são membros do GPENSC.\n.\n👩🏻‍🎓 A Bruna Barbosa Furtado (@brufurtado_) é aluna do quinto período de Nutrição da Universidade Federal de Ouro Preto (UFOP). Seu tema de pesquisa da IC é intitulado \"Adesão à intervenção nutricional individual entre usuários com Hipertensão Arterial Sistêmica na Atenção Primária à Saúde de Ouro Preto, Minas Gerais\", sob orientação da professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut) e coorientação da pós-doutoranda Anabele Pires Santos (@piresanabele).\n.\n 👩🏻‍🎓 A Gabriela da Silva Machado (@gabsmachados) é aluna do sexto período de Nutrição da UFOP. Seu tema de pesquisa é intitulado \"Consumo de doces e bebidas açucaradas em hipertensos de Ouro Preto-MG\". É orientada pela professora Dra. Renata Adrielle Lima (@renataadriellenutri) e coorientada pela professora Dra. Silvana Mara Luz Turbino (@silluzturbino).\n.\n👩🏼‍🎓 A Laura Nunes Faria (@laura.nunesfaria) é aluna do sexto período do curso de Nutrição da UFOP. Seu tema de IC é intitulado “Adesão a estilos de vida saudáveis entre usuários com Hipertensão Arterial Sistêmica na Atenção Primária à Saúde de Ouro Preto”, sob orientação da professora Dra. Raquel de Deus Mendonça.\n.\n👩🏻‍🎓 A Marília de Lima Alvares (@mariliadelimaalvares) é aluna do quinto período de Nutrição da UFOP. Seu tema de pesquisa é \"Qualidade da dieta dos hipertensos da Atenção Primária à Saúde de Ouro Preto\". É orientada pela professora Dra. Renata Adrielle Lima Vieira. \n. \n🗣 Continue nos acompanhando para saber mais sobre o nosso grupo e os projetos que estamos desenvolvendo!"
