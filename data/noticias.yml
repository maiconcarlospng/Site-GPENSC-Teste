  - data: "2024-10-24"
    categoria: "Pesquisa"
    titulo: "Hoje, no #compartilhaGPENSC vamos falar sobre as atualizações das diretrizes sobre o uso e relato de raça e etnia"
    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre as atualizações das diretrizes sobre o uso e relato de raça e etnia"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre as atualizações das diretrizes sobre o uso e relato de raça e etnia. Afinal, por que o uso correto desses termos é importante na ciência?\n.\n📚 Os periódicos da rede JAMA (Journal of the American Medical Association) publicaram atualizações essenciais nas diretrizes para o uso e relato de raça e etnia em publicações científicas das áreas médicas e de saúde. \n.\n🎯 O objetivo ? Promover justiça, equidade e consistência, garantindo que a linguagem seja inclusiva, respeitosa e precisa. \n.\n💡Sabemos que raça e etnia são construções sociais complexas, e a maneira como abordamos essas questões na ciência tem um impacto direto na qualidade e integridade das pesquisas, além de implicações para a saúde da população. Essa nova orientação oferece sugestões valiosas para evitar o uso de termos preconceituosos e racistas, fortalecer a diversidade na comunidade acadêmica e favorecer a comparabilidade entre os estudos.\n.\n👉🏼 Arraste para o lado e confira mais sobre o tema!\n.\n🔗 Para ler o artigo na íntegra: Flanagin A, Frey T, Christiansen SL, AMA Manual of Style Committee. Updated Guidance on the Reporting of Race and Ethnicity in Medical and Science Journals. JAMA. 2021;326(7):621–627. doi:10.1001/jama.2021.13304\n.\n🗣️ Gostou do post de hoje? Aproveite para salvar e compartilhar com quem precisa de ver esse post!"
    url: "https://www.instagram.com/p/DBha0s-PqOu/"
    imagem: "img/instagram-acervo/DBha0s-PqOu.webp"
  - data: "2024-10-15"
