    categoria: "Institucional"
    titulo: "Consumo alimentar segundo extensão e propósito de processamento e suas interfaces com a saúde humana durante a pandemia da covid-19: estudo covid inconfidentes"
    resumo: "O GPENSC relembra qualificação de doutorado da aluna Hillary Nascimento Coletro (@hillarycoletro), que ocorreu no dia 02 de setembro de 2022, via Google Meet"
    conteudo: "O GPENSC relembra qualificação de doutorado da aluna Hillary Nascimento Coletro (@hillarycoletro), que ocorreu no dia 02 de setembro de 2022, via Google Meet.\n.\n🔎 O projeto de doutorado da Hillary, intitulado “Consumo alimentar segundo extensão e propósito de processamento e suas interfaces com a saúde humana durante a pandemia da covid-19: estudo covid inconfidentes” tem como objetivo avaliar a associação entre o consumo alimentar segundo extensão e propósito de processamento em desfechos relacionados à saúde humana, em adultos brasileiros, durante a pandemia da covid-19.\n.\n👥 Seu estudo é orientado pela professora Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes). O trabalho contou com as contribuições da banca composta pelas professoras Dras. Patrícia Freitas (UFOP), Ísis Eloah - @isiseloah (UFOP), Maria del Carmen - mdcarmenmolina (UFES/UFOP), e Raquel Mendonça - @raquelmendonça_enut (UFOP). \n.\n📊 Os resultados preliminares evidenciam que o maior consumo semanal de alimentos in natura/minimamente processados está associado a uma menor prevalência de sintomas de depressão, assim como o maior consumo semanal de alimentos ultraprocessados está associado a uma maior prevalência de sintomas de ansiedade e depressão. \n.\n📈 Além disso, a presença de comportamentos de risco à saúde (alto consumo de alimentos ultraprocessados, o consumo não diário de frutas e hortaliças e o comportamento sedentário) também estão associados a uma maior razão de prevalência de sintomas de ansiedade ou depressão. Por fim, observou-se que o maior consumo semanal de alimentos ultraprocessados está associado a uma razão de prevalência 60% maior para a insegurança alimentar.\n.\n🎇 Parabenizamos a Hillary pela aprovação na sua qualificação e pela contribuição na ciência do país. Desejamos à aluna sucesso nas próximas etapas!"
