    titulo: "Em 2015, a Assembleia das Nações Unidas instituiu 11 de fevereiro como o Dia Internacional das Mulheres e Meninas na Ciência, motivada pela necessidade de refletir sobre a…"
    resumo: "Em 2015, a Assembleia das Nações Unidas instituiu 11 de fevereiro como o Dia Internacional das Mulheres e Meninas na Ciência, motivada pela necessidade de refletir sobre a participação e visibilidade do papel das mulheres na pesquisa, além da construção de políticas de incentivo e combate à desigualdade de gênero"
    conteudo: "Em 2015, a Assembleia das Nações Unidas instituiu 11 de fevereiro como o Dia Internacional das Mulheres e Meninas na Ciência, motivada pela necessidade de refletir sobre a participação e visibilidade do papel das mulheres na pesquisa, além da construção de políticas de incentivo e combate à desigualdade de gênero.\n.\n👩🏻‍🔬 Nesta data, celebramos a atuação e o legado de mulheres e meninas que contribuíram e que contribuem com a ciência no mundo, mas é também uma oportunidade para reforçarmos que avanços ainda se fazem necessários quanto a participação feminina em diversas áreas.\n.\n💌 Fica a nossa homenagem à todas as mulheres e meninas que se dedicam com amor, ética e respeito à ciência e às que são incansáveis na busca pelo conhecimento. Não podemos deixar de fazer uma menção especial às líderes do nosso grupo, as professoras (@dri_meireles, @julia_carraro, @maricarvalhomenezes e @raquelmendonca_enut) por serem fonte de inspiração e à todas as membras por serem a representação de um ambiente institucional cada vez mais diverso e plural.\n.\nCom carinho, GPENSC ❤️"
