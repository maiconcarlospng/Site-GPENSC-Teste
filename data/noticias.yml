  - data: "2022-05-19"
    categoria: "Extensão"
    titulo: "HipertenSUS realiza atividades com unidades de saúde de Ouro Preto"
    resumo: "O projeto HipertenSUS divulgou ações junto às Unidades Básicas de Saúde de Ouro Preto em maio de 2022."
    conteudo: "Olá, pessoal! Hoje é dia de #tbt no GPENSC! 🔙😍 . 🗓 Nosso #tbt é muito especial, para relembrar da ação do projeto HipertenSUS realizada nas Unidades Básicas de Saúde (UBS) para a população do município de Ouro Preto, que aconteceu entre os dias 02 e 06 de maio de 2022. ❤️ A equipe do HipertenSUS, em parceria com a Secretaria Municipal de Saúde de Ouro Preto (@prefeituraouropreto), realizou salas de esperas em UBS do município (São Cristóvão, Bauxita, Saramenha, Antônio Dias, Morro Santana e Piedade) e uma Cozinha Experimental no Laboratório de Técnica Dietética da Escola de Nutrição (ENUT - @enutufop) da UFOP. 👉🏻 Arraste para o lado e confira algumas fotos dessa ação. ✨ Queremos agradecer ao empenho da equipe HipertenSUS para realizar essa ação. Vocês são essenciais e têm conduzido essa pesquisa de forma brilhante, com muita dedicação e profissionalismo. ❣️ Também queremos deixar registrado um agradecimento especial para todos os moradores que estavam presentes no evento e para todos os participantes do projeto. O HipertenSUS só é possível por causa de vocês. Obrigada por contribuírem com a nossa pesquisa e com o avanço da ciência no país! . 🗣 Continuem nos acompanhando para saber mais sobre esse e outros projetos desenvolvidos pelo nosso grupo."
    url: "https://www.instagram.com/p/CdwR05fOMxr/"
    imagem: "img/instagram/CdwR05fOMxr.webp"

  - data: "2022-04-26"
    categoria: "Pesquisa"
    titulo: "Jornal regional destaca o projeto HipertenSUS"
    resumo: "A publicação do GPENSC registrou reportagem do Jornal Mundo dos Inconfidentes sobre o trabalho do HipertenSUS."
    conteudo: "Olá, pessoal! . 📰 Neste mês de abril, o Jornal Mundo dos Inconfidentes (@jornalmundodosinconfidentes) publicou uma reportagem sobre o projeto HipertenSUS, que é realizado pela @enut_ufop, em parceria com a @prefeituraouropreto. O HipertenSUS faz o acompanhamento nutricional de pessoas com hipertensão arterial sistêmica (HAS) assistidas pela Atenção Primária à Saúde no município de Ouro Preto. 🗒 A reportagem destaca o objetivo do estudo, que consiste em avaliar a efetividade da intervenção nutricional pautada em entrevista motivacional e no Guia Alimentar para a População Brasileira para o controle da HAS. Seus resultados contribuirão para a avaliação e planejamento de políticas em alimentação e nutrição. 📃 O texto também traz informações sobre quando o projeto começou, sua duração, quem são os componentes da equipe do HipertenSUS e quais são as Unidas Básicas de Saúde onde as atividades estão acontecendo. Vale muito a pena a leitura! . 🔗 Para acessar a reportagem na íntegra, acesse o link disponível na nossa bio."
    url: "https://www.instagram.com/p/Cc0--muO7yM/"
    imagem: "img/instagram/Cc0--muO7yM.jpg"

  - data: "2022-03-03"
    categoria: "Pesquisa"
    titulo: "Conheça o projeto HipertenSUS na Atenção Primária"
    resumo: "O GPENSC apresentou o estudo HipertenSUS, que avalia intervenção nutricional para o controle da hipertensão arterial em usuários da Atenção Primária à Saúde."
    conteudo: "Olá, pessoal! . Hoje, vamos apresentar para vocês o projeto “Efetividade de intervenção nutricional para controle da Hipertensão Arterial Sistêmica na Atenção Primária à Saúde (HipertenSUS)”. ❤️ O HipertenSUS é um estudo realizado pela Escola de Nutrição - ENUT (@enut_ufop) da Universidade Federal de Ouro Preto (@minhaufop) em parceria com a Secretaria Municipal de Saúde de Ouro Preto (@prefeituraouropreto). 👥 A equipe do HipertenSUS é formada por professoras da ENUT, pós-doutoranda, doutorandas, mestrandas e estudantes de iniciação científica e voluntários. 🎯 Tem como objetivo avaliar a efetividade de intervenção nutricional pautada em entrevista motivacional e no Guia Alimentar para a População Brasileira para o controle da Hipertensão Arterial Sistêmica (HAS) e redução do consumo de alimentos ultraprocessados em usuários da Atenção Primária à Saúde. 📋 Em novembro de 2021, a pesquisa realizou diagnóstico situacional sobre a percepção da população em relação ao sistema alimentar de Ouro Preto. A próxima atividade consiste em acompanhar usuários do sistema de saúde com diagnóstico de HAS por 6 meses, por meio de atendimento individual nas Unidades Básicas de Saúde do município. 💡 Os resultados desta pesquisa contribuirão para avaliação e planejamento das políticas de alimentação e nutrição. 💌 Em caso de dúvidas, entre em contato pelo e-mail: projetohipertensus.enut@ufop.edu.br . 🎥 Para saber mais sobre o HipertenSUS, continue nos acompanhando por aqui e pelo Youtube: https://www.youtube.com/channel/UCa8eXLK5z0B3-wAKVJ11GjA"
    url: "https://www.instagram.com/p/CaqBcL7OPII/"
    imagem: "img/instagram/CaqBcL7OPII.jpg"

  - data: "2022-03-02"
    categoria: "Institucional"
    titulo: "GPENSC compartilha conquistas em eventos científicos"
    resumo: "O grupo apresentou registro de premiações e reconhecimentos recebidos em eventos científicos durante 2021."
    conteudo: "Olá, pessoal! . Como vocês têm acompanhado, o GPENSC participou de vários eventos locais, nacionais e internacionais no ano passado. O ano de 2021 foi cheio de conquistas para o nosso grupo. Hoje, em especial, vamos apresentar algumas #PremiaçõesGPENSC dos eventos de 2021. 🏅 Parabenizamos as doutorandas Priscila Pena Camargo (@priscilapenacamargo) e Irene Carolina Sousa Justiniano (@irenecsj_) por terem seus trabalhos escolhidos como sendo os melhores na área de Saúde Coletiva no V Congresso Nacional de Alimentos e Nutrição (CONAN - @conan_enut), em 2021. 🏅 Parabenizamos a mestranda Joice Silva Vieira Leal (@joicesvleal) pelo trabalho apresentado no Encontro de Saberes 2021, da Universidade Federal de Ouro Preto. Seu trabalho foi destaque por ser o melhor na área de Ciências da Vida, na VI Mostra dos Programas de Pós-Graduação (MPPG - @proppi_ufop). ✨ Também parabenizamos as demais autoras desses trabalhos pela colaboração, orientações e por todo empenho dedicado à pesquisa. 👉🏽 Arraste para o lado e confira os detalhes sobre os nossos trabalhos premiados."
    url: "https://www.instagram.com/p/Cani4U7OcRI/"
    imagem: "img/instagram/Cani4U7OcRI.jpg"

