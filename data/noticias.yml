  - data: "2022-04-21"
    categoria: "Institucional"
    titulo: "O GPENSC relembra a defesa de mestrado da aluna Larissa Fernanda Fonseca Guedes, que aconteceu no dia 04 de março de 2022"
    resumo: "O GPENSC relembra defesa de mestrado da aluna Larissa Fernanda Fonseca Guedes (@larissaguedesnutri), que aconteceu no dia 04 de março de 2022"
    conteudo: "O GPENSC relembra defesa de mestrado da aluna Larissa Fernanda Fonseca Guedes (@larissaguedesnutri), que aconteceu no dia 04 de março de 2022. \n.\n🔎 A dissertação da Larissa, intitulada “Impactos financeiros e à saúde da população brasileira devidos ao consumo excessivo de sódio”, teve como objetivo estimar a carga de doenças crônicas não transmissíveis (DCNT) relacionada ao consumo excessivo de sódio na população adulta brasileira e os custos financeiros diretos decorrentes desse fator de risco para o Sistema Único de Saúde (SUS) no Brasil e nas 27 Unidades Federativas em 2019.\n.\n👥 O trabalho foi orientado pela professora Dra. Ísis Eloah Machado (@isiseloah) e contou com as contribuições da banca formada pela professora Dra. Mariana Santos Felisbino-Mendes (@nana.sfm), da UFMG, e pelo professor Dr. George Luiz Lins Machado Coelho (@georgellinsmachado), da UFOP. \n.\n📊 Os resultados da dissertação da Larissa mostraram que se o consumo médio de sódio pela população brasileira fosse reduzido para 3g/dia no passado (conforme preconizado pelo estudo Global Burden of Disease - GBD), em 2019, 30.814 mortes e 699.119 anos de vida perdidos ajustados pela incapacidade (DALYs) relacionados às DCNT poderiam ter sido evitados. Além disso, cerca de R$ 225,45 milhões em internações e procedimentos de média e alta complexidades poderiam ser economizados pelo SUS.\n.\n📈 Ao utilizar taxas padronizadas para a idade, a carga de DCNT foi maior nos estados do Nordeste, o que revela as disparidades regionais em função dos determinantes sociais e a necessidade de minimizar as iniquidades, fortalecendo a atenção primária para consolidar ações de educação em saúde e engajamento desse grupo populacional. \n.\nParabenizamos a Larissa pela defesa de mestrado e pela contribuição na ciência do país. Queremos também parabenizá-la pela aprovação no doutorado no PPGSN/UFOP! Sucesso sempre! 👏🎉✨"
    url: "https://www.instagram.com/p/CcoKKdgO7m-/"
    imagem: "img/instagram-acervo/CcoKKdgO7m-.webp"
