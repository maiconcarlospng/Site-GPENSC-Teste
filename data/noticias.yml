    conteudo: "O GPENSC recomenda o episódio \"Publicar ou Perecer\", do podcast Ciência Suja (@cienciasuja).\n.\n📚 Esse episódio aborda os desafios de um sistema que privilegia a quantidade em detrimento da qualidade na produção científica, explorando questões relacionadas à pressão por publicações e ao impacto disso na qualidade da pesquisa.\n.\n👥 O episódio conta com a participação do sociólogo Luiz Augusto Campos, professor da Universidade do Estado do Rio de Janeiro (UERJ) e editor chefe da Revista Dados. \n.\n🔎 Esse e outros episódios do podcast “Ciência Suja” estão disponíveis no Spotify.\n.\n🗣️ Gostou da dica? Compartilha com os amigos e aproveita para salvar essa recomendação."
