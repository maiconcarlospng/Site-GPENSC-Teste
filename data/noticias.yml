  - data: "2021-10-19"
    categoria: "Pesquisa"
    titulo: "Na semana passada, apresentamos para vocês a pesquisa da pós-doutoranda Nara Nunes Lage"
    resumo: "Na semana passada, apresentamos para vocês a pesquisa da pós-doutoranda Nara Nunes Lage (@narinhalage)"
    conteudo: "Na semana passada, apresentamos para vocês a pesquisa da pós-doutoranda Nara Nunes Lage (@narinhalage). Mas qual a importância de avaliar a eficácia de diferentes testes sorológicos para investigar a prevalência da COVID-19?\n.\n🦠 Os testes sorológicos para detectar a presença de anticorpos para SARS-CoV-2, vírus causador da COVID-19, têm ganhado destaque como método alternativo ou complementar ao RT-PCR no diagnóstico da infecção, devido seu baixo custo e facilidade de implementação. \n.\n🎯 O objetivo desta revisão foi determinar a precisão diagnóstica e acurácia de três testes sorológicos (imunoensaios: ELISA - enzimático; LFIA - fluxo lateral; CLIA - quimioluminescência) comparado com o método diagnóstico RT-PCR, considerado padrão-ouro.\n.\n📝 O estudo avaliou 40 trabalhos publicados em 2020 e determinou a sensibilidade e a especificidade de testes, totalizando cerca de 29.842 testes averiguados.\n.\n🧪 O trabalho verificou que a precisão diagnóstica dos testes sorológicos para COVID-19 apresentou alto risco de viés, heterogeneidade e limitada generalização para testes pontuais e para populações ambulatoriais. Além disso, o estudo observou que os testes rápidos (LFIA) apresentaram uma menor sensibilidade que os testes ELISA e CLIA, uma vez que demonstraram ter uma ampla chance de resultados falso/negativos, pois 34% dos testes de pacientes que tinham sido diagnosticados com COVID-19 via RT-PCR, nessa metodologia deram negativo.\n.\n🧫 Com relação a avaliação dos riscos inerentes à realização dos testes dentro da janela imunológica, o estudo identificou que a sensibilidade foi menor nos testes realizados na primeira e na segunda semanas após o início dos sintomas quando comparado com os exames realizados a partir da terceira semana do aparecimento dos sintomas de COVID-19.\n.\n💡 Deve-se ter cautela ao utilizar exames sorológicos para detecção da COVID-19 durante a tomada de decisões clínicas e a vigilância epidemiológica e mais estudos clínicos são necessários para melhor avaliar a precisão diagnóstica dos testes sorológicos. \n.\n🗣️ Arraste para o lado e confira o resumo do artigo apresentado."
    url: "https://www.instagram.com/p/CVOYkyHPdeu/"
    imagem: "img/instagram-acervo/CVOYkyHPdeu.webp"
  - data: "2021-10-12"
    categoria: "Pesquisa"
    titulo: "O GPENSC recomenda o Instrutivo de Abordagem Coletiva para Manejo da Obesidade no SUS, lançado em setembro de 2021 pelo Ministério da Saúde"
    resumo: "O GPENSC recomenda o Instrutivo de Abordagem Coletiva para Manejo da Obesidade no SUS, lançado em setembro de 2021 pelo Ministério da Saúde"
    conteudo: "O GPENSC recomenda o Instrutivo de Abordagem Coletiva para Manejo da Obesidade no SUS, lançado em setembro de 2021 pelo Ministério da Saúde.\n. \n📚 Esse material foi uma colaboração entre a Coordenação Geral de Alimentação e Nutrição do Ministério da Saúde (CGAN) e a Universidade Federal de Minas Gerais (UFMG), especialmente, por pesquisadores do GIN/UFMG (@gin.ufmg). A elaboração deste material também contou com o apoio da pesquisadora e membro do GPENSC, professora Dra. Mariana Carvalho de Menezes.\n.\n📝 O Instrutivo foi planejado com o objetivo de apoiar a atuação das equipes e profissionais de saúde da Atenção Primária à Saúde (APS) no manejo da obesidade no SUS, com ênfase na abordagem coletiva, trazendo um conjunto de recomendações para qualificar a atuação dos gestores, das equipes e profissionais de saúde que atuam na APS para a atenção aos casos de obesidade.\n.\n🔗 O material na íntegra pode ser acessado na Biblioteca Virtual em Saúde, do Ministério da Saúde, ou pelo link disponível na nossa bio. \n.\n🗣 Não deixe de conferir e compartilhar com os amigos!"
