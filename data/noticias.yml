  - data: "2022-03-15"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: mestranda Michelle Izabel Ferreira Mendes"
    resumo: "Hoje, é dia de apresentar para vocês mais uma de nossas pesquisadoras, a mestranda Michelle Izabel Ferreira Mendes (@michellef80mendes)"
    conteudo: "Hoje, é dia de apresentar para vocês mais uma de nossas pesquisadoras, a mestranda Michelle Izabel Ferreira Mendes (@michellef80mendes).\n.\n👩🏻‍🎓 Michelle é enfermeira formada pela Universidade Federal de Juiz de Fora (UFJF) e especialista em Saúde da Família e Comunidades pela Universidade Federal de Minas Gerais (UFMG). Tem experiência como enfermeira no Programa de Saúde da Família (PSF) da Prefeitura Municipal de Ouro Preto. \n.\n👩🏻‍💻 Atualmente, é mestranda no Programa de Pós-Graduação em Saúde e Nutrição da Universidade Federal de Ouro Preto (PPGSN/UFOP), na linha de pesquisa de Saúde e Nutrição em Indivíduos e Coletividades. \n.\n👥 É pesquisadora do Estudo Longitudinal de Saúde do Adulto (ELSA-Brasil), um estudo multicêntrico de coorte que tem como propósito investigar a incidência de fatores de risco para doenças crônicas, em particular, as cardiovasculares e o diabetes. \n.\n🔎 Sua pesquisa de mestrado, intitulada “Consumo de carne vermelha e processada e risco de hipertensão arterial em participantes do ELSA-Brasil”, é orientada pela professora Dra. Maria del Carmen Bisi Molina (@mdcarmenmolina) e coorientada pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut). \n.\n🗣 Quer saber mais sobre o trabalho da Michelle e sobre outras pesquisas que estão sendo desenvolvidas pelo nosso grupo? Então, continue nos acompanhando."
