  - data: "2022-08-26"
    categoria: "Pesquisa"
    titulo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a professora Dra"
    resumo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a professora Dra"
    conteudo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a professora Dra. Renata Adrielle Lima Vieira (@renataadriellenutri).\n.\n👩🏼‍🎓 A professora Renata é graduada em Nutrição pela Universidade Federal do Maranhão (UFMA). Possui Mestrado em Saúde e Nutrição pelo Programa de Pós-Graduação em Saúde e Nutrição da Universidade Federal de Ouro Preto (PPGSN/UFOP), na linha de pesquisa Bioquímica e Fisiopatologia da Nutrição. Doutorado em Cirurgia pelo Programa de Pós-Graduação em Cirurgia da Universidade Federal de Pernambuco (PPGC/UFPE). Além disso, é especialista em Nutrição Clínica pelo Programa de Residência Uniprofissional do Hospital das Clínicas da UFPE e Especialista em Ciências Nutricionais e Longevidade. \n.\n👩🏼‍🏫 Atualmente, é Professora Adjunta de Nutrição Clínica do Departamento de Nutrição Clínica e Social da UFOP. Atua principalmente em projetos com os seguintes temas: obesidade, cirurgia bariátrica, hipertensão, dietoterapia, práticas integrativas e crononutrição.\n.\n🗣️ Continue nos acompanhando e fique por dentro dos trabalhos desenvolvidos pela professora Renata e pelo nosso grupo!"
