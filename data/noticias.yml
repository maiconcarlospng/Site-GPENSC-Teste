    titulo: "Atividade física e comportamento sedentário"
    resumo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC"
    conteudo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC.\n.\n📄 Neste resumo, vamos falar sobre “Atividade física e comportamento sedentário”, tema apresentado pela doutoranda Samara Silva de Moura (@mourasamara) e pela mestranda Sarah Beatriz Resende Tinoco (@sarahbeatrizrt), sob a orientação da professora Dra. Adriana Lúcia Meireles (@dri_meireles).\n.\n🏋🏻‍♀️ Na apresentação, as alunas abordaram sobre a diferença entre atividade física (AF) e exercício físico, as categorias da AF (no tempo livre, nas tarefas domésticas, no trabalho ou estudo e no deslocamento), a classificação da AF como leve, moderada e vigorosa a partir do MET (múltiplos de equivalentes metabólicos), as recomendações de AF segundo diretrizes nacionais e internacionais. Além disso, as alunas abordaram sobre comportamento sedentário.\n.\n👉🏽 Arraste para o lado e confira mais sobre esse tema.\n.\n🗣️ Continue nos acompanhando para saber mais sobre os trabalhos desenvolvidos pelo nosso grupo!"
