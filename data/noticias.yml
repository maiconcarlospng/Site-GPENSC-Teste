    titulo: "Projeto: Efetividade de intervenção nutricional para controle da Hipertensão Arterial Sistêmica na Atenção Primária à Saúde"
    resumo: "Neste mês de março, foi publicada uma reportagem no site da UFOP (@minhaufop) sobre o projeto “Efetividade de intervenção nutricional para controle da Hipertensão Arterial Sistêmica na Atenção Primária à Saúde” (HipertenSUS)"
    conteudo: "Neste mês de março, foi publicada uma reportagem no site da UFOP (@minhaufop) sobre o projeto “Efetividade de intervenção nutricional para controle da Hipertensão Arterial Sistêmica na Atenção Primária à Saúde” (HipertenSUS).\n.\n🗒 A reportagem destaca que o HipertenSUS foi selecionado como uma das experiências inovadoras na avaliação feita pelo Laboratório de Inovação em Alimentação e Nutrição na Atenção Primária à Saúde (LIS A&N na APS), que faz da Organização Pan-Americana da Saúde e Organização Mundial da Saúde (Opas/OMS) em parceria com a Coordenação Geral de Alimentação e Nutrição do Ministério da Saúde (CGAN/MS) e a Escola Nacional de Saúde Pública Sérgio Arouca da Fundação Oswaldo Cruz (Ensp/Fiocruz).\n.\n🔗 Quer saber mais detalhes? Acesse a reportagem na íntegra por meio do link disponível na nossa bio."
