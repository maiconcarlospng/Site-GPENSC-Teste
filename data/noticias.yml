  - data: "2020-12-10"
    categoria: "Institucional"
    titulo: "Projeto: Cartas para um estudante em tempos de recolhimento"
    resumo: "Hoje vamos falar para vocês um pouco mais sobre o projeto cartas desenvolvido entre os membros do GPENSC"
    conteudo: "Hoje vamos falar para vocês um pouco mais sobre o projeto cartas desenvolvido entre os membros do GPENSC.\n.\n💌 Pensando em criar meios de apoio e de aproximação entre os integrantes do GPENSC durante a pandemia, as professoras Adriana Meireles, Júlia Carraro, Mariana Menezes e Raquel Mendonça idealizaram o projeto “Cartas para um estudante em tempos de recolhimento”, onde os participantes trocaram cartas entre si nos meses de setembro, outubro e novembro.\n.\n❣️ Este projeto foi fonte de muita inspiração, acolhimento e permitiu criar novos laços, fortalecer os laços existentes, motivar a carreira profissional, a vida pessoal e compartilhar a trajetória acadêmica. Alguns participantes relataram não ter vivido, até então, a experiência de escrever e enviar por correio uma carta. Dentre os relatos, o mais comum foi a emoção da expectativa da chegada da carta e se os destinatários também tinham recebido. \n.\n🎞 Com certeza essa experiência fará parte da coleção de boas memórias do nosso grupo.\n\n👇🏽Se você, membro do GPENSC, que participou do projeto, deixe seu depoimento nos comentários e compartilhe seu sentimento sobre esse projeto especial."
    url: "https://www.instagram.com/p/CIn_uT1A5pT/"
    imagem: "img/instagram-acervo/CIn_uT1A5pT.webp"
