    resumo: "Estamos com inscrições abertas para o preenchimento de 3 vagas para bolsistas e 3 vagas para voluntários de Iniciação Científica em projetos do GPENSC"
    conteudo: "Estamos com inscrições abertas para o preenchimento de 3 vagas para bolsistas e 3 vagas para voluntários de Iniciação Científica em projetos do GPENSC.\n.\n🔸 Quem pode participar?\nEstudantes do curso de Nutrição da UFOP.\n.\n🔸 Quais os documentos necessários?\nHistórico escolar, carta de interesse e disponibilidade\n.\n🔸 Como realizar a inscrição?\nPara realizar a inscrição, entre em contato com as pesquisadoras responsáveis, pelos seguintes endereços de e-mail:\n• Profa. Dra. Adriana Meireles: \nadriana.meireles@ufop.edu.br\n• Profa. Dra. Mariana Menezes:\nmariana.menezes@ufop.edu.br\n• Profa. Dra. Raquel Mendonça:\nraquel.mendonca@ufop.edu.br\n.\n🔸 Qual o prazo máximo das inscrições?\nAté dia 05/02/2021.\n.\n🗣️ Não perca essa chance, venha fazer pesquisa com a gente!"
