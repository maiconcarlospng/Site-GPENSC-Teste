    resumo: "Hoje, vamos divulgar a VI edição do Congresso Nacional de Alimentos e Nutrição - CONAN (@conan_enut), realizado pela Escola de Nutrição da UFOP (@enut_ufop)"
    conteudo: "Hoje, vamos divulgar a VI edição do Congresso Nacional de Alimentos e Nutrição - CONAN (@conan_enut), realizado pela Escola de Nutrição da UFOP (@enut_ufop).\n.\n📚 O Congresso terá como tema central “Cidadania, Saúde e Sustentabilidade”, integrando os Objetivos de Desenvolvimento Sustentável (ODS) da ONU, o conhecimento científico produzido no Brasil e as ações de extensão junto às comunidades. Esse tema reflete a urgência de integrar aspectos sociais, ambientais e de saúde nessas áreas.\n.\n🎬 A programação será intensa e diversificada, incluindo palestras, cursos, oficinas, rodas de conversa, apresentações de trabalhos científicos e de atividades extensionistas. \n.\n🗓️ O CONAN acontecerá entre os dias 26 e 30 de maio de 2025, no Centro de Artes e Convenções da UFOP. \n.\n🔗 As inscrições já estão abertas. Para realizar sua inscrição, acesse o site: https://conan.ufop.br/inscricoes. \n.\n💻 Para mais informações e ficar por dentro de toda a programação siga página do evento no Instagram:\n@conan_enut. Não deixe de participar!"
