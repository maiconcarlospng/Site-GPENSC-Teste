  - data: "2021-06-18"
    categoria: "Institucional"
    titulo: "Na última semana, apresentamos para vocês a pesquisa da mestranda Sarah Tinoco"
    resumo: "Na última semana, apresentamos para vocês a pesquisa da mestranda Sarah Tinoco (@sarahrtinoco)"
    conteudo: "Na última semana, apresentamos para vocês a pesquisa da mestranda Sarah Tinoco (@sarahrtinoco). Mas qual a importância de investigar a inatividade física e o comportamento sedentário (CS)? \n.\n🎯 O objetivo deste estudo foi examinar a associação entre atividade física e tempo de CS e a mortalidade por todas as causas.\n.\n📌 O presente estudo realizou uma meta-análise incluindo nove estudos de coorte prospectivos de quatro países, sendo que 44.370 homens e mulheres foram acompanhados em um período entre 4 e 14,5 anos. As associações entre diferentes combinações de atividade física de intensidade moderada a vigorosa (AFMV) e tempo de CS foram analisadas usando a análise de regressão de riscos proporcionais de Cox e resumidas usando meta-análise de efeitos aleatórios.\n.\n📊 Os resultados demonstram que em todas as coortes, o tempo médio de CS variou de 8,5 horas/dia a 10,5 horas/dia e 8 min/dia a 35 min/dia para a AFMV. O risco de morte aumentou quando os níveis de AFMV eram menores e o tempo de CS maior.\n.\n🔎 O estudo conclui que o maior tempo de CS está associado à maior mortalidade em indivíduos menos ativos. Cerca de 30–40 minutos de AFMV por dia atenuam a associação entre o CS e o risco de morte.\n.\n👉 Arraste para o lado e confira o resumo do artigo apresentado e outros dois artigos relacionados a esse tema."
    url: "https://www.instagram.com/p/CQRmUQSg7Ey/"
    imagem: "img/instagram-acervo/CQRmUQSg7Ey.webp"
  - data: "2021-06-11"
