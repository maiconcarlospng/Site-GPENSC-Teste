    titulo: "Projeto: Vigilância epidemiológica da COVID-19 na região dos Inconfidentes"
    resumo: "Neste último final de semana, entre os dias 27 e 29 de novembro, a equipe do projeto “Vigilância epidemiológica da COVID-19 na região dos Inconfidentes” (COVID-Inconfidentes-UFOP) mais uma vez percorreu os bairros do município de Mariana"
    conteudo: "Neste último final de semana, entre os dias 27 e 29 de novembro, a equipe do projeto “Vigilância epidemiológica da COVID-19 na região dos Inconfidentes” (COVID-Inconfidentes-UFOP) mais uma vez percorreu os bairros do município de Mariana.\n.\n🏘 Esse foi nosso terceiro e último painel em Mariana. Gostaríamos de agradecer a todos vocês, moradores da cidade, que aceitaram participar do estudo e receberam nossa equipe nos seus domicílios. Somos gratos pela participação de cada um nessa luta contra a COVID-19!\n.\n✨ Também queremos deixar registrado o nosso muito obrigado à nossa equipe que, com muito profissionalismo e empenho, tem auxiliado nessa pesquisa. Vocês são essenciais!\n.\n👉 Arraste para o lado e confira as fotos do painel III realizado na cidade de Mariana no último final de semana.\n.\n🔎 Continue nos acompanhando para saber mais sobre esse e outros projetos.\n.\n⚠️ E moradores de Ouro Preto, ainda temos mais um painel para realizar no município! Contamos com a participação de vocês para fecharmos o último painel de Ouro Preto.\n.\n📩 Qualquer dúvida, entre em contato pelo e-mail: covid.inconfidentes.ppgsn@ufop.edu.br"
