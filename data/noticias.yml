    titulo: "Abril é um mês muito especial para o GPENSC, pois comemoramos a criação do nosso grupo e do nosso Instagram"
    resumo: "Abril é um mês muito especial para o GPENSC, pois comemoramos a criação do nosso grupo e do nosso Instagram"
    conteudo: "Abril é um mês muito especial para o GPENSC, pois comemoramos a criação do nosso grupo e do nosso Instagram.\n.\n🗓️ No dia 8 de abril, nosso grupo completou 4 anos de fundação! São 4 anos de muito trabalho, projetos, descobertas, dedicação e conquistas! Sem dúvidas, estamos colhendo bons frutos ao longo desses anos. E ontem, dia 23 de abril, nosso Instagram completou mais um ano de existência, e nós somos muito gratos por todos vocês que nos seguem e que interagem nas nossas postagens!\n.\n🏆 Não poderíamos deixar essas datas passarem em branco, sem lembrar que cada membro é peça fundamental para o sucesso do GPENSC. Que possamos continuar a trabalhar em equipe, compartilhando conhecimentos e ideias, buscando sempre a excelência e o progresso da ciência.\n.\n✨ Desejamos a todos os membros sucesso e que nossas pesquisas continuem a contribuir com a sociedade! \n.\nNosso muito obrigada a todos! Parabéns, GPENSC! 💚❤️🧡"
