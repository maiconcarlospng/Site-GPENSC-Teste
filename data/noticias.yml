  - data: "2023-11-30"
    categoria: "Institucional"
    titulo: "O GPENSC relembra a defesa de doutorado da aluna Magda do Carmo Parajára, que aconteceu no dia 31 de outubro de 2023, no formato híbrido"
    resumo: "O GPENSC relembra defesa de doutorado da aluna Magda do Carmo Parajára (@magdaparajara), que aconteceu no dia 31 de outubro de 2023, no formato híbrido"
    conteudo: "O GPENSC relembra defesa de doutorado da aluna Magda do Carmo Parajára (@magdaparajara), que aconteceu no dia 31 de outubro de 2023, no formato híbrido.\n.\n🔎 A tese de doutorado da Magda, intitulada “Carga de doenças crônicas não transmissíveis atribuível a fatores de risco alimentares e seu custo financeiro para o Sistema Único de Saúde no Brasil”, teve como objetivo analisar a carga de doenças crônico não transmissíveis (DCNT) atribuível ao consumo de ácidos graxos trans (AGT) e consumo insuficiente de frutas, hortaliças e grãos integrais para a população brasileira entre 1990-2019 e o custo financeiro do consumo de AGT para o Sistema Único de Saúde (SUS) em 2019.\n.\n👥 Seu estudo foi orientado pela professora Dra. Adriana Lúcia Meireles (UFOP)  e coorientado pelo professor Dr. Eliseu Verly Junior - @eliseuverly (UERJ). O trabalho contou com as contribuições da banca formada pela professora Dra. Ísis Eloah Machado - @isiseloah (UFOP) e pelos professores Drs. Martin O’Flaherty (University of Liverpool), Eduardo Augusto Fernandes Nilson - @edu_nilson (Fiocruz) e Rafael Moreira Claro - rafael_claro (UFMG).\n.\n📊 Os resultados da tese da Magda mostraram que a alimentação elevada em AGT e insuficiente em frutas, hortaliças e grãos integrais contribuem substancialmente para a carga de DCNT e custos para o SUS no Brasil, especialmente em estados com menor nível socioeconômico.\n.\n💡 Os achados reforçam a importância de políticas alimentares para reduzir a carga de doença na população brasileira.\n.\n🎆 Parabenizamos a Magda pela sua defesa de doutorado e pela contribuição com o PPGSN e para a ciência do país. Desejamos muito sucesso!"
