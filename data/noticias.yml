    resumo: "Vamos começar a semana com novidades?"
    conteudo: "Vamos começar a semana com novidades? \n.\n📢 Iniciaremos um novo projeto por aqui: #LiveGPENSC. Nessas lives, integrantes do nosso grupo vão discutir sobre os seus temas de estudo em um bate-papo descontraído, porém baseado em evidências. Será uma oportunidade para vocês conhecerem um pouco mais sobre os nossos trabalhos e para interagirmos com vocês.\n.\n🗓 A nossa primeira live acontecerá no dia 22/07 (quinta-feira), às 19h00, e terá como tema “Sono em tempos de pandemia”. Nessa live, contaremos com a participação dos doutorandos Luiz Antônio Menezes (@luizmenezes__) e Thaís da Silva Sabião (@thasabiao), do PPGSN/UFOP.\n.\n📱 A live será aqui no perfil do GPENSC. Participe conosco!\n.\n💬 Vocês também podem participar enviando perguntas. Abriremos um caixinha de perguntas no nosso story, fiquem ligados!\n.\n🗣 Não fique de fora! Anota aí na agenda e #vemcomagente. Esperamos vocês!"
