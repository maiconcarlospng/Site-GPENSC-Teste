    resumo: "Nosso #tbt de hoje é recente, para lembrar de duas qualificações de mestrado que ocorreram em fevereiro e março de 2022 , via Google Meet"
    conteudo: "Nosso #tbt de hoje é recente, para lembrar de duas qualificações de mestrado que ocorreram em fevereiro e março de 2022 , via Google Meet. \n.\n🗓️ No dia 24 de fevereiro, aconteceu a qualificação de mestrado da aluna Michelle Izabel Ferreira Mendes (@michellef80mendes).\n.\n🔎 O projeto de mestrado da Michelle, intitulado “Consumo de carne vermelha e processada e risco de hipertensão arterial em participantes do Elsa-Brasil”, é orientado pela professora Dra. Maria del Carmen Bisi Molina (@mdcarmenmolina) e coorientado pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut). Sua banca de qualificação contou com a colaboração da professora Dra. Taísa Sabrina Silva Pereira (UDLAP) e da professora Dra. Adriana Lúcia Meireles – @dri_meireles (UFOP).\n.\n🗓️ No dia 07 de março, ocorreu a qualificação da mestranda Tainá Cristina Damasceno Silva (@tainacdamasceno).\n.\n🔎 O projeto de mestrado da Tainá, intitulado “Intervenção nutricional para controle da Hipertensão Arterial Sistêmica na Atenção Primária à Saúde”, é orientado pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut) e coorientado pela professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro). Sua banca de qualificação contou com as contribuições da professora Dra. Renata Andrade de Medeiros Moreira (UFT) e da professora Dra. Maria del Carmen Bisi Molina – @mdcarmenmolina (UFOP). \n.\n🎇 Parabenizamos a Michelle e a Tainá pela aprovação na sua qualificação e pela contribuição na ciência do país. Desejamos sucesso nas próximas etapas!"
