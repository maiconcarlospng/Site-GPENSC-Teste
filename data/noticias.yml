    titulo: "O GPENSC recomenda o documento “Linguagem Importa – Atualização de Linguagem para Diabetes, Obesidade e outras Condições Crônicas de Saúde”, lançado em 2022 durante o Fórum Intersetorial para Combate às doenças crônicas não transmissíveis (DCNTs) no Brasil"
    resumo: "O GPENSC recomenda o documento “Linguagem Importa – Atualização de Linguagem para Diabetes, Obesidade e outras Condições Crônicas de Saúde”, lançado em 2022 durante o Fórum Intersetorial para Combate às doenças crônicas não transmissíveis (DCNTs) no Brasil"
    conteudo: "O GPENSC recomenda o documento “Linguagem Importa – Atualização de Linguagem para Diabetes, Obesidade e outras Condições Crônicas de Saúde”, lançado em 2022 durante o Fórum Intersetorial para Combate às doenças crônicas não transmissíveis (DCNTs) no Brasil.\n.\n📄 Para aqueles em risco de desenvolver ou já diagnosticados com DCNTs, a comunicação adequada, seja ela pessoal ou ao maior número de pessoas, permite a tomada de decisões que possibilitem manter ou melhorar a saúde, principalmente o autocuidado.\n.\n📝 O documento traz uma série de recomendações quanto ao uso de termos reconhecidos e adequados para a comunicação relacionada às DCNTs, baseadas em referências globalmente estabelecidas por entidades, como a International Diabetes Federation (IDF), World Obesity Federation (WOF) e American Diabetes Association (ADA) e a Diabetes IK.\n.\n🎯 O objetivo do material é ser referência para todos os profissionais de saúde, acadêmicos e estudantes de medicina, profissionais de saúde e da comunicação, assim como demais interessados pela temática.\n.\n🔗 O material na íntegra pode ser acessado no site da Sociedade Brasileira de Endocrinologia e Metabologia, ou pelo link disponível na nossa bio. Não deixe de conferir!\n.\n📌 Aproveita e salve esse post! Também não deixe de marcar nos comentários ou compartilhar essa publicação com aquele(a) amigo(a) que precisa atualizar sobre os termos relacionados às DCNTs."
