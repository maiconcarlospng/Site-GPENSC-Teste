    conteudo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a mestranda Marana Luiza Duarte Avelar (@maranaduarte_psicologa).\n.\n👩🏻‍🎓 Marana é psicóloga pela Faculdade Ciências da Vida, com especializações em Gestão de Pessoas pela Universidade Católica Dom Bosco, Saúde Mental pela Faculdade Dom Luciano Mendes e Terapia Cognitivo-Comportamental pela PUC-RS. Atualmente, é mestranda do Programa de Pós-Graduação em Saúde e Nutrição (PPGSN/UFOP- @ppgsnufop), na linha de pesquisa Saúde e Nutrição em Indivíduos e Coletividade.\n.\n📚 É pesquisadora do projeto intitulado “NutricionalMente”, que tem como objetivo avaliar o efeito da intervenção nutricional, da terapia Cognitivo-Comportamental e de estratégias de m-Health na perda de peso e comportamento alimentar de adultos e idosos com excesso de peso, sob orientação da professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro) e coorientação da professora Dra. Erika Cardoso dos Reis (@erikacareis).\n.\n🔎 Quer saber mais sobre o tema da Marana? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo!"
