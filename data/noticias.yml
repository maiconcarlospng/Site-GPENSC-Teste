  - data: "2026-06-19"
    categoria: "Internacionalização"
    titulo: "Doutoranda do GPENSC inicia período de pesquisa na Universidade de Coimbra"
    resumo: "Laudicéia Ferreira Fróis iniciou doutorado sanduíche no Centro de Investigação em Antropologia e Saúde da Universidade de Coimbra, em Portugal."
    conteudo: "Em abril, a pesquisadora do GPENSC e doutoranda do PPGSN/UFOP (@ppgsn.ufop), Laudicéia Ferreira Fróis (@laudiceia_frois), iniciou seu doutorado sanduíche no Centro de Investigação em Antropologia e Saúde (CIAS) (@cias_uc), vinculado ao Instituto de Antropologia e ao Departamento de Ciências da Vida, da Universidade de Coimbra (@uccoimbra), em Portugal. Durante esse período, Laudicéia desenvolverá sua pesquisa sobre saúde mental e comportamentos obesogênicos a partir de dados da Pesquisa Nacional de Saúde do Escolar (PeNSE), um dos principais inquéritos nacionais sobre a saúde de adolescentes no Brasil. A realização dessas atividades na Universidade de Coimbra favorece o intercâmbio científico entre Brasil e Portugal, ampliando a disseminação do conhecimento produzido com dados brasileiros e promovendo a troca de experiências e abordagens entre pesquisadores dos dois países. Além disso, a pesquisadora atua como colaboradora no projeto ScreenHealth, que investiga as trajetórias de uso das mídias digitais, as desigualdades sociais e seus efeitos a longo prazo sobre a obesidade e a saúde mental infantil. No âmbito desse projeto, sua proposta consiste em avaliar os efeitos da substituição temporal entre comportamentos de 24 horas (comportamento sedentário, atividade física e sono) sobre a saúde mental de crianças. As atividades são desenvolvidas sob a supervisão da Prof.ª Dr.ª Cristina Maria Padez (Universidade de Coimbra) e orientação da Prof.ª Dr.ª Adriana Lucia Meireles (@dri_meireles) (UFOP). A experiência representa uma importante oportunidade de aprofundamento científico e metodológico, contribuindo para o fortalecimento das colaborações internacionais e para a integração de conhecimentos produzidos no Brasil e em Portugal. Além disso, fortalece as colaborações científicas internacionais e amplia o processo de internacionalização do GPENSC e do PPGSN/UFOP. Desejamos muito sucesso à Laudicéia nesta importante etapa de sua trajetória acadêmica. 🧡 #doutorado #doutoradosanduíche #ufop #universidadedecoimbra"
    url: "https://www.instagram.com/p/DZyMmi_kShF/"
    imagem: "img/instagram/DZyMmi_kShF.jpg"

