    titulo: "Avaliação temporal do ambiente alimentar comunitário de uma metrópole brasileira"
    resumo: "Hoje é dia de conhecer um pouquinho da pesquisa de uma das integrantes do GPENSC!"
    conteudo: "Hoje é dia de conhecer um pouquinho da pesquisa de uma das integrantes do GPENSC! 👩🏻‍🎓📚\n.\nA Irene é Nutricionista (UFMG), mestranda no Programa de Pós-Graduação em Saúde e Nutrição (UFOP), pesquisadora do Grupo de Estudos, Pesquisas e Práticas em Ambiente Alimentar (GEPPAAS-UFMG - @geppaasufmg) e do Grupo de Pesquisa e Estudos em Nutrição e Saúde Coletiva (GPENSC-UFOP).\n.\nSua pesquisa intitulada “Avaliação temporal do ambiente alimentar comunitário de uma metrópole brasileira” é orientada pela professora Dra. Milene Cristine Pessoa - @milenepessoa1 (UFMG) e coorientada pela professora Dra. Mariana Carvalho de Menezes - @maricarvalhomenezes (UFOP).\n.\nEm sua pesquisa, a Irene busca avaliar a mudança no perfil do ambiente alimentar comunitário da cidade de Belo Horizonte (MG) nos anos de 2008, 2011, 2015 e 2019. O trabalho dela permite avaliar as alterações ocorridas no contexto do acesso, disponibilidade e comercialização de alimentos, e como isso impacta no acesso dos indivíduos a alimentos mais ou menos saudáveis.\n.\nOs resultados do seu trabalho permitem investigar o contexto de oportunidades e limitações relacionadas à alimentação em BH, proporcionando também oportunidades de intervenções e mudanças estratégicas nas políticas locais."
    url: "https://www.instagram.com/p/CCMe7uoAI8W/"
    imagem: "img/instagram-acervo/CCMe7uoAI8W.webp"
  - data: "2020-07-01"
    categoria: "Pesquisa"
    titulo: "Na semana passada, apresentamos para vocês a pesquisa de mestrado do Luiz cujo tema é distúrbios do sono e hipovitaminose D em trabalhadores de turnos alternantes"
    resumo: "Na semana passada, apresentamos para vocês a pesquisa de mestrado do Luiz (@menezesnutri) cujo tema é distúrbios do sono e hipovitaminose D em trabalhadores de turnos alternantes"
    conteudo: "Na semana passada, apresentamos para vocês a pesquisa de mestrado do Luiz (@menezesnutri) cujo tema é distúrbios do sono e hipovitaminose D em trabalhadores de turnos alternantes. Mas por que estudar distúrbios do sono e vitamina D?\n .\nVários estudos demonstram que os receptores para vitamina D são expressos em áreas cerebrais que regulam o ciclo sono-vigília, como o hipotálamo. Essa evidência levou a realização de pesquisas epidemiológicas, que encontraram associação entre a vitamina D e o risco de distúrbios do sono. Porém, os resultados ainda permanecem controversos.\n .\nPor esse motivo, Gao e colaboradores (2018) realizaram uma metanálise com o objetivo de esclarecer a associação entre a vitamina D e o risco de distúrbios do sono. Foram incluídos nove estudos (apenas 1 estudo de coorte) envolvendo 9397 participantes. Os autores descobriram que os participantes com deficiência de vitamina D, tinham um risco significativamente aumentado de distúrbios do sono, como duração curta do sono, sonolência excessiva e má qualidade do sono.\n .\nApesar do grande número de evidências, os estudos sem sua maioria são observacionais, e não conseguem avaliar diretamente a direção da associação. Sendo necessário estudos de coorte ou de intervenção para verificar o grau de associação entre os dois desfechos.\n .\nDesta forma, é necessário mais estudos para melhorar a compreensão de como os distúrbios do sono estão associados a deficiência de vitamina D, principalmente em populações expostas ao risco, como os trabalhadores de turnos."
    url: "https://www.instagram.com/p/CCHX_rAgsvj/"
    imagem: "img/instagram-acervo/CCHX_rAgsvj.webp"
  - data: "2020-06-24"
    categoria: "Pesquisa"
    titulo: "Oi pessoal, hoje vamos conhecer um pouquinho da pesquisa de um dos integrantes do GPENSC 👩🏻‍🎓📚"
    resumo: "Oi pessoal, hoje vamos conhecer um pouquinho da pesquisa de um dos integrantes do GPENSC 👩🏻‍🎓📚 . O Luiz é Nutricionista formado pela Universidade Federal…"
    conteudo: "Oi pessoal, hoje vamos conhecer um pouquinho da pesquisa de um dos integrantes do GPENSC 👩🏻‍🎓📚\n.\nO Luiz é Nutricionista formado pela Universidade Federal de Ouro Preto (2019), e atualmente é Mestrando no Programa de Pós Graduação em Saúde e Nutrição aqui da  UFOP. Sua pesquisa é orientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientada pelo professor Dr. Raimundo Marques do Nascimento Neto. .\nIntitulada, “Associação entre a vitamina D e distúrbios do sono em trabalhadores de turnos alternantes”. Em sua pesquisa, o Luiz busca avaliar a associação entre a vitamina D e distúrbios do sono em trabalhadores específicos, pois o trabalho em turnos tem sérios impactos sobre o sistema circadiano e o sono. .\nEm sua pesquisa, o Luiz encontrou que trabalhadores de turnos alternantes, que fazem rodízios de turnos, matutinos, vespertinos ou noturnos, apresentam uma elevada prevalência de distúrbios do sono, associados a outras comorbidades como obesidade, hipertensão e hipovitaminose D. \nAlém disso, ele encontrou também que os trabalhadores de turnos que tinham níveis reduzidos de vitamina D apresentavam maior prevalência de distúrbios do sono.\nDesta forma, a pesquisa do Luiz contribui para melhorar a abordagem terapêutica e construção de estratégias preventivas em saúde para estes trabalhadores."
    url: "https://www.instagram.com/p/CB1YR6Mg2gM/"
    imagem: "img/instagram-acervo/CB1YR6Mg2gM.webp"
  - data: "2020-06-12"
    categoria: "Pesquisa"
    titulo: "Essa semana, apresentamos para vocês a pesquisa de mestrado da Waléria, já concluída, e sua atual pesquisa de doutorado, as quais fazem parte do Projeto sobre Ansiedade e…"
    resumo: "Essa semana, apresentamos para vocês a pesquisa de mestrado da Waléria (@waleria_dp), já concluída, e sua atual pesquisa de doutorado, as quais fazem parte do Projeto sobre Ansiedade e Depressão em Universitários (PADu - @padufederais) 🧠"
    conteudo: "Essa semana, apresentamos para vocês a pesquisa de mestrado da Waléria (@waleria_dp), já concluída, e sua atual pesquisa de doutorado, as quais fazem parte do Projeto sobre Ansiedade e Depressão em Universitários (PADu - @padufederais) 🧠. Mas por que estudar transtornos mentais em universitários?\n\nA ocorrência de transtornos mentais entre universitários e sua associação com o desempenho acadêmico não são bem compreendidas. Por esse motivo, o estudo de Bruffaerts e colaboradores (2018) teve como objetivo investigar se a ocorrência de transtornos mentais está associada ao desempenho acadêmico de calouros.\n\nO estudo foi realizado com uma amostra de estudantes universitários belgas do primeiro período e mostrou que, um terço dos calouros é acometido por algum tipo de transtorno mental já no início da vida acadêmica e que a presença desses transtornos está associada ao menor desempenho acadêmico.\n\nA partir desses resultados, os autores concluíram que os transtornos mentais são muito comuns entre calouros e que estes afetam de forma negativa seu desempenho acadêmico. Por isso, sugerem que outros estudos que investiguem essa relação causal são necessários, assim como intervenções destinadas a tratar esses transtornos e melhorar o desempenho acadêmico desses universitários.\n\nPortanto, cuidem-se e fiquem bem! Nossas vidas importam ❤️"
    url: "https://www.instagram.com/p/CBWa_GkgzpI/"
    imagem: "img/instagram-acervo/CBWa_GkgzpI.webp"
  - data: "2020-06-10"
    categoria: "Pesquisa"
    titulo: "Sintomas de transtorno de ansiedade e depressão e uso de substâncias psicoativas entre estudantes ingressantes da Universidade Federal de Ouro Preto"
    resumo: "Hoje, vamos conhecer um pouquinho da pesquisa de um dos integrantes do GPENSC!"
    conteudo: "Hoje, vamos conhecer um pouquinho da pesquisa de um dos integrantes do GPENSC! 📚🔎 A Waléria é farmacêutica, mestra em Saúde e Nutrição e, atualmente, é doutoranda no Programa de Ciências Farmacêuticas, todas as formações pela Universidade Federal de Ouro Preto. É membro do GPENSC desde a sua fundação. Tem experiência na área de Farmácia, com ênfase em Farmácia clínica e hospitalar, saúde coletiva e epidemiologia.\nSua pesquisa de mestrado foi orientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) com o tema “Sintomas de transtorno de ansiedade e depressão e uso de substâncias psicoativas entre estudantes ingressantes da Universidade Federal de Ouro Preto”. Nessa pesquisa, foram observadas altas prevalências de sintomas de ansiedade e depressão (42,5% e 33,2% respectivamente) e de consumo de substâncias psicoativas por estudantes universitários do primeiro período, destacando a importância do desenvolvimento de programas voltados à promoção da saúde mental e física de estudantes universitários e de prevenção ao uso de substâncias psicoativas no meio acadêmico. \nDurante o doutorado, sob orientação da professora Dra. Glenda Nicioli, investigará a prevalência do uso de psicofármacos em estudantes universitários da área de saúde em uma amostra de estudantes das Universidades Federais de Minas Gerais 💊.\nAmbas as pesquisas estão ligadas ao Projeto sobre Ansiedade e Depressão em universitários (PADu), que você pode acompanhar e conhecer mais acessando o @padufederais.\n\nContinue nos acompanhando para saber mais sobre essa pesquisa!"
