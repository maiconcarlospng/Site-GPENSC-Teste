  - data: "2024-07-23"
    categoria: "Institucional"
    titulo: "Artigo: The interaction between education and sex with alcohol consumption during the COVID-19 pandemic: a cross-sectional analysis of two Brazilian cities"
    resumo: "O GPENSC apresenta o artigo intitulado “The interaction between education and sex with alcohol consumption during the COVID-19 pandemic: a cross-sectional analysis of two Brazilian cities”, de autoria da doutoranda Amanda Popolino Diniz (@amandapopolinonutri) juntamente com outros pesquisadores do GPENSC e da UFOP"
    conteudo: "O GPENSC apresenta o artigo intitulado “The interaction between education and sex with alcohol consumption during the COVID-19 pandemic: a cross-sectional analysis of two Brazilian cities”, de autoria da doutoranda Amanda Popolino Diniz (@amandapopolinonutri) juntamente com outros pesquisadores do GPENSC e da UFOP.\n.\n🎯 O artigo teve como objetivo avaliar a associação conjunta de educação e sexo com o consumo excessivo habitual e episódico de álcool durante a pandemia da covid-19.\n.\n📝 Trata-se de um estudo transversal realizado, entre outubro e dezembro de 2020, por meio de inquérito soroepidemiológico domiciliar de base populacional. O consumo excessivo episódico de álcool foi definido como o consumo de cinco ou mais doses para homens ou quatro ou mais doses para mulheres, pelo menos uma vez nos últimos 30 dias. Para avaliar as associações entre nível de educação e sexo com o consumo de álcool foi realizada regressão logística multivariada ajustada.\n.\n📊 A prevalência de consumo habitual de álcool no estudo foi de 37,92%, enquanto a prevalência de consumo excessivo de álcool foi de 30,17%. Não houve associação entre o nível de educação e o consumo habitual ou excessivo de álcool de forma isolada. No entanto, ao avaliar o efeito combinado entre educação e sexo, observou-se que homens com baixo nível educacional eram mais propensos tanto ao consumo habitual (OR: 5,85; IC95:2,74–14,84) quanto ao consumo excessivo de álcool (OR: 4,45; IC95%: 1,54–12,82). Por outro lado, mulheres com alto nível educacional apresentavam maior propensão ao consumo habitual (OR: 2,16; IC95%: 1,18–3,95) e ao consumo excessivo de álcool (OR: 2,00; IC95%: 1,16–3,43). \n.\n💡Os resultados destacam o efeito modificador do sexo na associação entre educação e consumo de álcool, indicando que a influência da educação sobre o consumo de álcool variou entre os sexos durante a pandemia.\n.\n🔗 Acesse o artigo: https://www.mdpi.com/1660-4601/21/6/804"
