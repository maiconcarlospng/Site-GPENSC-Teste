  - data: "2026-06-30"
    categoria: "Pesquisa"
    titulo: "📚 Estudo conduzido pela Dra. Ariene Silva do Carmo, sendo fruto do pós-doutorado orientado pela professora…"
    resumo: "📚 Estudo conduzido pela Dra. Ariene Silva do Carmo, sendo fruto do pós-doutorado orientado pela professora Larissa Loures Mendes da UFMG e líder do Grupo…"
    conteudo: "📚 Estudo conduzido pela Dra. Ariene Silva do Carmo, sendo fruto do pós-doutorado orientado pela professora Larissa Loures Mendes da UFMG e líder do Grupo de Estudo, Pesquisa e Práticas em Ambiente Alimentar e Saúde (GEPPAAS). O estudo utilizou dados do Caeb (Comercialização de Alimentos em Escolas Brasileiras) e teve como objetivo analisar os preços e as estratégias de promoção comercial de alimentos vendidos em cantinas de escolas particulares brasileiras, segundo o sistema de classificação de alimentos NOVA.\n\n📊 Principais achados:\nOs resultados mostraram que os alimentos in natura, minimamente processados e preparações culinárias apresentaram menor preço quando comparados por 100 g ou 100 ml. Porém, ao considerar o preço por porção, que representa o valor pago pelo estudante, essas opções se tornaram mais caras em comparação aos alimentos ultraprocessados.\n\nAlém disso, aproximadamente 27% das cantinas utilizavam estratégias de precificação, como promoções e combos. Entretanto, essas ações eram aplicadas de forma semelhante para alimentos saudáveis e ultraprocessados, sem priorizar escolhas alimentares mais saudáveis.\n\n✅ O estudo concluiu que:\nA forma como os preços são apresentados pode influenciar as escolhas alimentares dos estudantes. Apesar de os alimentos saudáveis apresentarem menor custo proporcionalmente, o preço por porção pode dificultar seu acesso, tornando os ultraprocessados opções mais atrativas economicamente.\n\nEsses resultados reforçam a necessidade de políticas e intervenções que favoreçam a oferta, acessibilidade financeira e valorização de alimentos saudáveis no ambiente escolar.\n\n#saudecoletiva #nutrição #epidemiologia #alimentacaosaudavel #ambienteescolar"
    url: "https://www.instagram.com/p/DaOaehikSzf/"
    imagem: "img/instagram-acervo/DaOaehikSzf.webp"
