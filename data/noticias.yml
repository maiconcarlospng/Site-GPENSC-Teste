    titulo: "🔍 Como a insegurança alimentar afeta diferentes grupos durante crises de saúde?"
    resumo: "🔍 Como a insegurança alimentar afeta diferentes grupos durante crises de saúde? ⠀ Artigo produzido por Erica Costa Rodrigues (@costta.erica) e outros pesquisadores do GPENSC…"
    conteudo: "🔍 Como a insegurança alimentar afeta diferentes grupos durante crises de saúde?\n⠀\nArtigo produzido por Erica Costa Rodrigues (@costta.erica) e outros pesquisadores do GPENSC buscou investigar como os fatores sociais e demográficos associados à insegurança alimentar mudam em um importante grupo populacional durante uma crise de saúde, identificando grupos vulneráveis.\n\nOs achados deste estudo podem subsidiar programas de insegurança alimentar, especialmente durante interrupções escolares, e contribuir para o desenvolvimento de protocolos de apoio e enfrentamento para situações de crise que afetam o ambiente escolar e, consequentemente, a vida familiar das famílias mais vulneráveis.\n⠀\n🔗 Acesse o artigo completo: https://authors.elsevier.com/a/1kvUa3CdHt2-br\n⠀\n#InsegurançaAlimentar #Pesquisa #GPENSC #SaúdePública  #VulnerabilidadeSocial #Equidade"
