    conteudo: "No último final de semana (30, 31 de outubro e 01 de novembro), iniciamos a coleta de dados do projeto “Vigilância epidemiológica da COVID-19 na região dos Inconfidentes” (COVID-Incofidentes) no município de Ouro Preto. \n.\n🔬A pesquisa irá ajudar a compreender a realidade da pandemia na região dos Inconfidentes e seus possíveis impactos na saúde da população.\n.\n✨ Agradecemos a todos os moradores de Ouro Preto que já contribuíram com a nossa pesquisa neste último final de semana. No final do mês, continuaremos a coleta de dados no município. Se seu domicílio for selecionado, receba nossos pesquisadores e esteja conosco na luta contra a COVID-19. \n.\n👉 Arraste para o lado e confira as fotos do painel I realizado na cidade de Ouro Preto.\n.\n🔍 Continue nos acompanhando para saber mais sobre esse projeto e para acompanhar todos os painéis de Ouro Preto e Mariana.\n.\n📧 Qualquer dúvida, entre em contato pelo o e-mail: covid.inconfidentes.ppgsn@ufop.edu.br"
