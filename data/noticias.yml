    resumo: "O post de hoje é muito especial para nós do GPENSC: ultrapassamos a marca de 1000 seguidores! 🎉😍 . 📱 O nosso perfil no Instagram…"
    conteudo: "O post de hoje é muito especial para nós do GPENSC: ultrapassamos a marca de 1000 seguidores! 🎉😍\n.\n📱 O nosso perfil no Instagram foi criado em 2019, mas foi no ano de 2020 que iniciamos as nossas postagens. Estava na hora de divulgarmos nossos trabalhos e ideias por aqui também!\n.\n✨ Em tempos tão difíceis e de tantas incertezas, não temos dúvidas que foi uma decisão assertiva: vimos um caminho de novas possibilidades para divulgar ciência; além do mais, fomos contemplados por novas amizades e conexões. \n.\n❣️ Somos imensamente gratos a cada um de vocês que segue nosso perfil, que acompanha as nossas postagens, que interage nas publicações, que acredita no nosso trabalho, no ensino de qualidade, na pesquisa e na ciência brasileira! Esperamos continuar juntos por aqui, discutindo temas de Nutrição e Saúde Coletiva no âmbito da pesquisa, ensino e extensão!\n.\nCom carinho, de todos os membros do GPENSC! 💚❤️🧡"
