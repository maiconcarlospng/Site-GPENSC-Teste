    titulo: "Livro: Epidemiologia nutricional aplicada à obesidade"
    resumo: "O GPENSC recomenda o livro \"Epidemiologia nutricional aplicada à obesidade\", de autoria de Maria Laura da Costa Louzada, professora do Departamento de Nutrição da Faculdade de Saúde Pública da Universidade de São Paulo (USP) e pesquisadora do Núcleo de Pesquisas Epidemiológicas em Nutrição e Saúde da USP -…"
    conteudo: "O GPENSC recomenda o livro \"Epidemiologia nutricional aplicada à obesidade\", de autoria de Maria Laura da Costa Louzada, professora do Departamento de Nutrição da Faculdade de Saúde Pública da Universidade de São Paulo (USP) e pesquisadora do Núcleo de Pesquisas Epidemiológicas em Nutrição e Saúde da USP - NUPENS/USP (@nupens).\n.\n📚 O livro aborda a relação entre os hábitos alimentares da população e a obesidade, utilizando a epidemiologia nutricional para compreender os fatores de risco e as tendências desse problema de saúde pública.\n.\n📝 A obra é destinada a profissionais de saúde, pesquisadores e estudantes interessados em compreender melhor a relação entre alimentação e obesidade sob a ótica da saúde pública.\n.\n👉🏻 Arraste para o lado e confira.\n.\n🗣️ Gostou da postagem? Não deixe de conferir essa e as outras postagens e compartilhar com os amigos."
