    titulo: "Hoje é dia de apresentar para vocês um membro do GPENSC!"
    resumo: "Hoje é dia de apresentar para vocês um membro do GPENSC! Conheçam um pouco mais sobre a Professora Júlia. . A professora Júlia Cristina Cardoso…"
    conteudo: "Hoje é dia de apresentar para vocês um membro do GPENSC! Conheçam um pouco mais sobre a Professora Júlia.\n.\nA professora Júlia Cristina Cardoso Carraro possui graduação em Nutrição pela UFV, Mestrado e Doutorado em Ciência da Nutrição pela mesma instituição e Doutorado Sanduíche pela Universidad de Navarra (Pamplona, Espanha), no Departamento de Ciéncia de la Alimentación, y Fisiología. Professora adjunta de Nutrição Clínica do Departamento de Nutrição Clínica e Social e professora permanente do Programa de Pós–Graduação em Saúde e Nutrição da UFOP. Coordenadora do Ambulatório de Nutrição e do projeto de extensão Atenção Nutricional na Síndrome Metabólica. Experiência nas áreas de genômica nutricional, obesidade e síndrome metabólica."
