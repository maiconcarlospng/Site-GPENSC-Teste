    conteudo: "Conheça mais uma pesquisadora do GPENSC, a Dra. Bruna Barbosa (@brunabcrb).\n\nNutricionista formada pela Universidade Federal de Ouro Preto (UFOP), mestre e doutora em Saúde e Nutrição pelo Programa de Pós-Graduação em Saúde e Nutrição (PPGSN/UFOP). Pesquisadora do Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva (GPENSC/UFOP) e do Projeto de Ansiedade e Depressão em Universitários (PADu). \n\nAtualmente, atua como consultora técnica na Coordenação-Geral de Doenças Crônicas Não Transmissíveis do Departamento de Análise Epidemiológica e Vigilância de Doenças Não Transmissíveis do Ministério da Saúde (CGDNT/DAENT/SVSA/MS).\n\nContinue de olho no nosso perfil e acompanhe os projetos desenvolvidos pela Bruna!"
