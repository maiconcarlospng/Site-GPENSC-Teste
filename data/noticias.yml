    titulo: "PRODUÇÕES GPENSC 🧠 Um estudo conduzido por Luiz Antônio Alves de Menezes Júnior (@luizmenezes_jr)…"
    resumo: "PRODUÇÕES GPENSC 🧠 Um estudo conduzido por Luiz Antônio Alves de Menezes Júnior (@luizmenezes_jr) juntamente com outros pesquisadores do GPENSC investigou como a qualidade do…"
    conteudo: "PRODUÇÕES GPENSC 🧠\n\nUm estudo conduzido por Luiz Antônio Alves de Menezes Júnior (@luizmenezes_jr) juntamente com outros pesquisadores do GPENSC investigou como a qualidade do sono foi afetada durante a pandemia em adultos do Quadrilátero Ferrífero (MG).\n\nEntre os 1.511 participantes, 52,5% apresentaram má qualidade do sono. Sintomas de ansiedade foram relatados por 23,4% e de depressão por 15,0%. Cerca de 39,8% relataram pelo menos uma doença DCNT. Na análise ajustada, observou-se que a cada nova DCNT, a chance de má qualidade do sono aumentava em 39,0%. Na análise de mediação, os sintomas de ansiedade explicaram 6,5% e os de depressão, 36,1% da associação entre DCNTs e má qualidade do sono.\n\nOs resultados destacam a importância da orientação de autoridades públicas para a promoção da saúde e intervenções multidisciplinares para reduzir os sintomas de depressão e ansiedade e melhorar a qualidade do sono.\n\n#SaúdeMental #QualidadeDoSono #DCNT #CiênciaParaTodos #Pandemia"
    url: "https://www.instagram.com/p/DIzmfgDRMBc/"
    imagem: "img/instagram-acervo/DIzmfgDRMBc.webp"
