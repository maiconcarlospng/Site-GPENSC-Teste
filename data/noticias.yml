  - data: "2023-06-27"
    categoria: "Pesquisa"
    titulo: "Semana passada, apresentamos para vocês a pesquisa da doutoranda Laudicéia Ferreira Fróis"
    resumo: "Semana passada, apresentamos para vocês a pesquisa da doutoranda Laudicéia Ferreira Fróis"
    conteudo: "Semana passada, apresentamos para vocês a pesquisa da doutoranda Laudicéia Ferreira Fróis. Mas qual é a importância da validação de instrumentos que avaliam o comportamento alimentar?\n.\n📑 A validação de instrumentos que avaliam o comportamento alimentar é de extrema importância, uma vez que garantem confiabilidade dos dados, além de favorecer intervenções eficazes em estudos acerca do tema.\n.\n 📓 O Three Factor Eating Questionnaire (TFEQ) é um instrumento utilizado para avaliar três escalas do comportamento alimentar: descontrole alimentar, restrição cognitiva e alimentação emocional. O instrumento original foi proposto por Herman e Polivy (1975) e modificado por Tholin e colaboradores (2005).\n.\n🎯 O objetivo deste artigo foi apresentar a tradução do TFEQ-R21 para o português.\n.\n📈 Os autores realizaram um teste piloto com 12 sujeitos. Posteriormente, o mesmo foi aplicado em 125 mulheres brasileiras com idade entre 20 e 60 anos. Na análise desses dados, identificaram significância entre as variáveis comportamentais da alimentação com dados antropométricos. Além disso, considerou-se que altos escores indicou níveis elevados de alimentação descontrolada, restritiva e emocional.\n.\n📊 O artigo evidenciou que a versão em português do TFEQ-R21 pode ser um instrumento adequado para identificar os comportamentos de restrição cognitiva, alimentação emocional e descontrole alimentar, além de servir como base para a adoção de estratégias de abordagem na orientação nutricional, que levem em conta não apenas hábitos alimentares, mas que também valorizem os comportamentos desencadeantes da alimentação inadequada, como por exemplo, estímulos externos e emoções.\n.\n👉🏻 Arraste para o lado e veja o resumo do artigo."
    url: "https://www.instagram.com/p/CuAl-ygOkTR/"
    imagem: "img/instagram-acervo/CuAl-ygOkTR.webp"
  - data: "2023-06-22"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: doutoranda Laudicéia Ferreira Fróis"
    resumo: "O GPENSC apresenta mais um de nossas pesquisadoras, a doutoranda Laudicéia Ferreira Fróis"
    conteudo: "O GPENSC apresenta mais um de nossas pesquisadoras, a doutoranda Laudicéia Ferreira Fróis.\n.\n👩🏻‍🎓 Laudicéia é nutricionista formada pela Universidade Federal de Lavras (UFLA) e mestre em Ciências pela mesma instituição, pelo Programa de Pós-Graduação em Nutrição e Saúde (PPGNS). Possui experiência na área da Saúde Coletiva, com ênfase em comportamentos alimentares e público materno infantil. Atualmente é doutoranda no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN) da Universidade Federal de Ouro Preto (UFOP), na linha de Pesquisa Saúde e Nutrição em Indivíduos e Coletividades.\n.\n 📚 É pesquisadora do “Projeto de Ansiedade e Depressão em Universitários” (PADu- Multicêntrico) e também do “Estudo da Segurança Alimentar e Nutricional na Pandemia da COVID-19” (ESANP), sob orientação da professora Dra. Adriana Lúcia Meireles (@dri_meireles).\n.\n🔎 Quer saber mais sobre o tema da Laudicéia? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo!"
