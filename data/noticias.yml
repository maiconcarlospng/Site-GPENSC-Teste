  - data: "2020-05-15"
    categoria: "Institucional"
    titulo: "Oi pessoal, hoje vamos conhecer um pouquinho da pesquisa de um dos integrantes do GPENSC 👩🏻‍🎓📚"
    resumo: "Oi pessoal, hoje vamos conhecer um pouquinho da pesquisa de um dos integrantes do GPENSC 👩🏻‍🎓📚 A Hillary é nutricionista formada pela Universidade Federal de…"
    conteudo: "Oi pessoal, hoje vamos conhecer um pouquinho da pesquisa de um dos integrantes do GPENSC 👩🏻‍🎓📚\nA Hillary é nutricionista formada pela Universidade Federal de Ouro Preto em 2018, e ela gostou tanto da universidade que resolveu ficar por aqui mais um pouco e voltou a ser aluna em 2019. Hoje ela tem sua pesquisa orientada pela professora Dra. Júlia Carraro (@julia_carraro ) e coorientada pela professora Dra. Raquel Mendonça (@raqueldmendonca ). Intitulada, “Associação entre o consumo de polifenóis e hipertensão arterial sistêmica em participantes da Coorte de Universidades Mineiras (Projeto CUME)”, a pesquisa da Hillary propõe avaliar a associação entre o consumo de polifenóis da dieta e a incidência de hipertensão arterial nos egressos das Universidades Federais de Minas Gerais, participantes do projeto CUME (@projeto_cume -Coorte de Universidades Mineiras). É uma pesquisa super importante pois as doenças cardiovasculares, dentre elas a hipertensão arterial, foram as principais causas de óbito no mundo 🚨 no período de 2000 a 2012, segundo dados da Organização Mundial da Saúde, e estudos epidemiológicos mostraram associações entre consumo de polifenóis, e redução de risco de doenças crônicas entre elas as doenças cardiovasculares. Os polifenóis são metabólitos secundários das plantas e atuam como fator de proteção tanto nos processos inflamatórios e disfunção endotelial implicados no desenvolvimento de doenças.\n\nQuer saber mais sobre a pesquisa? Continue nos acompanhando!"
    url: "https://www.instagram.com/p/CAOU8KmgRDZ/"
    imagem: "img/instagram-acervo/CAOU8KmgRDZ.webp"
  - data: "2020-05-13"
