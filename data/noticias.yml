    titulo: "Food insecurity and symptoms of anxiety and depression disorder during the COVID-19 pandemic: COVID-Inconfidentes, a population-based survey"
    resumo: "O GPENSC apresenta um #infográfico sobre um dos produtos da tese de doutorado da Thaís Sabião (@thasabiao)"
    conteudo: "O GPENSC apresenta um #infográfico sobre um dos produtos da tese de doutorado da Thaís Sabião (@thasabiao).\n.\n💻 O artigo da Thaís, intitulado “Food insecurity and symptoms of anxiety and depression disorder during the COVID-19 pandemic: COVID-Inconfidentes, a population-based survey”, contou com a orientação da professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro), coorientação do professor Dr. George Luiz Lins Machado Coelho e colaboração de outras pesquisadoras do GPENSC.\n.\n 🍽️ A insegurança alimentar (IA) é definida como a falta de acesso regular aos alimentos, com qualidade e quantidade insuficientes, sendo a sua forma mais grave caracterizada pela experiência da fome. A IA foi agravada pela pandemia da covid-19 e representa um fator adverso não somente para o estado nutricional, mas também para a saúde mental, sendo associada à ocorrência de sintomas de transtorno de ansiedade generalizada (TAG) e sintomas de transtorno depressivo maior (TDM).\n.\n🎯 O objetivo do artigo foi analisar associações entre sintomas de IA e TAG e TDM e comparar as potenciais associações de fatores sociodemográficos. \n.\n📝 Foram utilizados dados do inquérito de base populacional com adultos residentes em Ouro Preto e Mariana, Minas Gerais (Projeto COVID-Inconfidentes). A amostra do estudo foi composta por 1693 participantes.\n.\n👥 Os transtornos foram mais prevalentes conforme características individuais, como sexo, número de moradores no domicílio, vivência da IA e má qualidade do sono. \n.\n📊 Observou-se que quanto maior o nível de IA, maior era a probabilidade de sintomas de TAG e TDM. \n.\n🧠 Participantes em IA experimentaram mais emoções negativas, como pouco interesse ou prazer em realizar atividades, ideação suicida, humor deprimido e má qualidade do sono. Além disso, indivíduos de raça/cor da pele não branca, sem filhos e com menor renda familiar mensal foram mais vulneráveis. O mesmo foi encontrado para as mulheres em relação aos sintomas de TAG e para os homens em relação ao TDM.\t\n.\n👉🏻 Arraste para o lado e confira!\t\n.\n🗣 Continue nos acompanhando para saber mais sobre os trabalhos desenvolvidos pelo nosso grupo!"
    url: "https://www.instagram.com/p/ChqEYBZun4i/"
