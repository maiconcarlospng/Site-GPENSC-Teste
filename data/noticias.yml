  - data: "2021-12-14"
    categoria: "Pesquisa"
    titulo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC"
    resumo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC"
    conteudo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC.\n.\n📄 Neste resumo, vamos falar sobre a disponibilidade alimentar nos domicílios de escolares de Mariana e Ouro Preto durante a pandemia de covid-19, apresentado pela doutoranda Priscila Pena Camargo (@priscilapenacamargo), sob orientação da professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut).\n.\n📚 Nas apresentações, a aluna abordou a disponibilidade de alimentos, como uma das dimensões da segurança alimentar e nutricional (SAN), o perfil sociodemográfico da população, a prevalência da insegurança alimentar nos domicílios e a disponibilidade domiciliar de alimentos marcadores de alimentação saudável e não saudável. Características sociodemográficas da população, como renda familiar mensal, percentual de desemprego, acesso a cestas básicas, recebimento de auxílio emergencial e inclusão em programas sociais foram descritas em dois momentos da pandemia, uma vez que a disponibilidade de alimentos pode estar aliada a condições socioeconômicas.\n.\n📝 A disponibilidade alimentar domiciliar foi avaliada por meio da investigação de uma lista de alimentos e grupos de alimentos divididos em marcadores de alimentação saudável e não saudável.\n.\n📊 A situação verificada nos lares dos escolares demonstra alto percentual de baixa renda e alta prevalência de insegurança alimentar e nutricional. Há graves problemas de disponibilidade de alimentos, principalmente em relação aos marcadores de alimentação saudável. A baixa disponibilidade de alimentos verificada apresenta relação com a condição socioeconômica e com a situação de SAN nos domicílios.\n.\n👉🏻 Arraste para o lado e confira mais sobre o tema. Acesse as referências disponibilizadas no post.\n.\n🗣️ Continue nos acompanhando para saber mais sobre os resultados do Estudo da Segurança Alimentar e Nutricional na Pandemia da Covid-19 (ESANP) e sobre os trabalhos desenvolvidos pelo nosso grupo!"
