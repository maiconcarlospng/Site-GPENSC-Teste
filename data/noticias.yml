    conteudo: "O GPENSC relembra presença de pesquisadores do GPENSC no 28º Congresso Brasileiro de Nutrição - CONBRAN 2024, em São Paulo, realizado entre os dias 21 a 24 de maio de 2024. O Congresso foi organizado pela Associação Paulista de Nutrição (APAN) e pela Associação Brasileira de Nutrição - ASBRAN(@asbran.brasil).\n.\n📝 A 28º edição do CONBRAN teve como tema principal “Alimentação e Nutrição na Perspectiva da Integralidade das Práticas do Cuidado”, com objetivo de debater a ciência e inspirar políticas públicas no país contra a fome e em defesa da alimentação saudável e adequada para todos. \n.\n➡️ Arraste para o lado e confira!\n.\n🎉 Parabenizamos a todos os membros por representar tão bem o GPENSC, o PPGSN e a UFOP!\n.\n🗣️ Continue nos acompanhando e fique por dentro de todas as nossas atividades e projetos!"
