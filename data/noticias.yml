    conteudo: "Conheça mais uma integrante do GPENSC! ✨\n\nMelissa Ionara Ribeiro Sabbagh é nutricionista formada pela Universidade Federal de Juiz de Fora (UFJF), mestre em Ciências da Nutrição pela Universidade Federal dos Vales do Jequitinhonha e Mucuri (UFVJM). Atualmente, é doutoranda no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN - @ppgsn.ufop) da Universidade Federal de Ouro Preto (UFOP), sob orientação da Profa. Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientação do Prof. Dr. Luiz Antônio Alves de Menezes Júnior (@luizmenezes_jr).\n\nAtua como pesquisadora no projeto “Vigilância Epidemiológica da COVID-19 na Região dos Inconfidentes/MG – COVID-Inconfidentes”, cujo objetivo é analisar a associação entre desigualdades sociais e a má qualidade do sono.\n\nContinue nos acompanhando para conhecer mais membros do grupo!\n\n#GPENSC #ciencia #nutricao #saudecoletiva #pesquisa"
