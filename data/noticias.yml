    resumo: "O GPENSC apresenta um membro do GPENSC!"
    conteudo: "O GPENSC apresenta um membro do GPENSC! 😍 Conheçam um pouco mais sobre a Professora Raquel.\n.\nA professora Raquel de Deus Mendonça possui graduação em Nutrição pela Universidade Federal de Minas Gerais (UFMG), mesma instituição que fez mestrado, doutorado (sanduíche na Universidad de Navarra, Espanha) e pós-doutorado, em Enfermagem e Saúde. \nAtualmente, é professora Adjunta do Curso de Nutrição da Universidade Federal de Ouro Preto (UFOP). Pesquisadora do Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva (GPENSC/UFOP) e do Núcleo Interinstitucional de Estudos Epidemiológicos em Saúde (NIELOS/UFMG). Tem experiência na área de Nutrição, com ênfase em Saúde Pública, atuando principalmente nos seguintes temas: Intervenção Nutricional, Epidemiologia Nutricional, Políticas e Programas de Alimentação e Nutrição.\n.\nContinuem nos acompanhando aqui para saber mais sobre nossos pesquisadores e seus estudos!"
