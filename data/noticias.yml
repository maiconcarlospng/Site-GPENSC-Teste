    titulo: "Métodos de estimação da carga de doenças e dos fatores de riscos nutricionais"
    resumo: "Nessa semana, realizamos a primeira reunião do GPENSC de 2021!"
    conteudo: "Nessa semana, realizamos a primeira reunião do GPENSC de 2021! \n.\n👥 Foi um momento de reencontro e de recepção dos novos membros. Aproveitamos para dar novamente as boas-vindas a todos, especialmente para os alunos que estão chegando agora. Que o nosso grupo possa ser um espaço de apoio mútuo, reflexão crítica, troca de conhecimento, aprendizagem, de fazer e discutir ciência!\n.\n👩🏽‍💻 No nosso primeiro encontro, também contamos com a apresentação do tema “Métodos de estimação da carga de doenças e dos fatores de riscos nutricionais”, realizado pela doutoranda Magda do Carmo Parajára (@magdaparajara). Nesse ano, nossas reuniões serão uma oportunidade para aprofundar temas comuns do grupo e discutir sobre as principais temáticas trabalhadas.\n.\n📚 Estamos muito animados com esse novo ano. Que 2021 possa ser um período de muitas oportunidades e de conhecimento para nós, e que permaneçamos juntos e conectados!\n.\n🗣 Continue nos acompanhando e fique por dentro de todas as nossas atividades e projetos!"
