    conteudo: "Hoje é dia de apresentar para vocês mais uma de nossas integrantes.\n.\n🎓 A Carla possui graduação em Nutrição pela Universidade Federal de Ouro Preto (UFOP). Atualmente, é mestranda do Programa de Pós-Graduação em Saúde e Nutrição (PPGSN-UFOP), na linha de pesquisa Nutrição em Saúde Coletiva. É membro do GPENSC e pesquisadora no projeto intitulado “Impactos financeiros e à saúde devidos à alimentação inadequada e ao excesso de peso no Brasil e Unidades Federativas”.\n\n📌 Sua pesquisa de mestrado é orientada pela professora Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes) e coorientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles).\n.\n🔎 Durante o mestrado, a Carla irá trabalhar com a carga de doenças atribuível a dieta rica em carnes processadas e seu custo financeiro para o Sistema Único de Saúde no Brasil.\n.\n🗣️ Continue nos acompanhando e fique por dentro deste e de outros trabalhos desenvolvidos pelo nosso grupo!"
