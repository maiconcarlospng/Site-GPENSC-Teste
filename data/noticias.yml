    conteudo: "Nessa semana, nos dias 28 e 29 de outubro, vai acontecer o III Seminário Latino-Americano de Ambiente Alimentar e Saúde - III SEMLAAAS (@semlaaas).\n.\n🗣️ Nós, do GPENSC, participaremos do III SEMLAAAS. Contaremos com a apresentação da doutoranda Irene Carolina Sousa Justiniano (@irenecsj_) e queremos convidar você que vai participar do evento para conhecer esse trabalho desenvolvido pelo nosso grupo, em parceria com o GEPPAAS/UFMG (@geppaasufmg).\n.\n👉🏽 Arraste para o lado e confira mais detalhes sobre a apresentação.\n. \n⚠️ E se você ainda não se inscreveu no evento, o link está na nossa bio. Corre que ainda dá tempo! Lembrando que o evento é gratuito!\n.\nNos vemos no III SEMLAAAS!"
