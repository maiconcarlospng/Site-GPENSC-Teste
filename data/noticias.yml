  - data: "2020-08-28"
    categoria: "Pesquisa"
    titulo: "Lembram que uns dias desses apresentamos o projeto de pesquisa da Erica?!"
    resumo: "Lembram que uns dias desses apresentamos o projeto de pesquisa da Erica?!"
    conteudo: "Lembram que uns dias desses apresentamos o projeto de pesquisa da Erica?! Pois bem, olhem que interessante este relatório sobre segurança alimentar e nutricional publicado pela FAO (@fao), em julho de 2020.\n.\n📈 O relatório contém as estimativas recentes da fome, da insegurança alimentar e da má nutrição em todo o mundo. O documento aponta que estamos longe de alcançar os ODS (Objetivos de Desenvolvimento Sustentável) da Agenda 2030. \n.\n⚠️ Projeções preliminares estimam que o número de pessoas desnutridas pode passar de 83 para 132 milhões em 2020 devido a pandemia da COVID-19. O relatório destaca ainda que a qualidade da dieta é um elo crítico entre a segurança alimentar e a nutrição, assim como questões referentes a custo e acessibilidade de dietas saudáveis em diferentes contextos e os padrões atuais de consumo de alimentos e mudanças climáticas. \n.\n💬 No relatório também são apresentadas orientações para nortear formuladores de políticas que devem considerar os diferentes contextos e realidades regionais na adequação das proposições.\n.\n💡 Convidamos todos à leitura desse documento que é parte dos esforços para pensar sistemas alimentares mais justos, sustentáveis e resilientes."
    url: "https://www.instagram.com/p/CEcz-CRgAI_/"
    imagem: "img/instagram-acervo/CEcz-CRgAI_.webp"
