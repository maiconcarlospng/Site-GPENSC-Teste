  - data: "2023-07-20"
    categoria: "Pesquisa"
    titulo: "Artigo: Avoidable diet-related deaths and cost-of-illness with culturally optimized modifications in diet: The case of Brazil"
    resumo: "O GPENSC apresenta o artigo intitulado \"Avoidable diet-related deaths and cost-of-illness with culturally optimized modifications in diet: The case of Brazil\", de autoria das professoras Dra"
    conteudo: "O GPENSC apresenta o artigo intitulado \"Avoidable diet-related deaths and cost-of-illness with culturally optimized modifications in diet: The case of Brazil\", de autoria das professoras Dra. Adriana Lúcia de Meireles (@dri.meireles) e Dra. Ísis Eloah Machado (@isiseloah) juntamente com outros pesquisadores da UERJ .\n.\n🎯 O artigo teve como objetivo projetar diferentes cenários dietéticos levando em consideração os preços e preferências dos alimentos, além de avaliar o número de mortes que seriam evitadas, bem como a carga econômica e os custos do sistema de saúde que seriam economizados no Brasil.\n.\n📝 Trata-se de um estudo que utilizou dados da  Pesquisa Nacional de Orçamentos Familiares (POF) e da Pesquisa Alimentar Nacional (PAN) 2017-2018. Modelos de programação linear foram executados para projetar cinco cenários com diferentes conjuntos de modificações importantes na dieta com o menor desvio do consumo da linha de base. Modelos comparativos de avaliação de risco foram usados para estimar os impactos na saúde de mudanças dietéticas otimizadas na mortalidade e os impactos econômicos na morbidade (hospitalizações) e mortes prematuras.\n.\n📈 As dietas otimizadas foram, em média, mais caras que as dietas de base, variando de 0,02/dia a 0,52/dia/adulto, considerando o dólar americano. O número de mortes evitadas ou adiadas variou de 12.750 (10.178-15.225) a 57.341 (48.573-66.298) de acordo com os diferentes cenários. As modificações na dieta economizaria de 50 a 219 milhões em hospitalizações e de 239 a 804 milhões anuais em perdas de produtividade com a redução de mortes prematuras.\n.\n💡 Os resultados evidenciam a importância de uma boa alimentação, sobretudo quando se trata da prevenção de mortes e custos por hospitalizações, além da perda na produtividade dos indivíduos. Cenário que pode ser modificado com a contribuição de subsídios e políticas sociais para melhorar as dietas da população. \n.\n🔗 Acesse o artigo: https://pubmed.ncbi.nlm.nih.gov/37432939/"
    url: "https://www.instagram.com/p/Cu7wun4Om_6/"
    imagem: "img/instagram-acervo/Cu7wun4Om_6.webp"
