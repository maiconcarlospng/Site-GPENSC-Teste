  - data: "2026-05-18"
    categoria: "Internacionalização"
    titulo: "Doutoranda do GPENSC desenvolve atividades na Universidad de Granada"
    resumo: "Vitória Regina Pinto iniciou período de doutorado sanduíche na Universidad de Granada, na Espanha."
    conteudo: "Em março, a pesquisadora do GPENSC e doutoranda do PPGSN/UFOP (@ppgsn.ufop), Vitória Regina Pinto (@vitoriareginan), iniciou seu doutorado sanduíche no Grupo de Investigación en Psicofisiología Humana y Salud, do Centro de Investigación Mente y Cerebro (@cimcyc) (CIMCYC), da Universidad de Granada (@canalug) – Facultad de Psicología, na Espanha, com bolsa da Fapemig. Durante esse período, Vitória desenvolverá sua pesquisa sobre mecanismos hedônicos (“liking”) e motivacionais (“wanting”) associados à obesidade e ao transtorno da compulsão alimentar periódica (TCAP), sob supervisão do Prof.º Dr.º David García-Burgos (Universidad de Granada) e orientação da Prof.ª Dr.ª Julia Cristina Cardoso Carraro (@julia_carraro) (UFOP). A experiência representa uma importante oportunidade para o aprofundamento técnico e científico em abordagens psicofisiológicas do comportamento alimentar, contribuindo para a compreensão mais integrativa da obesidade e da compulsão alimentar, para além dos aspectos exclusivamente nutricionais. Além disso, fortalece as colaborações científicas internacionais e amplia o processo de internacionalização do GPENSC e do PPGSN/UFOP. Desejamos muito sucesso nessa trajetória, Vitória! ✨"
    url: "https://www.instagram.com/p/DYfzjIykS0C/"
    imagem: "img/instagram/DYfzjIykS0C.jpg"

