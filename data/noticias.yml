    conteudo: "Apresentamos com alegria mais um membro do GPENSC! \n\nTania Manjarrés Rodríguez (@taniamanjarresfit) é bióloga pela Universidad Pedagógica y Tecnológica da Colômbia. É mestre em Conservação e Uso da Biodiversidade pela Pontificia Universidad Javeriana de Bogotá. Especialista em Nutrição Certificada Internacionalmente pelo Nutrition Coach Institute. Atualmente, é doutoranda em Nutrição Humana e Alimentos pela Universidad de Antioquia e doutoranda sanduíche no Programa de Pós-Graduação em Saúde e Nutrição (@ppgsn.ufop ), sob orientação da professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut).\n \n\nTania contribui para a saúde alimentar e ecologicamente sustentável, diminuindo os impactos ambientais por meio da potencialização da agrobiodiversidade, das tradições ancestrais e da alimentação agrossustentável.\n\nContinue nos acompanhando para conhecer novos membros.\n\n #GPENSC #Ciência #AlimentaçãoSustentável #Pesquisa"
