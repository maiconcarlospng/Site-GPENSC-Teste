    conteudo: "Nosso #tbt é bem recente, para lembrar da primeira reunião do GPENSC, que aconteceu no dia 13 de fevereiro de 2023.\n.\n👥 Foi um momento de reencontro, trocas e boas-vindas. No nosso primeiro encontro, também fizemos uma retrospectiva das atividades de 2022 e discutimos ideias e projetos para o ano de 2023. Estamos animados com esse retorno! \n.\n💟 Que o nosso grupo possa ser um espaço de apoio mútuo, reflexão crítica, troca de conhecimento, aprendizagem, de fazer e discutir ciência! Que os laços que nos unem sejam fortalecidos para que possamos ir cada vez mais longe, colhendo os frutos do nosso trabalho.\n.\n🗣 Continue nos acompanhando e fique por dentro de todas as nossas atividades e projetos!"
