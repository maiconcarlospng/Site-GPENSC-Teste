    titulo: "O GPENSC apresenta outra pesquisadora do nosso grupo☺️"
    resumo: "O GPENSC apresenta outra pesquisadora do nosso grupo☺️"
    conteudo: "O GPENSC apresenta outra pesquisadora do nosso grupo☺️\n.\nA Erica é nutricionista e trabalha desde 2011 no Programa de Alimentação Escolar do Município de Mariana- MG. Ela é graduada em nutrição pela Faculdade Itabirana de Saúde (2009), especialista em alimentação escolar pelo Centro Colaborador de Alimentação e Nutrição da Universidade Federal de Ouro Preto -UFOP (2014), mestre em Saúde e Nutrição pela mesma instituição (2018) e atualmente está cursando doutorado no Programa de Pós graduação em Saúde e Nutrição – UFOP.  Sua atual pesquisa orientada pela professora Dra. Adriana Meirelles (@dri_meireles )e coorientada pela professora Dra. Raquel Mendonça (@raquelmendonca_enut ), intitulada ESANP –Estudo da Segurança Alimentar e Nutricional na Pandemia da Covid-19: situação domiciliar dos alunos de Mariana e Ouro Preto.\n\n📝A pesquisa propõe realizar um estudo longitudinal com seguimento de 2 anos para avaliar a situação de segurança alimentar, o ambiente alimentar domiciliar, testagem anti Sars-Cov-2 e os aspetos quali-quantitativos dos cardápios oferecidos aos alunos. \n\nQuer saber mais sobre esse tema? Continue acompanhando nossas postagens.🧐"
    url: "https://www.instagram.com/p/CEKeTnHgUpK/"
    imagem: "img/instagram-acervo/CEKeTnHgUpK.webp"
