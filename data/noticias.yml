    titulo: "Episódio: Como brasileiros analisam a própria saúde mental"
    resumo: "O GPENSC recomenda o episódio “Como brasileiros analisam a própria saúde mental”, do podcast Café da Manhã"
    conteudo: "O GPENSC recomenda o episódio “Como brasileiros analisam a própria saúde mental”, do podcast Café da Manhã.\n.\n🎙️ O episódio apresenta uma pesquisa realizada pelo Datafolha, que mostrou que três em cada dez pessoas se sentem ansiosas, têm problemas com sono e com a alimentação, sempre ou frequentemente. Além disso, o episódio discute os caminhos para a redução do estigma em torno desse tema e faz uma análise dos obstáculos para o acesso ao cuidado pessoal.\n.\n👥 O episódio conta com a participação da psicanalista Vera Iaconelli (@vera.iaconelli), mestre e doutora em psicologia pela Universidade de São Paulo (USP).\n.\n🔎 Esse e outros episódios do podcast Café da manhã estão disponíveis no Spotify.\n.\n📌 Aproveita e já salva esse post e não deixe de marcar aqui nós comentários ou enviar essa publicação para aquele(a) amigo(a) que vai gostar dessa indicação."
