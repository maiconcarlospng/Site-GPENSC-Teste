  - data: "2021-11-02"
    categoria: "Pesquisa"
    titulo: "Artigo: Diagnostic accuracy of the Berlin questionnaire and the NoSAS score in detecting risk for obstructive sleep apnea in rotating shift workers"
    resumo: "Tem produção nova do GPENSC!"
    conteudo: "Tem produção nova do GPENSC!\n.\n📄 Hoje, trazemos para vocês o artigo intitulado “Diagnostic accuracy of the Berlin questionnaire and the NoSAS score in detecting risk for obstructive sleep apnea in rotating shift workers”, de autoria do doutorando Luiz Menezes (@luizmenezes__ ), sob a orientação da professora Dra. Adriana Lúcia Meireles (@dri_meireles), juntamente com outros pesquisadores. Esse artigo é produto do mestrado do Luiz e faz parte do projeto intitulado “Manejo da Fadiga”, realizado entre os anos de 2012 e 2018.\n.\n🎯 O objetivo do artigo foi avaliar a acurácia diagnóstica do questionário de Berlim (QB) e do escore NoSAS como instrumentos de rastreio para apneia obstrutiva do sono (AOS), em trabalhadores de turno alternante.\n.\n📌 O diagnóstico de AOS foi realizado pela polissonografia (padrão-ouro). O QB é um questionário com três categorias: presença de ronco, sonolência diurna excessiva e comorbidades (hipertensão e obesidade). O escore NoSAS é pontuado a partir dos valores de IMC, circunferência do pescoço, idade, sexo e presença de ronco.\n.\n📊 Foram avaliados 119 trabalhadores de 24 a 57 anos de idade. A polissonografia mostrou que 84% tinham AOS, sendo 46% AOS moderada a grave. Avaliando os resultados de acurácia, o escore NoSAS obteve os melhores resultados para todas as severidades de AOS. Quando avaliada a idade, observamos que o QB foi mais adequado para trabalhadores mais velhos (> 35 anos), enquanto o escore NoSAS foi melhor para os trabalhadores mais jovens (< 35 anos).\n.\n💡 Verificamos que os trabalhadores de turnos alternantes têm uma prevalência elevada de AOS, e que o escore NoSAS é mais adequado para a identificação da AOS do que o QB. Como é uma ferramenta prática e fácil de aplicar, pode ser utilizada para identificar os trabalhadores por turnos para avaliação do estudo do sono.\n.\n🔗 O artigo pode ser encontrado no seguinte link: https://link.springer.com/article/10.1007%2Fs11325-021-02446-5r"
    url: "https://www.instagram.com/p/CVyLwWJvXUY/"
    imagem: "img/instagram-acervo/CVyLwWJvXUY.webp"
