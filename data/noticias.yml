  - data: "2023-03-07"
    categoria: "Ensino"
    titulo: "Artigo: Key characteristics including sex, sexual orientation and internet use associated with worse mental health among university students in Brazil and implications"
    resumo: "O GPENSC apresenta o artigo intitulado \"Key characteristics including sex, sexual orientation and internet use associated with worse mental health among university students in Brazil and implications\", de autoria da doutoranda Waléria de Paula (@waleria_dp) juntamente com outros pesquisadores da UFOP"
    conteudo: "O GPENSC apresenta o artigo intitulado \"Key characteristics including sex, sexual orientation and internet use associated with worse mental health among university students in Brazil and implications\", de autoria da doutoranda Waléria de Paula (@waleria_dp) juntamente com outros pesquisadores da UFOP. \n.\n🎯 O artigo, um dos produtos da dissertação de mestrado da Waléria, teve como objetivo avaliar a prevalência e os fatores associados aos sintomas de ansiedade e de depressão entre universitários do primeiro semestre da Universidade Federal de Ouro Preto.\n.\n📝 Trata-se de um estudo transversal realizado com estudantes do primeiro semestre de cursos de graduação. Os dados foram coletados por meio de um questionário impresso autoaplicável composto por variáveis sociodemográficas, estilos de vida, condições de saúde e a escala de ansiedade, depressão e estresse (DASS-21). O desfecho do estudo foi a presença de sintomas de ansiedade e de depressão. \n.\n📈 Os resultados indicam que a prevalência de sintomas de ansiedade e de depressão foi de 42,5% e 33,2%, respectivamente. Observou-se associação positiva entre a presença dos transtornos mentais avaliados com sexo feminino, não heterossexual, cor da pele não branca, uso excessivo de internet, falta de atividade física, não frequentar festas universitárias, ter acompanhamento psicológico, histórico de ansiedade em parentes de primeiro ou segundo grau, autoavaliação de saúde ruim e uso de medicamentos psicotrópicos.\n.\n💡 Os achados do estudo destacam a importância do desenvolvimento de programas de promoção da saúde mental e física entre a população universitária.\n.\n🔗 Acesse o artigo: \nhttps://doi.org/10.1093/pubmed/fdab406"
    url: "https://www.instagram.com/p/CpgIrrcuZhT/"
    imagem: "img/instagram-acervo/CpgIrrcuZhT.webp"
  - data: "2023-02-15"
    categoria: "Ensino"
    titulo: "Artigo: Age, skin color, self-rated health, and depression associated with co-occurrence of obesogenic behaviors in university students: a cross-sectional study"
    resumo: "O GPENSC apresenta o artigo intitulado “Age, skin color, self-rated health, and depression associated with co-occurrence of obesogenic behaviors in university students: a cross-sectional study”, de autoria da doutoranda Bruna Carolina Barbosa (@brunabcrb), juntamente com outros pesquisadores do GPENSC e da UFMG"
    conteudo: "O GPENSC apresenta o artigo intitulado “Age, skin color, self-rated health, and depression associated with co-occurrence of obesogenic behaviors in university students: a cross-sectional study”, de autoria da doutoranda Bruna Carolina Barbosa (@brunabcrb), juntamente com outros pesquisadores do GPENSC e da UFMG.\n.\n🎯 O artigo, um dos produtos da dissertação de mestrado da Bruna, teve como objetivo estimar a prevalência e os fatores associados à coocorrência de comportamentos obesogênicos entre universitários.\n.\n📝 Trata-se de um estudo transversal realizado com estudantes ingressantes em 2019 nos cursos de graduação de uma universidade pública brasileira. Os dados foram coletados entre abril e setembro de 2019, por meio de um questionário autoaplicável. O desfecho foi a coocorrência de comportamentos obesogênicos, mensurada a partir da soma de três comportamentos de risco: práticas alimentares inadequadas, inatividade física no lazer e comportamento sedentário.\n.\n📈 Os resultados deste estudo indicam que os comportamentos obesogênicos são altamente prevalentes entre os estudantes universitários e tendem a ocorrer de forma simultânea. Observou-se que as práticas alimentares inadequadas constituíram o comportamento obesogênicos isolado mais prevalente (80,6%), que também foi o mais prevalente quando combinado com o comportamento sedentário (23,6%). Estudantes universitários com idade igual ou inferior a 20 anos, cor da pele não branca, autoavaliação de saúde ruim e sintomas depressivos tiveram maiores chances de ocorrência simultânea de comportamentos obesogênicos.\n.\n💡 Esses achados destacam a importância de desenvolver e implementar ações para reduzir os comportamentos obesogênicos combinados no ambiente universitário. As instituições devem se concentrar na criação de um ambiente que promova comportamentos de proteção à saúde, como atividade física e alimentação saudável.\n.\n🔗 Acesse o artigo: https://doi.org/10.1590/1516-3180.2022.0301.R1.10102022"
    url: "https://www.instagram.com/p/Coso2ioOW0_/"
    imagem: "img/instagram-acervo/Coso2ioOW0_.webp"
