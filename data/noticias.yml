    categoria: "Ensino"
    titulo: "Projeto: Impactos financeiros e à saúde devidos à alimentação inadequada e ao excesso de peso no Brasil e Unidades Federativas"
    resumo: "O GPENSC apresenta os alunos de iniciação científica do projeto “Impactos financeiros e à saúde devidos à alimentação inadequada e ao excesso de peso no Brasil e Unidades Federativas” e membros do GPENSC"
    conteudo: "O GPENSC apresenta os alunos de iniciação científica do projeto “Impactos financeiros e à saúde devidos à alimentação inadequada e ao excesso de peso no Brasil e Unidades Federativas” e membros do GPENSC.\n.\n🎓 O Helton da Costa Paiva (@heltonpaiva05) é aluno do sexto período do curso de Nutrição, da Universidade Federal de Ouro Preto (UFOP). Seu tema de pesquisa e do seu Trabalho de Conclusão de Curso (TCC) dentro desse projeto maior é “Tendência da carga de doenças cardiovasculares atribuível ao consumo insuficiente de grãos integrais na população brasileira, no período de 1990 a 2019”. Helton é orientado pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientado pela doutoranda Magda do Carmo Parajára (@magdaparajara).\n.\n🎓A Iana Barboza (@ianacmb) é aluna do quinto período de Nutrição (UFOP), orientada pela professora Dra. Mariana Carvalho de Menezes (@maricarvalhomeneses) e coorientada pela mestranda Joice Vieira Leal (@joicesvleal). Seu tema de pesquisa e também de TCC é intulado “A carga da Diabetes Mellitus tipo 2 (DM-2) atribuída ao consumo elevado de bebidas açucaradas na população brasileira em 2019”. \n.\n🎓A Jéssica Venâncio Pio é aluna do quinto período do curso de Nutrição (UFOP). Durante a iniciação científica, Jéssica foi orientada pela professora Dra. Adriana e coorientada pela mestranda Carla Eduarda Rocha (carlaef.rocha).\n.\n🗣️ Continue nos acompanhando e fique por dentro destes e de outros trabalhos que estão sendo desenvolvidos por nossos alunos de iniciação científica."
