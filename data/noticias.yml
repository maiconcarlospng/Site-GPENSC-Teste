    titulo: "Hoje, no #compartilhaGPENSC vamos falar sobre a Nova Cesta Básica Nacional pautada no Guia Alimentar para a População Brasileira"
    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre a Nova Cesta Básica Nacional pautada no Guia Alimentar para a População Brasileira"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre a Nova Cesta Básica Nacional pautada no Guia Alimentar para a População Brasileira.\n.\n🎯 O conceito de cesta básica alimentar refere-se a um conjunto de alimentos que busca garantir o direito humano à alimentação adequada e saudável, bem como à saúde e ao bem-estar da população. Esse conceito considera como direito humano fundamental o acesso contínuo e regular, de maneira socialmente justa, a uma alimentação que atenda aos aspectos biológicos e sociais de cada indivíduo.\n.\n🥬 Alimentos in natura ou minimamente processados serão priorizados na Cesta Básica. O objetivo é evitar o consumo de alimentos ultraprocessados, pois evidências científicas indicam que eles aumentam a prevalência de doenças cardiovasculares, diabetes, obesidade, hipertensão e vários tipos de câncer.\n.\n💡A mudança busca criar sistemas alimentares saudáveis e sustentáveis, promovendo a proteção de uma alimentação adequada e saudável, a saúde, o meio ambiente e a geração de renda para pequenos produtores rurais. Sempre que possível, devem ser priorizados alimentos agroecológicos, produzidos na mesma região onde serão consumidos e provenientes da agricultura familiar.\n.\n🔗 Para saber mais sobre o assunto, acesse: https://www.gov.br/planalto/pt-br/acompanhe-o-planalto/noticias/2024/03/publicado-decreto-que-regulamenta-nova-composicao-da-cesta-basica\n.\n🗣️ Gostou do conteúdo? Compartilha com os amigos e aproveita para salvar essa recomendação."
    url: "https://www.instagram.com/p/C-D5FRsvhIi/"
    imagem: "img/instagram-acervo/C-D5FRsvhIi.webp"
