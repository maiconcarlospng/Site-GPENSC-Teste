    imagem: "img/instagram-acervo/C0SUAoDOfQf.webp"
  - data: "2023-11-09"
    categoria: "Institucional"
    titulo: "Triagem de hipertensos e efetividade da entrevista motivacional sobre o controle da pressão arterial e consumo de frutas, verduras e legumes (FVL) em usuários da Atenção Primária à Saúde (APS)"
    resumo: "O GPENSC relembra qualificação de doutorado da aluna Raíssa de Melo Matos Ferreira (@raissa.mmatos), que ocorreu no dia 29 de setembro de 2023, via Google Meet"
    conteudo: "O GPENSC relembra qualificação de doutorado da aluna Raíssa de Melo Matos Ferreira (@raissa.mmatos), que ocorreu no dia 29 de setembro de 2023, via Google Meet.\n.\n🔎 O projeto de doutorado da Raíssa, intitulado “Triagem de hipertensos e efetividade da entrevista motivacional sobre o controle da pressão arterial e consumo de frutas, verduras e legumes (FVL) em usuários da Atenção Primária à Saúde (APS)”, tem como objetivo elaborar e validar um instrumento de triagem para hipertensão arterial sistêmica (HAS), bem como verificar a efetividade de uma intervenção pautada na entrevista motivacional e no Guia Alimentar para a População Brasileira para o controle da HAS e melhora do consumo de FLV em usuários da APS de Ouro Preto-MG.\n.\n👥 Seu estudo é orientado pela professora Dra. Júlia Carraro - @julia_carraro (UFOP) e coorientado pelo Dr. Luiz Menezes - @menezesnutri (UFOP). O trabalho contou com as contribuições da banca formada pelas professoras Dra. Lidiane Bernardes -@lidibernardes (UNIRV), Dra. Mariana Menezes -@maricarvalhomenezes (UFOP) e Dra. Erika dos Reis - @erikacareis (UFOP)\n.\n📊 Os resultados preliminares indicam um questionário adequado na análise de conteúdo, análises fatoriais e na confiabilidade, sendo um bom instrumento para atender os objetivos de triagem de HAS na APS.\n.\n💡Espera-se que os achados contribua para ampliar o entendimento sobre os fatores individuais relacionados a HAS, auxiliando na consolidação do conhecimento científico sobre a temática, principalmente no controle da HAS e produção de tecnologias para APS.\n.\n🎆 Parabenizamos a Raíssa pela sua aprovação na qualificação e pela contribuição para a ciência do país. Desejamos à aluna sucesso nas próximas etapas!"
    url: "https://www.instagram.com/p/CzcMgejOXJa/"
    imagem: "img/instagram-acervo/CzcMgejOXJa.webp"
