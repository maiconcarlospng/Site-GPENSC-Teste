    conteudo: "Hoje, temos uma lembrança muito especial, a Defesa de Mestrado da Ana Carla de Alcântara, que aconteceu em fevereiro, na #UFOP 👩🏻‍🎓👏🏻 A dissertação intitulada “Fatores associados à inatividade física e ao comportamento sedentário em egressos de universidades mineiras” faz parte do Projeto CUME (@projeto_cume), foi desenvolvida com a orientação da professora Dra. Adriana Lúcia Meireles e co-orientação da professora Dra. Júlia Cristina Cardoso Carraro, no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN/UFOP). O trabalho também contou com as contribuições das professoras Dras. Milene Cristine Pessoa (UFMG) e Aline Elizabeth da Silva Miranda (UFMG), que compuseram a banca examinadora."
