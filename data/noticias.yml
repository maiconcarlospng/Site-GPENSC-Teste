  - data: "2022-02-15"
    categoria: "Pesquisa"
    titulo: "Artigo: Polyphenols for improvement of inflammation and symptoms in rheumatic diseases: systematic review"
    resumo: "Hoje, trazemos para vocês o artigo intitulado “Polyphenols for improvement of inflammation and symptoms in rheumatic diseases: systematic review”, de autoria da doutoranda Hillary Nascimento Coletro (@hillarycoletro), sob a orientação das professoras Dras"
    conteudo: "Hoje, trazemos para vocês o artigo intitulado “Polyphenols for improvement of inflammation and symptoms in rheumatic diseases: systematic review”, de autoria da doutoranda Hillary Nascimento Coletro (@hillarycoletro), sob a orientação das professoras Dras. Júlia Carraro (@julia_carraro), Raquel Mendonça (@raquelmendonca_enut) e Adriana Meireles (@dri_meireles), juntamente com participação de outras pesquisadoras da UFOP.\n.\n🎯 Esse artigo é produto do mestrado da Hillary e teve como objetivo sintetizar dados de ensaios clínicos randomizados com relação a administração de polifenóis e seus efeitos sobre as doenças reumáticas, que são um grupo de condições patológicas caracterizadas por inflamação e incapacidade funcional.\n. \n💻 Foi realizada uma busca sistemática nas bases de dados PubMed (Medline), LILACS (BVS), IBECS (BVS), CUMED (BVS), BINACIS (BVS), EMBASE, Web of Science e Cochrane Library e na literatura cinzenta. No total, 646 artigos foram considerados elegíveis, dos quais 33 foram submetidos à leitura completa. Destes, 17 artigos foram selecionados para compor a revisão sistemática.\n.\n💡 Após análise seguindo o protocolo PRISMA-P checklist, é possível inferir que os polifenóis são potenciais aliados no tratamento e mitigação da atividade da doença de doenças reumáticas e melhora da qualidade de vida dos portadores desses agravos.\n.\n🔗 Acesse o artigo no link abaixo:\nhttps://www.scielo.br/j/spmj/a/9gsypp88wfZfKZrgRKqLs7D/?lang=en"
    url: "https://www.instagram.com/p/CaAywo5OLF-/"
    imagem: "img/instagram-acervo/CaAywo5OLF-.webp"
  - data: "2022-02-11"
    categoria: "Pesquisa"
    titulo: "Desde 2015, a partir de uma iniciativa da UNESCO e ONU, no dia 11 de fevereiro comemoramos o Dia Internacional das Mulheres e Meninas na Ciência, com o objetivo de fortalecer…"
    resumo: "Desde 2015, a partir de uma iniciativa da UNESCO e ONU, no dia 11 de fevereiro comemoramos o Dia Internacional das Mulheres e Meninas na Ciência, com o objetivo de fortalecer políticas de permanência na carreira científica e o compromisso global com a equidade de gênero nas instituições de pesquisa"
    conteudo: "Desde 2015, a partir de uma iniciativa da UNESCO e ONU, no dia 11 de fevereiro comemoramos o Dia Internacional das Mulheres e Meninas na Ciência, com o objetivo de fortalecer políticas de permanência na carreira científica e o compromisso global com a equidade de gênero nas instituições de pesquisa.\n.\n👩🏻‍🔬 A criação da data visa alcançar um maior destaque para a pauta, visto que ainda são necessários esforços para a participação igualitária das mulheres na ciência. Essa data não somente celebra a atuação e o legado de pesquisadoras ao redor do mundo, como também relembra os desafios enfrentados diante do atual cenário e reforça o papel e as contribuições fundamentais das mulheres nas áreas de pesquisa científica e tecnológica.\n.\n💌 Fica nossa homenagem para todas as mulheres extraordinárias, principalmente para as líderes (@dri_meireles, @julia_carraro, @maricarvalhomenezes e @raquelmendonca_enut) e membras do GPENSC, que se empenham para fazer ciência com amor, ética e respeito, rompem barreiras e estigmas em suas trajetórias e abrem caminhos antes inacessíveis para as mulheres.\n.\nCom carinho, GPENSC ❤️"
    url: "https://www.instagram.com/p/CZ1tGytOzvL/"
    imagem: "img/instagram-acervo/CZ1tGytOzvL.webp"
  - data: "2022-02-08"
    categoria: "Pesquisa"
    titulo: "Artigo: Influence of dietary total antioxidant capacity on the association between smoking and hypertension in Brazilian graduates"
    resumo: "Hoje, trazemos para vocês o artigo intitulado “Influence of dietary total antioxidant capacity on the association between smoking and hypertension in Brazilian graduates”, de autoria da doutoranda Thaís Sabião (@thasabiao), sob a orientação da professora Dra"
    conteudo: "Hoje, trazemos para vocês o artigo intitulado “Influence of dietary total antioxidant capacity on the association between smoking and hypertension in Brazilian graduates”, de autoria da doutoranda Thaís Sabião (@thasabiao), sob a orientação da professora Dra. Aline Aguiar (@aline.saguiar) e coorientação da professora Dra. Júlia Carraro (@julia_carraro), juntamente com outros pesquisadores. Esse artigo é produto do mestrado da Thaís e faz parte do Projeto CUME (@projeto_cume).\n.\n🎯 O objetivo do artigo foi avaliar a influência da capacidade antioxidante total da dieta (CATd) na associação entre tabagismo e a hipertensão arterial sistêmica (HAS).\n.\n📊 Foram incluídos no estudo 4.303 participantes. Verificou-se que fumantes atuais e ex-fumantes apresentaram valores de CATd mais altos, apesar do menor consumo de frutas. Observou-se que o café foi o principal contribuinte para o maior consumo de antioxidante entre os participantes. O tabagismo foi associado à HAS, sobretudo entre os indivíduos com maior CATd, porém, após exclusão da capacidade antioxidante do café, a associação só permaneceu em indivíduos com menor CATd.\n.\n💡 Os achados do estudo evidenciam que a ingestão de fontes antioxidantes que não seja o café deve permanecer em foco de estratégias nutricionais para HAS.\n.\n🔗 Acesse o artigo no link abaixo: \nhttps://www.nmcd-journal.com/article/S0939-4753(21)00248-9/fulltext"
    url: "https://www.instagram.com/p/CZuy6-yvg8p/"
    imagem: "img/instagram-acervo/CZuy6-yvg8p.webp"
  - data: "2022-02-03"
    categoria: "Pesquisa"
    titulo: "Nessa semana, apresentamos para vocês a pesquisa da Raíssa de Melo Matos Ferreira"
    resumo: "Nessa semana, apresentamos para vocês a pesquisa da Raíssa de Melo Matos Ferreira (@raissa.mmatos)"
    conteudo: "Nessa semana, apresentamos para vocês a pesquisa da Raíssa de Melo Matos Ferreira (@raissa.mmatos). Mas por que estudar sobre a efetividade da entrevista motivacional para o controle do diabetes e da hipertensão arterial?\n.\n👩🏾‍⚕️ Um dos principais desafios na prevenção, tratamento e controle do diabetes mellitus tipo 2 e da hipertensão arterial no atendimento básico de saúde é criar estratégias das quais os profissionais da saúde possam engajar e apoiar os pacientes na tomada de decisão compartilhada.\n.\n👥 A entrevista motivacional é um estilo eficaz de comunicação colaborativa para a promoção de mudanças no estilo de vida e no manejo de doenças crônicas não transmissíveis.\n.\n🎯 O objetivo do artigo foi avaliar a eficácia da entrevista motivacional no manejo do diabetes mellitus tipo 2 e hipertensão arterial na atenção primária à saúde.\n.\n📊 Após seis meses de estudo, houve diferenças estatisticamente significativas entre os grupos que tiverem a entrevista motivacional, com melhora da pressão arterial sistólica (p<0,01), pressão arterial diastólica (p<0,01) e pontuação total de adesão ao tratamento (p=0,01). O grupo da entrevista motivacional apresentou níveis de hemoglobina glicada significativamente reduzidos (0,4%) ao final do estudo (p<0,01).\n.\n🏥 Conclui-se que, no contexto da atenção primária à saúde, a consulta baseada na entrevista motivacional mostrou-se como uma estratégia de cuidado mais eficaz do que o cuidado usual para melhorar os níveis da pressão arterial e os graus de adesão em indivíduos com diabetes mellitus tipo 2 e hipertensão arterial. Além disso, a entrevista motivacional demonstrou ser útil na redução dos níveis de hemoglobina glicada e no controle do diabetes.\n.\n👉🏾 Arraste para o lado e confira o resumo do artigo."
