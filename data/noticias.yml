  - data: "2024-12-10"
    categoria: "Divulgação científica"
    titulo: "Cartilha sobre estratégias de publicidade alimentar é divulgada"
    resumo: "O GPENSC apresentou a cartilha Estratégias da publicidade na alimentação, elaborada por Tainá Damasceno no âmbito do projeto HipertenSUS."
    conteudo: "O GPENSC recomenda a cartilha “Estratégias da publicidade na alimentação”, lançada em novembro de 2024. O material foi elaborado pela doutoranda Tainá Damasceno (@tainacdamasceno), pesquisadora do projeto HipertenSUS, coordenado pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut). 💡A cartilha apresenta informações valiosas sobre a publicidade na alimentação, com destaque para o alerta sobre os perigos das propagandas e estratégias de marketing voltadas à venda de alimentos ultraprocessados, bem como os riscos associados ao consumo dessa classe de alimentos. Além disso, destaca a importância de verificar os rótulos para identificar a qualidade dos alimentos e recomenda o aplicativo Desrotulando (@desrotulandoapp) como um aliado nessa tarefa. 📚 A leitura é relevante para todos, pois o conhecimento sobre rótulos, composição e os riscos associados aos alimentos ultraprocessados é essencial para garantir o acesso à informação e promover a autonomia nas escolhas alimentares. 🔎 Para conferir a cartilha na íntegra e outros materiais do projeto acesse o link: https://enut.ufop.br/material-educativo . 🗣️ Gostou da dica? Compartilha com os amigos e aproveitar para salvar essa recomendação"
    url: "https://www.instagram.com/p/DDaegChvGF_/"
    imagem: "img/instagram/DDaegChvGF_.jpg"

