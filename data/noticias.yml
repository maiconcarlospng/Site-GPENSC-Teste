  - data: "2023-03-02"
    categoria: "Institucional"
    titulo: "Consumo de bebidas alcoólicas e sua interface com as condições socioeconômicas e demográficas durante a pandemia da covid-19: COVID-Inconfidentes"
    resumo: "O GPENSC relembra qualificação de doutorado da aluna Amanda Popolino Diniz (@amandapopolinonutri), que ocorreu no dia 23 de dezembro de 2022, via Google Meet"
    conteudo: "O GPENSC relembra qualificação de doutorado da aluna Amanda Popolino Diniz (@amandapopolinonutri), que ocorreu no dia 23 de dezembro de 2022, via Google Meet. \n.\n📝 O projeto de doutorado da Amanda, intitulado “Consumo de bebidas alcoólicas e sua interface com as condições socioeconômicas e demográficas durante a pandemia da covid-19: COVID-Inconfidentes”, tem como objetivo avaliar a prevalência do consumo de bebidas alcoólicas em residentes da região dos Inconfidentes/MG durante a pandemia da covid-19 e os fatores socioeconômicos associados. \n.\n👥 Seu estudo é orientado pela professora Dra. Adriana Lúcia Meireles (@dri_meireles ) e coorientado pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut ). O trabalho contou com as contribuições da banca composta pelo professor Dr. Crizian Saar (UFMG) e pelas professoras Dras. Anelise Souza - @andradeanelise (UFOP), Ísis Eloah - @isiseloah (UFOP) e Júlia Carraro - @julia_carraro (UFOP). \n.\n📊 Os resultados preliminares indicam uma prevalência do consumo de bebidas alcoólicas de 55,5% durante a pandemia da covid-19, sendo observada relação com o sexo, faixa etária, número de filhos, grau de escolaridade, estrutura domiciliar e atividade laboral. \n.\n📍Os resultados reforçam a importância de programas que visem a promoção da saúde e redução do consumo de bebidas alcoólicas, para que os danos à saúde da população sejam minimizados.\n.\n🎆 Parabenizamos a Amanda pela sua aprovação na qualificação e pela contribuição para a ciência do país. Desejamos à aluna sucesso nas próximas etapas!"
    url: "https://www.instagram.com/p/CpTQ-mQu4LC/"
    imagem: "img/instagram-acervo/CpTQ-mQu4LC.webp"
  - data: "2023-02-23"
    categoria: "Institucional"
    titulo: "Livro: Donos do Mercado: como os grandes supermercados exploram trabalhadores, fornecedores e a sociedade"
    resumo: "O GPENSC recomenda o livro “Donos do Mercado: como os grandes supermercados exploram trabalhadores, fornecedores e a sociedade” escrito por João Peres e Victor Matioli, ambos profissionais do O Joio e O Trigo"
    conteudo: "O GPENSC recomenda o livro “Donos do Mercado: como os grandes supermercados exploram trabalhadores, fornecedores e a sociedade” escrito por João Peres e Victor Matioli, ambos profissionais do O Joio e O Trigo.\n.\n📚 O livro foi publicado em outubro de 2020 e conta a história dos grandes supermercados no Brasil, abordando como eles surgiram e cresceram tanto. Ainda, os autores abordam sobre os impactos que esse gigantismo traz para os consumidores e trabalhadores em geral. \n.\n🎯 O objetivo do livro é tornar o leitor consciente dos impactos que estas grandes redes de supermercados tem em nossas vidas, e como eles afetam a produção, transporte e comercialização de alimentos no Brasil. \n.\n👉🏻 Arraste para o lado e confira.\n.\n🗣️ Aproveita e já salva esse post e não deixe de marcar aqui nos comentários ou enviar essa publicação para aquele(a) amigo(a) que vai gostar dessa indicação."
