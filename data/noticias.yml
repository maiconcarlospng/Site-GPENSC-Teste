  - data: "2026-09-01"
    categoria: "Ensino"
    titulo: "Você sabia que o sistema alimentar e a produção atual impactam diretamente nossas escolhas e saúde?"
    resumo: "Você sabia que o sistema alimentar e a produção atual impactam diretamente nossas escolhas e saúde? 💭 O estudo qualitativo conduzido por Anabele Pires Santos,…"
    conteudo: "Você sabia que o sistema alimentar e a produção atual impactam diretamente nossas escolhas e saúde? 💭\n\nO estudo qualitativo conduzido por Anabele Pires Santos, Raquel de Deus Mendonça e demais pesquisadoras da Universidade Federal de Ouro Preto (UFOP) e da Universidade Federal de Minas Gerais (UFMG) investigou a percepção de usuários com hipertensão arterial acompanhados na Atenção Primária à Saúde (APS) em Ouro Preto, Minas Gerais, sobre o sistema alimentar e suas implicações para a saúde. \n\n💡 O que foi investigado?\nOs pesquisadores realizaram um estudo qualitativo com análise documental. A coleta de dados ocorreu entre novembro e dezembro de 2021 por meio de quatro oficinas com 25 participantes no total (média de 7 pessoas por grupo) utilizando a técnica do “mapa falante”. O objetivo foi mapear as vivências, representações, crenças e percepções dos usuários sobre o sistema alimentar local. \n\n📊 Principais achados:\nOs achados revelam a transição do cultivo e preparo familiar para o alto consumo de ultraprocessados, acompanhada da perda de sabor, textura e diversidade dos alimentos. Os usuários associaram o modelo agrícola intensivo ao uso excessivo de agrotóxicos e poluição por plásticos, identificando-o como risco à saúde humana e ambiental. \n\nAlém disso, o preço é o principal determinante de compra. Ouro Preto enfrenta dependência de cadeias longas de abastecimento (como a CEASA/BH) devido à baixa produção agrícola local, impactada pela mineração, enquanto as feiras livres foram destacadas como essenciais para o acesso a alimentos frescos. \n\n✅ Conclusão:\nO estudo conclui que os hipertensos veem o sistema atual como barreira para comer bem. Fica evidente a necessidade de políticas públicas intersetoriais para fortalecer feiras, incentivar a agricultura local e ampliar o acesso a alimentos frescos.\n\n#alimentaçãosaudável #saudepublica #agricultura #alimentos"
    url: "https://www.instagram.com/p/DcwjOoTRqcz/"
    imagem: "img/instagram-acervo/DcwjOoTRqcz.webp"
  - data: "2026-06-24"
    categoria: "Ensino"
    titulo: "👉🏽 Você sabia que o ambiente em que vivemos e a forma como o percebemos podem ditar nossas escolhas…"
    resumo: "👉🏽 Você sabia que o ambiente em que vivemos e a forma como o percebemos podem ditar nossas escolhas alimentares, funcionando como barreiras ou promotores…"
    conteudo: "👉🏽 Você sabia que o ambiente em que vivemos e a forma como o percebemos podem ditar nossas escolhas alimentares, funcionando como barreiras ou promotores de uma alimentação saudável?\n\n📚Estudo conduzido por Bruna Aparecida Avelar (@brunnaavelar), juntamente com pesquisadores do GPENSC, investigou as barreiras e os facilitadores da alimentação saudável sob a perspectiva de usuários com hipertensão arterial acompanhados na Atenção Primária à Saúde (APS) em Ouro Preto, Minas Gerais.\n\n💡 O que foi investigado? Os pesquisadores realizaram um estudo com abordagens quantitativa e qualitativa. Na etapa quantitativa, avaliaram a percepção de 176 participantes utilizando a versão brasileira do questionário Perceived Nutrition Environment Measures Survey (NEMS-P). Na etapa qualitativa, realizaram oficinas com 25 participantes, utilizando a técnica do “mapa falante” em grupos focais para mapear as vivências e percepções sobre o sistema alimentar local.\n\n📊 Principais achados: Os participantes apontaram que o ambiente atual impõe mais dificuldades do que incentivos para uma alimentação saudável. Entre as dificuldades, destacaram-se o fácil acesso a alimentos ultraprocessados, os preços elevados e a qualidade/aparência insatisfatórias de frutas e verduras, além das mudanças nos hábitos de comensalidade. Entre os incentivos, foram mencionados a disponibilidade e a variedade de frutas e vegetais no bairro, a valorização das feiras livres e dos alimentos provenientes da agricultura familiar, bem como o resgate de práticas domésticas positivas, como o cultivo de hortas comunitárias ou caseiras.\n\n✅ O estudo concluiu que os indivíduos percebem alto acesso financeiro e físico a produtos ultraprocessados, em contrapartida a um baixo acesso a alimentos frescos. Esses achados reforçam a necessidade de políticas públicas intersetoriais que integrem saúde, segurança alimentar e sustentabilidade, promovendo a taxação de ultraprocessados, o subsídio a alimentos frescos e o fortalecimento dos circuitos locais de agricultura familiar.\n\n#saudecoletiva #nutrição #epidemiología #ufop"
    url: "https://www.instagram.com/p/DZ-9nfFEVDC/"
    imagem: "img/instagram-acervo/DZ-9nfFEVDC.webp"
