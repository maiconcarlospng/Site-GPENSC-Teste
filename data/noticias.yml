    titulo: "Convidamos você a participar do evento de exibição do documentário “Comida de Mentira” na Universidade Federal de Ouro Preto (UFOP)!"
    resumo: "Convidamos você a participar do evento de exibição do documentário “Comida de Mentira” na Universidade Federal de Ouro Preto (UFOP)!"
    conteudo: "Convidamos você a participar do evento de exibição do documentário “Comida de Mentira” na Universidade Federal de Ouro Preto (UFOP)!\n\n🎬 Sobre o filme:\nO documentário apresenta, de forma acessível e provocadora, como a indústria dos ultraprocessados influencia os hábitos alimentares, impacta a saúde da população, o meio ambiente e as políticas de alimentação no Brasil. Com participações de Bela Gil, Carlos Monteiro, Daniel Becker, Paula Johns, Rita Von Hunty, entre outros nomes, o filme é um convite à ação coletiva, ao pensamento crítico e à mobilização por uma alimentação adequada e saudável para todas as pessoas.\n\n🍿 Cinema gratuito + debates\n📍 Local: Auditório da Escola de Nutrição – UFOP\n📅 Data: 28/05/2026 (quinta-feira)\n🕠 Horário: 17h30\n🗂️ Organização: Grupo de Pesquisa Obesidade, Interseccionalidade e estigma e o Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva (GPENSC), em parceria com a Cleia Costa Barbosa, nutricionista e membro da Rede IBFAN Brasil, da Aliança pela Alimentação Adequada e Saudável e mentora do Movimento Ouro Preto pela Infância (MOPI). \n\nO evento contará com:\n \n📽️ Vídeo do MOPI.\n📽️ Exibição do filme da IBFAN.\n📽️ Exibição do documentário Comida de Mentira.\n💬 Roda de conversa sobre o filme.\n🥫 Tenda de ultraprocessados.\n📚 Lançamento do terceiro livro Mulheres em Construção.\n\n📄 Haverá emissão de certificado de participação.\n🔗 Inscrições até o dia 22 de maio através do seguinte link: https://forms.gle/qoWdsibuzF1xeLvf8\n\n💚 Entrada gratuita. Chame seus amigos e participe!"
