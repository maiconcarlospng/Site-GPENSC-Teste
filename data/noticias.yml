  - data: "2020-10-31"
    categoria: "Pesquisa"
    titulo: "Hoje, iremos falar sobre o PADu COVID-19"
    resumo: "Hoje, iremos falar sobre o PADu COVID-19"
    conteudo: "Hoje, iremos falar sobre o PADu COVID-19. \n.\n🔬Em decorrência da pandemia da COVID-19, discentes e docentes de todo o país tiveram suas rotinas alteradas devido ao isolamento social. \n.\n👥 Sendo assim, pesquisadores da UFOP e do UniBH se uniram para investigar o impacto da pandemia da COVID-19 nos sintomas de ansiedade e depressão, bem como no consumo e ambiente alimentar, perfil nutricional, hábitos de vida e condições gerais de saúde de todo o corpo acadêmico (alunos, técnicos e professores), iniciando, então, a pesquisa PADu COVID-19. \n.\n📚 Trata-se de um estudo longitudinal, parte integrante do projeto sobre ansiedade e depressão em universitários (PADu), no qual os dados serão coletados em quatro momentos, a partir de um questionário online, enviado por e-mail institucional. \n.\n⚠️ A primeira coleta ocorreu entre julho e agosto. Agora em novembro, iniciaremos a segunda coleta de dados.\n.\n📌 Você, estudante ou servidor da UFOP ou do UniBH, que respondeu o primeiro questionário, continue colaborando conosco para entendermos os efeitos da pandemia da COVID-19 na saúde e na alimentação da comunidade acadêmica. \n.\n🧬 Contribua para o avanço da ciência brasileira!\n.\n▶️ Arraste para o lado e veja os vídeos sobre a pesquisa.\n.\n🔍 Quer saber mais sobre o projeto? Continue nos acompanhando e siga também o @padufederais. \n.\n📧 Para maiores informações sobre o projeto, entre em contato pelo e-mail:\npaducovid.ppgsn@ufop.edu.br"
