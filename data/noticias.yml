    titulo: "Como comer bem?"
    resumo: "O GPENSC recomenda o episódio 269 do podcast do Mamilos (@mamilospod), que tem como tema “Como comer bem?”"
    conteudo: "O GPENSC recomenda o episódio 269 do podcast do Mamilos (@mamilospod), que tem como tema “Como comer bem?”.\n.\n📘 Esse episódio aborda sobre o Guia Alimentar para a População Brasileira, um importante instrumento de política pública no nosso país no que se refere à alimentação adequada e saudável, e um exemplo internacional, sendo considerado um dos mais completos do mundo e inspiração para o desenvolvimento de políticas de alimentação e nutrição em outros países.\n.\n💡 Esse podcast está repleto de informações sobre a alimentação da população brasileira, a classificação dos alimentos de acordo com o grau de processamento, os desafios de uma alimentação saudável e muito mais, de uma forma muito didática e descontraída. Vale a pena conferir!\n.\n📌 Aproveita, já salva esse post e não deixe de marcar aqui nos comentários ou enviar essa publicação para aquele amigo ou amiga que vai gostar dessa dica."
