  - data: "2022-10-14"
    categoria: "Pesquisa"
    titulo: "Artigo: Burden of non-communicable chronic diseases attributable to the consumption of sugar-sweetened beverage, 1990 - 2019"
    resumo: "O GPENSC apresenta o artigo intitulado “Burden of non-communicable chronic diseases attributable to the consumption of sugar-sweetened beverage, 1990 - 2019”, de autoria da mestre Joice Vieira Leal (@joicesvleal), juntamente com outras pesquisadores do GPENSC"
    conteudo: "O GPENSC apresenta o artigo intitulado “Burden of non-communicable chronic diseases attributable to the consumption of sugar-sweetened beverage, 1990 - 2019”, de autoria da mestre Joice Vieira Leal (@joicesvleal), juntamente com outras pesquisadores do GPENSC.\n.\n🎯 O artigo, um dos produtos da dissertação de mestrado da Joice, teve como objetivo estimar a carga de doenças crônicas não transmissíveis (DCNTs) atribuída ao consumo de bebidas açucaradas em 2019, e as mudanças que ocorreram entre 1990 e 2019, no Brasil e regiões. \n.\n📝 As métricas utilizadas foram os anos de vida perdidos devido à incapacidade (YLD), anos de vida perdidos por morte prematura (YLL), anos de vida perdidos ajustados por incapacidade (DALYs) e óbitos, obtidas pelo estudo Global Burden of Disease (GBD) 2019.\n.\n📈 Os resultados indicam que o diabetes mellitus tipo 2 (DM-2) e doenças isquêmicas cardíacas (DIC) foram os principais desfechos relacionados ao consumo de bebidas açucaradas, sendo que a DIC apresentou as maiores taxas de mortalidade e YLL em 1990 e 2019 em comparação com DM-2, que revelou maiores taxas de YLD. No que se refere às mudanças entre 1990 e 2019, observou-se uma tendência de queda nas Regiões Centro-Oeste, Sul e Sudeste, enquanto as taxas permaneceram estáveis nas regiões Nordeste e Norte.\n.\n💡 O estudo indica que não houve uma queda considerável na carga de DCNTs atribuída ao consumo de bebidas açucaradas entre 1990 e 2019, revelando a necessidade de implementar e fortalecer ações para reduzir o consumo dessas bebidas, sem deixar de considerar as realidades do país e suas desigualdades, bem como as particularidades regionais.\n.\n🔗 Acesse o artigo no link: \nhttps://pubmed.ncbi.nlm.nih.gov/36184212/ ou doi: 10.1016/j.clnesp.2022.08.019."
    url: "https://www.instagram.com/p/CjtWW1ZONI1/"
    imagem: "img/instagram-acervo/CjtWW1ZONI1.webp"
