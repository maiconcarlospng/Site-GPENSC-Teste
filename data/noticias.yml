  - data: "2026-06-05"
    categoria: "Ensino"
    titulo: "Capacitação aborda interpretação de artigos científicos"
    resumo: "O GPENSC divulgou curso de leitura e interpretação de artigos científicos com base na epidemiologia, ministrado por Adriana Lúcia Meireles."
    conteudo: "📚 Curso Gratuito | Leitura e Interpretação de Artigos Científicos com base na epidemiologia 🧑‍🏫Profª. Drª. Adriana Adriana Lúcia Meireles (DENCS/ENUT/UFOP) 🗓 24 de junho ⏰ 13h30 às 17h30 📍 Laboratório de Informática do Departamento de Estatística – UFOP Você sabe identificar se um artigo científico apresenta evidências de qualidade? Neste curso, serão abordados os principais aspectos para a leitura crítica e a interpretação adequada da literatura científica. Discutiremos como avaliar a qualidade metodológica de um estudo, reconhecer revistas científicas confiáveis, identificar características de revistas predatórias e interpretar resultados de pesquisas à luz dos conceitos fundamentais da epidemiologia. O curso é voltado para estudantes, pesquisadores e profissionais que desejam desenvolver habilidades essenciais para a análise crítica da produção científica e para a tomada de decisões baseada em evidências. 📢 Este curso é ofertado no âmbito do Projeto de Extensão intitulado: “Capacitação em epidemiologia e análises de dados: uma atividade conduzida pelo Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva (GPENSC)” 🔗 Inscrições gratuitas pelo link: https://forms.gle/vryn5aEsgEneUok89 ⚠️ Vagas limitadas. Garanta sua vaga! #CursoGratuito #Epidemiologia #LeituraCientífica #PesquisaCientífica #SaúdeColetiva"
    url: "https://www.instagram.com/p/DZNeqp-x73S/"
    imagem: "img/instagram/DZNeqp-x73S.jpg"

