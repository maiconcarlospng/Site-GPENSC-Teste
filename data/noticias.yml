    conteudo: "✨Entre os dias 10 e 12 de junho de 2026, foi realizado, em São Paulo (SP), o Ganepão (@ganepao), congresso anual de nutrição. \n\nA membra do GPENSC Cleisiane (@cleisi0102), participou do evento e apresentou o trabalho intitulado “Adesão às recomendações de tempo de tela entre crianças e adolescentes: um estudo longitudinal”.\n\n📚 O estudo, conduzido pelo GPENSC e desenvolvido no âmbito de sua dissertação de mestrado, investigou a adesão às recomendações de tempo de tela ao longo do tempo entre crianças e adolescentes, contribuindo para o avanço do conhecimento científico sobre comportamentos relacionados à saúde nessa população.\n\nSeguimos firmes, produzindo ciência e compartilhando conhecimentos! 🤍🧡\n\n#gpensc #saudecoletiva #ganepao #ciencia"
