  - data: "2024-02-29"
    categoria: "Pesquisa"
    titulo: "Hoje, o #GPENSConvida é sobre o HipertenSUS"
    resumo: "Hoje, o #GPENSConvida é sobre o HipertenSUS"
    conteudo: "Hoje, o #GPENSConvida é sobre o HipertenSUS. Sabia que você pode contribuir com a validação de um guia do mapa falante digital? \n.\n📢 E o que é mapa falante? É uma tecnologia social colaborativa voltada para o diagnóstico, planejamento e avaliação de territórios, com o intuito de dar voz àqueles(as) que o vivenciam.\n.\n📲 Para participar da validação colaborativa do guia, basta acessar o formulário disponível em https://forms.gle/mFbf1W8FQfk1je2K9 ou acessar o QR code. \n.\n📍 Com apenas alguns minutos você responde o formulário e contribui para a elaboração desse instrumento que permite que pesquisadores conheçam o seu território e suas particularidades, para que assim políticas públicas em saúde sejam benéficas e efetivas para a população. \n.\n🗺️ Faça sua voz ser ouvida na ciência! Venha colaborar com o projeto HipertenSUS e o Centro de Promoção da Saúde! \n.\n📝 Atividade com certificado. Participe! \n.\n🗣️ Quer saber mais sobre o HipertenSUS? Continue nos acompanhando."
