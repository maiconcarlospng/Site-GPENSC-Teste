  - data: "2022-01-28"
    categoria: "Pesquisa"
    titulo: "Livro: Nutricionismo: a ciência e a política da orientação nutricional"
    resumo: "Hoje, o post é sobre algumas abordagens do livro “Nutricionismo: a ciência e a política da orientação nutricional”, do autor Gyorgy Scrinis"
    conteudo: "Hoje, o post é sobre algumas abordagens do livro “Nutricionismo: a ciência e a política da orientação nutricional”, do autor Gyorgy Scrinis. Você já tinha ouvido falar sobre o conceito do paradigma “nutricionismo”? Sabe do que se trata?\n.\n🍽️ O termo “nutricionismo — ou o reducionismo nutricional” foi proposto por Gyorgy Scrinis ao analisar esse histórico de mensagens nutricionais que reduz a alimentação ao papel de nutrientes específicos e a saúde corporal. Mas, como já vem sendo abordado por vários pesquisadores e educadores, a alimentação vai além de questões biológicas e nutricionais e não devemos considerá-la apenas como uma mera substância que serve para o tratamento ou prevenção de determinada doença ou agravo à condição de saúde.\n.\n📝 Nesse sentido, Gyorgy Scrinis propõe aos docentes, nutricionistas e futuros nutricionistas a modificarem criticamente a maneira como tem lidado com a temática da alimentação e nutrição, principalmente, em relação a essa visão sobre o alimento e a alimentação como algo estritamente científico e cujas orientações mais básicas precisam de especialistas, cálculos de calorias e restrições nutrifocadas.\n.\n👉🏻 Arraste para o lado e confira mais sobre o tema.\n.\n💭 Convidamos você para refletir sobre como temos lidado com a temática da alimentação e nutrição: quais as implicações do nutricionismo para a relação das pessoas com a comida e com seu corpo?"
    url: "https://www.instagram.com/p/CZSedlIOHR6/"
    imagem: "img/instagram-acervo/CZSedlIOHR6.webp"
  - data: "2022-01-25"
    categoria: "Pesquisa"
    titulo: "Livro: Nutricionismo: a ciência e a política do aconselhamento nutricional"
    resumo: "O GPENSC recomenda o livro “Nutricionismo: a ciência e a política do aconselhamento nutricional”, do cientista e educador Gyorgy Scrinis"
    conteudo: "O GPENSC recomenda o livro “Nutricionismo: a ciência e a política do aconselhamento nutricional”, do cientista e educador Gyorgy Scrinis.\n.\n📚 O livro publicado em 2013 e traduzido para o português em 2021 propõe um olhar crítico sobre o foco restrito ao nutriente, muitas vezes a um único nutriente, ignorando a interação entre nutrientes, a qualidade do alimento em si, a combinação entre alimentos que formam um padrão alimentar e reduzindo esses nutrientes como determinantes únicos da condição de saúde ou doença. \n.\n📝 De modo geral, Gyorgy Scrinis apresenta uma diferente filosofia e teoria social da nutrição, questionando as abordagens redutoras dos nutrientes na ciência da nutrição, no aconselhamento dietético, na engenharia de alimentos e nas práticas de marketing. \n.\n📽️ No canal do YouTube da ACT Promoção da Saúde, tem uma série de lives que reúne pesquisadores e professores para debater e refletir conceitos do livro no contexto brasileiro. \n.\n🔗 Acesse o link a seguir e fique por dentro de tudo que aconteceu na live de lançamento do livro no Brasil: https://www.youtube.com/watch?v=eMwY8EgeJRs\n.\n🗣️ Gostou da dica? Compartilha com os amigos e aproveita para salvar essa recomendação!"
    url: "https://www.instagram.com/p/CZKzokeOvMT/"
    imagem: "img/instagram-acervo/CZKzokeOvMT.webp"
