    conteudo: "📞 Vigitel 2025 já começou!\nVocê pode ser uma das pessoas sorteadas para responder à pesquisa por telefone.\n\nO Vigitel é um dos principais inquéritos de saúde do Brasil, realizado com pessoas de 18 anos ou mais em todas as capitais do país. Ele ajuda a monitorar fatores de risco e proteção para doenças crônicas, como alimentação, atividade física, tabagismo, consumo de álcool, entre outros.\n\n💡 Sua participação é essencial para a construção de políticas públicas de saúde mais eficazes.\n\n👉🏻 Se receber a ligação do Ministério da Saúde, participe! Sua resposta faz a diferença, e todas as informações são mantidas em sigilo.\n\n#vigitel2025 #ministériodasaude #vigilânciaemsaúde #sus #saudepublica"
