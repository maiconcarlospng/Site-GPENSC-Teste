    titulo: "É com muita alegria que o GPENSC e o Programa de Pós-Graduação em Saúde e Nutrição – PPGSN convidam todos para participar da 1ª defesa de doutorado do PPGSN e do nosso grupo"
    resumo: "É com muita alegria que o GPENSC e o Programa de Pós-Graduação em Saúde e Nutrição – PPGSN (@ppgsn.ufop) convidam todos para participar da 1ª defesa de doutorado do PPGSN e do nosso grupo"
    conteudo: "É com muita alegria que o GPENSC e o Programa de Pós-Graduação em Saúde e Nutrição – PPGSN (@ppgsn.ufop) convidam todos para participar da 1ª defesa de doutorado do PPGSN e do nosso grupo.\n.\n👨🏻🎓 O primeiro aluno a defender o doutorado é o Luiz Antônio Alves de Menezes Júnior (@luizmenezes_), com a tese intitulada “Qualidade do sono durante a pandemia e suas interfaces com o consumo alimentar, comportamento sedentário e vitamina D”. O trabalho foi desenvolvido sob orientação da professora Dra. Adriana Lúcia Meireles – UFOP (@dri_meireles) e coorientação da professora Amanda Cristina de Souza Andrade – UFMT (csouza.amanda).\n.\n🗓️ O exame de defesa do Luiz ocorrerá no dia 28 de setembro (quarta-feira), às 14h00, de forma híbrida. Para aqueles que desejam assistir de forma presencial, em Ouro Preto-MG, a defesa será na sala 107 do CEAD. Além disso, será transmitido por videoconferência, via Google Meet. Para assistir, basta acessar o link da defesa por meio do QR Code.\n.\n🗣️ Não deixe de participar conosco e prestigiar o Luiz nesse momento tão especial! Esperamos vocês!"
