    titulo: "Hoje, no #compartilhaGPENSC vamos falar sobre a nova rotulagem nutricional, que foi implementada no dia 09 de outubro de 2022"
    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre a nova rotulagem nutricional, que foi implementada no dia 09 de outubro de 2022"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre a nova rotulagem nutricional, que foi implementada no dia 09 de outubro de 2022.\n.\n🧾 As novas regras para rotulagem de alimentos trazem modificações na tabela de informação nutricional, além da adoção da rotulagem nutricional frontal. A ideia é facilitar o conhecimento dos consumidores sobre quais alimentos têm ingredientes nocivos à saúde.\n.\n🧃Os produtos confeccionados a partir da data que a nova rotulagem nutricional entrou em vigor, devem, obrigatoriamente, estar de acordo com as novas regras. Como exceção à regra, alimentos que já estão circulando no mercado têm até 12 meses para sua adequação.\n.\n👉🏻 Arraste para o lado e confira mais sobre o tema.\n.\n🔗 Para mais informações acesse: https://www.gov.br/anvisa/pt-br/assuntos/alimentos/rotulagem\n.\n🗣️ Gostou das nossas postagens? Não deixe de conferir essa e as outras postagens e compartilhar com os amigos!"
