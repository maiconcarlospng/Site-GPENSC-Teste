    titulo: "O GPENSC recomenda o Guia de Atividade Física para a População Brasileira, lançado em junho de 2021 pelo Ministério da Saúde"
    resumo: "O GPENSC recomenda o Guia de Atividade Física para a População Brasileira, lançado em junho de 2021 pelo Ministério da Saúde"
    conteudo: "O GPENSC recomenda o Guia de Atividade Física para a População Brasileira, lançado em junho de 2021 pelo Ministério da Saúde.\n.\n📚 O Guia traz as primeiras recomendações e informações do Ministério da Saúde sobre atividade física para que a população tenha uma vida ativa, promovendo a saúde e a melhoria da qualidade de vida.\n.\n📝 A publicação é dividida em oito capítulos e aborda a prática de atividade física em diversos contextos, grupos e ciclos de vida. No Guia, constam também recomendações sobre a quantidade, a intensidade e os exemplos de atividades aeróbicas, de força e de equilíbrio, além de indicações para um estilo de vida ativo.\n.\n🔗 O material na íntegra pode ser acessado na Biblioteca Virtual em Saúde, do Ministério da Saúde, ou pelo link disponível na nossa bio. Não deixe de conferir!\n.\n📌 Aproveita e já salve esse post. Também não deixe de marcar aqui nos comentários ou compartilhar essa publicação com aquele(a) amigo(a) que precisa conhecer o Guia de Atividade Física para a População Brasileira."
