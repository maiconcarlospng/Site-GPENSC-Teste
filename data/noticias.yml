    titulo: "Pesquisadora do GPENSC realiza missão científica em Granada"
    resumo: "A professora Júlia Cristina Cardoso Carraro realizou missão científica na Universidad de Granada, na Espanha, em março de 2026."
    conteudo: "🇧🇷🇪🇸✈️ GPENSC pelo mundo! A professora Dra. Júlia Cristina Carraro Cardoso (@julia_carraro) esteve em Granada, na Espanha, em uma missão científica internacional ao Departamento de Psicobiologia da Universidad de Granada, sob a supervisão do professor David Garcia-Burgos. 🧠✨ A missão ocorreu no período de 04 a 18 de março de 2026 e teve como objetivo a discussão de colaboração científica em projeto na área de comportamento alimentar e obesidade, fortalecendo parcerias internacionais e ampliando oportunidades de pesquisa e intercâmbio de conhecimento. Arraste para o lado para conferir alguns registros dessa viagem! ➡️📸 #GPENSC #UFOP #Internacionalização #Pesquisa #Nutrição ComportamentoAlimentar Obesidade"
