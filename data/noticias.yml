    titulo: "Neste primeiro semestre de 2026, o GPENSC estará presente em três congressos internacionais.🌎"
    resumo: "Neste primeiro semestre de 2026, o GPENSC estará presente em três congressos internacionais.🌎 Nossa pesquisadora @laudiceia_frois participará, nos dias 28 e 29 de maio, do…"
    conteudo: "Neste primeiro semestre de 2026, o GPENSC estará presente em três congressos internacionais.🌎\n\nNossa pesquisadora @laudiceia_frois participará, nos dias 28 e 29 de maio, do XXV Congresso de Nutrição e Alimentação (@apnutricao), em Porto, Portugal.\n\nNosso pesquisador @luizmenezes_jr estará presente no REDIMED Omics Symposium 2026 & 6th International Congress on Olive Oils, realizado em Jaén, Espanha, nos dias 11 e 12 de junho.\n\nLuiz também participará da XLIV Reunión Anual de la Sociedad Española de Epidemiología (SEE) e do XXI Congresso da Associação Portuguesa de Epidemiologia (APE), em Pamplona, Espanha, entre os dias 23 e 26 de junho.\n\nAlém deles, nossa pesquisadora @vitoriareginan estará presente no VI International Congress of Psychobiology, em Servilha, Espanha, entre os dias 24 e 26 de junho.\n\nEstamos felizes em acompanhar a internacionalização do nosso grupo e desejamos excelentes apresentações aos nossos pesquisadores! ✈️\n\nSe você também vai participar desses congressos, aproveite para conhecer de perto os estudos desenvolvidos pelo GPENSC.\n\n👉 No carrossel, confira os detalhes das apresentações.\n\n#SaúdePública #PesquisaCientífica #GPENSCInternacional #Epidemiologia AlimentaçãoSaudável"
