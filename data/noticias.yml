    resumo: "Hoje, vamos divulgar a 16ª edição do Encontro de Saberes 2024, realizado pela Universidade Federal de Ouro Preto – UFOP (@minhaufop)"
    conteudo: "Hoje, vamos divulgar a 16ª edição do Encontro de Saberes 2024, realizado pela Universidade Federal de Ouro Preto – UFOP (@minhaufop). O tema desta edição é \"Conhecimento, Inovação e Demandas Sociais\".\n.\n🎯 O objetivo do evento é promover a integração dos saberes das áreas de ensino, pesquisa, extensão e internacionalização, criando oportunidade para a comunidade acadêmica debater sobre ciência; inovações tecnológicas; criação artística e literária; atividades de extensão; inovações pedagógicas; assuntos comunitários e estudantis; e, internacionalização.\n.\n🗓️ O Encontro de Saberes 2024 acontecerá entre os dias 09 de dezembro a 11 de dezembro de 2024, de forma presencial, com atividades no Centro de Artes e Convenções, em Ouro Preto.\n.\n👥 A 16ª edição contará com a participação de alunos de iniciação cientifica e pós-graduação do GPENSC apresentando seus trabalhos acadêmicos. Não deixe de ir e conferir!\n.\n🔗 Para mais informações, acesse: Encontro de Saberes 2024 - Universidade Federal de Ouro Preto. \n.\n🗣️ Nós, do GPENSC, convidamos a toda comunidade para participar e conhecer as ações que envolvem ciência desenvolvidas no dia a dia universitário, principalmente as que trazem melhorias e impactos positivos a sociedade."
