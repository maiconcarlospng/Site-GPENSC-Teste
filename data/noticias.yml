    resumo: "Abril é um mês muito especial para o GPENSC, pois celebramos não apenas a criação do nosso grupo, mas também do nosso Instagram"
    conteudo: "Abril é um mês muito especial para o GPENSC, pois celebramos não apenas a criação do nosso grupo, mas também do nosso Instagram.\n.\n🗓️ No dia 8 de abril, completamos 5 anos desde a fundação do nosso grupo! São 5 anos de intensa dedicação, projetos, descobertas e muitas conquistas. Estamos colhendo frutos incríveis ao longo dessa jornada e isso se deve ao esforço e comprometimento de cada membro. E ontem, dia 23 de abril, comemoramos mais um ano de existência do nosso Instagram. Queremos expressar nossa gratidão a todos vocês que nos seguem e interagem com nossas postagens.\n.\n🏆 Não poderíamos deixar essas datas passarem em branco, sem lembrar que cada membro é peça fundamental para o sucesso do GPENSC. Continuemos trabalhando em equipe, compartilhando conhecimentos e ideias, sempre em busca da excelência e do avanço na ciência.\n.\n✨ Desejamos a todos os membros sucesso e que nossas pesquisas continuem a contribuir com a sociedade!\n.\nNosso muito obrigada a todos!\nParabéns, GPENSC! 💚❤️🧡"
