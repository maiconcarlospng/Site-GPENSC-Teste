    titulo: "Ambiente alimentar durante a pandemia da covid-19 em dois municípios brasileiros e sua relação com a insegurança alimentar"
    resumo: "O GPENSC relembra qualificação de doutorado da aluna Irene Justiniano (@irenecsj_), que ocorreu no dia 20 de dezembro de 2022, via Google Meet"
    conteudo: "O GPENSC relembra qualificação de doutorado da aluna Irene Justiniano (@irenecsj_), que ocorreu no dia 20 de dezembro de 2022, via Google Meet.\n.\n🔎 O projeto de doutorado da Irene, intitulado: “Ambiente alimentar durante a pandemia da covid-19 em dois municípios brasileiros e sua relação com a insegurança alimentar”, tem como objetivo analisar as características do ambiente alimentar e sua relação com a insegurança alimentar nos municípios de Ouro Preto e Mariana (MG) durante a pandemia da covid-19.\n.\n👥 Seu estudo é orientado pela professora Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes). O trabalho contou com as contribuições da banca formada pelas professoras Dras. Milene Cristine Pessoa - @milenepessoa1 (UFMG), Érika Cardoso dos Reis - @erikacareis (UFOP), Adriana Lúcia Meireles - @dri_meireles (UFOP), e pelo professor Dr. Paulo César Castro Pereira Júnior - @pc.castrojr (UFRJ).\n.\n📈 Os resultados preliminares demonstram uma maior disponibilidade de locais que comercializam alimentos ultraprocessados (cerca de 70%) em ambos os municípios. Dentre os domicílios de escolares avaliados, 69,6% estavam em situação de insegurança alimentar. A pior percepção sobre o preço de frutas e hortaliças foi associada a baixa disponibilidade de alimentos in natura/minimamente processados no domicílio, e com a insegurança alimentar.\n.\n💡 Com o estudo, espera-se compreender as repercussões da covid-19 sobre o ambiente alimentar e a insegurança alimentar, além de contribuir para a implementação de intervenções e políticas de saúde pública que possam minimizar os impactos sobre a alimentação e a saúde.\n.\n🌌 Parabenizamos a Irene pela aprovação na sua qualificação e pela contribuição para a ciência do país. Desejamos à aluna sucesso nas próximas etapas!"
