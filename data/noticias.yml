    titulo: "Projeto: Vigilância epidemiológica da COVID-19 na região dos Inconfidentes"
    resumo: "O GPENSC relembra coleta de dados do projeto \"Vigilância epidemiológica da COVID-19 na região dos Inconfidentes\" (COVID-Inconfidentes), que ocorreu em outubro, novembro e dezembro de 2020, nos municípios de Ouro Preto e Mariana"
    conteudo: "O GPENSC relembra coleta de dados do projeto \"Vigilância epidemiológica da COVID-19 na região dos Inconfidentes\" (COVID-Inconfidentes), que ocorreu em outubro, novembro e dezembro de 2020, nos municípios de Ouro Preto e Mariana.\n.\n📝 A pesquisa teve como objetivo avaliar a situação da pandemia da covid-19 na região dos Inconfidentes e seus possíveis impactos na saúde da população. O estudo contou com a participação de aproximadamente 1.800 moradores dos dois municípios.\n.\n👉🏻 Arraste para o lado e confira algumas fotos do projeto. \n.\n🎇 Mais uma vez, gostaríamos de agradecer a todos os moradores de Ouro Preto e Mariana, que aceitaram participar do nosso estudo e receberam nossa equipe nos seus domicílios, contribuindo com a nossa pesquisa e o avanço da ciência no Brasil na luta contra a covid-19! Essa experiência faz parte da coleção de bons momentos do nosso grupo!\n.\n🗣️ Continue nos acompanhando para saber mais sobre os resultados do COVID-Inconfidentes e de outros projetos desenvolvidos pelo nosso grupo."
