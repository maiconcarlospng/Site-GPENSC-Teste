  - data: "2022-05-17"
    categoria: "Pesquisa"
    titulo: "Artigo: Health impacts caused by excessive sodium consumption in Brazil: results of the GBD 2019 study"
    resumo: "O GPENSC apresenta o artigo intitulado “Health impacts caused by excessive sodium consumption in Brazil: results of the GBD 2019 study”, de autoria da doutoranda Larissa Guedes (@larissaguedesnutri), juntamente com outras integrantes do GPENSC e pesquisadores da UFMG"
    conteudo: "O GPENSC apresenta o artigo intitulado “Health impacts caused by excessive sodium consumption in Brazil: results of the GBD 2019 study”, de autoria da doutoranda Larissa Guedes (@larissaguedesnutri), juntamente com outras integrantes do GPENSC e pesquisadores da UFMG.\n.\n🎯 O objetivo do estudo, produto do mestrado da Larissa,  foi descrever a carga de doenças crônicas não transmissíveis (DCNT) atribuível ao consumo excessivo de sódio entre os brasileiros no ano de 2019. A carga foi obtida por meio das estimativas das taxas de mortalidade e DALYs, principal métrica do Global Burden of Disease (GBD), que mensura simultaneamente a mortalidade prematura e incapacidades que afetam a qualidade de vida da população. \n.\n📊 O consumo excessivo de sódio foi o 3º maior risco dietético que contribuiu para óbitos e DALYs no Brasil em 2019. Estados da região Nordeste apresentaram as maiores taxas padronizadas de mortalidade e DALYs, sendo os homens mais acometidos pelas DCNT causadas pelo consumo excessivo de sódio. As doenças cardiovasculares foram as principais responsáveis pela carga de DCNT, seguidas pela doença renal crônica e câncer gástrico. \n.\n💡 O impacto do consumo excessivo de sódio na saúde da população brasileira continua alto, sendo necessárias medidas de prevenção e controle desse fator de risco, como políticas mais adequadas às realidades regionais e a grupos populacionais específicos. Além disso, destaca-se a importância de campanhas educativas que estimulem a leitura cuidadosa dos rótulos e o uso consciente do sal de mesa, principal fonte de sódio para os brasileiros.\n.\n📲 Acesse o artigo pelo QR Code."
    url: "https://www.instagram.com/p/CdrINEYOeiW/"
    imagem: "img/instagram-acervo/CdrINEYOeiW.webp"
  - data: "2022-05-13"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: doutoranda Bruna Aparecida Avelar"
    resumo: "Hoje é dia de apresentar para vocês mais uma de nossas pesquisadoras, a doutoranda Bruna Aparecida Avelar (@brunnaavelar)"
    conteudo: "Hoje é dia de apresentar para vocês mais uma de nossas pesquisadoras, a doutoranda Bruna Aparecida Avelar (@brunnaavelar).\n.\n👩🏻‍🎓 A Bruna é nutricionista graduada pela Universidade Federal de Lavras (UFLA) e possui mestrado na mesma instituição, pelo Programa de Pós-Graduação em Nutrição e Saúde (PPGNS).\n.\n👩🏻‍⚕️ Atuou na Atenção Primária à Saúde por 7 anos, no Núcleo Ampliado de Saúde da Família (NASF), onde também era responsável técnica de programas como Bolsa Família e Sistema de Vigilância Alimentar e Nutricional (SISVAN). Também atuou em Unidade de Alimentação e Nutrição de um hospital. Possui experiência na área de Saúde Coletiva, com ênfase em Políticas Públicas de Alimentação e Nutrição, Segurança Alimentar e Nutricional e Educação Alimentar e Nutricional.\n.\n👩🏻‍💻 Atualmente, é doutoranda na Universidade Federal de Ouro Preto (UFOP), no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN), na linha de pesquisa Saúde e Nutrição em Indivíduos e Coletividades. É pesquisadora do Projeto HipertenSUS, onde investigará a temática do ambiente alimentar percebido, sob a supervisão da professora Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes).\n.\n🗣 Quer saber mais sobre o trabalho da Bruna e outros estudos desenvolvidos pelo nosso grupo? Então, continue nos acompanhando!"
