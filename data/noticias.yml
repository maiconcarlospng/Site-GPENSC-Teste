    resumo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a mestranda Hiliane Karolline de Oliveira Silva (@nutrikarolloliveira)"
    conteudo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a mestranda Hiliane Karolline de Oliveira Silva (@nutrikarolloliveira).\n.\n👩🏻‍🎓 Hiliane é nutricionista formada pela Universidade Federal de Ouro Preto (UFOP). Possui experiência na nutrição clínica com ênfase em emagrecimento e tratamento de doenças. Atualmente, é mestranda no Programa de Pós-graduação em Saúde e Nutrição (PPGSN/UFOP - @ppgsn.ufop), na linha de pesquisa Saúde e Nutrição em indivíduos e Coletividades.\n.\n📚 É pesquisadora do projeto Coorte das Universidades Mineiras (CUME - @projeto_cume) e sua pesquisa de mestrado é intitulada \"Associação entre depressão, escolhas e preferências alimentares em egressos universitários de Minas Gerais\", sob orientação da professora Dra. Júlia Carraro (@julia_carraro).\n.\n🔎 Quer saber mais sobre o tema da Hiliane? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo!"
