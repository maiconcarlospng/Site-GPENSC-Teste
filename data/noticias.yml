    resumo: "Hoje, iremos iniciar um novo projeto no nosso instagram, o \"INDICA GPENSC\""
    conteudo: "Hoje, iremos iniciar um novo projeto no nosso instagram, o \"INDICA GPENSC\". Nesse projeto, iremos indicar podcasts, filmes, livros e outros materiais que possam contribuir em diversos aspectos no nosso dia a dia, como pessoal, acadêmico e social.\n.\n💡A nossa primeira indicação é o episódio \"O ano das pequenas coisas\" do podcast \"Para dar Nome às Coisas\" (@paradarnomeascoisas).\n.\n🎙 Nesse episódio, a autora destaca a importância das pequenas coisas durante esse período de pandemia, que nos dão sentido para atravessar os dias difíceis.\n.\n📝 Depois de escutar esse episódio especial e fazer sua lista dos pequenos acontecimentos, conta pra gente quais são as pequenas coisas que estão fazendo sentindo para você nesse momento.\n.\n🗣 Gostou desse conteúdo? Compartilha com seus amigos e convidem-os a mergulhar nesses pequenos acontecimentos.\n.\n❤️ Lembre-se que estamos todos juntos nessa! Com carinho, GPENSC."
