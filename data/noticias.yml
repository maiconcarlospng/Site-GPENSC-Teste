  - data: "2020-09-21"
    categoria: "Divulgação científica"
    titulo: "Em apoio ao Guia Alimentar para a População Brasileira!"
    resumo: "Em apoio ao Guia Alimentar para a População Brasileira! . ‼️ Na semana passada, o Ministério da Agricultura, Pecuária e Abastecimento (MAPA) emitiu um ofício…"
    conteudo: "Em apoio ao Guia Alimentar para a População Brasileira!\n.\n‼️ Na semana passada, o Ministério da Agricultura, Pecuária e Abastecimento (MAPA) emitiu um ofício acompanhado de uma nota técnica ao Ministério da Saúde solicitando a revisão do Guia Alimentar para a População Brasileira. A principal alegação é que a classificação NOVA na qual distribui os alimentos de acordo com o  grau de processamento, em alimentos in natura ou minimamente processados, ingredientes culinários, processados e ultraprocessados, é inadequada.\n.\n⚠️ Contudo, o Guia Alimentar para a População Brasileira é um documento sério, embasado em evidências científicas e reconhecido internacionalmente. O nosso Guia preconiza uma alimentação adequada e saudável, em uma linguagem simples e acessível para a população brasileira! Por isso, defendemos e apoiamos o Guia Alimentar para a População Brasileira!\n.\n📝 A @aliancaalimentacao criou um manifesto em defesa do Guia Alimentar para a População Brasileira. As assinaturas serão entregues ao Ministério da Saúde no dia 24/09. Não deixe de assinar, precisamos nos mobilizar! \n.\n🔗 O link do manifesto encontra-se na nossa bio.\n.\n.\n#EuApoiooGuiaAlimentar\n#NósApoiamosoGuiaAlimentar"
    url: "https://www.instagram.com/p/CFavApqgIlm/"
    imagem: "img/instagram-acervo/CFavApqgIlm.webp"
  - data: "2020-04-24"
    categoria: "Divulgação científica"
    titulo: "O GPENSC participou do I Congresso de Pós-Graduação em Alimentação e Nutrição (COPGAN) e do IV Congresso…"
    resumo: "O GPENSC participou do I Congresso de Pós-Graduação em Alimentação e Nutrição (COPGAN) e do IV Congresso Nacional de Alimentos e Nutrição (CONAN), que ocorreram…"
    conteudo: "O GPENSC participou do I Congresso de Pós-Graduação em Alimentação e Nutrição (COPGAN) e do IV Congresso Nacional de Alimentos e Nutrição (CONAN), que ocorreram no ano passado📚🎒\nOs integrantes do GPENSC colaboraram na organização dos eventos, mediações de mesas-redondas, avaliação e apresentação de trabalhos.\n\nAmbos os eventos aconteceram na cidade de Ouro Preto, Minas Gerais, e foram organizados pela Escola de Nutrição da Universidade Federal de Ouro Preto.\nO I COPGAN teve como público-alvo professores e pós-graduandos da área de alimentação e saúde, e seu objetivo foi debater temas de interesse para a pós-graduação, abordando desde assuntos relacionados ao cenário da pós-graduação no país até a formação dos pós-graduandos. Já o IV CONAN, foi destinado aos profissionais e estudantes das áreas de Ciência de Alimentos, Gastronomia, Alimentação e Nutrição, teve como objetivo discutir de forma atualizada a produção em ciência com o tema: Alimentação: ciência, cultura e modismo. 📚🍎"
