  - data: "2024-08-27"
    categoria: "Pesquisa"
    titulo: "Artigo: Anxiety Symptoms Influence Food Consumption Differently Depending on Nutritional Status During the COVID-19 Pandemic: A Longitudinal Study with University Students"
    resumo: "O GPENSC apresenta o artigo intitulado “Anxiety Symptoms Influence Food Consumption Differently Depending on Nutritional Status During the COVID-19 Pandemic: A Longitudinal Study with University Students”, de autoria da doutoranda Ana Cláudia Morito Neves (@anaclaudiamorito) juntamente com outros pesquisadores do…"
    conteudo: "O GPENSC apresenta o artigo intitulado “Anxiety Symptoms Influence Food Consumption Differently Depending on Nutritional Status During the COVID-19 Pandemic: A Longitudinal Study with University Students”, de autoria da doutoranda Ana Cláudia Morito Neves (@anaclaudiamorito) juntamente com outros pesquisadores do GPENSC.\n.\n🎯 O artigo teve como objetivo analisar se a presença de sintomas de ansiedade no início da pandemia influenciou a mudança no consumo alimentar de acordo com sua finalidade e extensão do processamento durante um ano de acompanhamento e se essa associação ocorreu igualmente em universitários com excesso e sem excesso de peso.\n.\n📝 Este estudo longitudinal foi realizado com 583 estudantes universitários de uma Instituição de Ensino Superior pública no Brasil. A coleta de dados foi dividida em dois períodos: julho e agosto de 2020 e maio a julho de 2021, utilizando questionários online. A variável exposição foi sintomas de ansiedade foi avaliada pela DASS-21. A variável desfecho, consumo alimentar, foi avaliada no início e no seguimento do estudo por meio de um QFA e agrupado de acordo com a finalidade e grau de processamento. \n.\n📊 Os resultados mostraram que sintomas prévios de ansiedade moderada/grave foram associados a um aumento na frequência de consumo tanto de alimentos in natura ou minimamente processados (β: 0,2 IC95%: 0,1; 0,7 p  = 0,013) quanto de alimentos ultraprocessados (β: 5,6 IC95%: 1,8; 17,7 p  = 0,003), mas com magnitudes diferentes. Em universitários com excesso de peso, sintomas prévios de ansiedade moderada/grave foram associados a uma redução na frequência de consumo de alimentos in natura ou minimamente processados (β: −2,0 IC95%: −3,5; −0,5 p  = 0,008), enquanto naqueles com excesso de peso, houve um aumento no consumo de alimentos ultraprocessados (β: 4,5 IC95%: 2,2; 6,8 p  < 0,001).\n.\n💡Os achados do estudo abrem caminho para intervenções que considerem a influência dos sintomas de ansiedade e o estado nutricional no consumo alimentar.\n.\n🔗 Acesse o artigo: https://doi.org/10.1080/27697061.2024.2378085"
