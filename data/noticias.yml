  - data: "2021-08-24"
    categoria: "Pesquisa"
    titulo: "Métodos de avaliação e características do consumo alimentar durante a pandemia de COVID-19"
    resumo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC"
    conteudo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC.\n.\n📄 Neste resumo, vamos falar sobre “Métodos de avaliação e características do consumo alimentar durante a pandemia de COVID-19”, apresentado pelos doutorandos Luiz Menezes (@menezesnutri) e Thaís Sabião (@thasabiao), sob orientação das professoras Dras. Adriana Lúcia Meireles (@dri_meireles) e Júlia Carraro.\n.\n🎯 Na apresentação, os alunos abordaram a definição de consumo alimentar e os fatores determinantes, as ferramentas úteis para a avaliação do consumo alimentar, apresentando as vantagens e desvantagens de cada método, e os impactos da pandemia no consumo alimentar da população. Além disso, os alunos abordaram os resultados preliminares da pesquisa COVID-Inconfidentes, um estudo que avaliou a situação da COVID-19 nas cidades de Mariana e Ouro Preto em 2020.\n.\n📈 Com base nos dados do COVID-Inconfidentes, observou-se que mais da metade dos indivíduos avaliados eram inativos fisicamente, consumiam bebida alcoólica e tinham sono de má qualidade. Os alimentos consumidos com maior frequência foram o feijão, legumes e vegetais, laticínios e frutas. Dentre os participantes, 3 a cada 4 adultos consumiam frequentemente pelo menos um alimento ultraprocessado.\n.\n💡 Os achados evidenciam a importância de políticas públicas que visem a prática de atividade física e consumo alimentar saudável durante a pandemia de COVID-19.\n.\n👉 Arraste para o lado e confira mais sobre esse tema.\n.\n🗣 Continue nos acompanhando para saber mais sobre os resultados do COVID-Inconfidentes e sobre os trabalhos desenvolvidos pelo nosso grupo!"
    url: "https://www.instagram.com/p/CS-agKuAyvt/"
    imagem: "img/instagram-acervo/CS-agKuAyvt.webp"
  - data: "2021-08-20"
    categoria: "Pesquisa"
    titulo: "Na semana passada, apresentamos para vocês a pesquisa da pós-doutoranda Bárbara Simões"
    resumo: "Na semana passada, apresentamos para vocês a pesquisa da pós-doutoranda Bárbara Simões (@barbaradossantossimoes)"
    conteudo: "Na semana passada, apresentamos para vocês a pesquisa da pós-doutoranda Bárbara Simões (@barbaradossantossimoes). Mas qual a importância de validar um questionário de frequência alimentar? \n.\n🎯 O objetivo deste artigo foi avaliar a validade relativa dos métodos de investigação do consumo de frutas e hortaliças (FH) em usuários do Programa Academia da Saúde de Belo Horizonte, Minas Gerais. \n.\n📋 A partir de um ensaio comunitário controlado randomizado, participaram 299 indivíduos (≥ 20 anos). Todos os participantes completaram três métodos para a avaliação do consumo de FH (QBreve-FH, QFA-FH e R24h). Medianas e tercis de consumo de FH foram comparados e calculados o coeficiente de Spearman, k, e o teste de Wilcoxon estratificado por características sociodemográficas e nutricionais.\n.\n📌 Correlações mais fortes foram observadas para a avaliação do consumo de frutas de acordo com QBreve-FH (r = 0,437) e os valores medianos foram comparáveis aos apresentados pelo R24h (p ≥ 0,05). Esta comparação também resultou em uma maior proporção de tercis com concordância exata (46,1%). \n.\n📈 Todos os métodos de teste superestimaram o consumo de FH quando combinados. Nenhum dos métodos testados foi muito preciso para a avaliação do consumo de FV. No entanto, a correlação mais forte foi encontrada para a avaliação QBreve-FH do consumo de frutas, indicando que é uma ferramenta adequada para a investigação do consumo de frutas.\n.\n💡 Dessa forma, estudar sobre o consumo alimentar e os diversos fatores que podem influenciar na sua acurácia é um constante desafio para os pesquisadores. Porém, é importante ressaltar que a sua avaliação adequada é relevante, uma vez que contribui para a promoção e proteção da saúde dos indivíduos. \n.\n👉 Arraste para o lado e confira o resumo do artigo apresentado."
    url: "https://www.instagram.com/p/CSz6ZhcH1P3/"
    imagem: "img/instagram-acervo/CSz6ZhcH1P3.webp"
  - data: "2021-08-03"
    categoria: "Pesquisa"
    titulo: "Saúde mental em tempos de pandemia de COVID-19"
    resumo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC"
    conteudo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC.\n.\n📄 Neste resumo, vamos falar sobre a “Saúde mental em tempos de pandemia de COVID-19”, apresentado pela doutoranda Waléria de Paula (@waleria_dp) e pela mestranda Bruna Carolina Barbosa (@brunabcrb18), sob orientação da professora Dra. Adriana Lúcia Meireles (@dri_meireles). A apresentação dessa temática também contou com a colaboração da aluna Isadora Khouri (@isadorasakr).\n.\n💡 Na apresentação, as alunas falaram sobre a definição de saúde mental de acordo com a Organização Mundial de Saúde (OMS), os fatores que afetam a saúde mental dos indivíduos, o cenário epidemiológico mundial de ansiedade e depressão e a saúde mental da comunidade acadêmica (estudantes e servidores) durante a pandemia de COVID-19. Além disso, as alunas abordaram alguns resultados preliminares do estudo PADu-COVID.\n.\n📈 Na linha de base do PADu-COVID, observou-se elevada prevalência de sintomas de ansiedade, depressão e estresse na comunidade acadêmica da UFOP. Os achados evidenciam a importância de políticas públicas que visem a saúde física e mental no ambiente universitário.\n.\n👉 Arraste para o lado e confira mais sobre esse tema.\n.\n🗣 Continue nos acompanhando para saber mais sobre os resultados do PADu-COVID e sobre os trabalhos desenvolvidos pelo nosso grupo!"
    url: "https://www.instagram.com/p/CSIANLPHf5s/"
    imagem: "img/instagram-acervo/CSIANLPHf5s.webp"
  - data: "2021-07-30"
    categoria: "Pesquisa"
    titulo: "Na semana passada, apresentamos para vocês a pesquisa da mestranda Thaís Calcagno"
    resumo: "Na semana passada, apresentamos para vocês a pesquisa da mestranda Thaís Calcagno (@t.calcagno)"
    conteudo: "Na semana passada, apresentamos para vocês a pesquisa da mestranda Thaís Calcagno (@t.calcagno). Mas qual a importância de estudar a percepção de solidão e de suporte social em tempos de pandemia da COVID-19?\n.\n📌 A solidão é uma experiência subjetiva negativa em um indivíduo, que surge quando as relações e interações sociais são percebidas como insuficientes. Já o suporte social, é definido como cuidado ou assistência, trocado por meio de relações sociais e interações interpessoais. Tanto a solidão quanto o suporte social foram identificados como consequências potenciais do distanciamento social imposto pelo governo para minimizar a transmissão do novo coronavírus.\n.\n📚 Os estudos têm demonstrado que durante eventos estressantes, como a pandemia de COVID-19, indivíduos silenciosos e aqueles que têm um sistema de suporte adequado e habilidades de enfrentamento têm menos probabilidade de serem estressadas ou de se sentirem solitários. O apoio adequado que se origina de amigos e familiares também foi considerado vital para ajudar o indivíduo a lidar com situações que provocam estresse, como crise de emergência e surtos de doenças infecciosas.\n.\n💡 Os achados do presente estudo sugerem que as medidas de controle da COVID-19 (por exemplo, bloqueio obrigatório e distanciamento social) para conter o vírus aumentaram os níveis de solidão, principalmente em estudantes mais jovens e mulheres. Alunos que percebem um maior apoio social, relataram um nível mais baixo de solidão.\n.\n👉🏻 Arraste para o lado e confira o resumo do artigo apresentado."
    url: "https://www.instagram.com/p/CR9sYWlnbgv/"
    imagem: "img/instagram-acervo/CR9sYWlnbgv.webp"
  - data: "2021-07-23"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: mestranda Thaís Calcagno Vidon Bruno"
    resumo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a mestranda Thaís Calcagno Vidon Bruno (@t.calcagno)"
    conteudo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a mestranda Thaís Calcagno Vidon Bruno (@t.calcagno).\n.\n👩🏼‍🎓 Thaís é graduada em Nutrição pela Universidade Federal de Viçosa (UFV). É pós-graduada em Nutrição Clínica e Terapia Nutricional pelo GANEP. Tem experiência na área de pesquisa clínica e experimental e na área profissional em Unidades de Alimentação e Nutrição (UAN) e Clínica Ambulatorial. Atualmente, é mestranda pelo Programa de Pós-Graduação em Saúde e Nutrição da UFOP (PPGSN/UFOP), na linha de pesquisa Saúde e Nutrição em Indivíduos e Coletividades. \n.\n📚 É pesquisadora do projeto “Efeito da pandemia do COVID-19 na saúde mental e nutricional e no ambiente alimentar domiciliar da comunidade acadêmica: avaliação longitudinal” (PADu-COVID) e seu trabalho de mestrado é intitulado “Associação da percepção de solidão e de suporte social em tempos de pandemia de COVID-19 com hábitos, práticas alimentares e estado nutricional”, sob a orientação da professora Dra. Júlia Cristina Carraro (UFOP) e coorientação da professora Dra. Sabrina Martins Barroso (UFTM).\n.\n🔎 Quer saber mais sobre o projeto da Thaís e de outros trabalhos desenvolvidos pelo nosso grupo? Continue nos acompanhando."
