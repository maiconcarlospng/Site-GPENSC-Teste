  - data: "2020-08-19"
    categoria: "Institucional"
    titulo: "Hoje é dia de apresentar para vocês uma de nossas integrantes!"
    resumo: "Hoje é dia de apresentar para vocês uma de nossas integrantes!"
    conteudo: "Hoje é dia de apresentar para vocês uma de nossas integrantes!\n.\n\nA Amanda é nutricionista formada pela Universidade Federal de Ouro Preto (2016), atualmente é mestranda acadêmica no Programa de Pós-Graduação em Saúde e Nutrição, também da Universidade Federal de Ouro Preto. É integrante do GPENSC desde a sua criação e possui experiência em pesquisa científica atuando na área de epidemiologia e saúde coletiva com ênfase nas doenças crônicas não transmissíveis. Sua pesquisa é orientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) e co-orientada pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut), e intitulada como “Ingestão de polifenóis e sua relação com os alimentos ultraprocessados em participantes da linha de base da coorte de universidades mineiras (Projeto Cume)”. \n.\n🔎 A pesquisa propõe avaliar a relação entre a ingestão de polifenóis e os alimentos ultraprocessados na coorte de egressos universitários, participantes do projeto CUME (@projeto_cume).\n.\n📌 A pesquisa compreende a ingestão de polifenóis, compostos bioativos considerados fatores protetores para doenças cardiovasculares, e o consumo de alimentos ultraprocessados, considerados fatores de risco para doenças cardiovasculares. Os dados da pesquisa são importantes, pois há um aumento significativo global na produção e no consumo de alimentos ultraprocessados. E assim, grande proporção da população mundial encontra-se exposta a alimentos excessivamente densos em energia e ricos em gordura saturada, açúcar e sódio. E essa tendência preocupante do padrão alimentar é percebida na população brasileira, a qual reflete um consumo elevado de produtos ultraprocessados e baixa ingestão de alimentos in natura como as frutas e hortaliças, principal fonte de polifenóis. \n.\n\nQuer saber mais sobre esse tema e sobre a pesquisa? Continue nos acompanhando."
    url: "https://www.instagram.com/p/CEFjUntn4Rr/"
    imagem: "img/instagram-acervo/CEFjUntn4Rr.webp"
  - data: "2020-07-30"
    categoria: "Institucional"
    titulo: "Hoje é dia #tbt e temos uma recordação muito especial para compartilhar com vocês!"
    resumo: "Hoje é dia #tbt e temos uma recordação muito especial para compartilhar com vocês!"
    conteudo: "Hoje é dia #tbt e temos uma recordação muito especial para compartilhar com vocês! 😍😍\n.\n🔹 Dessa vez, voltamos em fevereiro deste ano, quando aconteceu a Defesa de Mestrado da Waléria de Paula (@waleria_dp), que atualmente é doutoranda (Cipharma/UFOP) e integrante do nosso grupo de pesquisa.\n.\n🔹 A dissertação intitulada “Sintomas de transtorno de ansiedade e depressão e uso de substâncias psicoativas entre estudantes ingressantes da Universidade Federal de Ouro Preto” faz parte do Projeto de Ansiedade e Depressão em universitários (PADu - @padufederais) e teve como objetivo avaliar a prevalência dos sintomas de ansiedade e depressão e do uso de substância psicoativas e os fatores associados em estudantes universitários do primeiro período da #UFOP.\n.\n🔹 O trabalho foi orientado pela professora Dra. Adriana Lúcia Meireles (@dri_meireles), coorientado pela professora Dra. Renata C. R. M. do Nascimento (@recmacedo) e desenvolvido no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN/UFOP). Além disso, contou com a contribuição da banca composta pela professora Dra. Elaine Leandro Machado (DMPS/UFMG) e pela professora Dra. Clareci Silva Cardoso (UFSJ).\n.\n.\nParabéns Waléria pela sua contribuição na ciência brasileira! 👏👩🏻‍🏫✨"
    url: "https://www.instagram.com/p/CDSEmagAuJg/"
    imagem: "img/instagram-acervo/CDSEmagAuJg.webp"
  - data: "2020-07-16"
    categoria: "Institucional"
    titulo: "Hoje é dia de #tbt e temos uma recordação muito especial para compartilhar com vocês, a Defesa de Mestrado da Fátima Costa Oliveira, que aconteceu em fevereiro, na #UFOP 🎉🎈"
    resumo: "Hoje é dia de #tbt e temos uma recordação muito especial para compartilhar com vocês, a Defesa de Mestrado da Fátima Costa Oliveira (@fatimaoliveira3936), que aconteceu em fevereiro, na #UFOP 🎉🎈"
    conteudo: "Hoje é dia de #tbt e temos uma recordação muito especial para compartilhar com vocês, a Defesa de Mestrado da Fátima Costa Oliveira (@fatimaoliveira3936), que aconteceu em fevereiro, na #UFOP 🎉🎈\n.\nA dissertação da Fátima, intitulada “Associação de componentes dietéticos relacionados à inflamação e à microbiota intestinal com a prevalência de depressão em egressos universitários (Projeto CUME)”, faz parte do Projeto CUME (@projeto_cume), foi desenvolvida sob a orientação da professora Dra Júlia Cristina Cardoso Carraro e coorientação da professora Dra Raquel de Deus Mendonça (@raquelmendonca_enut), no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN/UFOP).\n.\nO trabalho contou também com as contribuições da banca avaliadora, composta pela professora Dra. Josefina Bressan (@josefinabressan) (DNS/UFV; coordenadora do Projeto CUME) e do professor Dr. George Luiz Lins Machado Coelho (EMED/UFOP).\n.\n.\nParabenizamos a Fátima pela defesa e por sua valiosa contribuição na ciência nacional! 👩🏻‍🏫👏🏻"
    url: "https://www.instagram.com/p/CCt3mnTAKe6/"
    imagem: "img/instagram-acervo/CCt3mnTAKe6.webp"
  - data: "2020-06-18"
    categoria: "Institucional"
    titulo: "Hoje é dia de #tbt 🥳🥳"
    resumo: "Hoje é dia de #tbt 🥳🥳 . . A Thaís Sabião foi aluna e integrante do nosso grupo de pesquisa no ano de 2019 e…"
    conteudo: "Hoje é dia de #tbt 🥳🥳\n.\n.\nA Thaís Sabião foi aluna e integrante do nosso grupo de pesquisa no ano de 2019 e conduziu sua pesquisa intitulada: “Capacidade antioxidante da dieta e hipertensão arterial entre fumantes e não fumantes egressos das Universidade Mineiras” sob a orientação da professora Aline Silva Aguiar e coorientação da professora Júlia Cristina Cardoso Carraro.\nA sua pesquisa teve desenho transversal e realizada com egressos de cinco instituições federais de ensino superior situadas no estado de Minas Gerais participantes do projeto CUME @projeto_cume (Coorte de Universidades Mineiras) e teve como objetivo investigar a associação do fumo com a hipertensão e ainda, analisar se a capacidade antioxidante total (CAT) da dieta atua como mediador desse desfecho entre os participantes.\nO trabalho também contou com as contribuições das professoras Adriana Meireles (@dri_meireles (UFOP) e Fernanda Vidgal (@fcvidigal) (UNIFAL) 👏🏻👏🏻👏🏻\n.\n.\n.\nParabéns Thaís, por auxiliar no desenvolvimento da ciência no país 👩🏻‍🏫"
    url: "https://www.instagram.com/p/CBl13drgydS/"
    imagem: "img/instagram-acervo/CBl13drgydS.webp"
  - data: "2020-05-27"
    categoria: "Institucional"
    titulo: "Hoje é dia de apresentar para vocês um membro do GPENSC!"
    resumo: "Hoje é dia de apresentar para vocês um membro do GPENSC! 😍 Conheçam um pouco mais sobre a Professora Mariana. . A professora Mariana Carvalho…"
    conteudo: "Hoje é dia de apresentar para vocês um membro do GPENSC! 😍 Conheçam um pouco mais sobre a Professora Mariana.\n.\nA professora Mariana Carvalho de Menezes possui graduação em Nutrição, é especialista em Saúde com ênfase em Epidemiologia, Mestre em Saúde e Enfermagem, Doutora em Enfermagem e Saúde com ênfase em Saúde Pública, sendo que, todas suas titulações foram obtidas pela Universidade Federal de Minas Gerais (UFMG). Mariana também fez Doutorado sanduíche na School of Public Health, Drexel University, Philadelphia, USA. \nAtualmente, é professora Adjunta do Departamento de Nutrição Clínica e Social da Universidade Federal de Ouro Preto (UFOP). É pesquisadora do projeto SALURBAL (Drexel University; Fiocruz-RJ), do Grupo de Intervenções em Nutrição (GIN-UFMG), do Grupo de Estudos, Pesquisas e Práticas em Ambiente Alimentar (GEPPAAS-UFMG) e do Grupo de Pesquisa e Estudos em Nutrição e Saúde Coletiva (GPENSC-UFOP). Possui experiência na área de Saúde Pública, com ênfase em Epidemiologia Nutricional, atuando principalmente nos temas: ambiente alimentar, consumo alimentar e intervenção nutricional."
    url: "https://www.instagram.com/p/CAtOvrAAiMd/"
    imagem: "img/instagram-acervo/CAtOvrAAiMd.webp"
  - data: "2020-05-22"
