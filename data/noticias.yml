  - data: "2022-03-17"
    categoria: "Pesquisa"
    titulo: "O GPENSC recomenda o Plano de Ações Estratégicas para o Enfrentamento das Doenças Crônicas e Agravos Não Transmissíveis no Brasil 2021-2030 (Plano de Dant), lançado em 2021…"
    resumo: "O GPENSC recomenda o Plano de Ações Estratégicas para o Enfrentamento das Doenças Crônicas e Agravos Não Transmissíveis no Brasil 2021-2030 (Plano de Dant), lançado em 2021 pelo Ministério da Saúde"
    conteudo: "O GPENSC recomenda o Plano de Ações Estratégicas para o Enfrentamento das Doenças Crônicas e Agravos Não Transmissíveis no Brasil 2021-2030 (Plano de Dant), lançado em 2021 pelo Ministério da Saúde.\n.\n📝 O Plano de Dant foi elaborado diante da aproximação do término da vigência do Plano de Ações Estratégicas para o Enfrentamento das Doenças Crônicas Não Transmissíveis no Brasil, 2011-2022 e para atender os compromissos que o Brasil assumiu mundialmente frente à Agenda dos Objetivos de Desenvolvimento Sustentável (ODS).\n.\n🎯 Alinhado com as principais políticas e programas do país, o Plano de Dant vem para ampliar e reafirmar as propostas para o enfretamento das doenças crônicas não transmissíveis (DCNT) e dos seus fatores de risco. O Plano tem como objetivo fortalecer a agenda de enfrentamento das DCNT, das violências e dos acidentes, bem como pautar a promoção da saúde nas ações de saúde.\n.\n👉🏽 Arraste para o lado e confira alguns resultados, metas e indicadores que são apresentados no Plano.\n.\n🔗 O material na íntegra pode ser acessado no site do Ministério da Saúde ou pelo link disponível na nossa bio.\n.\n🗣 Não deixe de conferir e salvar esse post para quando precisar!"
