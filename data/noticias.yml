    resumo: "Hoje, dando continuidade à nossa série de postagens sobre o Guia Alimentar para a População Brasileira, em comemoração aos seus 8 anos de lançamento, vamos falar sobre sua importância para a nossa população"
    conteudo: "Hoje, dando continuidade à nossa série de postagens sobre o Guia Alimentar para a População Brasileira, em comemoração aos seus 8 anos de lançamento, vamos falar sobre sua importância para a nossa população.\n.\n📘 O Guia é um documento oficial que tem o intuito de abordar sobre os princípios e as recomendações para uma alimentação adequada e saudável para a população brasileira. Ele apoia as ações de educação alimentar e nutricional nos mais diversos setores na área da saúde com linguagem simples e acessível, um dos motivos que justifica sua relevância.\n.\n🗣️ Está gostando das nossas postagens sobre o Guia? Não deixe de conferir e continuar acompanhando as próximas postagens dessa série para lá de especial."
