    titulo: "Crianças e adolescentes enfrentaram desafios alimentares durante a pandemia e isso foi investigado de perto!"
    resumo: "Crianças e adolescentes enfrentaram desafios alimentares durante a pandemia e isso foi investigado de perto! Estudo conduzido por Priscila Pena Camargo (@priscilapenacamargo) juntamente com outros…"
    conteudo: "Crianças e adolescentes enfrentaram desafios alimentares durante a pandemia e isso foi investigado de perto! \n\nEstudo conduzido por Priscila Pena Camargo (@priscilapenacamargo) juntamente com outros pesquisadores do GPENSC, para investigar como o contexto da pandemia de COVID-19 agravou a insegurança alimentar, especialmente entre as populações mais vulneráveis. \n \nO que foi feito?\nEstudo com 611 famílias de estudantes da rede pública para entender como a suspensão das aulas e a consequente interrupção no fornecimento da alimentação escolar durante a pandemia de COVID-19, afetou a disponibilidade de alimentos nos domicílios dos estudantes.\n\nE o que encontraram?\n82% dos lares estavam em insegurança alimentar;\n65% tinham baixa condição socioeconômica;\n50% dos responsáveis estavam desempregados;\nA disponibilidade de alimentos saudáveis foi significativamente menor em famílias com com insegurança alimentar, com mais filhos, chefiadas por pessoas não casadas, com queda na renda familiar e em situação de maior vulnerabilidade.\n\nConclusão:\nA pandemia escancarou desigualdades sociais. Famílias com crianças e adolescentes enfrentaram grande dificuldade no acesso a alimentos saudáveis, especialmente aquelas em maior vulnerabilidade. O estudo mostra que a segurança alimentar precisa ser prioridade em políticas públicas, principalmente em tempos de crise.\n\n🔗Acesse o artigo completo: https://pubs.sciepub.com/jfs/13/2/4/index.html"
    url: "https://www.instagram.com/p/DL5tga3R1KB/"
    imagem: "img/instagram-acervo/DL5tga3R1KB.webp"
