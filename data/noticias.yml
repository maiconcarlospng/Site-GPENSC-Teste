    resumo: "O GPENSC recomenda o episódio \"Ultraprocessados, uma relação tóxica”, do podcast Prato Cheio, o Joio e o Trigo (@ojoioeotrigo)"
    conteudo: "O GPENSC recomenda o episódio \"Ultraprocessados, uma relação tóxica”, do podcast Prato Cheio, o Joio e o Trigo (@ojoioeotrigo).\n.\n🎙️ O episódio apresenta uma pesquisa realizada pelo NUPENS e divulgada pelo Joio e o Trigo, que mostra como a teoria cunhada no Brasil venceu as fronteiras da ciência e se estabeleceu como um dos grandes acontecimentos do século XXI na comunidade acadêmica. Hoje, a tarefa de defender os ultraprocessados parece cada vez mais um exercício de negacionismo.\n.\n👥 O episódio conta com a participação do professor Dr. Carlos Augusto Monteiro e a professora e Dra. Ana Paula Bortolleto, ambos da Universidade de São Paulo (USP).\n.\n🔎 Esse e outros episódios do podcast Prato Cheio estão disponíveis no Spotify.\n.\n📌 Aproveita e já salva esse post e não deixe de marcar aqui nos comentários ou enviar essa publicação para aquele(a) amigo(a) que vai gostar dessa indicação."
