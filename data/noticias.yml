    conteudo: "É com muita alegria que o GPENSC convida para a roda de conversa, intitulada \"Roda da vida e fichamento de materiais \".\n.\n🗓️ Nosso encontro será dia 19 de junho (segunda-feira), às 10h00, e contaremos com a participação da professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut).\n.\n📝 O intuito do encontro é auxiliar sobre como elaborar uma roda da vida e fazer fichamento de textos acadêmicos, o que costuma ser dúvida frequente entre os pesquisadores, principalmente entre os estudantes.\n.\n📍O minicurso será presencial, no Laboratório Multiusuário de Pesquisa em Saúde Coletiva (LAMUSC) da Escola de Nutrição (ENUT/UFOP). Pedimos aos participantes que levem notebook ou similares.\n.\n🗣️ Venha participar conosco, não fique de fora! Anota aí na agenda e #vemcomagente. Esperamos vocês!"
