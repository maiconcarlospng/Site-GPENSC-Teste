    conteudo: "Nosso #tbt de hoje é bem recente, para lembrar da qualificação de doutorado da aluna Priscila Pena Camargo (@priscilapenacamargo), que ocorreu no dia 05 de agosto de 2022, via Google Meet.\n.\n🔎 O projeto de doutorado da Priscila, intitulado \"Disponibilidade alimentar em domicílios de escolares na pandemia da covid-19: estudo longitudinal ESANP”, tem como objetivo avaliar a disponibilidade alimentar em domicílios de escolares da rede pública municipal de ensino nos municípios de Mariana e Ouro Preto-MG na pandemia da covid-19.\n.\n👥 Seu estudo é orientado pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut) e coorientado pela professora Dra. Adriana Lúcia Meireles (@dri_meireles). O trabalho contou com as contribuições da banca formada pelas professoras Dras. Anelise Souza - @andradeanelise (UFOP), Daniela Canella - @dani_canella (UERJ), Elisabetta Recine (UNB) e Milene Pessoa - @milenepessoa1 (UFOP).\n.\n🍽️ Os resultados preliminares apontam que a disponibilidade de alimentos está comprometida e há alta prevalência de insegurança alimentar nos domicílios dos escolares na pandemia da covid-19.\n.\n💡 Esses achados reforçam a necessidade de políticas públicas que retirem os domicílios da situação de vulnerabilidade e apoiem produtores locais e ações para o acesso a alimentos frescos e saudáveis, em quantidade suficiente e com preço acessível, para que sejam garantidas as necessidades básicas dessa população.\n.\n🎇 Parabenizamos a Priscila pela aprovação na sua qualificação e pela contribuição na ciência do país. Desejamos à aluna sucesso nas próximas etapas!"
