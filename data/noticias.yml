    titulo: "O GPENSC relembra participação do GPENSC na Mostra de Profissões da UFOP, que ocorreu no dia 17 de junho de 2023"
    resumo: "O GPENSC relembra participação do GPENSC na Mostra de Profissões da UFOP, que ocorreu no dia 17 de junho de 2023"
    conteudo: "O GPENSC relembra participação do GPENSC na Mostra de Profissões da UFOP, que ocorreu no dia 17 de junho de 2023.\n.\n🎯 O objetivo do evento foi apresentar os cursos da universidade por meio de palestras, salas interativas, apresentações culturais e visitas monitoradas a estandes e laboratórios. A última edição do evento, organizado pela Pró-Reitoria de Graduação (Prograd), através do Núcleo de Apoio Pedagógico (NAP), aconteceu em 2019, no Campus Morro do Cruzeiro, em Ouro Preto, e trouxe para dentro da universidade cerca de seis mil estudantes do ensino médio de 110 escolas públicas e privadas de várias regiões de Minas Gerais.\n.\n🔎 O evento como a Mostra de Profissões é de extrema importância para a sociedade, já que o momento da escolha de uma profissão é tão marcante, e em meio a tantas opções, algumas inclusive desconhecidas, entender sobre as carreiras e os possíveis caminhos é uma forma de facilitar a escolha. \n.\n👥 Membros do GPENSC apresentaram os diversos projetos desenvolvidos pelo grupo, como: PADu- Multicêntrico, Projeto Cume, ESANP e covid-Inconfidentes. \n.\n🗣 Continue nos acompanhando e fique por dentro de todas as nossas atividades e projetos!"
