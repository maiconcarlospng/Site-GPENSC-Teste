    titulo: "Equipe do GPENSC: doutoranda Priscila Pena Camargo"
    resumo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a doutoranda Priscila Pena Camargo (@priscilapenacamargo)"
    conteudo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a doutoranda Priscila Pena Camargo (@priscilapenacamargo).\n.\n👩🏻‍🎓A Priscila é Nutricionista, graduada pela Universidade Federal de Ouro Preto - UFOP (2006), especialista em Alimentação e Nutrição do Escolar pelo CECANE/UFOP (2014) e mestre em Saúde e Nutrição pela UFOP (2017). Atualmente, é doutoranda no no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN/UFOP), na linha de pesquisa Saúde e Nutrição em indivíduos e coletividades.Tem experiência como Nutricionista responsável técnica pelo Programa Nacional de Alimentação Escolar (PNAE) no município de Ouro Preto.\n.\n📚 Sua pesquisa de doutorado, intitulada “Disponibilidade de alimentos e segurança alimentar e nutricional nos domicílios de alunos de escolas públicas: fatores associados e evolução durante e após a pandemia de COVID-19“, é orientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientada pela professora Dra. Raquel de Deus Mendonça (raquelmendonca_enut).\n.\n📌 A pesquisa da Priscila faz parte do projeto \"Estudo da Segurança Alimentar e Nutricional na Pandemia de COVID-19\" (ESANP). \n.\n🔍 Quer saber mais sobre o tema da Priscila? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo!"
