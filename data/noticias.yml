  - data: "2021-09-29"
    categoria: "Pesquisa"
    titulo: "Na semana passada, apresentamos para vocês a pesquisa da pós-doutoranda Ana Maria Sampaio Rocha"
    resumo: "Na semana passada, apresentamos para vocês a pesquisa da pós-doutoranda Ana Maria Sampaio Rocha (@anasampaiorocha)"
    conteudo: "Na semana passada, apresentamos para vocês a pesquisa da pós-doutoranda Ana Maria Sampaio Rocha (@anasampaiorocha). Estão lembrados? Para vocês ficarem ainda mais por dentro da temática investigada pela Ana Maria, hoje vamos apresentar alguns resultados preliminares do seu trabalho. \n.\n🎯 O objetivo do estudo foi estimar a prevalência da infecção por SARS-CoV-2, descrever o perfil sorológico e relacioná-lo com características socioeconômicas e de saúde, durante a primeira fase da pandemia, na sede dos municípios de Mariana e Ouro Preto, Minas Gerais. \n. \n🧪 Por meio de um estudo transversal, de base populacional, realizado no período de outubro a dezembro de 2020, foram selecionados indivíduos maiores de 18 anos, residentes na área urbana, a partir de amostragem estratificada por conglomerado. Os dados sociodemográficos, econômicos e de saúde foram obtidos por um questionário aplicado por meio de entrevista. O inquérito soroepidemiológico foi realizado utilizando amostras de soro, obtidas por punção venosa, e testadas pelo método imunocromatográfico (teste One Step Covid 2019®️). \n.\n🦠 Os dados obtidos permitiram concluir que os casos de infecção pelo SARS-CoV-2 concentraram-se em áreas de menor renda e, quando sintomáticos, apresentavam fadiga, ageusia, anosmia, vômito, taquicardia e dispneia. O perfil da soropositividade apontou uma possível vulnerabilidade no grupo infectado.\n.\n💡 Os inquéritos de base populacional são imprescindíveis para a visualização do cenário epidemiológico e projeções da doença, pois contribuem para o entendimento da dinâmica de transmissão e evolução da COVID-19 e podem subsidiar o direcionamento de medidas preventivas. No entanto, poucos são os estudos com esse delineamento voltados à estimativa da frequência de casos e à compreensão das características da população em países como o Brasil. \n.\n🗣 Quer saber mais sobre os resultados do COVID-Inconfidentes e outros estudos do grupo? Então, continue nos acompanhando."
    url: "https://www.instagram.com/p/CUa32P_PSGe/"
    imagem: "img/instagram-acervo/CUa32P_PSGe.webp"
  - data: "2021-09-24"
    categoria: "Pesquisa"
    titulo: "Sindemia global e ambiente alimentar"
    resumo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC"
    conteudo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC.\n.\n📄 Neste resumo, vamos falar sobre “Sindemia global e ambiente alimentar”, apresentado pelas doutorandas Irene Carolina Sousa Justiniano (@irenecsj_) e Hillary Nascimento Coletro (@hillarycoletro), sob orientação da professora Dra. Mariana Carvalho de Menezes. O resumo também contou com a colaboração das alunas de iniciação científica Milena Martins de Oliveira (@mi_martinns) e Maria Luísa de Farias Lage (@malu_lage_).\n.\n💡 Na apresentação, as alunas falaram sobre o conceito de sindemia global e seus determinantes, a definição de sistema alimentar e ambiente alimentar, bem como a classificação e os fatores que influenciam o ambiente alimentar. \n.\n🌎 Além disso, na apresentação as doutorandas destacaram que as estratégias mundiais de enfrentamento adotadas na pandemia da Covid-19, como distanciamento social e restrições para o funcionamento do comércio, causaram mudanças no ambiente alimentar e impactaram as práticas alimentares de toda a população em um mundo que já operava com um sistema alimentar estressado, prejudicando o acesso a alimentação saudável e colocando em risco a segurança alimentar e nutricional da população.\n.\n👉🏻 Arraste para o lado e confira mais sobre esse tema.\n.\n🗣️ Continue nos acompanhando para saber mais sobre os trabalhos desenvolvidos pelo nosso grupo."
