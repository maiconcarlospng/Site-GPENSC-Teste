    titulo: "Hoje é dia de apresentar para vocês mais uma de nossas integrantes"
    resumo: "Hoje é dia de apresentar para vocês mais uma de nossas integrantes"
    conteudo: "Hoje é dia de apresentar para vocês mais uma de nossas integrantes.\n.\n🎓 A Larissa é graduada em nutrição pela Universidade Federal de Viçosa e pós-graduada em Gestão da Segurança dos Alimentos (SENAC). Apresenta vasta experiência no Programa Nacional de Alimentação Escolar (PNAE) como: responsável técnica municipal, agente no Centro Colaborador em Alimentação e Nutrição do Escolar - CECANE/UFOP e nutricionista do quadro técnico na Secretaria de Estado de Educação de Minas Gerais, quando foi conselheira governamental do Conselho de Segurança Alimentar e Nutricional (CONSEA-MG) e membro do grupo de apoio técnico da Câmara Intersetorial de Segurança Alimentar e Nutricional do Estado de Minas Gerais (CAISAN-MG). Atuou, ainda, como docente do Pronatec IFMG-Bambuí. Atualmente, é mestranda do Programa de Pós-Graduação em Saúde e Nutrição da Universidade Federal de Ouro Preto, na linha de pesquisa Nutrição em Saúde Coletiva. É membro do GPENSC e pesquisadora no projeto intitulado “Impactos financeiros e à saúde devidos à alimentação inadequada e ao excesso de peso no Brasil e Unidades Federativas”.\n.\n📌 Sua pesquisa de mestrado é orientada pela professora Dra. Ísis Eloah Machado (@isiseloah) e tem como objetivo estimar a carga de doenças crônicas não transmissíveis relacionada à dieta com elevado teor de sódio para a população adulta brasileira e seu custo financeiro para o Sistema Único de Saúde.\n.\n🗣️ Continue nos acompanhando e fique por dentro deste e de outros trabalhos desenvolvidos pelo nosso grupo!"
