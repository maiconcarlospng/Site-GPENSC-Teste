  - data: "2024-08-29"
    categoria: "Institucional"
    titulo: "Nosso tbt de hoje é para lembrar da defesa de mestrado do Felipe Reis Stavaux Baudson, que ocorreu no dia 19 de julho de 2024 na Escola de Nutrição - ENUT/UFOP"
    resumo: "Nosso tbt de hoje é para lembrar da defesa de mestrado do Felipe Reis Stavaux Baudson (@felipebaudson ), que ocorreu no dia 19 de julho de 2024 na Escola de Nutrição - ENUT/UFOP (@enut_ufop )"
    conteudo: "Nosso tbt de hoje é para lembrar da defesa de mestrado do Felipe Reis Stavaux Baudson (@felipebaudson ), que ocorreu no dia 19 de julho de 2024 na Escola de Nutrição - ENUT/UFOP (@enut_ufop ).\n.\n🔎 A dissertação do Felipe, intitulada “Consumo de alimentos segundo a classificação NOVA e prevalência de insônia em egressos de universidades mineiras: Coorte CUME”, teve como objetivo analisar o consumo de alimentos segundo classificação NOVA e a sua associação com a prevalência de insônia entre os participantes do estudo CUME.\n.\n👥 Seu estudo foi orientado pela professora Dra. Raquel Mendonça – UFOP (@raquelmendonca_enut) e coorientada pela professora Dra. Renata Adrielle – UFPB (@renataadriellenutri ). O trabalho contou com a contribuição da banca formada pelo professor Dr. Luiz Antônio Menezes – UFOP (@luizmenezes__ ) e pela professora Dra. Camila Medeiros da Silva Mazzeti – UFMS (@cmazzeti).\n.\n💡Os resultados da dissertação do Felipe não encontraram uma associação significativa entre o consumo de alimentos, conforme a classificação NOVA, e a prevalência de insônia em adultos jovens. No entanto, foi observado que fatores como depressão, nível de atividade física, tabagismo e consumo de bebidas alcoólicas desempenham um papel crucial no desenvolvimento da insônia. \n.\n💡Esses achados enfatizam a necessidade de novos estudos que explorem essa associação para aprofundar o entendimento sobre como os hábitos alimentares influenciam esse distúrbio do sono, que é um dos mais comuns na sociedade atual.\n.\n🎆 Parabenizamos o Felipe pela defesa e pela contribuição na ciência do país."
    url: "https://www.instagram.com/p/C_RR4aHuBr4/"
    imagem: "img/instagram-acervo/C_RR4aHuBr4.webp"
