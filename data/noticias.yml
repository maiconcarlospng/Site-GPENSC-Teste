    conteudo: "Hoje é dia de apresentar para vocês mais uma de nossas integrantes ☺️\n.\n🎓 A Bruna possui graduação em Nutrição pela Universidade Federal de Ouro Preto (UFOP). Atualmente, é mestranda do Programa de Pós-Graduação em Saúde e Nutrição (PPGSN-UFOP), na linha de pesquisa Nutrição em Saúde Coletiva. É membro do GPENSC desde sua fundação, e pesquisadora no projeto sobre ansiedade e depressão em universitários (PADu- @padufederais) e do projeto “Efeito da pandemia do COVID-19 na saúde mental e nutricional e no ambiente alimentar domiciliar da comunidade acadêmica: avaliação longitudinal” (PADuCovid). \n.\n📌 Sua pesquisa de mestrado é orientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles ) e coorientada pela professora Dra. Elaine Leandro Machado (@lili_mach ).\n.\n🔎 Durante o mestrado, um dos temas que a Bruna irá trabalhar será à coocorrência de fatores de risco obesogênicos em estudantes universitários ingressantes na UFOP. \n.\n🗣️Continue nos acompanhando e fique por dentro deste e de outros trabalhos desenvolvidos pelo nosso grupo!"
