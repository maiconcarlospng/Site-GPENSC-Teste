    conteudo: "O GPENSC relembra última reunião do nosso grupo, que aconteceu no dia 04 de dezembro de 2023.\n.\n💟 Foi um encontro muito especial, em que tivemos a oportunidade de conversar e compartilhar nossas perspectivas sobre as reuniões presenciais, nossas dificuldades, alegrias e desejos para o próximo ano. \n.\n💫 Sabemos que 2023 foi um ano desafiador para muitos de nós, mas fizemos desse encontro especial e acolhedor. Para 2024, desejamos que o GPENSC continue sendo espaço de apoio mútuo, reflexão crítica, troca de conhecimento, aprendizagem, de fazer e discutir ciência, além de ser um espaço para amizades, respeito e acolhimento!\n.\nAgradecemos a todos vocês que acompanharam nosso grupo! Muito obrigado a todos! 💚❤️🧡"
