    imagem: "img/instagram-acervo/CcjC0guOb4k.webp"
  - data: "2022-04-14"
    categoria: "Pesquisa"
    titulo: "Efeito da interação entre o aleitamento materno e o polimorfismo IN/DEL da ECA sobre o risco de hipertensão arterial em adultos jovens"
    resumo: "O GPENSC apresenta um #infográfico sobre o tema de dissertação da Ana Flávia Martins (@ananutrifuncional)"
    conteudo: "O GPENSC apresenta um #infográfico sobre o tema de dissertação da Ana Flávia Martins (@ananutrifuncional).\n.\n👩🏻‍💻 O trabalho da Ana Flávia, intitulado “Efeito da interação entre o aleitamento materno e o polimorfismo IN/DEL da ECA sobre o risco de hipertensão arterial em adultos jovens”, contou com a orientação da professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro) e a coorientação da professora Dra. Karina Barbosa de Queiroz (@prof.karina_queiroz). \n.\n🩺 A hipertensão arterial é uma das doenças crônicas não transmissíveis de maior prevalência no Brasil e no mundo, é uma das principais causas de doenças cardiovasculares, sendo um importante fator evitável destas doenças. \n. \n📈 Diversos fatores podem aumentar o risco de hipertensão arterial, como idade, sexo, tabagismo, uso de bebida alcoólica e polimorfismos genéticos.\n.\n🤱🏾A programação metabólica é um importante fator de proteção contra doenças, tanto na infância quanto na idade adulta, sendo o aleitamento materno exclusivo um dos componentes desta programação.\n.\n👥 O estudo foi realizado na cidade de Ouro Preto com adultos entre 19 e 29 anos que haviam participado de uma primeira etapa do estudo em 2006. Foi realizada avaliação antropométrica, clínica, bioquímica e condições sociodemográficas. \n.\n📊 Observou-se uma elevada prevalência de hipertensão arterial nestes adultos jovens, maior do que o esperado para a idade, porém não houve relação dos valores de pressão e o genótipo do gene da ECA.\n.\n👉🏽 Arraste para o lado e confira!\n.\n🗣 Continue nos acompanhando para saber mais sobre os trabalhos desenvolvidos pelo nosso grupo!"
    url: "https://www.instagram.com/p/CcWVik4u4RZ/"
    imagem: "img/instagram-acervo/CcWVik4u4RZ.webp"
  - data: "2022-04-12"
    categoria: "Pesquisa"
    titulo: "Livro: Ambiente alimentar: saúde e nutrição"
    resumo: "Hoje, trazemos para vocês uma produção muito especial, o livro “Ambiente alimentar: saúde e nutrição”"
    conteudo: "Hoje, trazemos para vocês uma produção muito especial, o livro “Ambiente alimentar: saúde e nutrição”.\n.\n🎯 Esta obra tem como objetivo reunir as evidências científicas sobre a relação do ambiente alimentar e oportunidades ou condições que influenciam as escolhas alimentares dos indivíduos e populações.\n.\n📑 O livro foi organizado pelas pesquisadoras Larissa Loures Mendes (@larissalouresmendes), Milene Cristine Pessoa (@milenepessoa1) e Bruna Vieira de Lima Costa (@brunavlcosta), do Grupo de Estudos Pesquisas e Práticas em Ambiente Alimentar e Saúde - UFMG (GEPPAAS - @geppaasufmg).\n.\n👥 A obra também contou com a contribuição de pesquisadores de diversas instituições, incluindo a participação de pesquisadoras do GPENSC. \n.\n📝 As professoras Dras. Adriana Lúcia Meireles (@dri_meireles) e Mariana Carvalho de Menezes (@maricarvalhomenezes) e as doutorandas Irene Carolina Sousa Justiniano (@irenecsj_) e Magda do Carmo Parajára (@magdaparajara) tiveram participação nos seguintes capítulos:\n• Saúde urbana e ambiente alimentar: abordagens metodológicas\n• Ambiente alimentar comunitário\n• Ambiente alimentar doméstico\n• Abordagens sistêmicas na saúde – uma introdução ao tema\n.\n📍 O livro pode ser adquirido no site da Editora Rubio (@rubioeditora).\n.\n🗣 Continue nos acompanhando para ficar por dentro de todas as nossas produções!"
