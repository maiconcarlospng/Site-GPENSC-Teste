    titulo: "Carga de doenças atribuível a dieta rica em carnes processadas e seu custo financeiro para o Sistema Único de Saúde no Brasil"
    resumo: "Nosso #tbt é bem recente, para lembrar de duas qualificações de mestrado que ocorreram nos últimos dias, via Google Meet"
    conteudo: "Nosso #tbt é bem recente, para lembrar de duas qualificações de mestrado que ocorreram nos últimos dias, via Google Meet.\n.\n🗓️ No dia 16 de abril, aconteceu a qualificação de mestrado da aluna Carla Eduarda Rocha (@carlaef.rocha).\n.\n🔎 O projeto de mestrado da Carla, intitulado \"Carga de doenças atribuível a dieta rica em carnes processadas e seu custo financeiro para o Sistema Único de Saúde no Brasil\" é orientado pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientado pela professora Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes). Sua banca de qualificação contou com a colaboração da professora Dra. Ísis Eloah Machado (@isiseloahmachado) e da professora Dra. Erika Cardoso dos Reis, ambas professoras da UFOP.\n.\n🗓️ No dia 20 de abril, ocorreu a qualificação da mestranda Bruna Carolina Barbosa (@brunabcrb18).\n.\n🔎 O projeto de mestrado da Bruna, intitulado \"Coocorrência de comportamentos obesogênicos em estudantes universitários: estudo PADu\" é orientado pela professora Dra. Adriana Lúcia Meireles (@dri_meireles), da UFOP, e coorientado pela professora Dra. Elaine Leandro Machado (@lili_mach), da UFMG. A banca de qualificação da Bruna contou com as contribuições da professora Dra. Mariana Carvalho de Menezes - UFOP (@maricarvalhomenezes) e da professora Dra. Luana Caroline dos Santos - UFMG (@luanacstos).\n.\n🎇 Parabenizamos Carla e Bruna pela aprovação na qualificação e pela contribuição na ciência do país. Sucesso, meninas! ✨👏🏻🎉"
