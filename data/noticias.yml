    titulo: "Hoje, nosso post é para compartilhar com vocês sobre o doutorado sanduíche de uma pesquisadora do nosso grupo, a Magda do Carmo Parajára, discente do PPGSN/UFOP, orientada pela…"
    resumo: "Hoje, nosso post é para compartilhar com vocês sobre o doutorado sanduíche de uma pesquisadora do nosso grupo, a Magda do Carmo Parajára (@magdaparajara), discente do PPGSN/UFOP (@ppgsn.ufop), orientada pela professora Dra"
    conteudo: "Hoje, nosso post é para compartilhar com vocês sobre o doutorado sanduíche de uma pesquisadora do nosso grupo, a Magda do Carmo Parajára (@magdaparajara), discente do PPGSN/UFOP (@ppgsn.ufop), orientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles). \n.\n✈️ A Magda foi contemplada com uma bolsa da Coordenação de Aperfeiçoamento de Pessoal de Nível Superior (CAPES - @capes_mec), pelo Programa de Doutorado Sanduíche no Exterior (PDSE), para realizar sua mobilidade acadêmica em Liverpool, Reino Unido, entre maio e outubro de 2022.\n.\n🏫 A instituição de destino foi a University of Liverpool (@livuni). O orientador estrangeiro da aluna é o professor Dr. Martin O’Flaherty, líder do time de modelagem do Non-Communicable Disease Prevention and Food Policy Research Group. Além dele, o trabalho também conta com a colaboração e supervisão da pós-doutoranda Zoé Colombet (@zoe.teb).\n.\n📚 Durante o doutorado sanduíche, Magda realizará parte do seu estudo sobre o impacto de políticas de alimentação na redução da carga de doença e econômica e das iniquidades no Brasil, usando metodologia de modelagem.\n.\n👉🏽 Arraste para o lado e confira!\n.\n🗣️ E continue nos acompanhando, para saber mais sobre as novidades e trabalhos desenvolvidos pelo nosso grupo!"
