    resumo: "O GPENSC apresenta o resumo de mais uma de nossas palestras ministradas no primeiro semestre de 2020"
    conteudo: "O GPENSC apresenta o resumo de mais uma de nossas palestras ministradas no primeiro semestre de 2020. \n.\n🗣 Uma comunicação eficaz é essencial para nos expressarmos. Ainda assim, a comunicação clara e objetiva pode ser um desafio. Mas você sabia que a habilidade de falar bem em público pode ser adquirida com o aprendizado de técnicas? \n.\n‼️ Neste post, apresentaremos algumas dessas técnicas, tema da palestra “Descomplicando a oratória”, ministrada pela doutoranda Irene Carolina Sousa Justiniano (@irenecsj_).\n.\n👉 Passe para o lado e confira algumas dicas de oratória que, se aplicadas, te ajudarão a falar melhor em público. \n.\n📌 Gostou? O conteúdo foi útil para você? Então salve esse post para consultar sempre que precisar.\n.\n💬 Também não deixe de marcar nos comentários ou enviar esse resumo para aquele(a) amigo(a) que precisa conferir esse post sobre oratória."
