    resumo: "Estamos com inscrições abertas para vagas de entrevistadores voluntários no estudo \"ESANP - Estudo da Segurança Alimentar e Nutricional na pandemia de covid-19\""
    conteudo: "Estamos com inscrições abertas para vagas de entrevistadores voluntários no estudo \"ESANP - Estudo da Segurança Alimentar e Nutricional na pandemia de covid-19\".\n.\n👥 O ESANP é realizado pela Escola de Nutrição da Universidade Federal de Ouro Preto (ENUT/UFOP - @enut_ufop), em parceria com as Secretarias Municipais de Educação de Mariana e Ouro Preto, sob coordenação da professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut).\n.\n🔸 Quem pode participar?\nAlunos de graduação e pós-graduação do curso de Nutrição. \n.\n🔸 Como realizar a inscrição?\nEnvie e-mail demonstrando interesse de colaborar com o ESANP para o seguinte contato: projetoescolas.enut@ufop.edu.br\n.\n🔸 Qual é o prazo máximo das inscrições?\nAté o dia 08/08/22.\n.\n🗣️ Não perca essa chance, venha fazer pesquisa com a gente!"
