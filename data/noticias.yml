    conteudo: "Com alegria, apresentamos mais uma integrante do GPENSC!\n\nMiriam Aparecida de Assis Silva (@miriamaasilva) é nutricionista e mestre em Saúde e Nutrição pela Universidade Federal de Ouro Preto (UFOP). \n\nAtualmente, é doutoranda no Programa de Pós-Graduação em Saúde e Nutrição da UFOP (@ppgsn.ufop), sob orientação da profa. Dra. Raquel de Deus Mendonça (@raquelmendonca_enut) e coorientação da profa. Dra. Joana Ferreira do Amaral (@joanaferreiradoamaral).\n\nSua linha de pesquisa é consumo de alimentos ultraprocessados e parâmetros bioquímicos em indivíduos com hipertensão arterial.\n\nContinue nos acompanhando para conhecer mais membros do grupo!\n\n#GPENSC #Ciência #Nutrição #SaúdeColetiva #Pesquisa"
