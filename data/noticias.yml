  - data: "2022-05-10"
    categoria: "Pesquisa"
    titulo: "Artigo: Burden of non-communicable diseases attributable to dietary risks in Brazil, 1990-2019: an analysis of the Global Burden of Disease Study 2019"
    resumo: "O GPENSC apresenta o artigo intitulado “Burden of non-communicable diseases attributable to dietary risks in Brazil, 1990-2019: an analysis of the Global Burden of Disease Study 2019”, de autoria da professora Dra"
    conteudo: "O GPENSC apresenta o artigo intitulado “Burden of non-communicable diseases attributable to dietary risks in Brazil, 1990-2019: an analysis of the Global Burden of Disease Study 2019”, de autoria da professora Dra. Ísis Machado (@isiseloah) e da doutoranda Magda Parajára (@magdaparajara), juntamente com outras integrantes do GPENSC e pesquisadores da UERJ e UFMG.\n.\n🎯 O artigo teve como objetivo analisar a carga de doenças crônicas não transmissíveis (DCNT) atribuível a 15 fatores de risco dietéticos no Brasil entre 1990 e 2019.\n.\n🔎 A carga foi medida por meio de estimativas do número e taxas de mortalidade e anos de vida perdidos ajustados pela incapacidade (DALYs) - indicador que combina os anos perdidos por mortes prematuras e anos vividos com incapacidades na população - obtidas pelo estudo Global Burden of Disease (GBD) 2019. \n.\n📊 Os resultados indicam que os riscos dietéticos contribuíram principalmente para a ocorrência das doenças cardiovasculares, diabetes mellitus e cânceres, nesta ordem. As taxas padronizadas por idade de mortalidade e DALYs diminuíram cerca de 50% entre 1990 e 2019, sendo que os três principais fatores que contribuíram para a carga de DCNT nesses dois períodos foram: consumo excessivo de carne vermelha e sódio e baixo em grãos integrais. A maior carga de DCNT foi observada entre os homens, na população de meia idade (cerca de 50 anos) e dos estados do Maranhão, Rio de Janeiro e Alagoas.\n.\n💡 O estudo evidencia que a alimentação da população brasileira permanece inadequada. Com isso, reforça sobre a importância de políticas públicas em alimentação e nutrição para reduzir a carga de DCNT.\n.\n🔗 Acesse o artigo no link: https://www.scielo.br/j/rsbmt/a/c9NSmWYFZDFTRrhY8mhjVpt/"
    url: "https://www.instagram.com/p/CdZGB0dutEW/"
