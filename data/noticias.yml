    imagem: "img/instagram-acervo/CMAtqwEAS9K.webp"
  - data: "2021-03-02"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: mestranda Ana Cláudia Morito"
    resumo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a mestranda Ana Cláudia Morito (@anaclaudiamorito )"
    conteudo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a mestranda Ana Cláudia Morito (@anaclaudiamorito ).\n.\n👩🏻‍🎓 Ana Cláudia é graduada em Nutrição pela Unifaminas (2017). Tem experiência na área clínica e alimentação escolar. Atualmente, é mestranda do Programa de Pós-Graduação em Saúde e Nutrição, da UFOP, na linha de pesquisa Bases Experimentais em Saúde, Alimentos e Nutrição. \n.\n📚 Sua pesquisa de mestrado intitulada \"Associação do comer emocional e ansiedade com o ganho de peso durante a pandemia do COVID-19\" é orientada pela profa. Dra. Júlia Cristina Carraro.\n.\n📌 É pesquisadora do projeto “Efeito da pandemia do COVID-19 na saúde mental e nutricional e no ambiente alimentar domiciliar da comunidade acadêmica: avaliação longitudinal” (PADu COVID-19).\n.\n🔍 Continue nos acompanhando para conhecer mais sobre a temática de pesquisa da Ana Cláudia e outros projetos desenvolvidos no nosso grupo."
