    conteudo: "O GPENSC recomenda o episódio 37 “Guia alimentar para a população brasileira”, do podcast “Palavras em sala de aula” (@palavraseducacao). \n.\n🎙 O episódio aborda sobre a origem e estruturação do guia alimentar, aspectos da comensalidade e da alimentação enquanto manifestação cultural, os impactos do guia na alimentação escolar e a importância de se debater a alimentação no contexto do ambiente escolar.\n.\n👥 O episódio conta com a participação da Renata Bertazzi Levy, que é pesquisadora da Faculdade de Medicina da Universidade de São Paulo (USP) e do Núcleo de Pesquisas Epidemiológicas em Nutrição e Saúde (NUPENS/USP), além de ser uma das fundadoras do guia alimentar para a população brasileira. \n.\n📌 Aproveita e já salva esse post e não deixe de marcar aqui nos comentários ou enviar essa publicação para aquele(a) amigo(a) que vai gostar dessa indicação."
