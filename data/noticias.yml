  - data: "2024-07-16"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: doutoranda Luciene Teixeira Paixão"
    resumo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a doutoranda Luciene Teixeira Paixão (@luciene.tpaixao)"
    conteudo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a doutoranda Luciene Teixeira Paixão (@luciene.tpaixao).\n.\n👩🏻‍🎓 Luciene é nutricionista formada pela Universidade Federal de Viçosa (UFV)e Mestre em Saúde e Nutrição pelo Programa de Pós Graduação em Saúde e Nutrição (PPGSN) da Universidade Federal de Ouro Preto (UFOP). Atualmente, é doutoranda do PPGSN/UFOP- @ppgsnufop, na linha de pesquisa Saúde e Nutrição em Indivíduos e Coletividade. Possui experiência na área de nutrição para coletividades, Transtorno do Espectro Autista (TEA) e nutrição do idoso.\n.\n📚 É pesquisadora do projeto intitulado “Associação entre insônia e risco de doenças cardiovasculares mediada pela ingestão de polifenóis em participantes do Projeto CUME (Coorte de Universidades Mineiras)”, sob orientação da professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro) e coorientação do professor Dr. Luiz Antônio Alves Menezes-Júnior (@luizmenezes__).\n.\n🔎 Quer saber mais sobre o tema da Luciene? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo!"
