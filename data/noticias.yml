    resumo: "O GPENSC recomenda o episódio 2 “As escalas da fome”, do podcast “Prato cheio, o Joio e o Trigo” (@ojoioeotrigo)"
    conteudo: "O GPENSC recomenda o episódio 2 “As escalas da fome”, do podcast “Prato cheio, o Joio e o Trigo” (@ojoioeotrigo). Esse episódio também faz parte do especial sobre a fome, produzido em parceria com a Cátedra Josué de Castro de Sistemas Alimentares Saudáveis e Sustentáveis (@catedrajosuedecastro).\n.\n🎙 O episódio aborda o cotidiano e as estratégias de sobrevivência de pessoas em diferentes graus de insegurança alimentar e nutricional (leve, moderada e grave), e oferece um retrato do Brasil que possui cerca de 33 milhões de pessoas vivenciando a fome. Afinal, o que une e o que separa os brasileiros em situação de insegurança alimentar?\n.\n👥 O episódio conta com a participação de pesquisadores e profissionais de diferentes áreas, que discutem a insegurança alimentar e nutricional e trazem importante reflexões sobre a temática.\n.\n🗣️ Toda terça tem um novo episódio do podcast “Prato cheio” nas principais plataformas de streaming. Então, fique ligado(a)!\n.\n📌 Aproveita e já salva esse post e não deixe de marcar aqui nos comentários ou enviar essa publicação para aquele(a) amigo(a) que vai gostar dessa indicação."
