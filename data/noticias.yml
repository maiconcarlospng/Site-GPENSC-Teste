  - data: "2021-09-21"
    categoria: "Pesquisa"
    titulo: "O GPENSC apresenta o Estudo das Federais de Minas Gerais, o #PADuMulticêntrico"
    resumo: "O GPENSC apresenta o Estudo das Federais de Minas Gerais, o #PADuMulticêntrico"
    conteudo: "O GPENSC apresenta o Estudo das Federais de Minas Gerais, o #PADuMulticêntrico.\n.\n🧮 O Estudo das Federais de Minas Gerais é um estudo multicêntrico realizado com estudantes de graduação de oito universidades federais mineiras: UFOP, UFMG, UFLA, UJFJ, UFSJ, UNIFAL, UFU e UFVJM. \n.\n🎯 O objetivo do estudo é conhecer a prevalência dos sintomas de transtornos de ansiedade e depressão, bem como seus potenciais fatores associados entre estudantes universitários.\n.\n💭 Como participar do estudo?\nPara participar, basta acessar o link que está disponível na bio do Instagram do PADu (@padufederais) ou acessar o link que está disponível abaixo e clicar no questionário da sua universidade:\nhttps://linktr.ee/padufederais\n.\n💡 A participação dos estudantes da UFOP, UFMG, UFLA, UJFJ, UFSJ, UNIFAL, UFU e UFVJM é muito importante para o sucesso do estudo e para subsidiar as universidades com informações para a formulação de políticas públicas e ações específicas de acolhimento, prevenção e promoção da saúde mental!\n.\n🗣️ Quer saber mais sobre o Estudo das Federais de Minas Gerais? Continue nos acompanhando e siga também o @padufederais.\n.\n📲 Para maiores informações sobre o projeto, entre em contato pelo e-mail: padumulticentrico.enut@ufop.edu.br"
    url: "https://www.instagram.com/p/CUGQ5wJvjOZ/"
    imagem: "img/instagram-acervo/CUGQ5wJvjOZ.webp"
  - data: "2021-09-15"
