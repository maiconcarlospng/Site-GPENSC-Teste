  - data: "2023-02-07"
    categoria: "Pesquisa"
    titulo: "O GPENSC apresenta os projetos desenvolvidos pelo GPENSC"
    resumo: "O GPENSC apresenta os projetos desenvolvidos pelo GPENSC"
    conteudo: "O GPENSC apresenta os projetos desenvolvidos pelo GPENSC. \n.\n📝 Como grupo, temos características multidisciplinares e contamos com a participação de pesquisadores com interesse nas áreas de Nutrição e Saúde Coletiva. \n.\n📚 Os projetos do GPENSC, são conduzidos pelas professoras Dra. Adriana Lúcia Meireles, Júlia Cristina Cardoso Carraro, Mariana Carvalho de Menezes e Raquel de Deus Mendonça e conta com a colaboração das professoras Dra. Ísis Eloah Machado (@isiseloah) e Renata Adrielle Lima Vieira (@renataadriellenutti).\n.\n👨🏻‍💻 Para que os projetos se tornem viáveis, o grupo ainda conta com a colaboração de alunos de graduação, mestrado, doutorado, pós-doc, professores e de voluntários.\n.\n📊 Atualmente, os TCCs, dissertações e teses do nosso grupo são produtos dos seguintes projetos: PADu, COVID-Inconfidentes, ESANP e HipertenSUS.\n.\n👉🏻 Para saber mais sobre, arraste para o lado e confira!\n.\n🔍 Continue nos acompanhando para saber sobre os resultados desses projetos."
