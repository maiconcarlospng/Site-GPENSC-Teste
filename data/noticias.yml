  - data: "2020-09-23"
    categoria: "Ensino"
    titulo: "Há alguns dias, apresentamos para vocês a pesquisa da Magda"
    resumo: "Há alguns dias, apresentamos para vocês a pesquisa da Magda (@magdaparajara)"
    conteudo: "Há alguns dias, apresentamos para vocês a pesquisa da Magda (@magdaparajara). Mas por que investigar a carga e o custo financeiro das doenças atribuídas ao consumo alimentar inadequado?\n.\n📌 Embora modificável, o consumo alimentar inadequado é um dos principais contribuintes para a carga de doenças crônicas não transmissíveis (DCNT). No entanto, o impacto dos custos da alimentação inadequada não é conhecido em muitos países. \n.\n🎯 O objetivo do artigo apresentado foi estimar a carga financeira das DCNT devido ao não cumprimento das recomendações alimentares no Canadá, em 2018.\n.\n💸 Observou-se que um total de US$ 15,8 bilhões em custos diretos (hospitalizações, consultas e medicamentos) e indiretos (abordagem do capital humano) de saúde poderiam ser evitados se os canadenses cumprissem as recomendações alimentares quanto ao consumo de frutas, vegetais, leite, grãos integrais, nozes e sementes, bebidas açucaradas, carne vermelha e carne processada.\n.\n💡 O conhecimento sobre o custo das doenças é imprescindível para auxiliar na formulação e priorização de políticas, intervenções e alocação de recursos de saúde. Diante da falta de informações sobre esta temática no Brasil, o estudo da Magda contribuirá para a investigação da carga financeira das DCNT atribuídas aos fatores alimentares no Sistema Único de Saúde (SUS)."
    url: "https://www.instagram.com/p/CFfyrkrAngV/"
    imagem: "img/instagram-acervo/CFfyrkrAngV.webp"
