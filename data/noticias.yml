    titulo: "Hoje, no #compartilhaGPENSC vamos falar sobre as Diretrizes SAGER"
    resumo: "Hoje, no #compartilhaGPENSC vamos falar sobre as Diretrizes SAGER"
    conteudo: "Hoje, no #compartilhaGPENSC vamos falar sobre as Diretrizes SAGER. Afinal, por que o sexo e o gênero importam na ciência?\n.\n📚 As diretrizes SAGER foram criadas após três anos de trabalho intenso de acadêmicos, cientistas e editores de revistas científicas. Elas são uma ferramenta valiosa para garantir que o sexo e o gênero sejam adequadamente considerados nas pesquisas. \n.\n🎯 O objetivo? Melhorar a forma como essas questões são relatadas em publicações, permitindo uma comunicação mais precisa e transparente dos resultados. As diretrizes são flexíveis, adaptáveis a diferentes disciplinas e orientam tanto autores quanto revisores na inclusão dessas dimensões.\n.\n➡️ Embora as diretrizes não façam recomendações específicas para populações com diversidade de gênero, como transgêneros, elas incentivam os pesquisadores a pensar na relevância de suas descobertas para esses grupos. \n.\n💡Mesmo que muitos estudos ainda não tenham o poder para identificar diferenças nesses casos, é crucial que a ciência avance nessa direção! \n.\n👉🏼 Arraste para o lado e confira mais sobre o tema!\n.\n🔗 Para ler o artigo na íntegra: HEIDARI, S. et al.. Equidade de sexo e gênero na pesquisa: fundamentação das diretrizes SAGER e uso recomendado. Epidemiologia e Serviços de Saúde, v. 26, n. 3, p. 665–676, jul. 2017.\n.\n🗣️ Gostou do post de hoje? Aproveite para salvar e compartilhar com quem precisa de ver esse post!"
