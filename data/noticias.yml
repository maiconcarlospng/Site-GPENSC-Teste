    imagem: "img/instagram-acervo/CK7Fy61gejr.webp"
  - data: "2021-02-01"
    categoria: "Pesquisa"
    titulo: "Hoje, iremos falar sobre o PADu COVID-19"
    resumo: "Hoje, iremos falar sobre o PADu COVID-19"
    conteudo: "Hoje, iremos falar sobre o PADu COVID-19. \n.\n📚 Pra quem não conhece, o PADu COVID-19 é um estudo longitudinal realizado com membros da comunidade acadêmica (alunos de graduação, professores e técnicos administrativos) da UFOP. A pesquisa tem como objetivo avaliar o efeito da pandemia da COVID-19 nos sintomas de ansiedade e depressão, bem como no consumo e ambiente alimentar, perfil nutricional, hábitos de vida e condições gerais de saúde de todo o corpo acadêmico.\n.\n📊 Os dados serão coletados em quatro momentos (linha de base, T1, T2 e T3) a partir de um questionário autoaplicado e confidencial, enviado para o e-mail institucional.\n.\n⚠️ As coletas de dados da linha de base e do T1 ocorreram entre julho/agosto e novembro de 2020. Agora em fevereiro de 2021, iniciaremos a coleta de dados do seguimento T2.\n.\n📌 Você, estudante ou servidor da UFOP , que respondeu os questionários da linha de base e o T1, continue colaborando conosco para entendermos os efeitos da pandemia da COVID-19 na saúde e na alimentação da comunidade acadêmica. \n.\n🧬 Contribua para o avanço da ciência brasileira e para pesquisa na sua Universidade!\n.\n🔍 Quer saber mais sobre o projeto? Continue nos acompanhando e siga também o @padufederais. \n.\n📧 Para maiores informações sobre o projeto, entre em contato pelo e-mail:\npaducovid.ppgsn@ufop.edu.br"
    url: "https://www.instagram.com/p/CKwzBm8Au2j/"
    imagem: "img/instagram-acervo/CKwzBm8Au2j.webp"
