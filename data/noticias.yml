    conteudo: "Com alegria, apresentamos mais uma integrante do GPENSC! \n\nFernanda Segurasse de Moraes (@fernanda.segurasse) é farmacêutica formada pela Universidade Federal de Ouro Preto (UFOP). Atualmente, é mestranda no Programa de Pós-Graduação em Saúde e Nutrição da UFOP (@ppgsn.ufop), na linha de pesquisa Saúde e Nutrição dos Indivíduos e Coletividades, sob orientação da profa. Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientação da Dra. Waléria de Paula (@waleria_dp).\n\nAtua como pesquisadora no projeto “Análise epidemiológica de morbimortalidade e sua relação com as estratégias e ações no contexto pós-desastre nos municípios atingidos pelo colapso das barragens de Fundão e da Mina Córrego do Feijão em Minas Gerais”, com foco na avaliação da saúde mental das populações afetadas.\n\nContinue nos acompanhando para conhecer mais membros do grupo!\n\n#GPENSC #Ciência #Nutrição #SaúdeColetiva #Pesquisa"
