    titulo: "Projeto: Vigilância epidemiológica da COVID-19 na região dos Inconfidentes"
    resumo: "Neste último final de semana, entre os dias 11 e 13 de dezembro, realizamos a última coleta de dados do projeto \"Vigilância epidemiológica da COVID-19 na região dos Inconfidentes\" (COVID-INCOFIDENTES) no município de Ouro Preto"
    conteudo: "Neste último final de semana, entre os dias 11 e 13 de dezembro, realizamos a última coleta de dados do projeto \"Vigilância epidemiológica da COVID-19 na região dos Inconfidentes\" (COVID-INCOFIDENTES) no município de Ouro Preto. \n.\n💟 Gostaríamos de agradecer a todos os moradores da cidade, que aceitaram participar do nosso estudo e receberam nossa equipe nos seus domicílios, contribuindo com a nossa pesquisa e o avanço da ciência no Brasil na luta contra a COVID-19!\n.\n🎇 Agradecemos também a todos os voluntários, profissionais de saúde, supervisores e coordenadores que, com profissionalismo, carinho e dedicação, contribuíram para que esse projeto tornasse realidade. Nada se faz sozinho na ciência, e ainda bem que contamos com a ajuda de vocês nessa caminhada! Com certeza essa experiência fará parte da coleção de bons momentos do nosso grupo. \n.\n👉🏻 Arraste para o lado e confira as fotos do painel III realizado na cidade de Ouro Preto no último final de semana.\n.\n📌 Continue nos acompanhando para saber mais sobre esse e outros projetos desenvolvidos pelo nosso grupo.\n.\n📧 Qualquer dúvida, entre em contato pelo e-mail: covid.inconfidentes.ppgsn@ufop.edu.br"
