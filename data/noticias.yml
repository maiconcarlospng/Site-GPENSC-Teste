    resumo: "📢Inscrições Abertas para o PPGSN/UFOP 2026! O Programa de Pós-Graduação em Saúde e Nutrição (PPGSN/UFOP) @ppgsn.ufop está com inscrições abertas para o processo seletivo de…"
    conteudo: "📢Inscrições Abertas para o PPGSN/UFOP 2026!\n\nO Programa de Pós-Graduação em Saúde e Nutrição (PPGSN/UFOP) @ppgsn.ufop está com inscrições abertas para o processo seletivo de Mestrado e Doutorado Acadêmico para ingresso no primeiro semestre de 2026.\n\n🔬 Linhas de pesquisa:\n1️⃣ Bases Experimentais em Saúde, Alimentos e Nutrição – investigações sobre nutrientes, fatores ambientais e genéticos, com abordagens bioquímicas, moleculares e imunológicas.\n2️⃣ Saúde e Nutrição em Indivíduos e Coletividades – estudos sobre alimentação, nutrição, políticas públicas, programas e impactos na saúde da população.\n\n🎓 Vagas disponíveis:\n✔️ 30 para Mestrado\n✔️ 16 para Doutorado\n\n🗓️ Inscrições: de 1º de setembro a 27 de outubro de 2025.\n\n👉 Uma oportunidade única para quem deseja se aprofundar na pesquisa em saúde e nutrição em uma das principais universidades federais do país!\n\nPara mais informações acesse:\nhttps://posnutricao.ufop.br/news/editais-publicados-processo-seletivo-ppgsn-mestrado-e-doutorado-2026\n\n#UFOP #PPGSN #Mestrado #Doutorado #Saúde #Nutrição #PósGraduação #Ciência"
