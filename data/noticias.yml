    titulo: "Nosso #tbt é bem recente, para lembrar da defesa de mestrado da aluna Bianca Bastos Lima, que aconteceu no dia 30 de março, via Google Meet"
    resumo: "Nosso #tbt é bem recente, para lembrar da defesa de mestrado da aluna Bianca Bastos Lima (@limabiancabastos), que aconteceu no dia 30 de março, via Google Meet"
    conteudo: "Nosso #tbt é bem recente, para lembrar da defesa de mestrado da aluna Bianca Bastos Lima (@limabiancabastos), que aconteceu no dia 30 de março, via Google Meet.\n.\n🔎 A dissertação da Bianca, intitulada \"Efetividade do Programa Promoção da Alimentação Adequada e Saudável na Atenção Primária: Ensaio Comunitário Controlado Randomizado\", teve como objetivo avaliar a efetividade do programa Promoção da Alimentação Adequada e Saudável (PAAS) em usuários das Unidades Básicas da Atenção Primária à Saúde dos municípios de Nova Lima e Carmo do Cajuru, Minas Gerais. \n.\n📌 Sua pesquisa de mestrado foi uma parceria com o GIN-UFMG (Grupo de Pesquisa de Intervenções em Nutrição - @gin.ufmg) e foi orientado pela professora Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes). O trabalho da Bianca contou com as contribuições da professora Dra. Raquel de Deus Mendonça – UFOP (@raquelmendonca_enut) e da professora Dra. Aline Cristine Souza Lopes – UFMG (@alinelopes_ufmg). \n.\n💡O diferencial do programa PAS é que a estruturação das ações de educação alimentar e nutricional, pautando as atividades em importantes materiais problematizadores, geram empoderamento do indivíduo em seu cuidado em alimentação e nutrição.\n.\n🎇 Parabenizamos a Bianca a pela defesa de mestrado e por sua contribuição na ciência do país! 👏🎉"
    url: "https://www.instagram.com/p/CNavq20givh/"
    imagem: "img/instagram-acervo/CNavq20givh.webp"
  - data: "2021-04-05"
    categoria: "Institucional"
    titulo: "Vocês já ouviram falar sobre “infográfico”?"
    resumo: "Vocês já ouviram falar sobre “infográfico”?"
    conteudo: "Vocês já ouviram falar sobre “infográfico”? No segundo semestre de 2020, realizamos uma palestra super interessante sobre esse tema. Mas o que é infográfico? Infográficos são elementos visuais explicativos que misturam texto e imagem e que tem sido muito utilizados para representar resultados de artigos, dissertações e etc.\n.\n📚 Pensando nisso, hoje iremos apresentar os resultados da dissertação da Waléria de Paula (@waleria_dp) através de um infográfico (arraste para o lado).\n.\n💡A Waléria defendeu seu mestrado no final de 2019 e seu trabalho teve como objetivo avaliar o uso de substâncias psicoativas e a prevalência dos sintomas de transtorno de ansiedade e de depressão e seus fatores associados em estudantes do primeiro período de cursos ofertados pela Universidade Federal de Ouro Preto (UFOP). No seu estudo, a Waléria utilizou dados da linha de base do PADu-Ingressantes, que é um projeto aninhado ao PADu (@padufederais).\n.\n🎯 A primeira etapa do PADu-Ingressantes foi conduzida em 2019 e contou com a participação de 356 estudantes do primeiro período de 14 cursos de graduação presenciais da UFOP.\n.\n📌 Os resultados deste estudo têm implicações importantes para a comunidade acadêmica, pois evidencia que já no início da vida universitária os estudantes são acometidos pelos sintomas de transtornos de ansiedade e depressão, reforçando a necessidade de programas de saúde mental no ambiente universitário. \n.\n🗣️ Continue nos acompanhando para saber mais sobre os trabalhos desenvolvidos pelo nosso grupo."
    url: "https://www.instagram.com/p/CNTGjT1gqQO/"
    imagem: "img/instagram-acervo/CNTGjT1gqQO.webp"
