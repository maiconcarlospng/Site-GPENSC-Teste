    conteudo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a mestranda Cleisiane Rhute da Silva(@cleisi0108).\n.\n👩🏻‍🎓 Cleisiane é nutricionista formada pela Faculdade Itabirana de Saúde. Atualmente, é mestranda no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN) da Universidade Federal de Ouro Preto (UFOP), na linha de pesquisa Saúde e Nutrição em Indivíduos e Coletividades, sob orientação da professora Dra. Adriana Meireles (@dri_meireles ). Possui experiência em saúde coletiva, atuando como nutricionista no Programa de Alimentação Escolar do município de Mariana - MG. \n.\n📚 É pesquisadora do Estudo da Segurança Alimentar e Nutricional na pandemia da covid-19 (ESANP) e sua pesquisa visa investigar a associação entre insegurança alimentar e alterações no perfil lipídico dos participantes, a fim de compreender como o perfil lipídico pode ser influenciado pela falta de acesso a alimentos adequados.\n.\n🔎 Quer saber mais sobre o tema da Cleisiane? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo!"
