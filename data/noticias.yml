  - data: "2021-10-08"
    categoria: "Pesquisa"
    titulo: "Distúrbios do sono em trabalhadores de turno alternante: Validação de métodos e relação com hipovitaminose D"
    resumo: "O GPENSC apresenta um #infográfico sobre o tema de dissertação do Luiz Menezes (@menezesnutri)"
    conteudo: "O GPENSC apresenta um #infográfico sobre o tema de dissertação do Luiz Menezes (@menezesnutri). O trabalho intitulado “Distúrbios do sono em trabalhadores de turno alternante: Validação de métodos e relação com hipovitaminose D”, contou com orientação da professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientação do professor Dr. Raimundo Marques Nascimento Neto.\n.\n👷🏻‍♂️ O trabalho em turnos alternantes tem sérios impactos na saúde dos trabalhadores devido à dessincronização do sistema circadiano. Como consequências, esses trabalhadores apresentam mais distúrbios do sono e transtornos endócrino-metabólicos.\n.\n🔎 O estudo do Luiz foi realizado com trabalhadores de turnos alternantes de uma mineradora da região dos Inconfidentes, Minas Gerais. Foi realizada a avaliação antropométrica, clínica e bioquímica, além da investigação de questões sociodemográficas, comportamentais e do sono. O sono foi avaliado pelo padrão-ouro, que é a polissonografia noturna, onde o paciente dorme e é monitorada a atividade respiratória, muscular e cerebral durante o sono. Também foi realizado o rastreio para apneia do sono pelo questionário de Berlim (QB) e escore NoSAS. \n.\n📈 Como resultado, observou-se que os trabalhadores de turnos tinham elevada prevalência de distúrbios do sono, sendo os mais prevalentes a apneia do sono (86,6%), hipóxia noturna (75,6%), tempo total e eficiência de sono reduzida (31,7%) e latência do sono elevada (14,6%). Além disso, aproximadamente 1 a cada 3 trabalhadores apresentaram hipovitaminose D e tinham de 3 a 5 vezes mais chances de terem distúrbios do sono quando comparados aos trabalhadores com níveis normais de vitamina D.\n.\n👉 Arraste para o lado e confira!\n.\n🗣 Continue nos acompanhando para saber mais sobre os trabalhos desenvolvidos pelo nosso grupo!"
