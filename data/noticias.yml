  - data: "2026-07-14"
    categoria: "Pesquisa"
    titulo: "😴 Sono, ansiedade e depressão: como esses fatores influenciam a percepção da própria saúde?"
    resumo: "😴 Sono, ansiedade e depressão: como esses fatores influenciam a percepção da própria saúde? Um estudo conduzido pelo Prof°. Dr. Luiz Menezes-Júnior (@luizmenezes_jr), em parceria…"
    conteudo: "😴 Sono, ansiedade e depressão: como esses fatores influenciam a percepção da própria saúde?\n\nUm estudo conduzido pelo Prof°. Dr. Luiz Menezes-Júnior (@luizmenezes_jr), em parceria com pesquisadores do GPENSC (@gpenscufop), investigou a associação entre a qualidade do sono e a autopercepção de saúde, além do papel da ansiedade e da depressão nessa relação.\n\n🔎 O que foi investigado?\nO estudo foi realizado durante a pandemia de covid-19, nas cidades de Ouro Preto e Mariana (MG), com 1.762 adultos. Foram avaliadas a qualidade do sono, por meio do Índice de Qualidade do Sono de Pittsburgh (PSQI), e a autopercepção de saúde. Para identificar ansiedade e depressão, foram considerados o relato de sintomas, o diagnóstico médico e o uso de medicamentos relacionados a essas condições.\n\n📊 Principais achados\nO estudo identificou uma elevada frequência de má qualidade do sono, sintomas de ansiedade e depressão e uma parcela importante de participantes que avaliava sua saúde de forma negativa. Além disso, pessoas com má qualidade do sono apresentaram maior probabilidade de perceber sua saúde como ruim. Os resultados também mostraram que os sintomas de ansiedade e depressão mediaram parte dessa associação, evidenciando o papel da saúde mental na forma como a qualidade do sono influencia a percepção da própria saúde.\n\n💡 Conclusão\nOs achados reforçam que a qualidade do sono é um importante determinante da percepção de saúde e que a ansiedade e a depressão explicam parte dessa associação. Promover hábitos de sono saudáveis e fortalecer ações voltadas à saúde mental são estratégias fundamentais para melhorar o bem-estar e a qualidade de vida.\n\n#GPENSC #pesquisacientífica #sono #depressão #ansiedade"
    url: "https://www.instagram.com/p/DaybX3QlU_2/"
    imagem: "img/instagram-acervo/DaybX3QlU_2.webp"
