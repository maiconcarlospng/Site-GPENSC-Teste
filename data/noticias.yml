  - data: "2021-06-17"
    categoria: "Pesquisa"
    titulo: "Hoje o #tbt é para apresentar o #infográfico com os resultados da dissertação da Irene Carolina Sousa Justiniano"
    resumo: "Hoje o #tbt é para apresentar o #infográfico com os resultados da dissertação da Irene Carolina Sousa Justiniano (@irenecsj_)"
    conteudo: "Hoje o #tbt é para apresentar o #infográfico com os resultados da dissertação da Irene Carolina Sousa Justiniano (@irenecsj_). \n.\n🎯 O trabalho da Irene intitulado “Análise temporal do ambiente alimentar comunitário de uma metrópole brasileira” foi orientado pela professora Dra. Milene Cristine Pessoa (@milenepessoa1) e coorientado pela professora Mariana Carvalho de Menezes (@maricarvalhomenezes) e teve como objetivo avaliar a mudança no perfil do ambiente alimentar comunitário, relacionado ao comércio formal de alimentos, da cidade de Belo Horizonte (MG) nos anos de 2008, 2011, 2015 e 2018.\n.\n📈 Os resultados indicam que houve um aumento de estabelecimentos não saudáveis (154%), seguido pelos mistos (51%) e pelos saudáveis (32%) durante o período avaliado. A proporção de estabelecimentos não saudáveis em relação aos estabelecimentos saudáveis foi maior, demonstrando que a característica do ambiente alimentar comunitário de Belo Horizonte se modificou ao longo dos anos, evidenciando um ambiente alimentar com características desfavoráveis a uma alimentação adequada e saudável.\n.\n👉 Arraste para o lado e confira!\n.\n🗣️ Continue nos acompanhando para saber mais sobre os trabalhos desenvolvidos pelo nosso grupo!"
    url: "https://www.instagram.com/p/CQO_ffTgDoJ/"
    imagem: "img/instagram-acervo/CQO_ffTgDoJ.webp"
  - data: "2021-06-01"
    categoria: "Pesquisa"
    titulo: "Hoje vamos falar sobre as representações gráficas"
    resumo: "Hoje vamos falar sobre as representações gráficas"
    conteudo: "Hoje vamos falar sobre as representações gráficas.\n.\n📌 A escolha da apresentação dos resultados é determinante para o entendimento das informações, suas interpretações e, posteriormente, nas tomadas de decisões. Algumas informações são mais difíceis de serem explicas na forma de texto, por isso, representações gráficas são frequentemente usadas como uma forma mais rápida de transmitir informações em grandes quantidades e de maior complexidade.\n.\n📈 As representações gráficas servem para organizar e possibilitar a interpretação dos resultados de forma clara e objetiva, por esse motivo, elas devem ser atraentes para o leitor, ter uma boa qualidade e falar por si mesmas, sem que seja necessário ler o texto. Uma forma de apresentação de dados é por meio do uso de gráficos. Você sabe como escolher o gráfico certo para apresentar seus resultados?\n.\n💡 Pensando nisso, trouxemos para vocês uma figura apresentada pela doutoranda Magda Parajára (@magdaparajara) em uma das reuniões do nosso grupo. Essa figura demonstra alguns tipos de gráficos que podem serem utilizados dependendo do objetivo do estudo, por exemplo, comparação, distribuição, composição ou relação. \n.\n👉🏻 Arraste para o lado e confira. Acreditamos que esses materiais possam auxiliar vocês quanto à escolha do melhor gráfico para seu trabalho.\n.\n🗣️ Gostou deste post? Salve e compartilhe. Tambem não deixe de marcar um amigo(a) nos comentários que precisa ler esse conteúdo."
    url: "https://www.instagram.com/p/CPlyXj-gAjW/"
    imagem: "img/instagram-acervo/CPlyXj-gAjW.webp"
  - data: "2021-05-25"
    categoria: "Pesquisa"
    titulo: "O GPENSC apresenta um #infográfico com os resultados preliminares do doutorado da Priscila Pena Camargo"
    resumo: "O GPENSC apresenta um #infográfico com os resultados preliminares do doutorado da Priscila Pena Camargo (@priscilapenacamargo)"
    conteudo: "O GPENSC apresenta um #infográfico com os resultados preliminares do doutorado da Priscila Pena Camargo (@priscilapenacamargo).\n.\n🍽 O trabalho da Priscilla tem como tema a disponibilidade de alimentos nos domicílios dos alunos da rede municipal de ensino de Mariana e Ouro Preto - Minas Gerais, na pandemia de COVID-19 e no período pós-pandemia. O trabalho é orientado pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientado pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut). O desenvolvimento da pesquisa também conta com a participação da aluna de iniciação científica Chrislaine Corraide Dias dos Santos (@chris.cordis).\n.\n🎯 Um dos objetivos desse estudo consiste em analisar os fatores associados à disponibilidade dos alimentos nos domicílios dos escolares de Mariana e Ouro Preto. Além disso, pretende-se verificar se há relação entre a disponibilidade de alimentos e a situação de segurança alimentar das famílias durante e após a pandemia de COVID-19.\n.\n🔎 A pesquisa consiste em um estudo longitudinal com amostra representativa dos alunos matriculados em escolas públicas dos municípios avaliados. Para a avaliação da situação domiciliar dos estudantes, serão realizadas quatro coletas em momentos distintos.\n.\n👉 Arraste para o lado e confira alguns dos resultados do estudo.\n.\n🗣 Continue nos acompanhando para saber mais sobre o tema de pesquisa da Priscilla e sobre os trabalhos desenvolvidos pelo nosso grupo."
    url: "https://www.instagram.com/p/CPTyd14gtKS/"
    imagem: "img/instagram-acervo/CPTyd14gtKS.webp"
  - data: "2021-05-21"
    categoria: "Pesquisa"
    titulo: "Na próxima segunda-feira, dia 24 de maio, inicia-se a última etapa da coleta de dados da pesquisa PADu-COVID"
    resumo: "Na próxima segunda-feira, dia 24 de maio, inicia-se a última etapa da coleta de dados da pesquisa PADu-COVID"
    conteudo: "Na próxima segunda-feira, dia 24 de maio, inicia-se a última etapa da coleta de dados da pesquisa PADu-COVID.\n.\n🦠 O PADu-COVID é um estudo longitudinal realizado com estudantes de graduação e servidores (docentes e técnicos administrativos) da Universidade Federal de Ouro Preto (UFOP), que visa avaliar o impacto da pandemia da COVID-19 nos sintomas de transtorno de ansiedade e depressão, consumo e ambiente alimentar, hábitos de vida, condições gerais de saúde e uso de medicamentos entre a comunidade acadêmica da UFOP.\n.\n📌 Você, estudante ou servidor da UFOP, que respondeu o questionário da linha de base (primeira etapa), continue colaborando conosco! A participação de vocês é muito importante, para que os pesquisadores possam avaliar as mudanças comportamentais ocorridas entre as aplicações dos questionários e como os membros da comunidade acadêmica têm enfrentado este período de pandemia.\n.\n🗣️ Quer saber mais sobre o projeto? Continue nos acompanhando! Após o término da última etapa do estudo, os resultados do PADu-COVID serão amplamente divulgados para toda a comunidade acadêmica e também poderão ser conferidos aqui no nosso Instagram. \n.\n📧 Para maiores informações sobre o projeto, entre em contato pelo e-mail:\npaducovid.ppgsn@ufop.edu.br"
    url: "https://www.instagram.com/p/CPJdLoGgTf8/"
    imagem: "img/instagram-acervo/CPJdLoGgTf8.webp"
  - data: "2021-05-07"
    categoria: "Pesquisa"
    titulo: "Essa semana, apresentamos para vocês a pesquisa da Samara"
    resumo: "Essa semana, apresentamos para vocês a pesquisa da Samara (@mourasamara)"
    conteudo: "Essa semana, apresentamos para vocês a pesquisa da Samara (@mourasamara). Mas qual a importância de investigar a inatividade física, o comportamento sedentário (CS) e suas associações com marcadores bioquímicos de alterações metabólicas durante a pandemia de COVID-19?\n.\n🎯 O objetivo deste estudo foi analisar a atividade física (AF) autorreferida e o CS antes e durante o lockdown devido à COVID-19 em uma população espanhola adulta e saudável.\n.\n📌 Para alcançar o objetivo geral do estudo, 3.800 adultos saudáveis (18-64 anos) residentes na Espanha responderam ao questionário internacional curto de AF (IPAQ-S) duas vezes, entre 23 de março e 1º de abril de 2020 (confinamento).\n.\n📊 Os resultados demonstram que a AF autorreferida diminuiu significativamente durante o confinamento. Além disso, AF vigorosa e o tempo de caminhada diminuíram 16,8% e 58,2%, respectivamente, enquanto o tempo sentado aumentou 23,8%. A porcentagem de pessoas que cumprem a recomendação de 75 min/semana de AF vigorosa diminuiu 10,7%. O grupo que realizou mais AF vigorosa antes do confinamento apresentou a maior redução (30,5%). Os homens reduziram o tempo em AF vigorosa mais do que as mulheres (21% vs. 9%, respectivamente), e ainda, as mulheres relataram menor aumento no tempo sentado em comparação aos homens (35% vs. 25,3%, respectivamente).\n.\n🔎 Em conclusão, a população adulta espanhola, especialmente jovens, estudantes e homens muito ativos, diminuiu a AF diária autorrelatada e aumentou o tempo sentado durante o confinamento COVID-19.\n.\n💡O estudo da Samara pode subsidiar intervenções direcionadas ao aumento de AF e redução do CS, auxiliar na compreensão dos biomarcadores de alterações metabólicas associados à inatividade física e ao CS durante a pandemia de COVID-19 e promover informações para a tomada de decisão de agentes públicos, visando a promoção da qualidade de vida e saúde da população.\n.\n👉 Arraste para o lado e confira o resumo do artigo apresentado e outros dois artigos relacionados a esse tema."
    url: "https://www.instagram.com/p/COlbP81AnAh/"
    imagem: "img/instagram-acervo/COlbP81AnAh.webp"
  - data: "2021-05-04"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: doutoranda Samara Moura"
    resumo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a doutoranda Samara Moura (@mourasamara)"
    conteudo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a doutoranda Samara Moura (@mourasamara).\n.\n👩🏻‍🎓 A Samara é profissional de Educação Física, graduada em Licenciatura (2015) e Bacheral (2017) pela Universidade Federal de Ouro (UFOP). Especialista em Educação Física Escolar e Psicomotricidade pela Faculdade Integrada de Araguatins (FAIARA) e mestre em Saúde e Nutrição pelo Programa de Pós-Graduação em Saúde e Nutrição (PPGSN/UFOP). Atualmente, é doutoranda na mesma instituição, na linha de pesquisa Saúde e Nutrição em Indivíduos e Coletividades. A Samara é membro do Laboratório de Fisiologia do Exercício (LABFE) da UFOP e do GPENSC. \n.\n📚 É pesquisadora do projeto “Vigilância Epidemiológica da COVID-19 na Região dos Inconfidentes, Minas Gerais (COVID-Inconfidentes)\", sua pesquisa de doutorado é intitulada “Inatividade física no lazer e comportamento sedentário: associação com marcadores bioquímicos de alterações metabólicas durante a pandemia de COVID-19 em residentes da região dos Inconfidentes, Minas Gerais” e tem orientação da professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientação da professora Dra. Júlia Cristina Cardoso Carraro.\n.\n🔎 Quer saber mais sobre o projeto da Samara e de outros trabalhos desenvolvidos pelo nosso grupo? Continue nos acompanhando."
    url: "https://www.instagram.com/p/COdusGqgrWs/"
    imagem: "img/instagram-acervo/COdusGqgrWs.webp"
  - data: "2021-04-30"
    categoria: "Pesquisa"
    titulo: "O GPENSC apresenta um #infográfico com os resultados da dissertação da Hillary Coletro"
    resumo: "O GPENSC apresenta um #infográfico com os resultados da dissertação da Hillary Coletro (@hillarycoletro)"
    conteudo: "O GPENSC apresenta um #infográfico com os resultados da dissertação da Hillary Coletro (@hillarycoletro). O trabalho foi sobre o consumo de polifenóis e sua associação com a Hipertensão Arterial Sistêmica (HAS), sob orientação da professora Dra. Júlia Cristina Cardoso Carraro e coorientação da professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut).\n.\n🫀 As doenças cardiovasculares (DCV) têm como principal fator de risco a HAS, que afeta mais de 40% dos adultos no mundo e é a principal causa global de morte ou invalidez. Estudos epidemiológicos mostram associações entre consumo de polifenóis e a redução de risco de DCV.\n.\n🔎 O estudo da Hillary foi composto por 4130 graduados e pós-graduados. O consumo alimentar foi avaliado utilizando um Questionário de Frequência de Consumo Alimentar e a derivação da ingestão de polifenóis foi feita por meio do banco de dados Phenol Explorer. A presença de HAS foi estabelecida com base na declaração do participante de ter tido diagnóstico médico da doença, uso de medicamentos anti-hipertensivos ou valores de pressão arterial sistólica ≥ 140mmHg ou pressão arterial diastólica ≥ 90mmHg.\n.\n📈 Como resultado,  foi observado que café, oleaginosas (amendoim, nozes e castanhas) e leguminosas (feijão e lentilha) foram os alimentos que mais contribuíram para o consumo total de polifenóis, e que o consumo de flavonóis e ácidos fenólicos foi inversamente associado à prevalência de HAS na amostra. Isso quer dizer que, quanto maior o consumo dessas classes, mais protegido está o indivíduo contra a pressão alta.\n.\n👉 Arraste para o lado e confira!\n\n🗣 Continue nos acompanhando para saber mais sobre os trabalhos desenvolvidos pelo nosso grupo!"
    url: "https://www.instagram.com/p/COTdJQygNt1/"
    imagem: "img/instagram-acervo/COTdJQygNt1.webp"
  - data: "2021-04-16"
    categoria: "Pesquisa"
    titulo: "Essa semana apresentamos para vocês a pesquisa da doutoranda Thaís Sabião"
    resumo: "Essa semana apresentamos para vocês a pesquisa da doutoranda Thaís Sabião (@thasabiao)"
    conteudo: "Essa semana apresentamos para vocês a pesquisa da doutoranda Thaís Sabião (@thasabiao). Mas qual a importância de investigar a associação da vitamina D e fatores determinantes dos seus níveis plasmáticos com os sintomas de transtorno de ansiedade e depressão durante a pandemia de COVID-19?\n.\n🧬 A hipovitaminose D tem sido associada aos sintomas de ansiedade e depressão, no entanto, a atual falta de conhecimento sobre polimorfismos genéticos que alteram o metabolismo, disponibilidade e atividade da vitamina pode ser responsável por respostas individuais distintas. Logo, qualquer conclusão sobre o valor terapêutico da vitamina D precisa ser interpretada com cautela. \n.\n💊 O presente artigo apresentou uma revisão das evidências pré-clínicas e clínicas dos efeitos da suplementação de vitamina D no transtorno depressivo maior e transtornos de ansiedade. \n.\n🧠 Observou-se que vários estudos pré-clínicos e clínicos sugeriram que a vitamina D pode ter efeito protetor na saúde mental e tem potencial para ser utilizada como terapia adjuvante para os transtornos de ansiedade e depressão em diferentes populações. Todavia, apesar de alguns estudos clínicos apontarem que a suplementação de vitamina D poderia promover efeito antidepressivo e ansiolítico, a maioria não explora devidamente os demais fatores e mecanismos associados aos sintomas destes transtornos e não avaliam a presença de polimorfismos genéticos.\n.\n🔎 Considerando esta e outras informações como: o papel da vitamina D na saúde mental e o impacto do distanciamento social na redução da exposição solar implicando nos níveis séricos de vitamina D; faz-se necessário estudar os sintomas de transtornos mentais que podem ter sido agravados pela pandemia de COVID-19.\n.\n💡 O estudo da Thaís pode fornecer subsídios para o desenvolvimento de novas estratégias em saúde que colaborem com a qualidade de vida da população, além de promover a redução dos custos do Sistema Único de Saúde (SUS) com medicamentos para os sintomas de transtorno de ansiedade e depressão.\n.\n👉 Arraste para o lado e confira o resumo do artigo apresentado e outros dois artigos que foram usados como referências."
    url: "https://www.instagram.com/p/CNvXjLEgibI/"
    imagem: "img/instagram-acervo/CNvXjLEgibI.webp"
  - data: "2021-04-13"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: doutoranda Thaís da Silva Sabião"
    resumo: "O GPENSC apresenta uma pesquisadora do nosso grupo, a doutoranda Thaís da Silva Sabião (@thasabiao)"
    conteudo: "O GPENSC apresenta uma pesquisadora do nosso grupo, a doutoranda Thaís da Silva Sabião (@thasabiao).\n.\n👩🏻‍🎓 Thaís é nutricionista graduada pela Universidade Federal de Juiz de Fora (2017), instituição na qual mantém o vínculo como integrante do Grupo de Pesquisa em Nutrição Translacional (@gpnutt.ufjf), é mestre em Saúde e Nutrição com ênfase em Bioquímica e Fisiopatologia da Nutrição pela Universidade Federal de Ouro Preto (2020) e atualmente, é doutoranda na mesma instituição, na linha de pesquisa de Saúde Coletiva.\n.\n📚 É pesquisadora do projeto “Vigilância Epidemiológica da COVID-19 na Região dos Inconfidentes, Minas Gerais (COVID-Inconfidentes)\" e sua pesquisa de doutorado é intitulada “Determinantes do status da Vitamina D e sintomas de transtorno de ansiedade e depressão durante a pandemia de COVID-19: influência da exposição solar, ingestão alimentar e polimorfismo do VDR”, sob orientação do professor Dr. George Luiz Lins Machado Coelho e coorientação da professora Dra. Júlia Cristina Cardoso Carraro.\n.\n🔎 Quer saber mais sobre o tema da Thaís? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo!"
