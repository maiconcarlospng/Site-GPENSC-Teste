  - data: "2022-03-30"
    categoria: "Pesquisa"
    titulo: "No #compartilhaGPENSC de hoje, a doutoranda Magda do Carmo Parajára explica sobre uma ferramenta do estudo Global Burden of Disease (GBD), o GBD Compare"
    resumo: "No #compartilhaGPENSC de hoje, a doutoranda Magda do Carmo Parajára (@magdaparajara) explica sobre uma ferramenta do estudo Global Burden of Disease (GBD), o GBD Compare"
    conteudo: "No #compartilhaGPENSC de hoje, a doutoranda Magda do Carmo Parajára (@magdaparajara) explica sobre uma ferramenta do estudo Global Burden of Disease (GBD), o GBD Compare. Você já ouviu sobre essa ferramenta?\n.\n📊 O GBD Compare é uma ferramenta interativa de visualização de dados do estudo GBD. Ela permite que o usuário compare padrões e tendências de causas e fatores de risco por local, sexo e idade de forma personalizada. As configurações podem ser ajustadas com um simples clique. Além disso, as figuras que são geradas durante a visualização dos dados ficam disponíveis para download.\n.\n🔢 Os dados do GBD são atualizados periodicamente. No momento desta publicação, estimativas para 369 doenças e lesões e 87 fatores de risco estavam disponíveis para 204 países e territórios entre 1990 e 2019. Todos esses dados estão disponíveis para qualquer pessoa que tenha interesse em usá-los.\n.\n👉🏽 Arraste para o lado e confira mais detalhes sobre o GBD Compare.\n.\n📌 Gostou desse conteúdo? Então, não se esqueça de salvar e compartilhar esse post."
    url: "https://www.instagram.com/p/CbvhW_gOJw-/"
    imagem: "img/instagram-acervo/CbvhW_gOJw-.webp"
