  - data: "2026-09-23"
    categoria: "Pesquisa"
    titulo: "Projeto de alimentação e nutrição na APS recebe aprovação no edital da FAPEMIG"
    resumo: "Projeto coordenado por Ariene Silva do Carmo foi aprovado no edital Demanda Universal FAPEMIG 2026, categoria B, para investigar ações de alimentação e nutrição na Atenção Primária à Saúde."
    conteudo: "Com muita satisfação, compartilhamos que o projeto coordenado pela professora Ariene Silva do Carmo (@ariene.carmo), docente e pesquisadora do GPENSC, foi aprovado no Edital Demanda Universal da Fundação de Amparo à Pesquisa do Estado de Minas Gerais – FAPEMIG (Nº B01/2026 - Categoria B) e receberá financiamento para sua execução! Foram submetidas 1.586 propostas às Categorias B e C. Desse total, 161 foram aprovadas dentro do limite financeiro alocado para a Chamada. O projeto obteve a 3ª colocação na área de conhecimento Ciências da Saúde, Câmara de Enfermagem, Nutrição e Saúde Coletiva (CENS). 📌 Sobre o Projeto: “Fortalecimento das ações de alimentação e nutrição na Atenção Primária à Saúde em Minas Gerais: diagnóstico situacional, análise de indicadores e avaliação de oficinas de formação para gestores”. 💡 Qual é o objetivo? A pesquisa tem como objetivo realizar o diagnóstico situacional das ações e programas relacionados à PNAN no âmbito APS em Minas Gerais, analisar a evolução temporal e fatores associados aos indicadores de alimentação e nutrição, bem como avaliar a efetividade de oficinas de formação com gestores municipais para o fortalecimento da implementação dessas ações. 🎯 Impacto esperado: Espera-se produzir evidências que subsidiem o planejamento e o fortalecimento da PNAN na APS, contribuindo para a melhoria das ações de alimentação e nutrição e para a garantia do direito humano à alimentação adequada. O GPENSC parabeniza a Profa. Ariene por essa importante conquista para o fortalecimento do SUS e da Nutrição em Saúde Coletiva! 💚🏛️ #FAPEMIG #AtençaoBasica #NutricaoSUS #SaudeColetiva"
    url: "https://www.instagram.com/p/DdpP7pHxlzS/"
    imagem: "img/instagram/DdpP7pHxlzS.jpg"

