  - data: "2026-04-28"
    categoria: "Pesquisa"
    titulo: "Estudo do GPENSC é publicado na revista Nutrition"
    resumo: "O GPENSC divulgou artigo na revista Nutrition que avaliou intervenções nutricionais e entrevista motivacional e sua relação com proteína C-reativa em pessoas com hipertensão."
    conteudo: "✨ Artigo publicado! ✨ Com muita alegria compartilhamos mais uma a publicação de artigo do nosso grupo na revista Nutrition 🧪📚 🫀 O que investigamos? Avaliamos o efeito de duas intervenções, dietoterapia para hipertensão e à entrevista motivacional, sobre a proteína C-reativa (PCR), um importante marcador inflamatório. Em pessoas com hipertensão arterial atendidas na Atenção Primária à Saúde. 📉 Principais achados: A intervenção com dietoterapia foi eficaz na redução da PCR, indicando melhora do perfil inflamatório em indivíduos hipertensos, reforçando o papel do cuidado nutricional individualizado e acolhedor como estratégia fundamental no cuidado à hipertensão. 💡 Este trabalho fortalece a evidência de que intervenções nutricionais bem estruturadas podem ir além do controle pressórico, impactando também processos inflamatórios associados às doenças cardiovasculares. 💙"
    url: "https://www.instagram.com/p/DXsJ7CFkYs6/"
    imagem: "img/instagram/DXsJ7CFkYs6.jpg"

