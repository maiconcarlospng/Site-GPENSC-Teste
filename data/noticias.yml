  - data: "2022-12-01"
    categoria: "Institucional"
    titulo: "Nutrição nas diferentes fases da vida: desafios para a promoção da Saúde e da Segurança Alimentar e Nutricional"
    resumo: "O GPENSC relembra presença de membros do GPENSC no XXVII Congresso Brasileiro de Nutrição – Conbran em Maceió, e no 13º Congresso Brasileiro de Saúde Coletiva – Abrascão em Salvador, nos meses de outubro e novembro de 2022"
    conteudo: "O GPENSC relembra presença de membros do GPENSC no XXVII Congresso Brasileiro de Nutrição – Conbran em Maceió, e no 13º Congresso Brasileiro de Saúde Coletiva – Abrascão em Salvador, nos meses de outubro e novembro de 2022.\n.\n 📝 O Conbran teve como tema central “Nutrição nas diferentes fases da vida: desafios para a promoção da Saúde e da Segurança Alimentar e Nutricional”. Já o tema desta edição do Abrascão foi \"Saúde é democracia: diversidade, equidade e justiça social\".\n.\n🌎 Tanto o Conbran, quanto o Abrascão são dois dos principais eventos de nutrição e saúde coletiva do país. A participação dos membros nestes congressos, reforça o nosso compromisso em fazer ciência e compartilhar conhecimento.\n.\n➡️ Arraste para o lado e confira!\n.\n🎉 Parabenizamos a todos os membros por representar tão bem o GPENSC, o PPGSN e a UFOP.\n.\n🗣️ Continue nos acompanhando e fique por dentro de todas as nossas atividades e projetos!"
