  - data: "2022-11-17"
    categoria: "Institucional"
    titulo: "O GPENSC relembra 1ª defesa de doutorado do Programa de Pós-Graduação em Saúde e Nutrição - PPGSN e do GPENSC"
    resumo: "O GPENSC relembra 1ª defesa de doutorado do Programa de Pós-Graduação em Saúde e Nutrição - PPGSN (@ppgsn.ufop) e do GPENSC"
    conteudo: "O GPENSC relembra 1ª defesa de doutorado do Programa de Pós-Graduação em Saúde e Nutrição - PPGSN (@ppgsn.ufop) e do GPENSC. O primeiro doutor em Saúde e Nutrição foi o Luiz Antônio Alves de Menezes Júnior (@luizmenezes__). A defesa ocorreu no dia 28 de setembro de 2022, de forma híbrida.\n.\n🔎 O projeto de doutorado do Luiz teve como objetivo avaliar a qualidade do sono da população adulta das cidades de Mariana e Ouro Preto (MG) durante a pandemia da covid-19, verificar seus determinantes, e associação com o consumo alimentar, comportamento sedentário e vitamina D sérica.\n.\n📊 O doutorado do Luiz originou quatro artigos, sendo a má qualidade do sono a variável desfecho. No primeiro artigo, verificou-se que mais da metade dos indivíduos tinham má qualidade do sono (52,5%) e que viver sozinho, ter ansiedade, sintomas da covid-19 e perda ou ganho de mais 5% de peso corporal durante a pandemia, foram fatores associados a má qualidade do sono. Este artigo está publicado na revista São Paulo Medical Journal (doi:10.1590/1516-3180.2022.0139.R1.19082022). \n.\n📈 No segundo artigo, foi verificado que o maior consumo de alimentos ultraprocessados concomitante ao menor consumo de alimentos in natura/minimamente processados foi associado a má qualidade de sono. Este artigo está publicado na revista Clinical Nutrition ESPEN (doi:10.1016/j.clnesp.2022.03.02). \n.\n📈 No terceiro artigo, observou-se que os indivíduos com comportamento sedentário acima de 9 horas por dia, tinham maiores chances de má qualidade de sono. A prática de atividade física moderada a vigorosa, foi um fator protetivo para esta associação. Este artigo está submetido na revista European Journal of Sports Science, e encontra-se sob revisão por pares. \n.\n📈 E no último artigo, verificou-se que a deficiência de vitamina D em indivíduos que não expunham adequadamente ao sol foi associado a má qualidade do sono. Este artigo está submetido na revista Nutrition, sob revisão por pares.\n.\n🎆 Parabenizamos o Luiz pela finalização do doutorado e pela contribuição com o PPGSN e para a ciência do país. Desejamos muito sucesso!"
