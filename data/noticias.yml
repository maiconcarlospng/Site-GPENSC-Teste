    titulo: "O GPENSC apresenta um #infográfico com os resultados preliminares do trabalho de mestrado da Ana Cláudia Morito, intitulado \"Comer emocional e fatores relacionados em indivíduos com vínculo acadêmico: Projeto PADu-COVID\", sob orientação da professora Dra"
    resumo: "O GPENSC apresenta um #infográfico com os resultados preliminares do trabalho de mestrado da Ana Cláudia Morito (@anaclaudiamorito), intitulado \"Comer emocional e fatores relacionados em indivíduos com vínculo acadêmico: Projeto PADu-COVID\", sob orientação da professora Dra"
    conteudo: "O GPENSC apresenta um #infográfico com os resultados preliminares do trabalho de mestrado da Ana Cláudia Morito (@anaclaudiamorito), intitulado \"Comer emocional e fatores relacionados em indivíduos com vínculo acadêmico: Projeto PADu-COVID\", sob orientação da professora Dra. Júlia Cristina Cardoso Carraro.\n.\n🎯 O objetivo do estudo foi analisar o comer emocional e fatores relacionados em indivíduos com vínculo acadêmico durante a pandemia da COVID-19. Os resultados são referentes aos dados da linha de base do projeto PADu-COVID. \n.\n👉 Arraste para o lado e confira mais sobre esse tema.\n.\n🗣 Continue nos acompanhando para saber mais sobre os resultados do PADu-COVID e sobre os trabalhos desenvolvidos pelo nosso grupo!"
