    conteudo: "Estamos com inscrições abertas para o preenchimento de duas vagas para pesquisa, uma para bolsa PIP (Programa de Iniciação à Pesquisa) e uma para voluntário, no estudo intitulado “Impactos financeiros e à saúde devidos à alimentação inadequada e ao excesso de peso no Brasil e Unidades Federativas”, coordenado pela Profa. Dra. Ísis Eloah Machado (@isiseloah).\n.\n🔸 Quem pode participar?\nAlunos de graduação da área da saúde, da UFOP, que tenham um coeficiente mínimo de 6.0.\n.\n🔸 Qual o critério de seleção?\nMaior nota no currículo e entrevista.\n.\n🔸 Quais os documentos necessários?\nCurrículo Lattes e histórico escolar.\n.\n🔸 Como realizar a inscrição?\nPara realizar a inscrição, e para mais informações, entre em contato com a pesquisadora responsável, Profa. Dra. Ísis Eloah Machado, no seguinte endereço de e-mail: isis.machado@ufop.edu.br\n.\n🔸 Qual o prazo máximo das inscrições?\nAté dia 29/01/2021.\n. \n🗣️ Não perca essa chance, venha fazer pesquisa com a gente!"
