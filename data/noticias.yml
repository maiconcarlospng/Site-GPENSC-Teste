  - data: "2023-03-15"
    categoria: "Pesquisa"
    titulo: "O GPENSC recomenda o relatório “Índice de Políticas para Promoção de Ambientes Alimentares Saudáveis”, lançado em 2022"
    resumo: "O GPENSC recomenda o relatório “Índice de Políticas para Promoção de Ambientes Alimentares Saudáveis”, lançado em 2022"
    conteudo: "O GPENSC recomenda o relatório “Índice de Políticas para Promoção de Ambientes Alimentares Saudáveis”, lançado em 2022.\n.\n🧾O Brasil, junto a outros países ao redor do mundo, formam a Rede Internacional de Pesquisa, Monitoramento e Apoio às Ações em Alimentação, Nutrição, Obesidade e Doenças Crônicas Não Transmissíveis (DCNT) - Rede INFORMAS, que tem como objetivo avaliar e monitorar as ações dos setores públicos e privados com a intenção de promover ambientes alimentares saudáveis. \n.\n🎯 Para alcançar este objetivo, foi desenvolvido o índice Food-EPI com intuito de avaliar as práticas alimentares empregadas pelo governo dos países participantes desta rede e compará-las com os países que apresentam as melhores práticas internacionais. \n.\n💻 No Brasil, o Food-EPI foi coordenado pela Universidade de Brasília (UnB), em parceria com outras universidades e o Instituto Brasileiro de Defesa do Consumidor (IDEC).\n.\n✅ Os resultados do documento indicam “a urgência da retomada das funções primordiais por parte do Estado brasileiro”, uma vez que em certas instâncias de ação do governo é inexistente e, em outras, observa-se, claramente, o enfraquecimento das tomadas de ações governamentais.\n.\n🔗 Para conferir o documento na íntegra, acesse: www.opsan.unb.br/biblioteca \n.\n🗣️ Gostou da dica? Compartilha com os amigos e aproveita para salvar essa recomendação."
