  - data: "2026-08-25"
    categoria: "Pesquisa"
    titulo: "O que os motivos das escolhas alimentares têm a ver com o desejo por alimentos?"
    resumo: "O que os motivos das escolhas alimentares têm a ver com o desejo por alimentos? Um estudo conduzido pela doutoranda Ana Cláudia Morito Neves (@anaclaudiamorito),…"
    conteudo: "O que os motivos das escolhas alimentares têm a ver com o desejo por alimentos?\n\nUm estudo conduzido pela doutoranda Ana Cláudia Morito Neves (@anaclaudiamorito), em parceria com pesquisadores do GPENSC (@gpenscufop) e sob orientação da Profª Drª Júlia Cristina Cardoso Carraro (@julia_carraro), investigou a associação entre os motivos e valores que orientam as escolhas alimentares e o desejo por alimentos (food cravings) em adultos brasileiros.\n\nO que foi investigado?\nO estudo utilizou dados de uma subamostra da Coorte Universitária de Minas Gerais (CUME), um estudo de coorte prospectivo, aberto e realizado on-line, que investiga a relação entre padrões alimentares, transição nutricional e ocorrência de doenças crônicas não transmissíveis em graduados e pós-graduados de instituições federais de ensino superior brasileiras. Participaram do estudo 549 adultos, e o desejo por alimentos foi avaliado por meio do Food Craving Inventory instrumento adaptado e validado para a população brasileira. Os motivos das escolhas alimentares foram investigados pelo Food Choice Questionnaire, que contempla nove dimensões: saúde, humor, conveniência, apelo sensorial, conteúdo natural, preço, controle de peso, familiaridade e preocupações éticas.\n\n📊 Principais achados\nMotivos relacionados a humor, conveniência, apelo sensorial, preço e familiaridade estiveram associados a maior desejo por alimentos ricos em gordura e doces. Em contraste, motivos relacionados à saúde e ao conteúdo natural apresentaram associação com menor desejo por esses alimentos. Além disso, humor, apelo sensorial, preço, controle de peso e familiaridade estiveram associados a maior desejo por alimentos tradicionais.\n\n💡 Conclusão\nOs resultados mostram que o food craving não está relacionado apenas a necessidades biológicas. O desejo por alimentos é influenciado por diferentes dimensões das escolhas alimentares, envolvendo aspectos emocionais, práticos, sensoriais, racionais e culturais. \n\n✨ Esses achados reforçam a importância de compreender o comportamento alimentar de forma ampla, considerando os múltiplos fatores que influenciam nossas escolhas e desejos alimentares."
    url: "https://www.instagram.com/p/DcenjhWkTEv/"
    imagem: "img/instagram-acervo/DcenjhWkTEv.webp"
  - data: "2026-08-18"
    categoria: "Pesquisa"
    titulo: "Quem são os alimentos comercializados com o termo fit no Brasil?"
    resumo: "Quem são os alimentos comercializados com o termo fit no Brasil? 🔍 O estudo realizado por Thamara de Cássia Carneiro (@thamara_f), Dra. Bruna Eugênia Ferreira…"
    conteudo: "Quem são os alimentos comercializados com o termo fit no Brasil?\n\n🔍 O estudo realizado por Thamara de Cássia Carneiro (@thamara_f), Dra. Bruna Eugênia Ferreira Mota (@bruna.emota), doutoranda Francine Rubim de Resende (@francinerubimnutri), Dra. Raquel de Deus Mendonça (@raquelmendoca_enut) e Dra. Camila Carvalho Menezes (@menezescamilacarvalho) avaliou a qualidade nutricional de alimentos comercializados no Brasil com o termo “fit” ou “fitness”.\n\n📌Neste estudo, foram avaliados 146 alimentos que apresentavam os termos fit/fitness no rótulo do alimento.\n\n📊 Os autores verificaram que 79% foram classificados como ultraprocessados. Segundo o perfil de nutrientes, 75% e 39,2% dos alimentos possuíam pelo menos um nutriente crítico em nível em quantidade elevada, quanto critérios estabelecidos pela OPAS e ANVISA, respectivamente. Além disso, 80% dos rótulos apresentaram outras alegações e termos nutricionais exaltando alguma propriedade nutricional.\n\n📝Conclusão: Os resultados deste estudo verificaram que alimentos fit/fitness são, em sua maioria, ultraprocessados, com elevada prevalência de nutrientes críticos e possuem baixa qualidade nutricional. A utilização desses termos, que não são regulamentos pela legislação brasileiras podem ser utilizados de forma intencional pela indústria para atrair a atenção do consumidor e pode induzi-lo ao engano.\n\nFicou interessado em ler o artigo? Escaneie o Qr Code para ter acesso ao conteúdo na integra."
