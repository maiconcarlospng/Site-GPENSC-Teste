    conteudo: "Participação da professora Adriana na Avaliação Quadrienal da Capes!\n\nA professora Adriana Lúcia Meireles (@dri_meireles) foi convidada para atuar como consultora da área de Nutrição na Avaliação Quadrienal 2021-2024 da Capes.\n\nAs atividades presenciais ocorreram em Brasília e envolveram 15 pesquisadores que avaliaram a qualidade dos cursos de mestrado e doutorado em Nutrição do Brasil. \n\nEssa participação representa um importante reconhecimento da trajetória da professora Adriana e reforça o papel do GPENSC na produção de conhecimento científico e na qualificação da pós-graduação em Nutrição no país.\n\n#pesquisa #ciencia #capes"
