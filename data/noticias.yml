    titulo: "Importância da estimativa do custo das doenças"
    resumo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC"
    conteudo: "O GPENSC apresenta mais um resumo do projeto #compartilhaGPENSC.\n\n📝 Neste resumo, vamos falar sobre a “Importância da estimativa do custo das doenças”, apresentado pelas mestrandas Carla Rocha, Joice Vieira (@joicesvleal) e Larissa Guedes (@larissaguedesnutri) que são orientadas, respectivamente, pelas professoras Dra. Adriana Lúcia Meireles (@dri_mereireles), Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes) e Dra. Ísis Eloah Machado (@isiseloah).\n.\n💡 Na apresentação, as alunas abordaram sobre o custo das doenças, a importância do seu estudo, principalmente, para o Sistema Único de Saúde (SUS), além das abordagens utilizadas para mensurar o custo e alguns conceitos usados na área da saúde. Ainda, as alunas mencionam a fonte de informação sobre custos que será utilizada em suas pesquisas de mestrado: o DATASUS.\n.\n👉🏻Arraste para o lado e confira sobre essa temática.\n.\n🗣️ Continue nos acompanhando para saber mais sobre os trabalhos desenvolvidos pelo nosso grupo."
