  - data: "2023-05-23"
    categoria: "Pesquisa"
    titulo: "Oi pessoal! . Hoje vamos apresentar para vocês o artigo intitulado “Multiple health risk behaviors,…"
    resumo: "Oi pessoal! . Hoje vamos apresentar para vocês o artigo intitulado “Multiple health risk behaviors, including hight consumption of ultra – processed foods and theis…"
    conteudo: "Oi pessoal!\n.\nHoje vamos apresentar para vocês o artigo intitulado “Multiple health risk behaviors, including hight consumption of ultra – processed foods and theis implications for mental health during the COVID – 19 pandemic”, de autoria da doutoranda Hillary Coletro (@hillarycoletro) juntamente com colaboração de outros pesquisadores do GPENSC.\n.\n🎯 O artigo, um dos produtos da tese de doutorado da Hillary, teve como objetivo avaliar a associação entre a ocorrência conjunta de comportamentos de\nrisco à saúde, como comportamento sedentário, alto consumo semanal de alimentos ultraprocessados e não consumir diariamente frutas e hortaliças, e sintomas de ansiedade e depressão em adultos.\n.\n🔎 Trata-se de um estudo transversal realizado com dados coletados em Ouro Preto e Mariana/MG. O desfecho,\nsintomas de ansiedade e depressão foram medidos por meio das escalas PHQ – 9 e GAD – 7. A exposição, comportamentos de risco, foi avaliada por meio do questionário de frequência alimentar e classificação NOVA, e horas diárias em que o participante declarou passar sentado, deitado ou reclinado.\n.\n📈 Observou-se que aqueles que apresentavam consumo não diário de frutas e hortaliças,\ne alto consumo de alimentos ultraprocessados, apresentaram uma razão de prevalência 2,6 maior para a\nocorrência de sintomas de transtorno mental, assim como aqueles com todos os três comportamentos de\nrisco à saúde apresentaram uma razão de prevalência 2,8 maior para sintomas de transtorno mental.\n.\n📝 Este estudo revelou que a existência de uma combinação de dois e três comportamentos de risco para a saúde conduziu a uma maior prevalência de sintomas de ansiedade ou depressão.\n.\n🔗Acesse o artigo: 10.3389/frutas.2022.1042425"
    url: "https://www.instagram.com/p/CsmckOguDTn/"
    imagem: "img/instagram-acervo/CsmckOguDTn.webp"
  - data: "2023-05-18"
    categoria: "Pesquisa"
    titulo: "Um mundo em turbulência: oportunidades para focar na saúde pública"
    resumo: "O GPENSC relembra presença de pesquisadores do GPENSC no 17º Congresso Mundial de Saúde Pública, em Roma, que ocorreu entre os dias 02 a 06 de maio de 2023"
    conteudo: "O GPENSC relembra presença de pesquisadores do GPENSC no 17º Congresso Mundial de Saúde Pública, em Roma, que ocorreu entre os dias 02 a 06 de maio de 2023. O Congresso foi organizado pela World Federation of Public Health Associations(WFPHA) juntamente com a Associação de Escolas de Saúde Pública (ASPHER) e a Sociedade Italiana de Higiene, Medicina Preventiva e Saúde Pública (SItI).\n.\n📝 O 17º Congresso Mundial de Saúde Pública teve como tema central “Um mundo em turbulência: oportunidades para focar na saúde pública”, refletindo o compromisso da comunidade global de saúde de trabalhar em conjunto dentro e fora de nossos respectivos campos para promover a equidade na saúde e construir um futuro mais sustentável e justo.\n.\n➡️ Arraste para o lado e confira!\n.\n🎉 Parabenizamos a todos os membros por representar tão bem o GPENSC, o PPGSN e a UFOP! \n.\n🗣️ Continue nos acompanhando e fique por dentro de todas as nossas atividades e projetos!"
