    conteudo: "O GPENSC recomenda o episódio “A nova cesta básica e o cerco aos ultraprocessados” do podcast “O Assunto”, que é uma iniciativa de Natuza Nery com produção do G1 (@portalg1).\n.\n📝 O episódio é parte de uma série de podcast que oferece entrevistas exclusivas para contextualizar, explicar e trazer uma perspectiva diferente sobre os temas mais relevantes do Brasil e do mundo, incluindo política, saúde, economia, história, cultura e muito mais.\n.\n📚 Na indicação de hoje, você terá a oportunidade de entender melhor a importância do decreto do governo para atualização dos itens da Cesta Básica da Alimentação e seu impacto na saúde da população brasileira. Além disso, o episódio também fala sobre a nova rotulagem dos alimentos.\n\n👥 O episódio conta com a participação da chef de cozinha Rita Lobo (@ritalobo), que é autora de 11 livros sobre comida, criadora do Panelinha e do programa Cozinha na Prática no GNT e da pesquisadora Ana Paula Bortoletto (@anapbmartins), professora da Faculdade de Saúde Pública da USP e integrante do Núcleo de Pesquisas Epidemiológicas em Nutrição e Saúde (@nupensusp).\n.\n🔎 Esse e outros episódios do podcast “O assunto” estão disponíveis no Spotify.\n.\n🗣️ Gostou da dica? Compartilha com os amigos e aproveita para salvar essa recomendação."
