    titulo: "O GPENSC relembra a defesa de mestrado da Thaís Calcagno Vidon Bruno, que ocorreu no dia 15 de fevereiro de 2023, via Google Meet"
    resumo: "O GPENSC relembra defesa de mestrado da Thaís Calcagno Vidon Bruno (@t.calcagno), que ocorreu no dia 15 de fevereiro de 2023, via Google Meet"
    conteudo: "O GPENSC relembra defesa de mestrado da Thaís Calcagno Vidon Bruno (@t.calcagno), que ocorreu no dia 15 de fevereiro de 2023, via Google Meet.\n.\n🔎 A dissertação da Thaís, intitulada “Percepção de suporte social, consumo alimentar e ganho de peso em estudantes universitários durante a pandemia de covid-19: estudo PADu-covid\", teve como objetivo validar uma escala de percepção de suporte social durante a pandemia e avaliar sua associação com o consumo alimentar e ganho de peso em estudantes de graduação de uma instituição de ensino superior do estado de Minas Gerais.\n.\n👥 Seu estudo foi orientado pela professora Dra. Julia Cristina Cardoso Carraro - @julia_carraro (UFOP) e coorientado pela professora Dra. Sabrina Martins Barroso - @sabarroso (UFTM). O trabalho contou com as contribuições da banca composta pelas professoras Dra. Raquel de Deus Mendonça - @raquelmendonca_enut (UFOP) e Dra. Daniela Saes Sartorelli (USP).\n.\n📈 Os resultados da dissertação da Thaís apresentam uma escala com atributos de validade para a avaliação da percepção de suporte social em estudantes universitários em período de restrição social. Ademais, os resultados indicam que houve um aumento da percepção de suporte social entre estudantes universitários e foi visto que ter um maior suporte social está relacionado a uma alimentação de melhor qualidade. \n.\n🎆 Parabenizamos a Thais pela sua defesa de mestrado e pela contribuição para a ciência do país!"
