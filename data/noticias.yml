    titulo: "Nosso #tbt de hoje é bem recente, para lembrar da defesa de mestrado da aluna Bruna Carolina Rafael Barbosa, que ocorreu no dia 22 de março, via Google Meet"
    resumo: "Nosso #tbt de hoje é bem recente, para lembrar da defesa de mestrado da aluna Bruna Carolina Rafael Barbosa (@brunabcrb18), que ocorreu no dia 22 de março, via Google Meet"
    conteudo: "Nosso #tbt de hoje é bem recente, para lembrar da defesa de mestrado da aluna Bruna Carolina Rafael Barbosa (@brunabcrb18), que ocorreu no dia 22 de março, via Google Meet.\n.\n🔎 A dissertação da Bruna, intitulada “Coocorrência de comportamentos obesogênicos e sintomas de ansiedade e depressão durante os meses iniciais da pandemia da covid-19: PADu-COVID, um estudo com universitários” teve como objetivo estimar a prevalência dos sintomas de ansiedade e depressão e sua associação com a coocorrência de comportamentos obesogênicos em estudantes de graduação de uma Instituição Federal de Ensino Superior durante os meses iniciais (julho a agosto de 2020) da pandemia da covid-19.\n.\n👥 Seu trabalho foi orientado pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientado pela professora Dra. Elaine Leandro Machado (@lili_mach). O trabalho contou com as contribuições da professora Dra. Fernanda de Carvalho Vidigal (@fcvidigal) e da professora Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes).\n.\n📈 Os resultados da dissertação da Bruna indicam que os sintomas de ansiedade (46,1%) e depressão (54,6 %) foram altamente prevalentes entre os estudantes universitários durante o período de suspensão das atividades presenciais na universidade. Além disso, os resultados mostraram que quanto maior o número de comportamentos obesogênicos simultâneos, maior a chance dos estudantes apresentarem sintomas de ansiedade e depressão.\n.\n💡 Esses achados reforçam a necessidade de desenvolver ações de saúde pública para melhor abordar questões de saúde mental no ambiente universitário.\n.\nParabenizamos a Bruna pela defesa de mestrado e pela contribuição na ciência do país. Queremos também parabenizá-la pela aprovação no doutorado no PPGSN/UFOP! Sucesso sempre! 👏🎉✨"
