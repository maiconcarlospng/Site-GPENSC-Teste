    conteudo: "Na semana passada, foi publicada uma reportagem no site da UFOP (@minhaufop) explicando sobre o “Estudo da Segurança Alimentar e Nutricional na Pandemia da Covid-19” (ESANP).\n.\n🏠 O texto da reportagem destaca o objetivo do estudo e as coletas de dados que já aconteceram. Além disso, é abordado sobre a próxima fase da pesquisa, que vai iniciar agora em dezembro, com a finalidade de continuar acompanhando as condições de segurança alimentar nos domicílios avaliados, por meio de entrevistas telefônicas. \n.\n💬 A reportagem também traz uma explicação muito didática da professora Dra Raquel de Deus Mendonça (@raquelmendonca_enut), coordenadora do ESANP, a respeito do que é segurança alimentar e nutricional. Vale muito a pena conferir!\n.\n🔗 Quer saber mais sobre o estudo e ainda conhecer os resultados que já foram publicados? Acesse a reportagem na íntegra por meio do link disponível na nossa bio."
