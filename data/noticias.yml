    titulo: "Uma pesquisa realizada pela Universidade Federal de Ouro Preto (UFOP) pretende traçar o perfil de…"
    resumo: "Uma pesquisa realizada pela Universidade Federal de Ouro Preto (UFOP) pretende traçar o perfil de pacientes infectados pelo coronavírus em Antônio Pereira, distrito da cidade…"
    conteudo: "Uma pesquisa realizada pela Universidade Federal de Ouro Preto (UFOP) pretende traçar o perfil de pacientes infectados pelo coronavírus em Antônio Pereira, distrito da cidade de Ouro Preto 👩🏻‍💻😷\n🔹\nA iniciativa surgiu porque foi no distrito de Antônio Pereira onde foram diagnosticados os primeiros casos de Coronavírus no município. Além disso, por ser uma área de mineração e que recebe muito trabalhadores de fora, também apresenta alta taxa de transmissão.\n🔹\nAlém disso, os pesquisadores (@gpenscufop) vão aplicar um questionário a todos os testados com perguntas sobre histórico de saúde, hábitos alimentares e mudanças durante o período da pandemia.\n🔹\nEstamos na expectativa para o início da pesquisa e desenvolvimento de resultados promissores 👏🏻👏🏻\n🔹\nPara maiores informações, acesse o site do @otempo"
