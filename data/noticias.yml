    resumo: "Hoje, vamos divulgar a 15ª edição do Encontro de Saberes 2023, realizado pela Universidade Federal de Ouro Preto – UFOP (@minhaufop)"
    conteudo: "Hoje, vamos divulgar a 15ª edição do Encontro de Saberes 2023, realizado pela Universidade Federal de Ouro Preto – UFOP (@minhaufop). O tema desta edição é \"Revoluções tecnológicas e as mudanças sociais\". \n.\n🎯 O objetivo do evento é promover a integração dos saberes das áreas de ensino, pesquisa, extensão e internacionalização, criando oportunidade para a comunidade acadêmica debater sobre as mudanças sociais e tecnológicas que a humanidade está vivendo.\n.\n🗓️ O Encontro de Saberes 2023 acontecerá entre os dias 20 de novembro a 24 de novembro de 2023, de forma presencial, com atividades no Centro de Artes e Convenções, em Ouro Preto.\n.\n👥 A 15ª edição contará com a participação de alunos de iniciação cientifica e pós-graduação do GPENSC apresentando seus trabalhos acadêmicos. Não deixe de ir e conferir pessoalmente nossos banners!\n.\n🔗 Para mais informações, acesse: https://encontrodesaberes.ufop.br/.\n.\n🗣️ Nós, do GPENSC, convidamos a toda comunidade para participar e conhecer as ações que envolvem ciência desenvolvidas no dia a dia universitário, principalmente as que trazem melhorias e impactos positivos a sociedade."
