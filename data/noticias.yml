    imagem: "img/instagram-acervo/CVEIKS9orXQ.webp"
  - data: "2021-09-17"
    categoria: "Institucional"
    titulo: "Artigo: Home food insecurity during the suspension of classes in Brazilian public schools due to the COVID-19 pandemic"
    resumo: "Tem produção nova do GPENSC vindo aí!"
    conteudo: "Tem produção nova do GPENSC vindo aí!\n.\n📄 Hoje, trazemos para vocês o artigo intitulado “Home food insecurity during the suspension of classes in Brazilian public schools due to the COVID-19 pandemic”, de autoria da doutoranda Érica Costa Rodrigues, sob a orientação da professora Dr. Adriana Lúcia Meireles, juntamente com outras pesquisadoras do grupo. Esse artigo foi realizado com resultados da linha de base do Estudo da Segurança Alimentar e Nutricional na Pandemia da COVID-19 – ESANP, um estudo longitudinal desenvolvido pelo GPENSC.\n.\n🎯 O objetivo do artigo foi avaliar o efeito das condições socioeconômicas e de variáveis relacionadas à pandemia da COVID-19 sobre a insegurança alimentar (IA) de alunos durante a suspensão das aulas nas escolas públicas municipais. \n.\n📌 A coleta de dados foi realizada com adultos responsáveis pela compra de alimentos durante a pandemia da COVID-19.  O desfecho foi a IA, avaliada por meio da Escala Brasileira de Insegurança Alimentar (EBIA). Modelos de regressão logística multivariada foram usados para estimar o Odds Ratio (OR) e intervalo de confiança de 95% (IC95%).\n.\n📊 A prevalência total de IA nos domicílios foi de 82%, sendo 65,7% IA leve, 11,3% IA moderada e 5,0% IA grave. Famílias com o maior número de filhos (OR = 2,17; IC95%: 1,10–4,27) e as famílias que receberam cestas básicas do governo local (OR = 1,64; IC95%: 1,04–2,58) foram significativamente associadas à IA. Além disso, as famílias que não experimentaram diminuição na renda durante a pandemia foram inversamente associadas à IA (OR = 0,17; IC95%: 0,09–0,32). \n.\n💡 A prevalência de IA foi elevada e as políticas de distribuição de cestas básicas podem não ser suficientes para garantir a segurança alimentar das famílias mais vulneráveis com maior número de filhos. Considerando o possível agravamento da IA durante a pandemia de COVID-19, o Programa Nacional de Alimentação Escolar (PNAE) pode desempenhar um papel estratégico na promoção da segurança alimentar dos alunos.\n.\n🔗 O artigo pode ser encontrado no seguinte link: https://www.sciencedirect.com/science/article/abs/pii/S0899900721003105"
    url: "https://www.instagram.com/p/CT7_c1EvSkB/"
    imagem: "img/instagram-acervo/CT7_c1EvSkB.webp"
