    titulo: "Na semana passada, apresentamos para vocês algumas alunas de Iniciação Científica (IC) que fazem parte do projeto COVID-Inconfidentes (Vigilância epidemiológica da COVID-19 na…"
    resumo: "Na semana passada, apresentamos para vocês algumas alunas de Iniciação Científica (IC) que fazem parte do projeto COVID-Inconfidentes (Vigilância epidemiológica da COVID-19 na região dos Inconfidentes/MG) e que são membros do GPENSC"
    conteudo: "Na semana passada, apresentamos para vocês algumas alunas de Iniciação Científica (IC) que fazem parte do projeto COVID-Inconfidentes (Vigilância epidemiológica da COVID-19 na região dos Inconfidentes/MG) e que são membros do GPENSC. Hoje, iremos apresentar para vocês o restante desse time.\n.\n🎓 A Milena Martins (@mi_martinns) é aluna do sexto período de Nutrição na Universidade Federal de Ouro Preto (UFOP), orientada pela professora Dra Mariana Carvalho de Menezes (@maricarvalhomenezes) e coorientada pelas doutorandas Hillary Nascimento Coletro (@hillarycoletro) e Irene Carolina Souza Justiniano (@irenecsj_). O tema do seu projeto de pesquisa na iniciação é sobre ambiente alimentar e o tema do seu TCC envolve consumo alimentar e saúde mental.\n.\n🎓 A Railane Sangir Santos (@railanesangir) é aluna do sexto período de Serviço Social da Universidade Federal de Viçosa (UFV). Orientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientada pela doutoranda Amanda Popolino Diniz (@amandapopolinonutricionista), seu tema de pesquisa é “Relação do consumo de tabaco e bebidas alcoólicas com a atividade laboral durante a pandemia da COVID-19”.\n.\n🎓 A Shisa Maris Martins Pereira (@shisamartins) é aluna do sexto período do curso de Medicina (UFOP), orientada pela professora Dra. Adriana Lúcia Meireles  e coorientada pelo doutorando Luiz Antônio Alves de Menezes Júnior (@luizmenezes__). Seu tema de pesquisa é intitulado “Associação do excesso de peso com a qualidade do sono durante a pandemia da COVID-19”.\n.\n🎓 A Virgínia Silva Rocha é aluna do sexto período do curso de Medicina (UFOP), orientada pela professora Dra. Adriana Lúcia Meireles e coorientada pela doutoranda Samara Silva de Moura (@mourasamara). O tema do seu projeto de pesquisa na iniciação é sobre “Inatividade física e comportamento sedentário durante a pandemia de COVID-19”.\n.\n🗣️ Continue nos acompanhando para saber mais sobre o nosso grupo e os projetos que desenvolvemos!"
