  - data: "2021-06-30"
    categoria: "Pesquisa"
    titulo: "Métodos da estimação da carga de doenças e dos fatores de riscos nutricionais"
    resumo: "Conhecimento nunca é demais, não é mesmo?!"
    conteudo: "Conhecimento nunca é demais, não é mesmo?! Pensando nisso, hoje vamos iniciar o projeto #compartilhaGPENSC. Neste projeto, vamos trazer resumos sobre os temas que nosso grupo vem trabalhando nas reuniões fechadas, onde temos abordado as grandes temáticas de investigação desenvolvidas pelo grupo. A ideia desses resumos é compartilhar conhecimento e não deixar vocês de fora do que estamos discutindo.\n.\n📄 Hoje, trazemos um resumo intitulado “Métodos da estimação da carga de doenças e dos fatores de riscos nutricionais”, apresentado pela doutoranda Magda do Carmo Parajára (@magdaparajara), que é orientada pela professora Dra. Adriana Lúcia Meireles (@dri_meireles). A apresentação dessa temática também contou com a colaboração do aluno de iniciação científica Helton da Costa Paiva (@heltonpaiva05).\n.\n💡 Nesse resumo, a Magda falou sobre o que é a carga de doença, o porquê de estudá-la, as formas de mensurá-la e alguns exemplos de métricas de carga de doenças. Além disso, a aluna traz como a carga de doenças será mensurada no seu trabalho e nas pesquisas de outros alunos que investigam esse tema, que é por meio de métricas estimadas pelo estudo Global Burden of Disease, o GBD.\n.\n🔍 No GBD, a carga atribuída aos fatores dietéticos é determinada a partir de uma abordagem de avaliação comparativa de risco, onde estima-se a proporção da carga específica da doença que é devida ao fator de risco dietético, também denominada fração atribuível populacional (FAP). Ou seja, a partir da FAP é possível mensurar qual a carga da doença que é explicada pelo fator de risco dietético de interesse.\n.\n👉 Arraste para o lado e confira mais sobre essa temática.\n.\n🗣️ Continue nos acompanhando para saber mais sobre os trabalhos desenvolvidos pelo nosso grupo!"
    url: "https://www.instagram.com/p/CQwdHRoAKRJ/"
    imagem: "img/instagram-acervo/CQwdHRoAKRJ.webp"
  - data: "2021-06-23"
    categoria: "Pesquisa"
    titulo: "Qualidade do sono e comportamento sedentário durante a pandemia: um estudo de base populacional, COVID-Inconfidentes"
    resumo: "O GPENSC apresenta algumas das alunas de Iniciação Científica (IC) que fazem parte do projeto COVID-Inconfidentes (Vigilância epidemiológica da COVID-19 na região dos Inconfidentes/MG) e que são membros do GPENSC"
    conteudo: "O GPENSC apresenta algumas das alunas de Iniciação Científica (IC) que fazem parte do projeto COVID-Inconfidentes (Vigilância epidemiológica da COVID-19 na região dos Inconfidentes/MG) e que são membros do GPENSC.\n.\n🎓 A Amanda Gonçalves Miranda (@_amandinha8) é aluna do primeiro período de Medicina do Centro Universitário de Belo Horizonte (UniBH), orientada pela professora  Dra. Adriana Lúcia Meireles (@dri_meireles) e coorientada pelos doutorandos Samara Silva de Moura (@mourasamara) e Luiz Antônio Menezes (@luizmenezes__). Seu tema de pesquisa é intitulado \"Qualidade do sono e comportamento sedentário durante a pandemia: um estudo de base populacional, COVID-Inconfidentes\".\n.\n🎓 A Júlia Almeida Alves da Silva (@imjulialmeida) é aluna do terceiro período de Nutrição na Universidade Federal de Ouro Preto (UFOP). Seu tema de pesquisa dentro desse projeto maior é “Segurança alimentar e nutricional e o consumo alimentar da população dos municípios de Mariana e Ouro Preto/MG na pandemia por Sars-Cov2”. Júlia é orientada pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut) e coorientada pela professora Dra. Adriana Lúcia Meireles.\n.\n🎓 A Marcela Gomes Reis (@marcelagreis) é aluna do oitavo período de Nutrição (UFOP). Na iniciação científica, é orientada pela professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro) e coorientada pela doutoranda Thaís da Silva Sabião (@thasabiao), sendo seu projeto intitulado ‘‘Consumo de folato e vitamina B12 e sua relação com sintomas de ansiedade e depressão durante a pandemia de COVID-19’’. \n.\n🎓 A Maria Luísa Lage (@malu_lage_) é aluna do segundo período de Nutrição (UFOP). Orientada pela professora Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes), coorientada pelas doutorandas Hillary Nascimento Coletro (@hillarycoletro) e Irene Carolina Sousa Justiniano (@irenecsj_), seu tema de pesquisa é sobre ambiente alimentar e COVID-19.\n.\n🗣️ Continue nos acompanhando para saber mais sobre o nosso grupo e os projetos que desenvolvemos!"
