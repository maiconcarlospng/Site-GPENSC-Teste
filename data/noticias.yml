    titulo: "Hoje, trouxemos para vocês mais um momento descontraído no #InteraçãoGPENSC"
    resumo: "Hoje, trouxemos para vocês mais um momento descontraído no #InteraçãoGPENSC"
    conteudo: "Hoje, trouxemos para vocês mais um momento descontraído no #InteraçãoGPENSC. Que tal interagir com o GPENSC no \"De olho na telinha\"?\n. \n➡️ Arraste para o lado e confira nosso momento interação da semana. Aproveita e marca seu parceiro(a) de artigo 💕\n.\n💭 Dica boa é dica compartilhada, não é mesmo? Então anota essa aí: o prazo para submeter resumo para o World Congress on Public Health (WCPH) finaliza na próxima semana, dia 15 de dezembro.\n.\n📝 O congresso é realizado a cada dois ou três anos pela Federação Mundial de Associações de Saúde Pública e serve como um fórum para a troca de conhecimentos e experiências sobre questões-chave de saúde pública, contribuindo para a proteção e promoção da saúde pública a nível nacional e global, além da construção de um futuro mais sustentável e justo. Por isso, corre lá e não perca a chance de ter sua publicação em um evento internacional.\n.\n🥰 Por hoje, é isso seguimores! Continuem nos acompanhando e fiquem por dentro de todas as nossas atividades e projetos!\n.\n🗣️ Gostou do post e da dica? Compartilha com seu amigo(a)."
