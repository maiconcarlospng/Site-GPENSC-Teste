  - data: "2022-11-22"
    categoria: "Pesquisa"
    titulo: "Ciência, tecnologia e humanização: desafios e propostas para o século XXI"
    resumo: "Hoje vamos divulgar a 14ª edição do Encontro de Saberes 2022, realizado pela Universidade Federal de Ouro Preto – UFOP (@minhaufop)"
    conteudo: "Hoje vamos divulgar a 14ª edição do Encontro de Saberes 2022, realizado pela Universidade Federal de Ouro Preto – UFOP (@minhaufop). O tema desta edição será “Ciência, tecnologia e humanização: desafios e propostas para o século XXI”.\n.\n🎯 O objetivo do evento é promover a integração dos saberes das áreas do ensino, pesquisa, extensão e internacionalização, criando oportunidade para a comunidade acadêmica debater sobre uma das questões mais relevantes da atualidade: a manutenção da qualidade de vida no planeta.\n.\n🗓️ O Encontro de Saberes 2022 acontecerá entre os dias 12 e 16 de dezembro de 2022, de forma online, por meio da plataforma Moodle na UFOP Aberta. \n.\n👥 A 14ª edição contará com a participação de alunos de pós-graduação e de iniciação científica do GPENSC apresentando seus trabalhos acadêmicos. Serão 5 dias de muito conteúdo, trocas e aprendizado!\n.\n🗣️ Convidamos a toda comunidade para participar e discutir os rumos da ciência, da educação e os desafios enfrentados pelo ensino universitário público. Participe!"
