  - data: "2024-05-31"
    categoria: "Institucional"
    titulo: "Comportamentos de movimentos e obesidade: associação com sintomas de ansiedade e depressão durante o ensino remoto"
    resumo: "O GPENSC relembra qualificação de doutorado da aluna Bruna Carolina Rafael Barbosa (@brunabcrb), que ocorreu no dia 23 de abril de 2024, via Google Meet"
    conteudo: "O GPENSC relembra qualificação de doutorado da aluna Bruna Carolina Rafael Barbosa (@brunabcrb), que ocorreu no dia 23 de abril de 2024, via Google Meet.\n.\n🔎 O projeto de doutorado da Bruna, intitulado “Comportamentos de movimentos e obesidade: associação com sintomas de ansiedade e depressão durante o ensino remoto”, tem como objetivo avaliar como os comportamentos de movimento e a obesidade estão associados a presença de sintomas de ansiedade e depressão entre estudantes universitários durante o ensino remoto devido a pandemia da covid-19”.\n.\n👥 Seu estudo é orientado pela professora Dra. Adriana Lúcia Meireles - @dri_meireles (UFOP). O trabalho contou com as contribuições da banca formada pelo professor Dr. Mauro Virgílio Gomes de Barros (UPE) e pelas professoras Dra. Raquel de Deus Mendonça - @raquelmendonca_enut (UFOP) e Dra. Clareci Silva Cardoso (UFSJ).\n.\n📊 Os resultados preliminares demonstram que os sintomas de ansiedade e depressão, bem como o comportamento sedentário (CS), são altamente prevalentes entre os estudantes universitários. Além disso, observou-se que o CS é um comportamento associado à presença de sintomas de ansiedade e depressão e que não praticar atividade física de intensidade moderada e vigorosa aumenta os efeitos negativos do CS. Por fim, os resultados preliminares indicam que estudantes com obesidade apresentam maiores chances de sintomas de ansiedade [OR: 1.43 (IC 95%: 1.24-1.65)] e sintomas de depressão [OR: 1.50 (IC 95%: 1.30-1.73)] quando comparados aos estudantes sem obesidade.\n.\n💡Espera-se que esses achados contribuam para a elaboração de estratégias que reduzam o CS, promovam a prática regular de atividade física e apoiem a necessidade de combater a obesidade, visando melhorar a saúde física e mental dos estudantes universitários.\n.\n🎆 Parabenizamos a Bruna pela sua aprovação na qualificação e pela contribuição para a ciência do país. Desejamos à aluna sucesso nas próximas etapas!"
