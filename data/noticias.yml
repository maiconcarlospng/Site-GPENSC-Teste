    conteudo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a mestranda Verônica Magalhães (@veronica_magalhaes_).\n.\n🧑🏻‍🎓Verônica é nutricionista formada pela Universidade Federal de Ouro Preto (UFOP). Atualmente, é mestranda no Programa de Pós-Graduação em Saúde e Nutrição (PPGSN/UFOP), na linha de pesquisa Saúde e Nutrição em Indivíduos e coletividades. Possui experiência em saúde coletiva, atuando como nutricionista da Atenção Primária à Saúde (APS) em Mariana/MG.\n.\n📚 É pesquisadora do projeto HipertenSUS e sua pesquisa de mestrado visa avaliar qualitativamente a efetividade da intervenção nutricional em usuários hipertensos na APS. É orientada pela professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut) e coorientada pela pós-doutoranda Anabele Pires Santos (@piresanabele).\n.\n🔎 Quer saber mais sobre o tema da Verônica? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo"
