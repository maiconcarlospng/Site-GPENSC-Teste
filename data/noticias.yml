    imagem: "img/instagram-acervo/ClE5EqwPyiB.webp"
  - data: "2022-11-03"
    categoria: "Institucional"
    titulo: "Sintomas de transtorno de ansiedade e de depressão: implicações dos determinantes pré-existentes e dos que foram impactados pela pandemia da covid-19"
    resumo: "O GPENSC relembra qualificação de doutorado da aluna Thaís Sabião (@thasabiao), que ocorreu no dia 08 de setembro de 2022, via Google Meet"
    conteudo: "O GPENSC relembra qualificação de doutorado da aluna Thaís Sabião (@thasabiao), que ocorreu no dia 08 de setembro de 2022, via Google Meet.\n.\n🔎 O projeto de doutorado da Thaís, intitulado: “Sintomas de transtorno de ansiedade e de depressão: implicações dos determinantes pré-existentes e dos que foram impactados pela pandemia da covid-19”, tem como objetivo avaliar a associação da insegurança alimentar (IA), home office e vitamina D nos sintomas de transtorno de ansiedade (TA) e de depressão (TD) durante a pandemia em residentes da região dos Inconfidentes, Minas Gerais.\n.\n👥 Seu estudo é orientado pela professora Dra. Júlia Carraro (@julia_carraro) e coorientado pelo professor Dr. George Machado Coelho (@georgellinsmachado). O trabalho contou com as contribuições da banca formada pelas professoras Dra. Raquel Mendonça - @raquelmendonca_enut (UFOP), Maria Del Carmen - @mdcarmen (UFES), Fernanda Vidigal - @fcvidigal (UNIFAL) e Ana Paula Cândido - @apccandido (UFJF).\n.\n📈 Os resultados preliminares indicam que os sintomas de transtorno de ansiedade estiveram presentes em 23,3% dos indivíduos e de depressão, em 15,6%. Verificou-se uma associação positiva entre a IA e a gravidade dos sintomas de TA e TD durante a pandemia da covid-19, sendo observada maior vulnerabilidade de indivíduos de raça/cor da pele não branca, sem filhos e com menor renda familiar mensal.\n. \n💡 Espera-se que os dados obtidos forneçam subsídios para o aprimoramento e formulação de políticas públicas que assegurem a promoção da qualidade de vida da população e redução dos custos em saúde, no que se refere à saúde mental.\n.\n🌌 Parabenizamos a Thaís pela aprovação na sua qualificação e pela contribuição para a ciência do país. Desejamos à aluna sucesso nas próximas etapas!"
    url: "https://www.instagram.com/p/Ckg2w0Qu_OH/"
    imagem: "img/instagram-acervo/Ckg2w0Qu_OH.webp"
