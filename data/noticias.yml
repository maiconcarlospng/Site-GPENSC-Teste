    titulo: "✨ Momentos GPENSC | Qualificações ✨"
    resumo: "✨ Momentos GPENSC | Qualificações ✨ O GPENSC se orgulha de acompanhar e celebrar cada etapa da trajetória de seus membros! 🎓👏 Parabenizamos Laudicéia Ferreira…"
    conteudo: "✨ Momentos GPENSC | Qualificações ✨\n\nO GPENSC se orgulha de acompanhar e celebrar cada etapa da trajetória de seus membros! 🎓👏\n\nParabenizamos Laudicéia Ferreira Fróis e Deisyane Fumian Bouzada pelas qualificações de seus projetos de doutorado, que contribuem para o avanço do conhecimento em nutrição e saúde coletiva.\n\n👩🏻‍🏫 Laudicéia Ferreira Fróis\nProjeto: Fatores genéticos, comportamentais e ambientais no risco cardiovascular da população da Região dos Inconfidentes - MG\nOrientação: Profª Drª Adriana Lúcia Meireles \nCoorientação: Profª Drª Milene Cristine Pessoa\n\n👩🏻‍🏫 Deisyane Fumian Bouzada\nProjeto: Qualidade de vida e saúde de estudantes universitários: PADu-Multicêntrico\nOrientação: Profª Drª Adriana Lúcia Meireles"
