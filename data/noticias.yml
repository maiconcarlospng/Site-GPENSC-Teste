  - data: "2025-06-03"
    categoria: "Pesquisa"
    titulo: "🔍 Como os comportamentos de movimento se associam ao risco cardiovascular, e qual o papel da qualidade do…"
    resumo: "🔍 Como os comportamentos de movimento se associam ao risco cardiovascular, e qual o papel da qualidade do sono nessa relação? Artigo produzido por Samara…"
    conteudo: "🔍 Como os comportamentos de movimento se associam ao risco cardiovascular, e qual o papel da qualidade do sono nessa relação?\n\nArtigo produzido por Samara Silva de Moura (@mourasamara) e outros pesquisadores do GPENSC investigou a associação entre os comportamentos de movimento e o risco cardiovascular, considerando a mediação pela qualidade do sono. \n\nO estudo envolveu 1.550 indivíduos, sendo 46,3% com idades entre 35 e 59 anos e 50,7% do sexo feminino. A análise multivariada indicou que indivíduos com maior nível de atividade física por hora de comportamento sedentário apresentaram menor probabilidade de risco cardiovascular intermediário a alto, e parte desse efeito foi mediado pela qualidade do sono. Na análise combinada, aqueles com boa qualidade de sono e maior proporção de atividade física também apresentaram menor probabilidade de risco cardiovascular elevado.\n\n🔗 Acesse o artigo completo: \nhttps://bmcpublichealth.biomedcentral.com/articles/10.1186/s12889-024-20829-7\n\n#RiscoCardiovascular #QualidadeDoSono #ComportamentosDeMovimento #Pesquisa #Epidemiologia"
