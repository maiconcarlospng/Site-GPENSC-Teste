  - data: "2026-10-29"
    categoria: "Pesquisa"
    titulo: "Você tem o hábito de observar ou comprar alimentos com os termos caseiro e artesanal?"
    resumo: "Você tem o hábito de observar ou comprar alimentos com os termos caseiro e artesanal? Um estudo conduzido por Thais Falco (@thafalco), em colaboração com…"
    conteudo: "Você tem o hábito de observar ou comprar alimentos com os termos caseiro e artesanal?\n\nUm estudo conduzido por Thais Falco (@thafalco), em colaboração com pesquisadores do GPENSC, teve como objetivo identificar e caracterizar alimentos industrializados comercializados com os termos “caseiro” e/ou “artesanal” nas principais redes de supermercados brasileiras e avaliar sua qualidade nutricional\n\n🔎 O que foi investigado?\nEstudo descritivo baseado em levantamentos online e presenciais de produtos alimentícios disponíveis no varejo brasileiro. Os alimentos foram classificados de acordo com o grau e a finalidade do processamento (classificação NOVA) e avaliados utilizando dois modelos de perfil nutricional: o modelo da Organização Pan-Americana da Saúde e o modelo brasileiro.\n\n📊 Principais achados\nA amostra foi composta por 97 produtos. De acordo com a classificação NOVA, 77% eram alimentos ultraprocessados e 23% eram alimentos processados. Utilizando o modelo internacional de perfil nutricional, 57,36% apresentaram pelo menos um nutriente crítico em excesso; segundo o modelo brasileiro, 48,22% continham altos níveis de sódio, gordura saturada ou açúcar adicionado.\n\n💡 Conclusão\nOs resultados reforçam as evidências sobre a discrepância entre as alegações de marketing e a qualidade nutricional, e demonstram a aplicabilidade de múltiplos modelos de avaliação de nutrientes à análise de rotulagem de alimentos."
    url: "https://www.instagram.com/p/DfF-Py8ldjr/"
    imagem: "img/instagram-acervo/DfF-Py8ldjr.webp"
  - data: "2026-10-21"
    categoria: "Pesquisa"
    titulo: "🍎 ALIMENTAÇÃO E QUALIDADE DE VIDA NA UNIVERSIDADE"
    resumo: "🍎 ALIMENTAÇÃO E QUALIDADE DE VIDA NA UNIVERSIDADE Você sabia que a qualidade da alimentação pode estar associada à qualidade de vida de estudantes universitários?…"
    conteudo: "🍎 ALIMENTAÇÃO E QUALIDADE DE VIDA NA UNIVERSIDADE\n\nVocê sabia que a qualidade da alimentação pode estar associada à qualidade de vida de estudantes universitários?\nUm estudo conduzido por Deisyane Fumian Bouzada (@deisyanebouzada), em colaboração com pesquisadores do GPENSC, investigou a associação entre a qualidade da alimentação, considerando a extensão e a finalidade do processamento dos alimentos segundo a classificação NOVA, e a qualidade de vida de estudantes universitários de diferentes áreas do conhecimento.\n\n🔎 O que foi investigado?\nEstudo transversal, com dados do projeto multicêntrico “Sintomas de transtorno de ansiedade e depressão em universitários de Minas Gerais: prevalência e fatores associados” (PADu-multicêntrico), realizado on-line com estudantes de graduação de oito instituições federais de ensino superior de Minas Gerais. A qualidade de vida foi avaliada pelo World Health Organization Quality of Life – BREF (WHOQOL-bref), considerando os domínios físico, psicológico, relações sociais e meio ambiente. O consumo alimentar foi avaliado por meio de questionário de frequência alimentar.\n\n📊 Principais achados\nA amostra foi composta por 8.650 universitários O estudo identificou que universitários classificados no quarto quartil (Q4), correspondente à pior qualidade da dieta, apresentaram maiores chances de baixa qualidade de vida nos domínios físico (OR=2,49; IC95%: 2,16–2,88), psicológico (OR=2,40; IC95%: 2,08–2,76), meio ambiente (OR=1,95; IC95%: 1,66–2,30) e relações sociais (OR=1,59; IC95%: 1,34–1,89). \n\n💡 Conclusão\nOs achados reforçam a importância da alimentação saudável como um aspecto relevante para a promoção da qualidade de vida de estudantes universitários, destacando a necessidade de estratégias de promoção da saúde no ambiente acadêmico.\n\n#Gpensc #universitários #alimentação #qualidadedevida"
    url: "https://www.instagram.com/p/DexU8q5ln_D/"
    imagem: "img/instagram-acervo/DexU8q5ln_D.webp"
