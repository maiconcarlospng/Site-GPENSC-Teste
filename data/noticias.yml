    titulo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo"
    resumo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo"
    conteudo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo.\n.\n🎓 A Joice (@joicesvleal) é Nutricionista, graduada pela Faculdade Pitágoras (2011), especialista em Obesidade e Emagrecimento pela Universidade Estácio de Sá (2015) e especialista em Alimentação Escolar pela Universidade Cândido Mendes (2019). Tem experiência como Nutricionista na atenção primária à saúde e na alimentação escolar, em âmbito municipal e estadual.\nAtualmente, é mestranda do Programa de Pós-Graduação em Saúde e Nutrição da Universidade Federal de Ouro Preto, na linha de pesquisa saúde e nutrição em indivíduos e coletividades.\n.\n📌 Sua pesquisa de mestrado intitulada \"Carga de Doenças Crônicas Atribuível ao Consumo Elevado de Bebidas Açucaradas e o Impacto Financeiro ao Sistema Único de Saúde\" é  orientada pela profa. Dra. Mariana Carvalho de Menezes (@maricarvalhomenezes).\n.\n 🔍 A pesquisa da Joice faz parte do projeto \"Impactos financeiros e à saúde devidos à alimentação inadequada e ao excesso de peso no Brasil e Unidades Federativas.\"\n.\n🗣️ Continue nos acompanhando e fique por dentro deste e de outros trabalhos desenvolvidos pelo nosso grupo!"
