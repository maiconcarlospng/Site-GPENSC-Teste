  - data: "2021-10-05"
    categoria: "Ensino"
    titulo: "Entre os dias 18 e 19 de novembro de 2021, acontecerão os cursos pré-congresso do 11° Congresso Brasileiro de Epidemiologia (EPI2021), realizado pela Abrasco, em formato virtual"
    resumo: "Entre os dias 18 e 19 de novembro de 2021, acontecerão os cursos pré-congresso do 11° Congresso Brasileiro de Epidemiologia (EPI2021), realizado pela Abrasco (@abra.sco), em formato virtual"
    conteudo: "Entre os dias 18 e 19 de novembro de 2021, acontecerão os cursos pré-congresso do 11° Congresso Brasileiro de Epidemiologia (EPI2021), realizado pela Abrasco (@abra.sco), em formato virtual. Nós, do GPENSC, participaremos de dois cursos pré-congresso. \n.\n1️⃣ Bases conceituais e metodológicas do ambiente alimentar no Brasil e na América Latina\nEsse curso contará com a participação da professora Dra. Mariana Carvalho de Menezes (UFOP), pesquisadora do GPENSC. Destacamos que esse curso é uma parceria com o GEPPAAS (@geppaasufmg) e PENSAP (@grupopensap).\n.\n2️⃣ Introdução ao estudo de Carga Global de Doenças\nEsse curso contará com a participação da professora Dra. Ísis Eloah Machado - @isiseloah (UFOP), pesquisadora do GPENSC. Já esse curso, será realizado juntamente com pesquisadores da Rede GBD Brasil, IHME, UFMG, FCM-MG, UFSJ, UNB e Vital Strategies.\n. \n👉 Arraste para o lado e confira mais informações sobre os cursos.\n.\n🌐 As inscrições podem ser realizadas no site do evento (epi.org.br), na opção “Cursos”, ou no link na nossa bio.\n.\n⚠️ A participação nos cursos é condicionada à inscrição no congresso.\n.\nEsperamos vocês! 😉"
