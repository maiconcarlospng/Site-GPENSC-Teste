  - data: "2024-07-11"
    categoria: "Pesquisa"
    titulo: "Artigo: Co-occurrence of obesogenic behaviors and their implications for mental health during the COVID-19 pandemic: a study with university students"
    resumo: "O GPENSC apresenta o artigo intitulado “Co-occurrence of obesogenic behaviors and their implications for mental health during the COVID-19 pandemic: a study with university students”, de autoria da doutoranda Bruna Carolina Rafael Barbosa (@brunabcrb ) juntamente com outros pesquisadores do GPENSC e da UFMG"
    conteudo: "O GPENSC apresenta o artigo intitulado “Co-occurrence of obesogenic behaviors and their implications for mental health during the COVID-19 pandemic: a study with university students”, de autoria da doutoranda Bruna Carolina Rafael Barbosa (@brunabcrb ) juntamente com outros pesquisadores do GPENSC e da UFMG.\n.\n🎯 O artigo teve como objetivo estimar a prevalência de sintomas de ansiedade e depressão e avaliar a associação entre a ocorrência combinada de comportamentos obesogênicos entre estudantes universitários.\n.\n📝 Trata-se de um estudo transversal realizado com 1.353 estudantes de uma universidade pública no Brasil, entre julho a agosto de 2020, utilizando um questionário online. As variáveis de desfecho (sintomas de ansiedade e depressão) foram avaliadas por meio da escala DASS-21. A coocorrência de comportamentos obesogênicos foi mensurada com base no consumo irregular de frutas e vegetais, consumo frequente de alimentos ultraprocessados, inatividade física no lazer e comportamento sedentário.\n.\n📊 Os resultados do estudo mostraram que 46,1% dos participantes apresentavam sintomas de ansiedade e 54,6% sintomas de depressão. A combinação mais prevalente de comportamentos obesogênicos foi consumo frequente de alimentos ultraprocessados, inatividade física no lazer e comportamento sedentário (17,2%). Quanto maior o número de comportamentos obesogênicos simultâneos, maior a chance de apresentar sintomas de ansiedade [OR: 2,81 (IC95%: 1,77–4,46)] e depressão [OR: 3,46 (IC95%: 2,20–5,43)].\n.\n💡Os achados reforçam a necessidade de ações de promoção da saúde mental no ambiente universitário em conjunto com programas de promoção de estilo de vida saudável e melhoria do bem-estar físico e mental dos alunos.\n.\n🔗 Acesse o artigo: https://doi.org/10.1186/s12889-024-19031-6"
