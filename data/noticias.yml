  - data: "2021-07-09"
    categoria: "Pesquisa"
    titulo: "Na semana passada, apresentamos para vocês a pesquisa da mestranda Tainá Damasceno"
    resumo: "Na semana passada, apresentamos para vocês a pesquisa da mestranda Tainá Damasceno (@tainacdamasceno)"
    conteudo: "Na semana passada, apresentamos para vocês a pesquisa da mestranda Tainá Damasceno (@tainacdamasceno). Mas por que realizar intervenção nutricional por meio de entrevista motivacional (EM)?\n.\n👥 EM é um estilo de aconselhamento centrado no paciente que utiliza técnicas específicas, como a escuta ativa, o apoio à autonomia, a tomada de decisões partilhada e o estímulo à mudança.\n.\n📄 O BMI2 (Brief Motivational Interviewing to reduce Body Mass Index) foi um ensaio de intervenção em 3 grupos, aleatorizado em cluster, com práticas clínicas que serviram como unidade de aleatorização e análise, são eles:\n• O Grupo 1 teve o índice de massa corporal (IMC) medido na linha de base e no seguimento de 1 e 2 anos e teve cuidados de rotina fornecidos pelo prestador de serviço pediátrico (PSP), bem como materiais educativos padrão para os pais;\n• O Grupo 2 realizou 4 sessões de aconselhamento e EM durante os 2 anos, incluindo os mesmos pontos de avaliação do Grupo 1. \n• O Grupo 3 incluiu as mesmas componentes de intervenção do Grupo 2, mas acrescentou o aconselhamento com base em EM de um nutricionista registrado ao longo de 2 anos com os pais das crianças. \n.\n📉 Os resultados demonstraram uma redução do percentil do IMC das crianças que foram acompanhadas por dois anos e com maior frequência em relação às crianças que não receberam o acompanhamento, apenas receberam orientações dietéticas.\n.\n💡 O estudo da Tainá é importante porque a EM é trabalhada atualmente enquanto uma abordagem que, através de testes e adaptações com rigor científico, visa resolver/trabalhar a ambivalência do indivíduo e agregar uma visão humanista e construtivista nas modificações de comportamentos humano. Diante disso, a aplicação da EM em outras áreas vem sendo amplamente estudada.\n. \n👉 Arraste para o lado e confira o resumo do artigo apresentado."
    url: "https://www.instagram.com/p/CRHoLY3gTU1/"
    imagem: "img/instagram-acervo/CRHoLY3gTU1.webp"
  - data: "2021-07-02"
    categoria: "Pesquisa"
    titulo: "Equipe do GPENSC: mestranda Tainá Cristina Damasceno Silva"
    resumo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a mestranda Tainá Cristina Damasceno Silva (@tainacdamasceno)"
    conteudo: "O GPENSC apresenta mais uma pesquisadora do nosso grupo, a mestranda Tainá Cristina Damasceno Silva (@tainacdamasceno).\n.\n👩🏻‍🎓 Tainá é graduada em Nutrição pela Universidade Federal de Ouro Preto (UFOP). Atualmente, é pós-graduanda em Educação Alimentar e Nutricional pela Faculdade Arnaldo e mestranda pelo Programa de Pós-Graduação em Saúde e Nutrição da UFOP (PPGSN/UFOP), na linha de pesquisa Saúde e Nutrição em Indivíduos e Coletividades.\n.\n📚 É pesquisadora do projeto \"HipertenSUS\" e seu trabalho de mestrado é intitulado \"Intervenção nutricional para controle da Hipertensão Arterial Sistêmica na Atenção Primária à Saúde de Ouro Preto: entrevista motivacional e Guia Alimentar versus dietoterapia\", sob orientação da professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut).\n.\n🔎 Quer saber mais sobre o projeto da Tainá e de outros trabalhos desenvolvidos pelo nosso grupo? Continue nos acompanhando."
