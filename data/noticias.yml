    resumo: "Momentos GPENSC | Qualificações - Mestrado ✨🎓 O caminho da pesquisa é feito de dedicação, trocas e muitos aprendizados. Nosso grupo celebra com alegria a…"
    conteudo: "Momentos GPENSC | Qualificações - Mestrado ✨🎓\n\nO caminho da pesquisa é feito de dedicação, trocas e muitos aprendizados. Nosso grupo celebra com alegria a etapa de qualificação das mestrandas do GPENSC! 🧡\n\nParabenizamos:\n\nGabriela da Silva Machado\nTítulo: Intervenção Pautada na Entrevista Motivacional versus Dietoterapia: Mudança no Consumo de Alimentos in natura e no Risco Cardiovascular em Pessoas com Hipertensão\nOrientadora: Profª Drª Júlia Cristina Cardoso Carraro\n\nGabrielle Araújo Santos\nTítulo: Associação entre qualidade do sono e consumo de “comfort foods” durante períodos de estresse prolongado\nOrientador: Prof. Dr. Luiz Antônio Alves de Menezes Júnior\n\nMaria Luiza das Dores Rocha\nTítulo: Polimorfismo do gene BDNF, consumo de alimentos ultraprocessados e sua interação com o risco cardiovascular em adultos graduados (Estudo CUME)\nOrientadora: Profª Drª Júlia Cristina Cardoso Carraro\n\nPaloma Letícia Gonçalves\nTítulo: Mudanças e consistência no consumo alimentar: coorte CUME\nOrientadora: Profª Drª Raquel de Deus Mendonça\n\nEdna da Silva\nTítulo: Consumo de bebidas adoçadas e sua associação com a qualidade do sono: Estudo COVID-Inconfidentes\nOrientadora: Profª Drª Adriana Lúcia Meireles\n\nLaís Fernanda Costa Oliveira\nTítulo: Acúmulo de resíduos sólidos provenientes das embalagens de alimentos ultraprocessados: análise do consumo alimentar da Coorte CUME\nOrientadora: Profª Drª Raquel de Deus Mendonça\n\nChrislaine Corraide Dias dos Santos\nTítulo: Efetividade da entrevista motivacional e da dietoterapia no consumo de alimentos ultraprocessados em indivíduos com diagnóstico de hipertensão\nOrientadora: Profª Drª Raquel de Deus Mendonça\n\nQue essa etapa seja apenas o início de muitas contribuições para a ciência e para a saúde coletiva! 🚀📚\n\n#GPENSC #Mestrado #Qualificação #Pesquisa #Nutrição #SaúdeColetiva #PPGSN #UFOP #MomentoGPENSC"
