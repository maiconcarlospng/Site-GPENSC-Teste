    titulo: "Equipe do GPENSC: doutoranda Amanda Leão Cardoso"
    resumo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a doutoranda Amanda Leão Cardoso (@amanda__leao98)"
    conteudo: "O GPENSC apresenta mais uma de nossas pesquisadoras, a doutoranda Amanda Leão Cardoso (@amanda__leao98).\n.\n👩🏻‍🎓 Amanda é Cientista de Alimentos formada pela Universidade Federal de Ouro Preto (UFOP) e Mestre em Ecologia de Biomas Tropicais pela mesma instituição. Atualmente, é doutoranda no Programa de Pós-Graduação em Saúde e Nutrição da UFOP (PPGSN/UFOP) na linha de pesquisa Saúde e Nutrição em Indivíduos e coletividades, sob orientação da professora Dra. Raquel de Deus Mendonça (@raquelmendonca_enut). Sua jornada acadêmica tem sido marcada pela atuação na análise dos impactos sanitários resultantes de processos de desenvolvimento que promovem injustiças ambientais, sociais e econômicas, com foco em populações rurais vulnerabilizadas pelos modelos do agronegócio e da mineração.\n.\n📚 É membro do Núcleo de Pesquisa e Extensão em Desenvolvimento Econômico e Social (NUPEDES/UFOP) e do Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva (GPENSC/UFOP). Além disso, também é membro do projeto Mulheres na Ecologia, por meio do qual desenvolve atividades que buscam promover uma mudança na cultura científica do país, dando visibilidade para as mulheres e estabelecendo uma conexão entre ciência, universidade e sociedade.\n.\n🔎 Quer saber mais sobre o tema da Amanda? Continue nos acompanhando e fique por dentro deste e de outros projetos desenvolvidos pelo nosso grupo!"
