    resumo: "O GPENSC recomenda o livro “O peso das dietas”, escrito pela Ph.D Sophie Deram, nutricionista, doutora pelo departamento de Endocrinologia da Faculdade de Medicina da Universidade de São Paulo (FMUSP)"
    conteudo: "O GPENSC recomenda o livro “O peso das dietas”, escrito pela Ph.D Sophie Deram, nutricionista, doutora pelo departamento de Endocrinologia da Faculdade de Medicina da Universidade de São Paulo (FMUSP). \n.\n🎯 O livro tem como objetivo discutir mitos e crenças sobre a alimentação, reunindo evidências da área nutriogenômica e neurociências. \n.\n😋 O livro também conta com receitas simples, a fim de contribuir com uma vida mais saudável e sem restrição.\n.\n💡Você já conhecia a nossa indicação? Tem mais sugestões? Responda nos comentários!\n.\n🗣 Não deixe de conferir e compartilhar com os amigos."
