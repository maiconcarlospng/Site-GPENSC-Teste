    conteudo: "Doutorado sanduíche | GPENSC pelo mundo ✈️🌍🇨🇱\n\nEm setembro, a pesquisadora do GPENSC e doutoranda do PPGSN/UFOP (@ppgsn.ufop), Francine Rubim de Resende iniciou seu doutorado sanduíche no  Centro de Investigación en Ambientes Alimentarios y Prevención de Enfermedades Crónicas Asociadas a la Nutrición (CIAPEC), localizado no Instituto de Nutreición y Tecnología de los alimentos (INTA) da Universidade de Chile, com bolsa da CAPES.\n\nDurante seu sanduíche, Francine irá desenvolver a pesquisa a cerca de alegações nutricionais e técnicas de marketing utilizados em rótulos de alimentos, uma análise que avalia os períodos anterior e posterior a implementação da lei de rotulagem nutricional frontal de alimentos no Chile, sob a supervisão da Dra. Camila Corvalán (Universidad de Chile) e das Profas. Dra. Camila Carvalho Meneses (UFOP) e Dra. Júlia Cristina Cardoso Carraro (UFOP).\n\nContinue nos acompanhando para saber mais sobre a pesquisa da Francine! 🧡\n\n#doutorado #doutoradosanduiche #universidaddechile #cienciabrasileira"
