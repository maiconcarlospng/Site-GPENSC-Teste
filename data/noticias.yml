    conteudo: "Prêmio CAPES de Tese | Thaís Sabião ✨\n\nA pesquisadora Thaís, doutoranda egressa do PPGSN/UFOP (@ppgsn.ufop), orientada pela professora Júlia Carraro (@julia_carraro) e coorientada pelo George Machado-Coelho, foi vencedora do Prêmio CAPES de Tese 2025.\n\nPara Thaís, o prêmio marca sua trajetória acadêmica: mais do que uma realização pessoal, reflete o trabalho coletivo e reafirma a relevância de sua pesquisa para a sociedade.\n\nSua tese mostrou como fatores sociais e biológicos, como insegurança alimentar e o metabolismo da vitamina D, podem influenciar sintomas de ansiedade e depressão. Os resultados contribuem para compreender a complexidade da saúde mental e orientam políticas públicas, estratégias de prevenção e cuidado inclusivo.\n\nThaís destaca que essa conquista a motiva a continuar pesquisando, transformando conhecimento em ações concretas pela saúde mental.\n\nParabéns à Thaís, à professora Júlia e ao professor George por essa conquista que enche o GPENSC de orgulho!\n\n#capes #premiocapes #prêmiocapesdetese #cienciabrasileira #gpensc #ufop"
