  - data: "2023-05-11"
    categoria: "Pesquisa"
    titulo: "Livro: Avaliação das políticas de alimentação e nutrição: contribuições teóricas e práticas"
    resumo: "O GPENSC recomenda o livro \"Avaliação das políticas de alimentação e nutrição: contribuições teóricas e práticas\", lançado em 2023"
    conteudo: "O GPENSC recomenda o livro \"Avaliação das políticas de alimentação e nutrição: contribuições teóricas e práticas\", lançado em 2023.\n.\n🍽️ Assegurar à população os direitos constitucionais de alimentação e nutrição é ainda um grande desafio no Brasil, onde coexistem diversos problemas nutricionais que foram agravados durante a pandemia da covid-19.\n.\n💡O livro está elaborado em duas partes e é composto por aspectos teóricos e práticos. A primeira seção, denominada “Fundamentos teóricos e metodológicos para a avaliação das políticas de alimentação e nutrição em saúde”, traz as bases teóricas e conceituais da avaliação. Já a segunda, “Produção de Conhecimento e Experiências Práticas de Avaliação no Campo da Alimentação e Nutrição em Saúde”, trata-se de experiências avaliativas inovadoras, como as abordagens colaborativas e participativas, cujos usos são ainda pouco comuns para o campo da alimentação e nutrição.\n.\n📚 A leitura é interessante para todos os envolvidos no ciclo de políticas públicas em qualquer de suas etapas ― gestores, profissionais da saúde, acadêmicos, pesquisadores, especialistas ― e reforça a importância da formação de redes colaborativas para se atingirem melhorias na qualidade de vida da população.\n.\n🔎 Para conferir mais sobre o livro acesse o link: https://portal.fiocruz.br/livro/avaliacao-das-politicas-de-alimentacao-e-nutricao-contribuicoes-teoricas-e-praticas\n.\n🗣️ Gostou da dica? Compartilha com os amigos e aproveitar para salvar essa recomendação."
