  - data: "2022-06-07"
    categoria: "Pesquisa"
    titulo: "Artigo: Ultra-processed and fresh food consumption and symptoms of anxiety and depression during the COVID-19 pandemic: COVID Inconfidentes"
    resumo: "O GPENSC apresenta o artigo intitulado “Ultra-processed and fresh food consumption and symptoms of anxiety and depression during the COVID-19 pandemic: COVID Inconfidentes”, de autoria da doutoranda Hillary Coletro (@hillarycoletro), juntamente com outras integrantes do GPENSC e pesquisador da UFOP"
    conteudo: "O GPENSC apresenta o artigo intitulado “Ultra-processed and fresh food consumption and symptoms of anxiety and depression during the COVID-19 pandemic: COVID Inconfidentes”, de autoria da doutoranda Hillary Coletro (@hillarycoletro), juntamente com outras integrantes do GPENSC e pesquisador da UFOP. \n.\n🎯 O objetivo do estudo, que é um dos produtos da tese de doutorado da Hillary, teve como objetivo avaliar a associação entre a prevalência de sintomas de ansiedade e depressão e o consumo de alimentos, de acordo com o grau de processamento, durante a pandemia da covid-19.\n.\n📝 Para avaliar os sintomas de ansiedade e depressão, foram utilizadas duas escalas validadas para população brasileira: GAD-7 (avalia sintomas de ansiedade) e PHQ-9 (avalia a presença de sintomas de depressão). A variável de exposição, consumo alimentar, foi medida a partir de um Questionário de Frequência Alimentar qualitativo. Os alimentos foram categorizados conforme a classificação NOVA.\n.\n📊 Observou-se que o consumo de alimentos in natura/minimamente processados acima da frequência média semanal foi associada a uma menor prevalência de sintomas de depressão [RP: 0,5 (IC 95%: 0,3; 0,7)]. Em contrapartida, o consumo acima da média semanal de alimentos ultraprocessados foi associado a uma maior prevalência de sintomas de ansiedade [RP: 1,5 (IC95%: 1,03; 2,3)] e sintomas de depressão [RP: 1,5 (IC95%:1,0; 2,1) valor de p: 0,034].\n.\n💡 O estudo evidencia que o aumento do consumo de alimentos ultraprocessados está associado a uma maior ocorrência de sintomas de ansiedade e depressão. Dessa forma, recomenda-se um aumento do consumo de alimentos in natura/minimamente processados, conforme estabelecido pelo guia alimentar para a população brasileira. \n.\n🔗 Acesse o artigo pelo DOI: https://doi.org/10.1016/j.clnesp.2021.12.013"
    url: "https://www.instagram.com/p/CehMgEpOlV7/"
    imagem: "img/instagram-acervo/CehMgEpOlV7.webp"
  - data: "2022-05-24"
    categoria: "Pesquisa"
    titulo: "Associação dos sintomas de transtorno de ansiedade com a mudança dos escores de alimentação e do peso corporal em universitários durante a pandemia da covid-19 (Projeto PADu-COVID)"
    resumo: "O GPENSC apresenta um #infográfico sobre o tema de dissertação da Ana Cláudia Morito (@anaclaudiamorito)"
    conteudo: "O GPENSC apresenta um #infográfico sobre o tema de dissertação da Ana Cláudia Morito (@anaclaudiamorito). \n.\n👩🏻‍💻 O trabalho, intitulado “Associação dos sintomas de transtorno de ansiedade com a mudança dos escores de alimentação e do peso corporal em universitários durante a pandemia da covid-19 (Projeto PADu-COVID)”, contou com a orientação da professora Dra. Júlia Cristina Cardoso Carraro (@julia_carraro) e coorientação da professora Dra. Adriana Lúcia Meireles (@dri_meireles). \n.\n🧠 A ansiedade se caracteriza como um transtorno mental, que vem se apresentando de forma crescente na população, em especial entre os universitários, podendo afetar os hábitos alimentares e alterar o peso corporal. Durante momentos de crise, como a pandemia da covid-19, esse transtorno pode ocorrer de forma mais prevalente, devido às mudanças ocorridas de forma repentina na rotina dos indivíduos.\n.\n🎯 O objetivo do estudo foi avaliar a associação dos sintomas de transtorno de ansiedade com a mudança dos escores de alimentação e do peso corporal em universitários durante a pandemia da covid-19. \n.\n🔎 Foi realizado um estudo de acompanhamento longitudinal de 628 estudantes da UFOP. Os participantes responderam um questionário on-line, em dois momentos (T0 e T3). A variável de exposição, sintomas de transtornos de ansiedade, foi obtida por meio da escala DASS-21 (Depression, Anxiety and Stress Scale - 21). Os participantes autorrelataram o peso corporal e consumo alimentar no T0 e T3. Foram usados equivalentes semanais para calcular o escore total da ingestão alimentar de cada momento, para cada grupo de alimento, sendo que uma maior pontuação indicava melhor qualidade dos escores alimentares. \n.\n📈 Os resultados mostraram um aumento nos escores de ansiedade e no peso dos universitários quando analisou a diferença entre o T0 e T3. Não foi encontrada associação dos sintomas de transtorno de ansiedade com a mudança dos escores de alimentação e peso corporal dos universitários.\n.\n👉🏽 Arraste para o lado e confira!\n.\n🗣 Continue nos acompanhando para saber mais sobre os trabalhos desenvolvidos pelo nosso grupo!"
    url: "https://www.instagram.com/p/Cd9P8HBOwoj/"
    imagem: "img/instagram-acervo/Cd9P8HBOwoj.webp"
