<!-- MOTOR DE TRADUÇÃO AUTOMÁTICA E BANDEIRAS OTIMIZADAS PARA MOBILE -->
<div id="google_translate_element" style="position: absolute; opacity: 0; width: 1px; height: 1px; overflow: hidden; pointer-events: none;"></div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'pt',
      includedLanguages: 'pt,en,es',
      autoDisplay: false
    }, 'google_translate_element');
  }

  function aplicarIdiomaVisual(langCode) {
    var idioma = (langCode || 'pt').toLowerCase().split('-')[0];
    document.documentElement.lang = idioma === 'en' ? 'en' : idioma === 'es' ? 'es' : 'pt-BR';
    document.documentElement.setAttribute('data-gp-current-language', ['pt','en','es'].includes(idioma) ? idioma : 'pt');
    document.querySelectorAll('.gp-language-button').forEach(function(botao) {
      var ativo = botao.getAttribute('data-lang') === idioma;
      botao.setAttribute('aria-pressed', String(ativo));
      botao.classList.toggle('is-active', ativo);
    });
    if (idioma === 'es') {
      document.documentElement.setAttribute('data-gp-language', 'es');
    } else {
      document.documentElement.removeAttribute('data-gp-language');
    }
  }

  function recuperarIdiomaSalvo() {
    var correspondencia = document.cookie.match(/(?:^|;\s*)googtrans=([^;]+)/);
    if (!correspondencia) {
      aplicarIdiomaVisual('pt');
      return;
    }

    try {
      var partes = decodeURIComponent(correspondencia[1]).split('/').filter(Boolean);
      aplicarIdiomaVisual(partes.length ? partes[partes.length - 1] : 'pt');
    } catch (erro) {
      aplicarIdiomaVisual('pt');
    }
  }

  function traduzirPagina(langCode) {
    aplicarIdiomaVisual(langCode);
    var langPair = '/pt/' + langCode;
    document.cookie = 'googtrans=' + langPair + '; path=/;';
    if (window.location.hostname.includes('.')) document.cookie = 'googtrans=' + langPair + '; path=/; domain=' + window.location.hostname;

    var select = document.querySelector('.goog-te-combo');
    if (select) {
      select.value = langCode;
      select.dispatchEvent(new Event('change'));
    } else if (langCode === 'pt') {
      window.location.reload();
    } else {
      // Abre a tradução da página quando o widget não está disponível.
      window.location.assign('https://translate.google.com/translate?sl=pt&tl=' + encodeURIComponent(langCode) + '&u=' + encodeURIComponent(window.location.href));
    }
  }

  // Injeção com eventos otimizados para touch no celular
  document.addEventListener("DOMContentLoaded", function() {
    recuperarIdiomaSalvo();

    var navbarTitle = document.querySelector(".navbar-brand .navbar-title") || document.querySelector(".navbar-brand");
    
    if (navbarTitle && !document.querySelector(".bandeiras-container")) {
      var container = document.createElement("div");
      container.className = "bandeiras-container notranslate";
      container.setAttribute("translate", "no");
      container.setAttribute("role", "group");
      container.setAttribute("aria-label", "Idioma do site");
      container.innerHTML = `
        <button type="button" class="gp-language-button" data-lang="pt" onclick="traduzirPagina('pt')" aria-label="Português — tradução automática" title="Português — tradução automática"><span lang="pt">PT</span></button>
        <button type="button" class="gp-language-button" data-lang="en" onclick="traduzirPagina('en')" aria-label="English — tradução automática" title="English — tradução automática"><span lang="en">EN</span></button>
        <button type="button" class="gp-language-button" data-lang="es" onclick="traduzirPagina('es')" aria-label="Español — tradução automática" title="Español — tradução automática"><span lang="es">ES</span></button>
      `;
      navbarTitle.after(container);
      aplicarIdiomaVisual((document.documentElement.getAttribute("data-gp-current-language") || "pt"));
    }

    // Mobile: idiomas na primeira linha. Tablet: dentro do menu.
    // Desktop amplo: idiomas ao lado da busca, fora da lista de navegação.
    function ajustarOrdemNavbarMobile() {
      var navContainer = document.querySelector(".navbar .navbar-container");
      var navList = document.querySelector(".navbar .navbar-nav");
      var search = navContainer && navContainer.querySelector("#quarto-search");
      var flags = document.querySelector(".bandeiras-container");
      if (!navContainer || !flags) return;

      var desktopItem = document.querySelector(".gp-nav-idiomas-item");
      var desktopWrapper = document.querySelector(".gp-nav-idiomas-desktop");

      if (window.matchMedia("(max-width: 1099px)").matches) {
        if (desktopItem) desktopItem.remove();
        if (flags.parentElement !== navContainer) navContainer.appendChild(flags);
        if (desktopWrapper) desktopWrapper.remove();
      } else if (window.matchMedia("(min-width: 1100px)").matches) {
        if (desktopItem) desktopItem.remove();
        if (!desktopWrapper) {
          desktopWrapper = document.createElement("div");
          desktopWrapper.className = "gp-nav-idiomas-desktop";
        }
        if (flags.parentElement !== desktopWrapper) desktopWrapper.appendChild(flags);
        if (desktopWrapper.parentElement !== navContainer ||
            (search && desktopWrapper.nextElementSibling !== search)) {
          navContainer.insertBefore(desktopWrapper, search || null);
        }

        // A ordem visual é definida no próprio elemento para prevalecer
        // sobre regras antigas do Bootstrap/Quarto em páginas internas.
        var brand = navContainer.querySelector(".navbar-brand-container");
        var collapse = navContainer.querySelector(".navbar-collapse");
        var tools = navContainer.querySelector(".quarto-navbar-tools");
        desktopWrapper.style.setProperty("order", "998", "important");
        desktopWrapper.style.setProperty("display", "flex", "important");
        desktopWrapper.style.setProperty("flex", "0 0 auto", "important");
        desktopWrapper.style.setProperty("align-items", "center", "important");
        if (brand) brand.style.setProperty("order", "2", "important");
        if (collapse) collapse.style.setProperty("order", "20", "important");
        if (tools) tools.style.setProperty("order", "900", "important");
        if (search) {
          search.style.setProperty("order", "999", "important");
          search.style.setProperty("margin-left", ".15rem", "important");
        }
      } else {
        if (!navList) return;
        if (!desktopItem) {
          desktopItem = document.createElement("li");
          desktopItem.className = "nav-item gp-nav-idiomas-item";
          navList.appendChild(desktopItem);
        }
        if (flags.parentElement !== desktopItem) desktopItem.appendChild(flags);
        if (desktopWrapper) desktopWrapper.remove();
      }
    }

    ajustarOrdemNavbarMobile();
    window.addEventListener("resize", ajustarOrdemNavbarMobile, { passive: true });

    // O campo Algolia/Quarto é criado sob demanda ao abrir a busca.
    // O observador garante placeholder e rótulo também no modal flutuante.
    var scrollAntesDaBusca = 0;
    var buscaEstavaAberta = false;

    function prepararCampoBusca() {
      var buscaAberta = document.body.classList.contains("aa-Detached");

      if (buscaAberta && !buscaEstavaAberta) {
        scrollAntesDaBusca = window.scrollY || window.pageYOffset || 0;
      }

      document.querySelectorAll(".aa-Input").forEach(function(campo) {
        if (!campo.getAttribute("placeholder")) {
          campo.setAttribute("placeholder", "Buscar no site...");
        }
        campo.setAttribute("aria-label", "Buscar no site do GPENSC");
        // iOS amplia a página automaticamente quando o campo tem fonte menor que 16px.
        campo.style.setProperty("font-size", "16px", "important");
        campo.style.setProperty("-webkit-text-size-adjust", "100%", "important");
        campo.style.setProperty("transform", "none", "important");
      });

      if (!buscaAberta && buscaEstavaAberta) {
        var campoAtivo = document.activeElement;
        if (campoAtivo && campoAtivo.matches && campoAtivo.matches(".aa-Input")) {
          campoAtivo.blur();
        }
        window.requestAnimationFrame(function() {
          window.scrollTo({ top: scrollAntesDaBusca, left: 0, behavior: "auto" });
        });
      }
      buscaEstavaAberta = buscaAberta;
    }

    prepararCampoBusca();
    var observadorBusca = new MutationObserver(prepararCampoBusca);
    observadorBusca.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class"] });  });
</script>

<!-- GPENSC: botão universal de acessibilidade. Sem dependências externas. -->
<div id="gp-access" class="notranslate" translate="no">
  <button id="gp-access-trigger" type="button" aria-label="Abrir opções de acessibilidade" aria-controls="gp-access-panel" aria-expanded="false" title="Acessibilidade">
    <svg viewBox="0 0 48 48" width="28" height="28" aria-hidden="true" focusable="false" fill="none">
      <circle cx="24" cy="8.5" r="4.5" fill="currentColor"/>
      <path d="M8 19.5C13.5 21.2 19.1 22 24 22s10.5-.8 16-2.5M24 22v9m0 0L13.5 42M24 31 34.5 42" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <section id="gp-access-panel" role="region" aria-label="Opções de acessibilidade" hidden>
    <div class="gp-access-head"><strong>Acessibilidade</strong><button type="button" id="gp-access-close" aria-label="Fechar opções de acessibilidade">×</button></div>
    <div class="gp-access-actions">
      <button type="button" data-gp-access="increase">Aumentar texto <span aria-hidden="true">A+</span></button>
      <button type="button" data-gp-access="decrease">Diminuir texto <span aria-hidden="true">A−</span></button>
      <button type="button" data-gp-access="contrast" aria-pressed="false">Alto contraste</button>
      <button type="button" data-gp-access="motion" aria-pressed="false">Reduzir animações</button>
      <button type="button" data-gp-access="reset">Restaurar padrão</button>
    </div>
  </section>
</div>
<style>
#gp-access{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:1090;font-family:inherit}
#gp-access-trigger{display:grid;place-items:center;width:48px;height:48px;padding:0;border:2px solid #fff;border-radius:50%;background:#1f4d2b;color:#fff;box-shadow:0 3px 12px #173a2360;cursor:pointer;transition:transform .18s ease}
#gp-access-trigger:hover{transform:translateY(-2px)}
#gp-access :is(button):focus-visible{outline:3px solid #d9731f;outline-offset:3px}
#gp-access-panel{position:absolute;left:0;bottom:calc(100% + 12px);width:min(310px,calc(100vw - 28px));max-height:min(420px,calc(100dvh - 95px));overflow-y:auto;padding:16px;background:#fff;color:#203d2a;border:1px solid #cbd9cd;border-radius:14px;box-shadow:0 8px 30px #16371e33}
#gp-access-panel[hidden]{display:none!important}
.gp-access-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
#gp-access-close{border:0;background:transparent;color:inherit;font-size:26px;line-height:1;cursor:pointer}
.gp-access-actions{display:grid;gap:8px}
.gp-access-actions button{display:flex;justify-content:space-between;align-items:center;min-height:42px;padding:9px 12px;border:1px solid #d5e1d5;border-radius:8px;background:#f7faf6;color:#1f4d2b;text-align:left;cursor:pointer;font-size:14px}
.gp-access-actions button[aria-pressed="true"]{background:#1f4d2b;color:white}
html.gp-access-contrast body{background:#fff!important;color:#111!important}
html.gp-access-contrast #quarto-content main.content :is(p,li,h1,h2,h3,h4,h5,h6){color:#111!important}
html.gp-access-contrast #quarto-content main.content a{color:#0753a2!important;text-decoration:underline!important}
html.gp-access-motion *,html.gp-access-motion *::before,html.gp-access-motion *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
@media(prefers-reduced-motion:reduce){#gp-access-trigger{transition:none}}
</style>
<script>
(function(){
  'use strict';
  var root=document.documentElement;
  var saved={size:0,contrast:false,motion:false};
  try{var parsed=JSON.parse(localStorage.getItem('gp-access-preferences')||'{}');saved.size=Math.max(0,Math.min(3,Number(parsed.size)||0));saved.contrast=parsed.contrast===true;saved.motion=parsed.motion===true;}catch(e){}
  function apply(){
    root.classList.toggle('gp-access-contrast',saved.contrast);
    root.classList.toggle('gp-access-motion',saved.motion);
    root.style.setProperty('--gp-access-text-scale',String(1+saved.size*.12));
    document.querySelectorAll('#quarto-content main.content p,#quarto-content main.content li,#quarto-content main.content td').forEach(function(el){
      if(!el.dataset.gpAccessBaseSize){el.dataset.gpAccessBaseSize=getComputedStyle(el).fontSize;}
      el.style.fontSize='calc('+el.dataset.gpAccessBaseSize+' * var(--gp-access-text-scale))';
    });
    var contrast=document.querySelector('[data-gp-access="contrast"]');
    var motion=document.querySelector('[data-gp-access="motion"]');
    if(contrast)contrast.setAttribute('aria-pressed',String(saved.contrast));
    if(motion)motion.setAttribute('aria-pressed',String(saved.motion));
    try{localStorage.setItem('gp-access-preferences',JSON.stringify(saved));}catch(e){}
  }
  document.addEventListener('DOMContentLoaded',function(){
    var trigger=document.getElementById('gp-access-trigger'),panel=document.getElementById('gp-access-panel');
    if(!trigger||!panel)return;
    function toggle(open){panel.hidden=!open;trigger.setAttribute('aria-expanded',String(open));if(open)document.getElementById('gp-access-close').focus();else trigger.focus();}
    trigger.addEventListener('click',function(){toggle(panel.hidden);});
    document.getElementById('gp-access-close').addEventListener('click',function(){toggle(false);});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!panel.hidden)toggle(false);});
    document.addEventListener('pointerdown',function(e){if(!panel.hidden&&!document.getElementById('gp-access').contains(e.target)){panel.hidden=true;trigger.setAttribute('aria-expanded','false');}});
    panel.addEventListener('click',function(e){
      var b=e.target.closest('button[data-gp-access]');if(!b)return;
      switch(b.dataset.gpAccess){
        case 'increase':saved.size=Math.min(3,saved.size+1);break;
        case 'decrease':saved.size=Math.max(0,saved.size-1);break;
        case 'contrast':saved.contrast=!saved.contrast;break;
        case 'motion':saved.motion=!saved.motion;break;
        case 'reset':saved={size:0,contrast:false,motion:false};break;
      }
      apply();
    });
    apply();
  });
})();
</script>
