<!-- MOTOR DE TRADUÇÃO AUTOMÁTICA E BANDEIRAS OTIMIZADAS PARA MOBILE -->
<div id="google_translate_element" style="position: absolute; opacity: 0; width: 1px; height: 1px; overflow: hidden; pointer-events: none;"></div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'pt',
      includedLanguages: 'pt,en,es',
      autoDisplay: false
    }, 'google_translate_element');
  }

  function aplicarIdiomaVisual(langCode) {
    var idioma = (langCode || 'pt').toLowerCase().split('-')[0];
    if (idioma === 'es') {
      document.documentElement.setAttribute('data-gp-language', 'es');
    } else {
      document.documentElement.removeAttribute('data-gp-language');
    }
  }

  function recuperarIdiomaSalvo() {
    var correspondencia = document.cookie.match(/(?:^|;\s*)googtrans=([^;]+)/);
    if (!correspondencia) {
      aplicarIdiomaVisual('pt');
      return;
    }

    try {
      var partes = decodeURIComponent(correspondencia[1]).split('/').filter(Boolean);
      aplicarIdiomaVisual(partes.length ? partes[partes.length - 1] : 'pt');
    } catch (erro) {
      aplicarIdiomaVisual('pt');
    }
  }

  function traduzirPagina(langCode) {
    aplicarIdiomaVisual(langCode);
    var langPair = '/pt/' + langCode;
    document.cookie = 'googtrans=' + langPair + '; path=/;';
    document.cookie = 'googtrans=' + langPair + '; path=/; domain=' + window.location.hostname;

    var select = document.querySelector('.goog-te-combo');
    if (select) {
      select.value = langCode;
      select.dispatchEvent(new Event('change'));
    } else {
      window.location.reload();
    }
  }

  // Injeção com eventos otimizados para touch no celular
  document.addEventListener("DOMContentLoaded", function() {
    recuperarIdiomaSalvo();

    var navbarTitle = document.querySelector(".navbar-brand .navbar-title") || document.querySelector(".navbar-brand");
    
    if (navbarTitle && !document.querySelector(".bandeiras-container")) {
      var container = document.createElement("div");
      container.className = "bandeiras-container";
      container.innerHTML = `
        <img src="https://flagcdn.com/w40/br.png" class="bandeira-idioma" onclick="traduzirPagina('pt')" ontouchstart="traduzirPagina('pt')" alt="Português" title="Português">
        <img src="https://flagcdn.com/w40/us.png" class="bandeira-idioma" onclick="traduzirPagina('en')" ontouchstart="traduzirPagina('en')" alt="English" title="English">
        <img src="https://flagcdn.com/w40/es.png" class="bandeira-idioma" onclick="traduzirPagina('es')" ontouchstart="traduzirPagina('es')" alt="Español" title="Español">
      `;
      navbarTitle.after(container);
    }

    // Mobile: idiomas na primeira linha. Tablet: dentro do menu.
    // Desktop amplo: idiomas ao lado da busca, fora da lista de navegação.
    function ajustarOrdemNavbarMobile() {
      var navContainer = document.querySelector(".navbar .navbar-container");
      var navList = document.querySelector(".navbar .navbar-nav");
      var search = navContainer && navContainer.querySelector("#quarto-search");
      var flags = document.querySelector(".bandeiras-container");
      if (!navContainer || !flags) return;

      var desktopItem = document.querySelector(".gp-nav-idiomas-item");
      var desktopWrapper = document.querySelector(".gp-nav-idiomas-desktop");

      if (window.matchMedia("(max-width: 768px)").matches) {
        if (desktopItem) desktopItem.remove();
        if (flags.parentElement !== navContainer) navContainer.appendChild(flags);
        if (desktopWrapper) desktopWrapper.remove();
      } else if (window.matchMedia("(min-width: 1451px)").matches) {
        if (desktopItem) desktopItem.remove();
        if (!desktopWrapper) {
          desktopWrapper = document.createElement("div");
          desktopWrapper.className = "gp-nav-idiomas-desktop";
        }
        if (flags.parentElement !== desktopWrapper) desktopWrapper.appendChild(flags);
        if (desktopWrapper.parentElement !== navContainer ||
            (search && desktopWrapper.nextElementSibling !== search)) {
          navContainer.insertBefore(desktopWrapper, search || null);
        }

        // A ordem visual é definida no próprio elemento para prevalecer
        // sobre regras antigas do Bootstrap/Quarto em páginas internas.
        var brand = navContainer.querySelector(".navbar-brand-container");
        var collapse = navContainer.querySelector(".navbar-collapse");
        var tools = navContainer.querySelector(".quarto-navbar-tools");
        desktopWrapper.style.setProperty("order", "998", "important");
        desktopWrapper.style.setProperty("display", "flex", "important");
        desktopWrapper.style.setProperty("flex", "0 0 auto", "important");
        desktopWrapper.style.setProperty("align-items", "center", "important");
        if (brand) brand.style.setProperty("order", "2", "important");
        if (collapse) collapse.style.setProperty("order", "20", "important");
        if (tools) tools.style.setProperty("order", "900", "important");
        if (search) {
          search.style.setProperty("order", "999", "important");
          search.style.setProperty("margin-left", ".15rem", "important");
        }
      } else {
        if (!navList) return;
        if (!desktopItem) {
          desktopItem = document.createElement("li");
          desktopItem.className = "nav-item gp-nav-idiomas-item";
          navList.appendChild(desktopItem);
        }
        if (flags.parentElement !== desktopItem) desktopItem.appendChild(flags);
        if (desktopWrapper) desktopWrapper.remove();
      }
    }

    ajustarOrdemNavbarMobile();
    window.addEventListener("resize", ajustarOrdemNavbarMobile, { passive: true });

    // O campo Algolia/Quarto é criado sob demanda ao abrir a busca.
    // O observador garante placeholder e rótulo também no modal flutuante.
    var scrollAntesDaBusca = 0;
    var buscaEstavaAberta = false;

    function prepararCampoBusca() {
      var buscaAberta = document.body.classList.contains("aa-Detached");

      if (buscaAberta && !buscaEstavaAberta) {
        scrollAntesDaBusca = window.scrollY || window.pageYOffset || 0;
      }

      document.querySelectorAll(".aa-Input").forEach(function(campo) {
        if (!campo.getAttribute("placeholder")) {
          campo.setAttribute("placeholder", "Buscar no site...");
        }
        campo.setAttribute("aria-label", "Buscar no site do GPENSC");
        // iOS amplia a página automaticamente quando o campo tem fonte menor que 16px.
        campo.style.setProperty("font-size", "16px", "important");
        campo.style.setProperty("-webkit-text-size-adjust", "100%", "important");
        campo.style.setProperty("transform", "none", "important");
      });

      if (!buscaAberta && buscaEstavaAberta) {
        var campoAtivo = document.activeElement;
        if (campoAtivo && campoAtivo.matches && campoAtivo.matches(".aa-Input")) {
          campoAtivo.blur();
        }
        window.requestAnimationFrame(function() {
          window.scrollTo({ top: scrollAntesDaBusca, left: 0, behavior: "auto" });
        });
      }
      buscaEstavaAberta = buscaAberta;
    }

    prepararCampoBusca();
    var observadorBusca = new MutationObserver(prepararCampoBusca);
    observadorBusca.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class"] });  });
</script>

<!-- Carrossel automático da galeria da página inicial. -->
<script>
(() => {
  const inicializarCarrosseis = () => {
    document.querySelectorAll(".galeria-faixa").forEach((faixa, numero) => {
      if (faixa.dataset.carrosselInicializado === "true") return;

      const imagensOriginais = Array.from(faixa.querySelectorAll(":scope > .galeria-item"));
      if (!imagensOriginais.length) imagensOriginais.push(...Array.from(faixa.querySelectorAll(":scope > img")));
      if (imagensOriginais.length < 2) return;

      const total = imagensOriginais.length;
      const container = faixa.closest(".galeria") || faixa.parentElement;
      if (!container) return;

      faixa.dataset.carrosselInicializado = "true";
      faixa.id = faixa.id || "galeria-faixa-" + (numero + 1);
      faixa.setAttribute("role", "region");
      faixa.setAttribute("aria-label", "Galeria de fotos do GPENSC");
      faixa.setAttribute("tabindex", "0");

      // As cópias do início permitem a passagem contínua da última foto para a primeira.
      const imagensClonadas = [];
      imagensOriginais.slice(0, Math.min(3, total)).forEach((imagem) => {
        const clone = imagem.cloneNode(true);
        clone.dataset.carrosselClone = "true";
        if (clone.matches("img")) {
          clone.alt = "";
          clone.loading = "eager";
        } else {
          clone.querySelectorAll("img").forEach((img) => {
            img.alt = "";
            img.loading = "eager";
          });
        }
        clone.setAttribute("aria-hidden", "true");
        imagensClonadas.push(clone);
        faixa.appendChild(clone);
      });

      const todosOsQuadros = () => imagensOriginais.concat(imagensClonadas);
      const centralizarNoCelular = () =>
        window.matchMedia("(max-width: 767.98px)").matches;

      // No celular, calcula a rolagem para deixar o centro da foto no centro da faixa.
      // No desktop, preserva o alinhamento pela borda esquerda.
      const deslocamentoPara = (imagem) => {
        if (!imagem) return faixa.scrollLeft;

        const faixaRect = faixa.getBoundingClientRect();
        const imagemRect = imagem.getBoundingClientRect();
        let destino = faixa.scrollLeft + imagemRect.left - faixaRect.left;

        if (centralizarNoCelular()) {
          destino -= (faixa.clientWidth - imagemRect.width) / 2;
        }

        return Math.max(0, destino);
      };

      const rolarParaElemento = (imagem, comportamento) => {
        if (!imagem) return;
        faixa.scrollTo({
          left: deslocamentoPara(imagem),
          behavior: comportamento
        });
      };

      const rolarParaIndice = (indice, comportamento) => {
        rolarParaElemento(imagensOriginais[indice], comportamento);
      };

      const anterior = document.createElement("button");
      anterior.type = "button";
      anterior.className = "galeria-controle galeria-controle--anterior";
      anterior.setAttribute("aria-label", "Mostrar foto anterior");
      anterior.setAttribute("aria-controls", faixa.id);
      anterior.title = "Foto anterior";
      anterior.textContent = "‹";

      const proximo = document.createElement("button");
      proximo.type = "button";
      proximo.className = "galeria-controle galeria-controle--proximo";
      proximo.setAttribute("aria-label", "Mostrar próxima foto");
      proximo.setAttribute("aria-controls", faixa.id);
      proximo.title = "Próxima foto";
      proximo.textContent = "›";

      container.append(anterior, proximo);

      let indiceAtual = 0;
      let intervalo = null;
      let retomada = null;
      let fimDaRolagem = null;

      const parar = () => {
        if (intervalo !== null) window.clearInterval(intervalo);
        intervalo = null;
      };

      const iniciar = () => {
        parar();
        if (
          document.hidden ||
          window.matchMedia("(prefers-reduced-motion: reduce)").matches ||
          (window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
            container.matches(":hover")) ||
          container.contains(document.activeElement)
        ) return;

        intervalo = window.setInterval(() => irPara(indiceAtual + 1, false), 5000);
      };

      const pausarEAgendarRetomada = () => {
        parar();
        if (retomada !== null) window.clearTimeout(retomada);
        retomada = window.setTimeout(iniciar, 6000);
      };

      const irPara = (novoIndice, interacaoManual) => {
        if (interacaoManual) pausarEAgendarRetomada();

        if (novoIndice < 0) {
          indiceAtual = total - 1;
          rolarParaIndice(indiceAtual, "smooth");
          return;
        }

        if (novoIndice >= total) {
          // A primeira cópia tem a mesma foto do início; depois a rolagem
          // é reposicionada sem animação para o quadro original equivalente.
          rolarParaElemento(imagensClonadas[0], "smooth");
          indiceAtual = 0;
          return;
        }

        indiceAtual = novoIndice;
        rolarParaIndice(indiceAtual, "smooth");
      };

      // Identifica a foto mais próxima do ponto de referência após o toque ou a rolagem.
      const sincronizarIndiceManual = () => {
        const faixaRect = faixa.getBoundingClientRect();
        const celular = centralizarNoCelular();
        const referencia = celular
          ? faixaRect.left + faixa.clientWidth / 2
          : faixaRect.left;

        let indiceMaisProximo = 0;
        let menorDistancia = Infinity;

        todosOsQuadros().forEach((imagem, indice) => {
          const imagemRect = imagem.getBoundingClientRect();
          const pontoImagem = celular
            ? imagemRect.left + imagemRect.width / 2
            : imagemRect.left;
          const distancia = Math.abs(pontoImagem - referencia);

          if (distancia < menorDistancia) {
            menorDistancia = distancia;
            indiceMaisProximo = indice;
          }
        });

        if (indiceMaisProximo >= total) {
          indiceAtual = (indiceMaisProximo - total) % total;
          window.requestAnimationFrame(() => {
            rolarParaIndice(indiceAtual, "auto");
          });
        } else {
          indiceAtual = indiceMaisProximo;
        }
      };

      faixa.addEventListener("scroll", () => {
        if (fimDaRolagem !== null) window.clearTimeout(fimDaRolagem);
        fimDaRolagem = window.setTimeout(sincronizarIndiceManual, 180);
      }, { passive: true });

      anterior.addEventListener("click", () => {
        irPara(indiceAtual - 1, true);
        anterior.blur();
      });

      proximo.addEventListener("click", () => {
        irPara(indiceAtual + 1, true);
        proximo.blur();
      });

      container.addEventListener("mouseenter", parar);
      container.addEventListener("mouseleave", iniciar);
      container.addEventListener("focusin", parar);
      container.addEventListener("focusout", () => {
        window.setTimeout(() => {
          if (!container.contains(document.activeElement)) iniciar();
        }, 0);
      });

      faixa.addEventListener("pointerdown", pausarEAgendarRetomada, { passive: true });
      anterior.addEventListener("pointerdown", pausarEAgendarRetomada, { passive: true });
      proximo.addEventListener("pointerdown", pausarEAgendarRetomada, { passive: true });

      window.addEventListener("resize", () => {
        window.requestAnimationFrame(() => {
          rolarParaIndice(indiceAtual, "auto");
        });
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) parar();
        else iniciar();
      });

      // A primeira foto já começa centralizada quando a página é aberta no celular.
      if (centralizarNoCelular()) {
        window.requestAnimationFrame(() => rolarParaIndice(0, "auto"));
      }

      iniciar();
    });
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", inicializarCarrosseis, { once: true });
  } else {
    inicializarCarrosseis();
  }
})();
</script>

<!-- Barra nativa do sistema: mantém o deslize e os controles do carrossel sem exibir a trilha. -->
<style id="gpen-galeria-hide-scrollbar">
  /* Este estilo fica no HTML gerado para prevalecer sobre o CSS externo em cache. */
  .galeria-faixa {
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }
  .galeria-faixa::-webkit-scrollbar,
  .galeria-faixa::-webkit-scrollbar-track,
  .galeria-faixa::-webkit-scrollbar-thumb,
  .galeria-faixa::-webkit-scrollbar-button,
  .galeria-faixa::-webkit-scrollbar-corner,
  .galeria-faixa::-webkit-resizer {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
    min-height: 0 !important;
    background: transparent !important;
    border: 0 !important;
  }
</style>


<!-- Centraliza a foto ativa no celular durante o avanço automático e o deslize manual. -->

    .galeria-faixa {
      box-sizing: border-box !important;
      width: 100% !important;
      padding-left: 14% !important;
      padding-right: 14% !important;
      scroll-padding-left: 14% !important;
      scroll-padding-right: 14% !important;
      scroll-snap-type: x mandatory !important;
    }

    .galeria-faixa > img,
    .galeria-faixa > .galeria-item {
      box-sizing: border-box !important;
      flex: 0 0 100% !important;
      width: 100% !important;
      height: clamp(210px, 52vw, 340px) !important;
      min-height: 210px !important;
      max-height: 340px !important;
      aspect-ratio: auto !important;
      scroll-snap-align: center !important;
      scroll-snap-stop: always;
    }

    .galeria-faixa > img {
      object-fit: cover !important;
      object-position: center !important;
    }

    .galeria-faixa > .galeria-item {
      display: block !important;
      overflow: hidden !important;
    }

    .galeria-faixa > .galeria-item > img {
      width: 100% !important;
      height: 100% !important;
      max-height: none !important;
      object-fit: cover !important;
    }
  }

  @media (max-width: 380px) {
    .galeria-faixa {
      padding-left: 6% !important;
      padding-right: 6% !important;
      scroll-padding-left: 6% !important;

</style>
