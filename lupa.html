<!-- =====================================================================
     lupa.html – JAVASCRIPT GERAL (include-after-body)
     Contém:
     1) Animação de entrada ao rolar a página (Scroll Reveal)
     2) Sistema de Troca de Idiomas (PT / EN / ES)
     ===================================================================== -->

<script>
document.addEventListener("DOMContentLoaded", function () {

  // 1) REVELAR AO ROLAR (Scroll Reveal):
  // Elementos com a classe "reveal" aparecem suavemente ao entrar na viewport.
  var alvos = document.querySelectorAll(".reveal");
  if ("IntersectionObserver" in window) {
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { 
          e.target.classList.add("visivel"); 
          obs.unobserve(e.target); 
        }
      });
    }, { threshold: 0.12 });
    alvos.forEach(function (el) { obs.observe(el); });
  } else {
    // Fallback para navegadores antigos
    alvos.forEach(function (el) { el.classList.add("visivel"); });
  }

});

// 2) SISTEMA DE TROCA DE IDIOMAS (PT / EN / ES)
const i18nDict = {
  pt: {
    "nav-sobre": "Quem somos",
    "nav-linhas": "Linhas de pesquisa",
    "nav-pesquisa": "Pesquisa",
    "nav-projetos": "Projetos",
    "nav-publicacoes": "Publicações",
    "nav-extensao": "Extensão",
    "nav-disciplinas": "Disciplinas",
    "nav-noticias": "Notícias",
    "nav-contato": "Contato"
  },
  en: {
    "nav-sobre": "About Us",
    "nav-linhas": "Research Lines",
    "nav-pesquisa": "Research",
    "nav-projetos": "Projects",
    "nav-publicacoes": "Publications",
    "nav-extensao": "Extension",
    "nav-disciplinas": "Courses",
    "nav-noticias": "News",
    "nav-contato": "Contact"
  },
  es: {
    "nav-sobre": "Quiénes somos",
    "nav-linhas": "Líneas de investigación",
    "nav-pesquisa": "Investigación",
    "nav-projetos": "Proyectos",
    "nav-publicacoes": "Publicaciones",
    "nav-extensao": "Extensión",
    "nav-disciplinas": "Asignaturas",
    "nav-noticias": "Noticias",
    "nav-contato": "Contacto"
  }
};

function changeLang(lang) {
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;

  var elements = document.querySelectorAll('[data-i18n]');
  elements.forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (i18nDict[lang] && i18nDict[lang][key]) {
      el.textContent = i18nDict[lang][key];
    }
  });

  console.log("Idioma alterado para: " + lang.toUpperCase());
}
</script>
