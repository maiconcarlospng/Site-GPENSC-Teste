name: Publicar site Quarto

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # se você salvar duas vezes seguidas, só a última compila

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # baixa pacotes já compilados (bem mais rápido)

      - uses: r-lib/actions/setup-r-dependencies@v2   # guarda os pacotes em cache
        with:
          packages: |
            any::readr
            any::dplyr
            any::htmltools
            any::DT
            any::plotly
            any::yaml
            any::knitr
            any::rmarkdown
            any::here
            any::purrr
            any::stringr
            any::lubridate

      - name: Renderizar o site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
