name: Publicar site Quarto

# Toda publicação compila o site e o painel a partir do mesmo commit; não reutiliza HTML antigo.
# A documentação de uso e migração está no README.md.
on:
  push:
    branches:
      - main
    paths:
      - "**.qmd"
      - "R/**"
      - "partials/**"
      - "data/**"
      - "img/**"
      - "docs/**"
      - "admin/**"
      - "styles.css"
      - "styles-mobile-v2.css"
      - "styles-mobile-v3.css"
      - "styles-mobile-v4.css"
      - "styles-mobile-v5.css"
      - "styles-navbar-v6.css"
      - "styles-navbar-v7.css"
      - "styles-navbar-v8.css"
      - "styles-busca-v9.css"
      - "styles-spotify-v10.css"
      - "styles-conteudo-v7.css"
      - "styles-timeline-v11.css"
      - "styles-parcerias-v13.css"
      - "styles-linhas-v14.css"
      - "styles-geral-v15.css"
      - "styles-menu-mobile-v16.css"
      - "styles-timeline-v12.css"
      - "styles-home-v17.css"
      - "styles-agenda-v18.css"
      - "styles-gpensc-v26.css"
      - "styles-gpensc-v27.css"
      - "styles-direcao-v28.css"
      - "styles-*.css"
      - "js/**"
      - "custom.scss"
      - "lupa.html"
      - "topo.html"
      - "_quarto.yml"
      - "_variables.yml"
      - "_extensions/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

# Permissões mínimas necessárias para compilar e publicar no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita duas publicações concorrentes. Se uma edição nova chegar, prioriza a mais recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Distingue mudanças exclusivas do painel de alterações que exigem nova renderização Quarto/R.
  validate-panel:
    name: Validar painel e conteúdo
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar validador YAML
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validar configuração, arquivos, YAML e CSS
        run: python admin/validar-painel.py
      - name: Verificar links, páginas e recursos estáticos
        run: python admin/auditar-site.py
      - name: Validar sintaxe do painel, árvore e Workers
        run: node --check admin/galeria-multipla.js && node --check admin/app.js && node --check js/arvore-v44.js && node --check js/arvore-interativa.js && node --check js/galeria-sobre.js && node --check admin-access-worker/worker.js && node --check analytics-worker/worker.js

  build:
    name: Compilar site (Quarto + R)
    needs: [validate-panel]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório e o histórico necessário
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Preparar R e usar pacotes binários quando disponíveis
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependências R declaradas pelo projeto
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::htmltools
            any::DT
            any::plotly
            any::yaml
            any::knitr
            any::rmarkdown
            any::here
            any::purrr
            any::stringr
            any::lubridate

      - name: Recompilar o site e o painel sem reutilizar HTML antigo
        run: |
          rm -rf _site _freeze
          quarto render
          rm -f _site/admin/validar-painel.py _site/admin/auditar-site.py

      - name: Empacotar o site gerado para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Implantar artefato compilado
        id: deployment
        uses: actions/deploy-pages@v4
