name: Publicar site Quarto

on:
  push:
    branches: [main]
    paths:
      - "**.qmd"
      - "R/**"
      - "data/**"
      - "img/**"
      - "admin/**"
      - "styles.css"
      - "custom.scss"
      - "lupa.html"
      - "_quarto.yml"
      - "_variables.yml"
      - "_extensions/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # se você salvar duas vezes seguidas, só a última compila

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O passo de invalidação compara o SHA anterior do push com o atual.
          # É necessário trazer o histórico para que ambos os commits existam localmente.
          fetch-depth: 0

      # Cache do Quarto: alterações em apenas CSS, imagens ou painel podem reaproveitar R.
      - name: Restaurar cache das execuções do Quarto
        uses: actions/cache@v4
        with:
          path: _freeze
          key: quarto-freeze-${{ runner.os }}-${{ hashFiles('**.qmd', 'R/**', 'data/**', '_variables.yml', '_quarto.yml') }}
          restore-keys: |
            quarto-freeze-${{ runner.os }}-

      # Os documentos dependem dos YAML e de helpers.R; não use resultados antigos nesses casos.
      - name: Invalidar resultados congelados quando mudarem dados ou código R
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            if printf '%s\n' "$changed_files" | grep -Eq '^(R/|data/|_variables\.yml$|_quarto\.yml$)'; then
              echo "Dados/código compartilhado alterados: removendo cache antigo do Quarto."
              rm -rf _freeze
            fi
          fi

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # baixa pacotes já compilados (bem mais rápido)

      - uses: r-lib/actions/setup-r-dependencies@v2   # guarda os pacotes em cache
        with:
          packages: |
            any::readr
            any::dplyr
            any::htmltools
            any::DT
            any::plotly
            any::yaml
            any::knitr
            any::rmarkdown
            any::here
            any::purrr
            any::stringr
            any::lubridate

      - name: Renderizar o site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
