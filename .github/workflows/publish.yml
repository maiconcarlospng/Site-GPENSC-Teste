name: Publicar site Quarto

# Mudanças exclusivamente em CSS e JS estáticos podem reutilizar o HTML publicado.
# Demais alterações mantêm compilação completa e validações.
# A documentação de uso e migração está no README.md.
on:
  push:
    branches:
      - main
    paths:
      - "**.qmd"
      - "R/**"
      - "partials/**"
      - "data/**"
      - "img/**"
      - "docs/**"
      - "admin/**"
      - "styles.css"
      - "svg-institucional.css"
      - "site-ajustes.css"
      - "site-escala.css"
      - "home-refinamentos.css"
      - "scripts/gerar-inventario-materiais.py"
      - "js/**"
      - "custom.scss"
      - "lupa.html"
      - "topo.html"
      - "_quarto.yml"
      - "_variables.yml"
      - "_extensions/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

# Permissões mínimas necessárias para compilar e publicar no GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Uma publicação por vez; novos commits substituem execuções antigas.
# Evita gastar tempo compilando versões que já foram superadas.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Distingue mudanças exclusivas do painel de alterações que exigem nova renderização Quarto/R.
  validate-panel:
    name: Validar painel e conteúdo
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar validador YAML
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Construir índice de vínculos dos materiais
        run: python scripts/gerar-inventario-materiais.py
      - name: Validar configuração, arquivos, YAML e CSS
        run: python admin/validar-painel.py
      - name: Verificar links, páginas e recursos estáticos
        run: python admin/auditar-site.py
      - name: Validar integridade do acervo Instagram
        run: python admin/validar-acervo-instagram.py
      - name: Validar sintaxe das rotinas do Instagram
        run: python -m py_compile admin/arquivar-capas-instagram.py scripts/importar-instagram.py
      - name: Validar sintaxe do painel, árvore e Workers
        run: node --check js/carrosseis-instagram.js && node --check js/paginacao-noticias.js && node --check admin/galeria-multipla.js && node --check admin/app.js && node --check admin/lote-edicoes.js && node --check admin/testar-lote.js && node admin/testar-lote.js && node --check js/acessibilidade-gpensc.js && node --check js/acervo-instagram.js && node --check js/galeria-home.js && node --check js/arvore.js && node --check js/arvore-interativa.js && node --check js/galeria-sobre.js && node --check admin-access-worker/worker.js && node --check analytics-worker/worker.js

  build:
    name: Compilar site (Quarto + R)
    needs: [validate-panel]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório e o histórico necessário
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identificar publicação rápida segura
        id: mode
        shell: bash
        run: |
          echo "fast=false" >> "$GITHUB_OUTPUT"
          # A branch publicada registra qual commit da main originou o HTML.
          if ! git fetch --no-tags --depth=1 origin render-published:refs/remotes/origin/render-published; then
            echo "Sem publicação anterior; compilação completa."
            exit 0
          fi
          previous="$(git log -1 --format=%s origin/render-published)"
          previous="${previous#deploy: sync main @ }"
          if [[ ! "$previous" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Sem identificador de commit válido; compilação completa."
            exit 0
          fi
          if [[ -z "$previous" ]] || ! git cat-file -e "$previous^{commit}" 2>/dev/null; then
            echo "Commit de origem desconhecido; compilação completa."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$previous" HEAD; then
            echo "Histórico divergente; compilação completa."
            exit 0
          fi
          changed="$(git diff --name-only "$previous" HEAD)"
          # Apenas recursos estáticos já referenciados pelo HTML existente.
          # Alterações em templates, dados, conteúdo ou configuração exigem Quarto.
          if [[ -n "$changed" ]] && ! grep -Ev '^(styles\\.css|svg-institucional\\.css|site-ajustes\\.css|js/[^[:space:]]+)$' <<< "$changed" && ! git diff --name-only --diff-filter=D "$previous" HEAD | grep -q .; then
            echo "Somente CSS/JS estáticos mudaram desde a publicação anterior."
            echo "fast=true" >> "$GITHUB_OUTPUT"
          else
            echo "Há alterações que exigem renderização completa."
          fi

      - name: Reutilizar HTML publicado e atualizar recursos estáticos
        if: steps.mode.outputs.fast == 'true'
        shell: bash
        run: |
          mkdir -p _site
          git archive origin/render-published | tar -xf - -C _site
          # Copiar somente os arquivos estáticos alterados, mantendo os demais.
          cp styles.css _site/styles.css
          if [[ -f site-ajustes.css ]]; then cp site-ajustes.css _site/site-ajustes.css; fi
          if [[ -f svg-institucional.css ]]; then cp svg-institucional.css _site/svg-institucional.css; fi
          if [[ -d js ]]; then mkdir -p _site/js; cp -a js/. _site/js/; fi
          test -s _site/index.html
          test -s _site/styles.css
          rm -f _site/admin/validar-painel.py _site/admin/auditar-site.py _site/admin/arquivar-capas-instagram.py

      - name: Instalar Quarto
        if: steps.mode.outputs.fast != 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Preparar R e usar pacotes binários quando disponíveis
        if: steps.mode.outputs.fast != 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependências R declaradas pelo projeto
        if: steps.mode.outputs.fast != 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::htmltools
            any::DT
            any::plotly
            any::yaml
            any::knitr
            any::rmarkdown
            any::here
            any::purrr
            any::stringr
            any::lubridate

      - name: Restaurar capas originais já publicadas
        if: steps.mode.outputs.fast != 'true'
        shell: bash
        run: |
          mkdir -p img/instagram
          if git fetch --no-tags --depth=1 origin render-published:refs/remotes/origin/render-published; then
            if git ls-tree -r --name-only origin/render-published -- img/instagram | grep -q '^img/instagram/'; then
              git archive origin/render-published img/instagram | tar -xf -
              echo "Capas já publicadas recuperadas para esta compilação."
            fi
          fi

      - name: Arquivar imagens das publicações importadas
        if: steps.mode.outputs.fast != 'true'
        run: python3 admin/arquivar-capas-instagram.py

      - name: Recompilar o site e o painel sem reutilizar HTML antigo
        if: steps.mode.outputs.fast != 'true'
        run: |
          rm -rf _site _freeze
          quarto render
          rm -f _site/admin/validar-painel.py _site/admin/auditar-site.py _site/admin/arquivar-capas-instagram.py

      - name: Atualizar inventário de materiais do site publicado
        run: python3 scripts/gerar-inventario-materiais.py --output _site/admin/static-media-references.js

      - name: Sincronizar o site compilado com o Render
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: render-published
          commit_message: "deploy: sync main @ ${{ github.sha }}"

      - name: Empacotar o site gerado para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Implantar artefato compilado
        id: deployment
        uses: actions/deploy-pages@v4
