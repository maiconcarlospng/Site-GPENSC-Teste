name: Publicar site Quarto

# Publica apenas quando muda código, conteúdo ou recursos usados pelo site.
# A documentação de uso e migração está no README.md.
on:
  push:
    branches:
      - main
    paths:
      - "**.qmd"
      - "R/**"
      - "data/**"
      - "img/**"
      - "docs/**"
      - "admin/**"
      - "styles.css"
      - "styles-mobile-v2.css"
      - "styles-mobile-v3.css"
      - "custom.scss"
      - "lupa.html"
      - "topo.html"
      - "_quarto.yml"
      - "_variables.yml"
      - "_extensions/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

# Permissões mínimas necessárias para compilar e publicar no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita duas publicações concorrentes. Se uma edição nova chegar, prioriza a mais recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Distingue mudanças exclusivas do painel de alterações que exigem nova renderização Quarto/R.
  detect_changes:
    name: Identificar o tipo de alteração
    runs-on: ubuntu-latest
    outputs:
      site_build: ${{ steps.filter.outputs.site_build }}
    steps:
      - name: Baixar o histórico para comparar arquivos
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decidir se é necessário recompilar o site público
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "site_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          if [[ -z "$changed_files" ]]; then
            echo "site_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          site_build=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$path" != admin/* ]]; then
              site_build=true
              break
            fi
          done <<< "$changed_files"

          echo "site_build=$site_build" >> "$GITHUB_OUTPUT"
          echo "Recompilar site público: $site_build"

  validate-panel:
    name: Validar painel e conteúdo
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar validador YAML
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validar configuração, arquivos, YAML e CSS
        run: python admin/validar-painel.py
      - name: Validar sintaxe do widget de galeria
        run: node --check admin/galeria-multipla.js

  build:
    name: Compilar site (Quarto + R)
    needs: [validate-panel, detect_changes]
    if: needs.detect_changes.outputs.site_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório e o histórico necessário
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache permanente do resultado público: mudanças apenas em admin/ podem reutilizá-lo.
      - name: Preparar cache do site público renderizado
        uses: actions/cache@v4
        with:
          path: _site
          key: quarto-site-${{ runner.os }}-${{ hashFiles('**.qmd', 'R/**', 'data/**', 'img/**', 'docs/**', 'styles.css', 'styles-mobile-v2.css', 'styles-mobile-v3.css', 'custom.scss', 'lupa.html', 'topo.html', '_quarto.yml', '_variables.yml', '_extensions/**') }}
          restore-keys: |
            quarto-site-${{ runner.os }}-

      # Reaproveita resultados congelados do Quarto quando a chave de cache é compatível.
      - name: Restaurar cache do Quarto
        uses: actions/cache@v4
        with:
          path: _freeze
          key: quarto-freeze-${{ runner.os }}-${{ hashFiles('**.qmd', 'R/**', 'data/**', '_variables.yml', '_quarto.yml') }}
          restore-keys: |
            quarto-freeze-${{ runner.os }}-

      # Conteúdo e funções R podem afetar resultados computados; não reutilizar freeze antigo nesses casos.
      - name: Invalidar resultados congelados se mudarem dados ou código R
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            if printf '%s\n' "$changed_files" | grep -Eq '^(R/|data/|_variables\.yml$|_quarto\.yml$)'; then
              echo "Dados ou código compartilhado mudaram; removendo _freeze antigo."
              rm -rf _freeze
            fi
          fi

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Preparar R e usar pacotes binários quando disponíveis
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependências R declaradas pelo projeto
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::htmltools
            any::DT
            any::plotly
            any::yaml
            any::knitr
            any::rmarkdown
            any::here
            any::purrr
            any::stringr
            any::lubridate

      - name: Identificar páginas afetadas por alterações de conteúdo
        id: partial
        shell: bash
        run: |
          partial=false
          pages=""
          if [[ "${{ github.event_name }}" == "push" && -f _site/index.html ]]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            partial=true
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                data/noticias.yml) pages="$pages index.qmd noticias.qmd noticia.qmd" ;;
                data/eventos.yml) pages="$pages index.qmd agenda.qmd" ;;
                data/projetos.yml) pages="$pages index.qmd projetos.qmd extensao.qmd" ;;
                data/publicacoes.yml) pages="$pages publicacoes.qmd" ;;
                data/defesas.yml) pages="$pages teses.qmd" ;;
                data/livros.yml) pages="$pages livros.qmd" ;;
                data/videos.yml) pages="$pages videos.qmd" ;;
                data/sites.yml) pages="$pages sites.qmd" ;;
                data/disciplinas.yml) pages="$pages disciplinas.qmd" ;;
                data/linhas.yml) pages="$pages linhas.qmd" ;;
                data/noar.yml) pages="$pages noar.qmd" ;;
                data/equipe.yml) pages="$pages sobre.qmd" ;;
                data/galeria.yml|data/apoio.yml) pages="$pages index.qmd" ;;
                *) partial=false; break ;;
              esac
            done <<< "$changed_files"
            [[ -z "$changed_files" ]] && partial=false
          fi
          if [[ "$partial" == "true" ]]; then
            pages="$(printf '%s\n' $pages | sort -u | tr '\n' ' ' | xargs)"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "pages=$pages" >> "$GITHUB_OUTPUT"
            echo "Renderização parcial: $pages"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "pages=" >> "$GITHUB_OUTPUT"
            echo "Renderização completa necessária."
          fi

      - name: Renderizar somente as páginas afetadas pelo conteúdo
        if: steps.partial.outputs.enabled == 'true'
        shell: bash
        run: |
          for page in ${{ steps.partial.outputs.pages }}; do
            quarto render "$page"
          done
          # Atualiza os YAML públicos copiados como recursos do site.
          mkdir -p _site/data
          rsync -a --delete data/ _site/data/
          rm -f _site/admin/validar-painel.py

      - name: Renderizar o site completo quando necessário
        if: steps.partial.outputs.enabled != 'true'
        run: |
          rm -rf _site
          quarto render
          rm -f _site/admin/validar-painel.py

      - name: Empacotar o site gerado para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  admin_fast_path:
    name: Atualizar somente o painel (sem R/Quarto)
    needs: [validate-panel, detect_changes]
    if: needs.detect_changes.outputs.site_build == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Restaurar a última versão compilada do site público
        id: site-cache
        uses: actions/cache@v4
        with:
          path: _site
          key: quarto-site-${{ runner.os }}-${{ hashFiles('**.qmd', 'R/**', 'data/**', 'img/**', 'docs/**', 'styles.css', 'custom.scss', 'lupa.html', 'topo.html', '_quarto.yml', '_variables.yml', '_extensions/**') }}

      - name: Conferir o cache antes de publicar
        shell: bash
        run: |
          if [[ "${{ steps.site-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "::error::Ainda não existe cache do site compilado. Execute uma publicação completa antes de atualizar somente o painel."
            exit 1
          fi
          test -f _site/index.html || { echo "::error::O cache não contém index.html."; exit 1; }
          test -f _site/admin/cms.html || { echo "::error::O cache não contém o editor Sveltia."; exit 1; }

      - name: Substituir somente os arquivos do painel
        shell: bash
        run: |
          rsync -a --delete admin/ _site/admin/
          rm -f _site/admin/validar-painel.py
          test -f _site/admin/cms.html
          test -f _site/admin/painel.css
          test -f _site/admin/config.yml

      - name: Empacotar o site existente com o painel atualizado
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    needs: [build, admin_fast_path]
    if: always() && (needs.build.result == 'success' || needs.admin_fast_path.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Implantar artefato compilado
        id: deployment
        uses: actions/deploy-pages@v4
