name: Publicar site Quarto

# Toda publicação compila o site e o painel a partir do mesmo commit; não reutiliza HTML antigo.
# A documentação de uso e migração está no README.md.
on:
  push:
    branches:
      - main
    paths:
      - "**.qmd"
      - "R/**"
      - "partials/**"
      - "data/**"
      - "img/**"
      - "docs/**"
      - "admin/**"
      - "styles.css"
      - "vi-no-rotulo.css"
      - "js/**"
      - "custom.scss"
      - "lupa.html"
      - "topo.html"
      - "_quarto.yml"
      - "_variables.yml"
      - "_extensions/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

# Permissões mínimas necessárias para compilar e publicar no GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Evita duas publicações concorrentes. Se uma edição nova chegar, prioriza a mais recente.
concurrency:
  group: pages
  # Não cancelar publicações iniciadas quando novos commits chegarem.
  # O GitHub mantém uma execução pendente e publica a versão mais recente depois.
  cancel-in-progress: false

jobs:
  # Distingue mudanças exclusivas do painel de alterações que exigem nova renderização Quarto/R.
  validate-panel:
    name: Validar painel e conteúdo
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar validador YAML
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validar configuração, arquivos, YAML e CSS
        run: python admin/validar-painel.py
      - name: Verificar links, páginas e recursos estáticos
        run: python admin/auditar-site.py
      - name: Validar integridade do acervo Instagram
        run: python admin/validar-acervo-instagram.py
      - name: Validar sintaxe do painel, árvore e Workers
        run: node --check admin/galeria-multipla.js && node --check admin/app.js && node --check admin/lote-edicoes.js && node --check admin/testar-lote.js && node admin/testar-lote.js && node --check js/acessibilidade-gpensc.js && node --check js/acervo-instagram.js && node --check js/galeria-home.js && node --check js/arvore.js && node --check js/arvore-interativa.js && node --check js/galeria-sobre.js && node --check admin-access-worker/worker.js && node --check analytics-worker/worker.js

  build:
    name: Compilar site (Quarto + R)
    needs: [validate-panel]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório e o histórico necessário
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Preparar R e usar pacotes binários quando disponíveis
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependências R declaradas pelo projeto
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::htmltools
            any::DT
            any::plotly
            any::yaml
            any::knitr
            any::rmarkdown
            any::here
            any::purrr
            any::stringr
            any::lubridate

      - name: Restaurar capas originais já publicadas
        shell: bash
        run: |
          mkdir -p img/instagram
          if git fetch --no-tags --depth=1 origin render-published:refs/remotes/origin/render-published; then
            if git ls-tree -r --name-only origin/render-published -- img/instagram | grep -q '^img/instagram/'; then
              git archive origin/render-published img/instagram | tar -xf -
              echo "Capas já publicadas recuperadas para esta compilação."
            fi
          fi

      - name: Arquivar imagens das publicações importadas
        run: python3 admin/arquivar-capas-instagram.py

      - name: Recompilar o site e o painel sem reutilizar HTML antigo
        run: |
          rm -rf _site _freeze
          quarto render
          rm -f _site/admin/validar-painel.py _site/admin/auditar-site.py

      - name: Sincronizar o site compilado com o Render
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: render-published
          commit_message: "deploy: sync main @ ${{ github.sha }}"

      - name: Empacotar o site gerado para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Implantar artefato compilado
        id: deployment
        uses: actions/deploy-pages@v4
