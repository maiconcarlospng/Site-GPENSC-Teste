name: Prévia experimental do GPENSC

on:
  push:
    branches:
      - layout-experimental
    paths:
      - "**.qmd"
      - "R/**"
      - "data/**"
      - "img/**"
      - "experimental.css"
      - "onezoom.css"
      - "onezoom.js"
      - "tree-nav.html"
      - "tree-interactions.js"
      - "tree-interactions.html"
      - "_quarto.yml"
      - "_variables.yml"
      - "_extensions/**"
      - ".github/workflows/preview-experimental.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpensc-experimental-preview
  cancel-in-progress: true

jobs:
  build-preview:
    name: Renderizar prévia sem publicar no site oficial
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a branch experimental
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Preparar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependências R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::htmltools
            any::DT
            any::plotly
            any::yaml
            any::knitr
            any::rmarkdown
            any::here
            any::purrr
            any::stringr
            any::lubridate

      - name: Renderizar o site experimental
        run: quarto render

      - name: Guardar o site renderizado como artefato de prévia
        uses: actions/upload-artifact@v4
        with:
          name: gpensc-arvore-experimental
          path: _site/
          if-no-files-found: error
          retention-days: 7

      - name: Preparar versão estática para hospedagem no Render
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gpensc-render-site"
          cp -a _site/. "$RUNNER_TEMP/gpensc-render-site/"

          git switch --orphan render-published
          git clean -fdx

          cp -a "$RUNNER_TEMP/gpensc-render-site/." .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica versão estática experimental do GPENSC"
          git push origin HEAD:render-published --force
