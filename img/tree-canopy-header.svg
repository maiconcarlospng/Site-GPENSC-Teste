<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 620" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Copa verde de uma árvore vista por baixo">
<defs>
 <linearGradient id="canopyGreen" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#d7e7ae"/><stop offset=".48" stop-color="#86ad6b"/><stop offset="1" stop-color="#356b42"/>
 </linearGradient>
 <linearGradient id="canopyDeep" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#a8c98a"/><stop offset=".5" stop-color="#5f9256"/><stop offset="1" stop-color="#244f35"/>
 </linearGradient>
 <linearGradient id="canopySun" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#e9efc3"/><stop offset="1" stop-color="#9bbb78"/>
 </linearGradient>
 <radialGradient id="light">
  <stop offset="0" stop-color="#fff6d2" stop-opacity=".92"/><stop offset=".48" stop-color="#f8edc7" stop-opacity=".4"/><stop offset="1" stop-color="#f8edc7" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="limbWood" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#b18756"/><stop offset=".45" stop-color="#765136"/><stop offset="1" stop-color="#4b3525"/>
 </linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
 <g id="leaf">
  <path d="M0 0 C-43 -13 -70 -57 -52 -96 C-17 -111 22 -74 0 0Z" fill="url(#canopyGreen)" stroke="#315e3b" stroke-opacity=".2" stroke-width="2"/>
  <path d="M0 -2 Q-15 -49 -48 -92 M-19 -48 L-46 -55 M-11 -28 L-36 -28 M-26 -67 L-30 -81" fill="none" stroke="#e6edc9" stroke-width="2.4" stroke-linecap="round" opacity=".58"/>
 </g>
 <g id="sprig">
  <use href="#leaf" transform="rotate(-34) scale(1.02)"/>
  <use href="#leaf" transform="translate(28 -5) rotate(27) scale(.88)"/>
  <use href="#leaf" transform="translate(9 -30) rotate(7) scale(.72)"/>
 </g>
</defs>
