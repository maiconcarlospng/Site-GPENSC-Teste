  <path d="M274 610 C354 572 416 633 476 685 C553 752 620 681 704 718" stroke="url(#branchWood)" stroke-width="41"/>
  <path d="M397 644 C393 590 370 563 335 544 M478 685 C466 735 437 761 400 780 M585 710 C613 754 651 769 686 765" stroke="#67482f" stroke-width="18"/>
  <!-- Extensão: ramo que ondula e sobe até uma ponta fina -->
  <path d="M279 824 C358 922 427 866 507 850 C630 825 710 929 884 866" stroke="#38291f" stroke-width="46"/>
  <path d="M279 824 C358 922 427 866 507 850 C630 825 710 929 884 866" stroke="url(#branchWood)" stroke-width="32"/>
  <path d="M390 886 C382 930 357 952 324 966 M510 850 C542 794 583 779 624 786 M730 891 C760 842 802 830 841 837" stroke="#67482f" stroke-width="14"/>
  <!-- Biblioteca: ramo mais baixo e largo, com curva descendente -->
  <path d="M284 1037 C363 1000 425 1062 492 1124 C567 1193 674 1064 812 1103" stroke="#38291f" stroke-width="62"/>
  <path d="M284 1037 C363 1000 425 1062 492 1124 C567 1193 674 1064 812 1103" stroke="url(#branchWood)" stroke-width="44"/>
  <path d="M405 1068 C399 1018 371 988 339 967 M492 1124 C475 1176 444 1205 404 1222 M651 1100 C684 1150 724 1167 763 1160" stroke="#67482f" stroke-width="17"/>
