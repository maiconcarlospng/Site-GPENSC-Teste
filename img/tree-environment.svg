  <path d="M286 1245 C361 1327 428 1284 522 1262 C660 1229 780 1378 930 1311" stroke="url(#branchWood)" stroke-width="39"/>
  <path d="M409 1290 C391 1330 361 1354 326 1370 M522 1262 C551 1208 593 1187 636 1194 M770 1362 C799 1315 837 1297 878 1305" stroke="#67482f" stroke-width="16"/>
</g>

