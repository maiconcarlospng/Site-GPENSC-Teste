<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1320" preserveAspectRatio="none" role="img" aria-label="Ilustração de uma grande árvore viva, com raízes, tronco, galhos e folhas">
<defs>
  <linearGradient id="skyWash" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8efdc" stop-opacity=".8"/>
    <stop offset=".52" stop-color="#f4f3e8" stop-opacity=".35"/>
    <stop offset="1" stop-color="#e7ead8" stop-opacity=".18"/>
  </linearGradient>
  <linearGradient id="bark" x1="0" y1="0" x2="1" y2=".1">
    <stop offset="0" stop-color="#35291f"/>
    <stop offset=".12" stop-color="#63452e"/>
    <stop offset=".27" stop-color="#99704a"/>
    <stop offset=".42" stop-color="#bd9564"/>
    <stop offset=".59" stop-color="#8a603c"/>
    <stop offset=".77" stop-color="#66462f"/>
    <stop offset="1" stop-color="#38291f"/>
  </linearGradient>
  <linearGradient id="barkLight" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f1c68d" stop-opacity="0"/>
    <stop offset=".45" stop-color="#f1c68d" stop-opacity=".75"/>
    <stop offset="1" stop-color="#f1c68d" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="branchWood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c09762"/>
    <stop offset=".42" stop-color="#956c43"/>
    <stop offset="1" stop-color="#553b28"/>
  </linearGradient>
  <linearGradient id="leafDeep" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8fab70"/>
    <stop offset=".48" stop-color="#47784a"/>
    <stop offset="1" stop-color="#1c5034"/>
  </linearGradient>
  <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c6d99c"/>
    <stop offset=".52" stop-color="#83a966"/>
    <stop offset="1" stop-color="#477647"/>
  </linearGradient>
  <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e1e9b9"/>
    <stop offset=".58" stop-color="#a9c582"/>
    <stop offset="1" stop-color="#668f53"/>
  </linearGradient>
  <linearGradient id="leafOlive" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b9c77c"/>
    <stop offset="1" stop-color="#718d4f"/>
  </linearGradient>
  <radialGradient id="sunGlow">
    <stop offset="0" stop-color="#fff4c6" stop-opacity=".7"/>
    <stop offset=".48" stop-color="#e8dca7" stop-opacity=".22"/>
    <stop offset="1" stop-color="#e8dca7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a7b989" stop-opacity="0"/>
    <stop offset="1" stop-color="#71865e" stop-opacity=".2"/>
  </linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="13"/>
  </filter>
  <filter id="leafShadow" x="-35%" y="-35%" width="170%" height="170%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
    <feOffset dy="4" result="offset"/>
    <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <g id="leaf">
    <path d="M0 0 C-34 -13 -57 -48 -43 -76 C-12 -88 20 -62 0 0Z" fill="url(#leafGreen)"/>
    <path d="M0 0 C-34 -13 -57 -48 -43 -76 C-12 -88 20 -62 0 0Z" fill="none" stroke="#315e3c" stroke-opacity=".28" stroke-width="2"/>
    <path d="M0 -2 Q-14 -38 -39 -72 M-17 -38 L-39 -42 M-10 -22 L-31 -20 M-20 -49 L-24 -61" fill="none" stroke="#e5edc5" stroke-width="2" stroke-linecap="round" opacity=".52"/>
  </g>
  <g id="leafPair">
    <use href="#leaf" transform="rotate(-36) scale(1.05)"/>
    <use href="#leaf" transform="translate(20 -4) rotate(28) scale(.88)"/>
    <use href="#leaf" transform="translate(8 -23) rotate(4) scale(.72)"/>
  </g>
  <g id="berry">
    <circle r="7" fill="#b76542"/><circle cx="-2" cy="-2" r="2" fill="#f2c49b" opacity=".7"/>
  </g>
  <g id="bird" fill="none" stroke="#52634b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".72">
    <path d="M0 12 Q16 -7 30 8 Q44 -8 60 12"/>
  </g>
  <pattern id="grain" width="54" height="54" patternUnits="userSpaceOnUse">
    <circle cx="7" cy="9" r="1.2" fill="#667d53" opacity=".13"/>
    <circle cx="40" cy="35" r=".9" fill="#99744b" opacity=".12"/>
    <path d="M19 47l4 -2" stroke="#667d53" stroke-width="1" opacity=".1"/>
  </pattern>
</defs>

<!-- Luz e atmosfera -->
<rect width="1900" height="1320" fill="url(#skyWash)"/>
<circle cx="1510" cy="220" r="270" fill="url(#sunGlow)"/>
<circle cx="1510" cy="220" r="82" fill="#f7e9b8" opacity=".22"/>
