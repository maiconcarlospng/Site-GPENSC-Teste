<!-- Seis galhos principais: brotam em alturas, direções e espessuras diferentes -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- O grupo: ramo ascendente que procura a luz -->
  <path d="M285 188 C354 112 422 151 490 126 C575 94 645 165 746 145" stroke="#38291f" stroke-width="60"/>
  <path d="M285 188 C354 112 422 151 490 126 C575 94 645 165 746 145" stroke="url(#branchWood)" stroke-width="43"/>
  <path d="M397 151 C390 99 365 71 330 50 M493 126 C523 68 565 53 603 56 M636 158 C671 121 701 110 742 113" stroke="#67482f" stroke-width="17"/>
  <!-- Pesquisa: curva longa, com uma elevação no meio -->
  <path d="M277 398 C360 468 427 369 512 395 C605 424 707 348 850 393" stroke="#38291f" stroke-width="50"/>
  <path d="M277 398 C360 468 427 369 512 395 C605 424 707 348 850 393" stroke="url(#branchWood)" stroke-width="35"/>
  <path d="M408 424 C420 473 397 500 365 524 M515 395 C552 347 587 326 626 332 M726 370 C757 327 794 316 832 326" stroke="#67482f" stroke-width="15"/>
