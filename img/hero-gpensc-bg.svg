<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" fill="none">
  <defs>
    <linearGradient id="leaf" x1="1020" y1="110" x2="1390" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7D65B"/>
      <stop offset="1" stop-color="#5F9A3E"/>
    </linearGradient>
    <linearGradient id="orange" x1="1370" y1="60" x2="1600" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F39A32"/>
      <stop offset="1" stop-color="#D9731F"/>
    </linearGradient>
  </defs>

  <!-- Formas curvas derivadas da divisão cromática da marca: verde, laranja e vermelho.
       A composição não reproduz a lupa; amplia apenas os gestos gráficos da identidade. -->
  <path d="M1190 -45C1307 5 1360 66 1411 141C1455 206 1539 227 1640 211V-45H1190Z" fill="#D43A2F"/>
  <path d="M1399 122C1497 116 1586 175 1650 279V470H1534C1455 391 1406 305 1399 122Z" fill="url(#orange)"/>
  <path d="M1002 468C1020 330 1114 190 1304 98C1371 197 1381 330 1296 468H1002Z" fill="url(#leaf)"/>

  <!-- Recorte claro entre as três áreas, como no símbolo original -->
  <path d="M1308 91C1342 116 1371 151 1394 192" stroke="#F3ECDD" stroke-width="13" stroke-linecap="round"/>
  <path d="M1378 200C1397 250 1410 310 1408 366" stroke="#F3ECDD" stroke-width="10" stroke-linecap="round" opacity=".9"/>

  <!-- Nervação foliar: uma nervura central contínua e nervuras secundárias
       alternadas, suavemente arqueadas e ligadas à nervura principal. -->
  <g stroke="#285D35" stroke-linecap="round" stroke-linejoin="round" opacity=".72">
    <!-- Nervura central -->
    <path d="M1072 448C1152 363 1236 239 1310 112"
          fill="none" stroke-width="7"/>

    <!-- Nervuras secundárias do lado esquerdo da nervura central -->
    <g fill="none" stroke-width="4">
      <path d="M1110 405C1080 412 1048 417 1018 415"/>
      <path d="M1143 365C1110 360 1072 354 1032 350"/>
      <path d="M1177 321C1142 307 1101 298 1058 296"/>
      <path d="M1210 276C1175 255 1135 240 1090 238"/>
      <path d="M1240 230C1208 207 1170 190 1135 190"/>
      <path d="M1268 184C1240 162 1210 148 1180 151"/>
      <path d="M1290 145C1270 130 1250 121 1228 124"/>
    </g>

    <!-- Nervuras secundárias do lado direito: acompanham a margem da folha -->
    <g fill="none" stroke-width="4">
      <path d="M1110 405C1170 418 1240 429 1322 428"/>
      <path d="M1143 365C1205 382 1275 391 1342 383"/>
      <path d="M1177 321C1238 342 1305 350 1360 337"/>
      <path d="M1210 276C1270 296 1325 300 1370 286"/>
      <path d="M1240 230C1290 248 1330 249 1360 236"/>
      <path d="M1268 184C1305 198 1332 195 1345 181"/>
      <path d="M1290 145C1312 153 1328 149 1336 137"/>
    </g>
  </g>

  <!-- Pequenos recortes claros dão textura de impressão, sem competir com o nome -->
  <g fill="#F3ECDD" opacity=".76">
    <circle cx="1460" cy="80" r="4"/>
    <circle cx="1490" cy="101" r="2.5"/>
    <circle cx="1516" cy="71" r="3"/>
    <circle cx="1438" cy="381" r="3.5"/>
    <circle cx="1470" cy="402" r="2.5"/>
    <circle cx="1501" cy="378" r="3"/>
  </g>
  <path d="M1468 24C1510 43 1544 69 1575 109M1474 420C1525 397 1566 390 1612 402" stroke="#F3ECDD" stroke-width="3" stroke-linecap="round" opacity=".42"/>
</svg>