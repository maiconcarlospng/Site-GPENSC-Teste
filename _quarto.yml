# =====================================================================
# _quarto.yml  –  CONFIGURAÇÃO GERAL DO SITE
# =====================================================================

project:
  type: website
  render:
    - "*.qmd"                 # só renderiza páginas .qmd (ignora README.md e COMO-EDITAR.md)
  resources:
    - img/**                  # copia TODAS as imagens para o site
    - "admin/**"              # copia a pasta do painel Sveltia CMS
    - "data/**"               # <--- NOVO: Copia os dados do CMS (noticias.yml) para o site final

lang: pt-BR

website:
  title: "GPENSC"
  description: "Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva – UFOP"
  favicon: img/logo_gpensc.png
  search: true                # Lupa de busca no menu

  navbar:
    logo: img/logo_gpensc.png
    background: light
    
    right:
      - href: sobre.qmd
        text: Quem somos
      - href: linhas.qmd
        text: Linhas de pesquisa
      - text: Pesquisa
        menu:
          - href: projetos.qmd
            text: Projetos
          - href: publicacoes.qmd
            text: Publicações
      - text: Extensão
        menu:
          - href: extensao.qmd
            text: Projetos de extensão
          - href: noar.qmd
            text: GPENSC no Ar
      - href: disciplinas.qmd
        text: Disciplinas
      - text: Biblioteca virtual
        menu:
          - href: teses.qmd
            text: Teses e dissertações
          - href: livros.qmd
            text: Livros
          - href: videos.qmd
            text: Vídeos
          - href: sites.qmd
            text: Sites recomendados
      - href: noticias.qmd
        text: Notícias
      - href: agenda.qmd
        text: Agenda
      - href: contato.qmd
        text: Contato

  page-footer:
    left: |
      [Quem somos](sobre.qmd) · [Notícias](noticias.qmd) · [Agenda](agenda.qmd) · [Contato](contato.qmd)
    center: |
      © GPENSC · Universidade Federal de Ouro Preto · <a href="/admin/" style="opacity: 0.4; text-decoration: none; font-size: 0.85em;">admin</a>
    right: |
      [<i class="bi bi-instagram"></i>](https://instagram.com/gpenscufop){aria-label="Instagram" title="Instagram"}
      [<i class="bi bi-envelope"></i>](mailto:gpensc@ufop.edu.br){aria-label="E-mail" title="E-mail"}

format:
  html:
    theme: [default, custom.scss]
    css: styles.css
    page-layout: full
    include-after-body: lupa.html
    toc: false
    smooth-scroll: true

execute:
  echo: false
  warning: false
  message: false
  freeze: false               # <--- NOVO: Força o Quarto a recalcular as notícias a cada publicação