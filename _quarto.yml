# =====================================================================
# _quarto.yml  –  CONFIGURAÇÃO GERAL DO SITE
# =====================================================================

project:
  type: website
  render:
    - "*.qmd"
    - "!partials/**"            # trechos incluídos nas páginas, nunca páginas independentes
  resources:
    - img/**                  # copia TODAS as imagens para o site
    - "js/**"
    - "admin/**"              # copia a pasta do painel Sveltia CMS
    - "data/**"               # <--- NOVO: Copia os dados do CMS (noticias.yml) para o site final

lang: pt-BR

website:
  title: "GPENSC"
  description: "Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva – UFOP"
  favicon: img/logo_gpensc.png
  search: true                # Lupa de busca no menu

  navbar:
    logo: img/logo_gpensc.png
    background: light
    
    right:
      - href: index.qmd
        text: Início
      - text: O GPENSC
        menu:
          - text: Quem somos
            href: grupo.qmd#sobre
          - text: Nossa história
            href: grupo.qmd#historia
          - text: Equipe e integrantes
            href: equipe.qmd
          - text: Parcerias
            href: grupo.qmd#parcerias
      - text: Pesquisa
        menu:
          - text: Visão geral
            href: pesquisa.qmd
          - text: Linhas de pesquisa
            href: linhas.qmd
          - text: Projetos de pesquisa
            href: projetos.qmd
          - text: Publicações
            href: publicacoes.qmd
          - text: Teses e dissertações
            href: teses.qmd
          - text: Árvore do conhecimento
            href: arvore.qmd
      - text: Extensão e formação
        menu:
          - text: Projetos de extensão
            href: extensao.qmd
          - text: Vi no Rótulo
            href: vi-no-rotulo.qmd
          - text: Ensino e formação
            href: ensino.qmd
          - text: Capacitação em Epidemiologia e Análise de Dados
            href: capacitacao-epidemiologia.qmd
      - text: Conteúdos
        menu:
          - text: Materiais educativos
            href: conteudos.qmd#materiais
          - text: Vídeos
            href: conteudos.qmd#videos
          - text: Podcasts
            href: conteudos.qmd#podcasts
          - text: Livros e e-books
            href: conteudos.qmd#livros
          - text: Ciência para a sociedade
            href: conteudos.qmd#resultados
      - text: Atualizações
        menu:
          - text: Notícias
            href: atualizacoes.qmd#noticias
          - text: Agenda
            href: atualizacoes.qmd#agenda
      - href: grupo.qmd#contato
        text: Contato

  page-footer:
    left: |
      <div id="gp-institutional-footer"><div class="gp-footer-main"><div class="gp-footer-identity"><a class="gp-footer-name" href="index.html" aria-label="GPENSC — página inicial">GPENSC</a><p>Grupo de Pesquisa e Ensino em<br class="gp-footer-break"> Nutrição e Saúde Coletiva</p><p class="gp-footer-affiliation">Escola de Nutrição · Universidade Federal de Ouro Preto</p></div><nav class="gp-footer-links" aria-label="Links do rodapé"><a href="grupo.html#sobre">O grupo</a><a href="pesquisa.html">Pesquisa</a><a href="atualizacoes.html#agenda">Agenda</a><a href="grupo.html#contato">Contato</a></nav></div><div class="gp-footer-base"><span>© GPENSC · UFOP</span><a class="gp-footer-admin" href="admin/" aria-label="Acessar o painel administrativo">Admin</a></div></div>
format:
  html:
    theme: [default, custom.scss]
    css:
      - styles-mobile-v4.css
      - styles-mobile-v5.css
      - styles-navbar-v6.css
      - styles-conteudo-v7.css
      - styles-navbar-v7.css
      - styles-navbar-v8.css
      - styles-busca-v9.css
      - styles-spotify-v10.css
      - styles-timeline-v12.css
      - styles-parcerias-v13.css
      - styles-linhas-v14.css
      - styles-geral-v15.css
      - styles-menu-mobile-v16.css
      - styles-home-v17.css
      - styles-agenda-v18.css
      - styles-gpensc-v26.css
      - styles-gpensc-v27.css
      - styles-direcao-v28.css
      - styles-projetos-v30.css
      - styles-identidades-v31.css
      - styles-revisao-mobile-v32.css
      - styles-home-fix-v33.css
      - styles-identidade-v34.css
      - styles-refino-v36.css
      - styles-editorial-v37.css
      - styles-galeria-v39.css
      - styles-resultados-v41.css
      - styles-galeria-v42.css
      - styles-mobile-v43.css
      - styles-arvore-v44.css
      - styles-institucional-v46.css
      - styles-layout-v47.css
      - styles-rodape-v48.css
      - styles-arvore-v49.css
      - styles-home-menu-v50.css
    page-layout: full
    include-after-body: lupa.html
    include-in-header: analytics.html
    toc: false
    smooth-scroll: true

execute:
  echo: false
  warning: false
  message: false
  freeze: auto                # Reaproveita resultados R; o workflow invalida o cache se os dados mudarem.