project:
  type: website
  render:
    - "*.qmd"
  resources:
    - "img/**"
    - "data/**"
    - "tree-interactions.js"

lang: pt-BR

website:
  title: "GPENSC"
  description: "Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva – UFOP"
  favicon: img/logo_gpensc.png
  search: false
  page-footer:
    center: |
      <span>GPENSC · Universidade Federal de Ouro Preto</span>

format:
  html:
    theme: default
    css: experimental.css
    include-before-body: tree-nav.html
    include-after-body: tree-interactions.html
    page-layout: full
    toc: false
    smooth-scroll: true

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
