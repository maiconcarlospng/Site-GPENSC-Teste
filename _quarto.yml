# =====================================================================
# _quarto.yml  –  CONFIGURAÇÃO GERAL DO SITE
# =====================================================================

project:
  type: website
  render:
    - "*.qmd"                 # só renderiza páginas .qmd (ignora README.md e COMO-EDITAR.md)
  resources:
    - img/**                  # copia TODAS as imagens para o site
    - "js/**"
    - "admin/**"              # copia a pasta do painel Sveltia CMS
    - "data/**"               # <--- NOVO: Copia os dados do CMS (noticias.yml) para o site final

lang: pt-BR

website:
  title: "GPENSC"
  description: "Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva – UFOP"
  favicon: img/logo_gpensc.png
  search: true                # Lupa de busca no menu

  navbar:
    logo: img/logo_gpensc.png
    background: light
    
    right:
      - text: Grupo
        menu:
          - href: sobre.qmd
            text: Quem somos
          - href: historia.qmd
            text: Nossa história
          - href: arvore.qmd
            text: Árvore do conhecimento
          - href: parcerias.qmd
            text: Parcerias
          - href: impacto.qmd
            text: Impacto social
      - text: Pesquisa
        menu:
          - href: pesquisa.qmd
            text: Pesquisa — visão geral
          - href: linhas.qmd
            text: Linhas de pesquisa
          - href: projetos.qmd
            text: Projetos
          - href: publicacoes.qmd
            text: Publicações
          - href: teses.qmd
            text: Teses e dissertações
          - href: metodos.qmd
            text: Metodologias
      - href: extensao.qmd
        text: Extensão
      - href: ensino.qmd
        text: Ensino
      - text: Divulgação
        menu:
          - href: divulgacao.qmd
            text: Divulgação científica
          - href: resultados.qmd
            text: Ciência para a sociedade
          - href: materiais.qmd
            text: Materiais educativos
          - href: podcasts.qmd
            text: Podcasts
          - href: livros.qmd
            text: Livros e e-books
          - href: videos.qmd
            text: Vídeos
      - href: agenda.qmd
        text: Agenda
      - href: noticias.qmd
        text: Notícias
      - href: contato.qmd
        text: Contato

  page-footer:
    left: |
      <div class="gp-footer-bottom">
      <span class="gp-footer-copyright">© GPENSC · Universidade Federal de Ouro Preto. Todos os direitos reservados.</span>
      <a class="gp-footer-admin-link" href="admin/">Admin</a>
      </div>
format:
  html:
    theme: [default, custom.scss]
    css:
      - styles-mobile-v4.css
      - styles-mobile-v5.css
      - styles-navbar-v6.css
      - styles-conteudo-v7.css
      - styles-navbar-v7.css
      - styles-navbar-v8.css
      - styles-busca-v9.css
      - styles-spotify-v10.css
      - styles-timeline-v12.css
      - styles-parcerias-v13.css
      - styles-linhas-v14.css
      - styles-geral-v15.css
      - styles-menu-mobile-v16.css
      - styles-home-v17.css
      - styles-agenda-v18.css
      - styles-gpensc-v26.css
      - styles-gpensc-v27.css
      - styles-direcao-v28.css
      - styles-arvore-v29.css
      - styles-projetos-v30.css
      - styles-identidades-v31.css
      - styles-revisao-mobile-v32.css
      - styles-home-fix-v33.css
      - styles-identidade-v34.css
      - styles-arvore-v35.css
      - styles-refino-v36.css
      - styles-editorial-v37.css
      - styles-arvore-v38.css
      - styles-galeria-v39.css
      - styles-arvore-v40.css
      - styles-resultados-v41.css
    page-layout: full
    include-after-body: lupa.html
    include-in-header: analytics.html
    toc: false
    smooth-scroll: true

execute:
  echo: false
  warning: false
  message: false
  freeze: auto                # Reaproveita resultados R; o workflow invalida o cache se os dados mudarem.