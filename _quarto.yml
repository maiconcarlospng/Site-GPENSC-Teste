# =====================================================================
# _quarto.yml  –  CONFIGURAÇÃO GERAL DO SITE
# =====================================================================

project:
  type: website
  render:
    - "*.qmd"                 # só renderiza páginas .qmd (ignora README.md e COMO-EDITAR.md)
  resources:
    - img/**                  # copia TODAS as imagens para o site
    - "admin/**"              # copia a pasta do painel Sveltia CMS
    - "data/**"               # <--- NOVO: Copia os dados do CMS (noticias.yml) para o site final

lang: pt-BR

website:
  title: "GPENSC"
  description: "Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva – UFOP"
  favicon: img/logo_gpensc.png
  search: true                # Lupa de busca no menu

  navbar:
    logo: img/logo_gpensc.png
    background: light
    
    right:
      - href: sobre.qmd
        text: Quem somos
      - href: linhas.qmd
        text: Linhas de pesquisa
      - text: Pesquisa
        menu:
          - href: projetos.qmd
            text: Projetos
          - href: publicacoes.qmd
            text: Publicações
      - text: Extensão
        menu:
          - href: extensao.qmd
            text: Projetos de extensão
          - href: noar.qmd
            text: GPENSC no Ar
      - href: disciplinas.qmd
        text: Disciplinas
      - text: Biblioteca virtual
        menu:
          - href: teses.qmd
            text: Teses e dissertações
          - href: livros.qmd
            text: Livros
          - href: videos.qmd
            text: Vídeos
          - href: sites.qmd
            text: Sites recomendados
      - href: noticias.qmd
        text: Notícias
      - href: agenda.qmd
        text: Agenda
      - href: contato.qmd
        text: Contato

  page-footer:
    left: |
      <div class="gp-footer-brand">
        <a class="gp-footer-brand-mark" href="index.html" aria-label="GPENSC — página inicial">
          <img src="img/logo_gpensc.png" alt="Logotipo do GPENSC">
          <span class="gp-footer-brand-wordmark">
            <strong>GPENSC</strong>
            <small>UFOP · Escola de Nutrição</small>
          </span>
        </a>
        <p class="gp-footer-description">
          Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva.
        </p>
        <p class="gp-footer-affiliation">
          Universidade Federal de Ouro Preto · Escola de Nutrição.
        </p>
      </div>
    center: |
      <div class="gp-footer-navigation">
        <h2 class="gp-footer-heading">Explore o site</h2>
        <nav class="gp-footer-links" aria-label="Navegação do rodapé">
          <a href="index.html">Início</a>
          <a href="sobre.html">Quem somos</a>
          <a href="linhas.html">Linhas de pesquisa</a>
          <a href="projetos.html">Projetos</a>
          <a href="publicacoes.html">Publicações</a>
          <a href="extensao.html">Extensão</a>
          <a href="noar.html">GPENSC no Ar</a>
          <a href="disciplinas.html">Disciplinas</a>
          <a href="teses.html">Teses e dissertações</a>
          <a href="livros.html">Livros</a>
          <a href="videos.html">Vídeos</a>
          <a href="sites.html">Sites recomendados</a>
          <a href="noticias.html">Notícias</a>
          <a href="agenda.html">Agenda</a>
          <a href="contato.html">Contato</a>
          <a href="admin/">Acesso administrativo</a>
        </nav>
      </div>
    right: |
      <div class="gp-footer-contact">
      <h2 class="gp-footer-heading">Contato e redes</h2>
      <div class="gp-footer-contact-list">
      <a class="gp-footer-contact-link" href="mailto:gpensc@ufop.edu.br"><i class="bi bi-envelope" aria-hidden="true"></i><span>gpensc@ufop.edu.br</span></a>
      <a class="gp-footer-contact-link" href="https://www.instagram.com/gpenscufop/" target="_blank" rel="noopener noreferrer"><i class="bi bi-instagram" aria-hidden="true"></i><span>@gpenscufop</span></a>
      <a class="gp-footer-contact-link" href="tel:+553135591800"><i class="bi bi-telephone" aria-hidden="true"></i><span>(31) 3559-1800 · telefone institucional</span></a>
      </div>
      <p class="gp-footer-address"><i class="bi bi-geo-alt" aria-hidden="true"></i><span>Escola de Nutrição, UFOP — Campus Morro do Cruzeiro, Ouro Preto/MG · CEP 35400-000</span></p>
      </div>

format:
  html:
    theme: [default, custom.scss]
    css: styles-mobile-v4.css
    page-layout: full
    include-after-body: lupa.html
    toc: false
    smooth-scroll: true

execute:
  echo: false
  warning: false
  message: false
  freeze: auto                # Reaproveita resultados R; o workflow invalida o cache se os dados mudarem.