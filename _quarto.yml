# =====================================================================
# _quarto.yml  –  CONFIGURAÇÃO GERAL DO SITE
# =====================================================================

project:
  type: website
  render:
    - "*.qmd"
    - "!partials/**"            # trechos incluídos nas páginas, nunca páginas independentes
  resources:
    - img/**                  # copia TODAS as imagens para o site
    - "js/**"
    - "admin/**"              # copia a pasta do painel Sveltia CMS
    - "data/**"               # <--- NOVO: Copia os dados do CMS (noticias.yml) para o site final

lang: pt-BR

website:
  title: "GPENSC"
  description: "Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva – UFOP"
  favicon: img/logo_gpensc.png
  search: true                # Lupa de busca no menu

  navbar:
    logo: img/logo_gpensc.png
    logo-alt: "GPENSC — página inicial"
    background: light
    
    right:
      # Navegação principal sem links repetidos: subáreas de divulgação ficam na própria página.
      - text: O GPENSC
        menu:
          - text: Quem somos
            href: grupo.qmd
          - text: Nossa história
            href: historia.qmd
          - text: Instituições parceiras
            href: parcerias.qmd
      - text: Pesquisa
        href: pesquisa.qmd
      - text: Extensão
        href: extensao.qmd
      - text: Ensino
        href: ensino.qmd
      - text: Divulgação
        menu:
          - text: Visão geral
            href: conteudos.qmd
          - text: Biblioteca
            href: biblioteca.qmd
          - text: Multimídia
            href: multimidia.qmd
          - text: Ciência para a sociedade
            href: ciencia-sociedade.qmd
      - text: Notícias
        href: noticias.qmd
      - text: Agenda
        href: agenda.qmd
      - text: Contato
        href: contato.qmd

  page-footer:
    left: |
      <div id="gp-institutional-footer"><div class="gp-footer-main"><div class="gp-footer-logos" aria-label="Vínculos institucionais"><a href="https://enut.ufop.br/" target="_blank" rel="noopener noreferrer" title="Escola de Nutrição da UFOP"><img src="img/logo_nutricao.png" alt="Escola de Nutrição — ENUT" loading="lazy"></a><a href="https://ufop.br/" target="_blank" rel="noopener noreferrer" title="Universidade Federal de Ouro Preto"><img src="img/ufop-logo.jpg" alt="Universidade Federal de Ouro Preto — UFOP" loading="lazy"></a><a href="https://posnutricao.ufop.br/" target="_blank" rel="noopener noreferrer" title="Programa de Pós-Graduação em Saúde e Nutrição"><img src="img/logo_ppgsn.png" alt="Programa de Pós-Graduação em Saúde e Nutrição — PPGSN" loading="lazy"></a></div><div class="gp-footer-identity"><a class="gp-footer-name" href="index.html" aria-label="GPENSC — página inicial">GPENSC</a><p>Grupo de Pesquisa e Ensino em<br class="gp-footer-break"> Nutrição e Saúde Coletiva</p><p class="gp-footer-affiliation">Escola de Nutrição · Universidade Federal de Ouro Preto</p></div><nav class="gp-footer-links" aria-label="Links do rodapé"><a href="grupo.html#sobre">O grupo</a><a href="pesquisa.html">Pesquisa</a><a href="agenda.html">Agenda</a><a href="contato.html">Contato</a></nav></div><div class="gp-footer-base"><span>© GPENSC · UFOP</span><a class="gp-footer-admin" href="admin/" aria-label="Acessar o painel administrativo">Admin</a></div></div>
format:
  html:
    theme: [default, custom.scss]
    css:
      - styles.css
      - svg-institucional.css
      - site-ajustes.css
      - site-escala.css
      - home-refinamentos.css
      - site-density.css
    page-layout: full
    include-after-body: lupa.html
    include-in-header: analytics.html
    toc: false
    smooth-scroll: true

execute:
  echo: false
  warning: false
  message: false
  freeze: auto                # Reaproveita resultados R; o workflow invalida o cache se os dados mudarem.