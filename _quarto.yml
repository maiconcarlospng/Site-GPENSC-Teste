# =====================================================================
# _quarto.yml  –  CONFIGURAÇÃO GERAL DO SITE
# =====================================================================

project:
  type: website
  render:
    - "*.qmd"                 # só renderiza páginas .qmd (ignora README.md e COMO-EDITAR.md)
  resources:
    - img/**                  # copia TODAS as imagens para o site
    - "admin/**"              # copia a pasta do painel Sveltia CMS
    - "data/**"               # <--- NOVO: Copia os dados do CMS (noticias.yml) para o site final

lang: pt-BR

website:
  title: "GPENSC"
  description: "Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva – UFOP"
  favicon: img/logo_gpensc.png
  search: true                # Lupa de busca no menu

  navbar:
    logo: img/logo_gpensc.png
    background: light
    
    right:
      - href: sobre.qmd
        text: Quem somos
      - href: linhas.qmd
        text: Linhas de pesquisa
      - text: Pesquisa
        menu:
          - href: projetos.qmd
            text: Projetos
          - href: publicacoes.qmd
            text: Publicações
      - text: Extensão
        menu:
          - href: extensao.qmd
            text: Projetos de extensão
          - href: noar.qmd
            text: GPENSC no Ar
      - href: disciplinas.qmd
        text: Disciplinas
      - text: Biblioteca virtual
        menu:
          - href: teses.qmd
            text: Teses e dissertações
          - href: livros.qmd
            text: Livros
          - href: videos.qmd
            text: Vídeos
          - href: sites.qmd
            text: Sites recomendados
      - href: noticias.qmd
        text: Notícias
      - href: agenda.qmd
        text: Agenda
      - href: contato.qmd
        text: Contato

  page-footer:
    left: |
      <div class="gp-footer-bottom">
      <span class="gp-footer-copyright">© GPENSC · Universidade Federal de Ouro Preto. Todos os direitos reservados.</span>
      <a class="gp-footer-admin-link" href="https://maiconcarlospng.github.io/Site-GPENSC-Teste/admin/">Admin</a>
      </div>
    center: |
      <div class="gp-footer-support">
      <h2 class="gp-footer-section-title">Apoio e vínculos institucionais</h2>
      <div class="gp-footer-support-logos" aria-label="Instituições vinculadas">
      <a class="gp-footer-support-logo" href="https://posnutricao.ufop.br/" target="_blank" rel="noopener noreferrer" aria-label="Programa de Pós-Graduação em Saúde e Nutrição da UFOP" title="PPGSN — UFOP">
      <img src="img/logo_ppgsn.png" alt="Logotipo do Programa de Pós-Graduação em Saúde e Nutrição">
      <span class="gp-footer-support-name">Programa de Pós-Graduação em Saúde e Nutrição</span>
      </a>
      <a class="gp-footer-support-logo" href="https://enut.ufop.br" target="_blank" rel="noopener noreferrer" aria-label="Escola de Nutrição da UFOP" title="Escola de Nutrição — UFOP">
      <img src="img/logo_nutricao.png" alt="Logotipo da Escola de Nutrição">
      <span class="gp-footer-support-name">Escola de Nutrição</span>
      </a>
      <a class="gp-footer-support-logo" href="https://ufop.br" target="_blank" rel="noopener noreferrer" aria-label="Universidade Federal de Ouro Preto" title="UFOP">
      <img src="img/ufop-logo.jpg" alt="Logotipo da Universidade Federal de Ouro Preto">
      <span class="gp-footer-support-name">Universidade Federal de Ouro Preto</span>
      </a>
      </div>
      </div>

format:
  html:
    theme: [default, custom.scss]
    css: styles-mobile-v4.css
    page-layout: full
    include-after-body: lupa.html
    toc: false
    smooth-scroll: true

execute:
  echo: false
  warning: false
  message: false
  freeze: auto                # Reaproveita resultados R; o workflow invalida o cache se os dados mudarem.