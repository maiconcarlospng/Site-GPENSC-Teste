<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Administração - GPENSC</title>
    <link rel="icon" href="../img/favicon.png" />
    <link rel="cms-config-url" type="application/yaml" href="config.yml?revision=galeria-multipla-v4" />

    <style>
      body {
        background-color: #f8f9fa !important;
      }

      .gpen-admin-boas-vindas {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 18px;
        background: linear-gradient(145deg, #f8faf9 0%, #edf4ef 100%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .gpen-admin-cartao {
        width: min(100%, 520px);
        box-sizing: border-box;
        padding: 38px 30px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e1e9e3;
        border-radius: 20px;
        box-shadow: 0 16px 44px rgba(24, 65, 42, 0.09);
      }

      .gpen-admin-logo {
        display: block;
        width: min(100%, 210px);
        max-height: 170px;
        object-fit: contain;
        margin: 0 auto 24px;
      }

      .gpen-admin-cartao h1 {
        margin: 0 0 10px;
        color: #234b35;
        font-size: clamp(1.5rem, 5vw, 2rem);
        font-weight: 700;
        line-height: 1.2;
      }

      .gpen-admin-cartao p {
        margin: 0 auto 24px;
        max-width: 390px;
        color: #526257;
        font-size: 1rem;
        line-height: 1.65;
      }

      .gpen-admin-entrar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 24px;
        border: 0;
        border-radius: 9px !important;
        background: #286442;
        color: #ffffff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition: background-color .15s ease, transform .15s ease;
      }

      .gpen-admin-entrar:hover {
        background: #1e5033;
        transform: translateY(-1px);
      }

      .gpen-admin-voltar {
        display: inline-block;
        margin-top: 20px;
        color: #526257;
        font-size: .9rem;
        text-decoration: none;
      }

      .gpen-admin-voltar:hover {
        color: #234b35;
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .gpen-admin-cartao { padding: 30px 20px; }
        .gpen-admin-logo { width: min(100%, 175px); }
      }

      [hidden] { display: none !important; }

      button {
        border-radius: 8px !important;
      }

      .gpen-sc-galeria {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
      }

      .gpen-sc-galeria__toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .gpen-sc-galeria__count {
        color: #5b6470;
        font-size: 0.9rem;
      }

      .gpen-sc-galeria__grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 14px;
      }

      .gpen-sc-galeria__item {
        min-width: 0;
        overflow: hidden;
        border: 1px solid #d9dee5;
        border-radius: 10px;
        background: #fff;
      }

      .gpen-sc-galeria__imagem {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        background: #eef1f4;
      }

      .gpen-sc-galeria__imagem img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .gpen-sc-galeria__sem-imagem {
        padding: 12px;
        color: #5b6470;
        font-size: 0.85rem;
        overflow-wrap: anywhere;
      }

      .gpen-sc-galeria__corpo {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
      }

      .gpen-sc-galeria__corpo label {
        font-size: 0.85rem;
        font-weight: 600;
      }

      .gpen-sc-galeria__legenda {
        box-sizing: border-box;
        width: 100%;
        min-height: 38px;
        padding: 8px 10px;
        border: 1px solid #cbd2da;
        border-radius: 6px;
        font: inherit;
      }

      .gpen-sc-galeria__acoes {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .gpen-sc-galeria__acoes button {
        padding: 6px 10px;
        border: 1px solid #cbd2da;
        background: #fff;
        cursor: pointer;
      }

      .gpen-sc-galeria__acoes button:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }

      .gpen-sc-galeria__erro {
        color: #b42318;
        margin: 0;
      }

      .gpen-sc-galeria__vazia {
        padding: 18px;
        border: 1px dashed #bdc5cf;
        border-radius: 8px;
        color: #5b6470 !important;
      }

      /* O CMS tem tema escuro; os cartões da galeria usam controles claros próprios. */
      .gpen-sc-galeria__corpo label {
        color: #4b5563 !important;
      }

      .gpen-sc-galeria__legenda {
        background-color: #ffffff !important;
        color: #1f2937 !important;
      }

      .gpen-sc-galeria__legenda::placeholder {
        color: #6b7280 !important;
        opacity: 1;
      }

      .gpen-sc-galeria__acoes button {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        min-height: 34px;
        padding: 7px 10px !important;
        color: #263238 !important;
        background-color: #f7f8fa !important;
        border: 1px solid #cbd2da !important;
        font-size: 0.82rem !important;
        font-weight: 600 !important;
        line-height: 1.3 !important;
        white-space: nowrap;
      }

      .gpen-sc-galeria__acoes button:hover:not(:disabled) {
        background-color: #e9edf2 !important;
        border-color: #9ca3af !important;
      }

      .gpen-sc-galeria__acoes button:disabled {
        color: #9ca3af !important;
        background-color: #f3f4f6 !important;
      }

      .gpen-sc-galeria__arquivo {
        overflow-wrap: anywhere;
        color: #6b7280 !important;
        font-size: 0.76rem !important;
      }

      .gpen-sc-galeria__preview {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
        gap: 12px;
        padding: 12px 0;
      }

      .gpen-sc-galeria__preview figure {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        border: 1px solid #d9dee5;
        border-radius: 8px;
        background: #ffffff;
      }

      .gpen-sc-galeria__preview img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }

      .gpen-sc-galeria__preview figcaption {
        padding: 8px;
        color: #374151 !important;
        font-size: 0.82rem !important;
        overflow-wrap: anywhere;
      }

      .gpen-sc-galeria__preview-vazia {
        padding: 12px;
        color: #aeb7c2 !important;
      }
    </style>
  </head>
  <body>
    <main class="gpen-admin-boas-vindas" id="gpen-admin-boas-vindas">
      <section class="gpen-admin-cartao" aria-labelledby="gpen-admin-titulo">
        <img class="gpen-admin-logo" src="../img/logo_gpensc.png" alt="Logo do GPENSC" />
        <h1 id="gpen-admin-titulo">Painel Administrativo</h1>
        <p>Bem-vindo(a) ao espaço de atualização do site do Grupo de Pesquisa e Ensino em Nutrição e Saúde Coletiva.</p>
        <button class="gpen-admin-entrar" id="gpen-admin-entrar" type="button">Acessar painel</button>
        <br />
        <a class="gpen-admin-voltar" href="../">Voltar ao site do GPENSC</a>
      </section>
    </main>

    <!-- Registra o widget personalizado antes de iniciar o CMS. -->
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script src="galeria-multipla.js?v=20261021-6"></script>
    <script>
      document.getElementById("gpen-admin-entrar").addEventListener("click", function () {
        document.getElementById("gpen-admin-boas-vindas").hidden = true;
        document.title = "Painel Administrativo GPENSC";
        CMS.init();
      });
    </script>
  </body>
</html>
