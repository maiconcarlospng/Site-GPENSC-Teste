<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Administração - Decap CMS</title>
  
  <!-- Meta tag oficial do Netlify Identity -->
  <meta name="netlify-site-url" content="https://sitegpensc.netlify.app" />
  
  <!-- Script do Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script>
    // Sobrescreve a memoria do navegador (localStorage) para remover a URL antiga do GitHub
    localStorage.setItem("netlifySiteURL", "https://sitegpensc.netlify.app");

    if (window.netlifyIdentity) {
      window.netlifyIdentity.init({
        APIUrl: "https://sitegpensc.netlify.app/.netlify/identity"
      });

      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.reload();
          });
        }
      });
    }
  </script>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
