app_title: "Painel Administrativo GPENSC"
site_url: "https://maiconcarlospng.github.io/Site-GPENSC-Teste/"
display_url: "https://maiconcarlospng.github.io/Site-GPENSC-Teste/"
logo:
  src: "../img/logo_gpensc.png"

backend:
  name: github
  repo: maiconcarlospng/Site-GPENSC-Teste
  branch: main
  base_url: https://sveltia-cms-auth.maicon-carlos.workers.dev

locale: "pt"

media_folder: "img"
public_folder: "img"

collections:
  - name: "comunicacao"
    label: "01 · Conteúdo e comunicação"
    files:
        - label: "Notícias"
          name: "noticias"
          file: "data/noticias.yml"
          fields:
            - label: "Notícias"
              name: "itens"
              widget: "list"
              collapsed: true
              label_singular: "notícia"
              hint: "Preencha título, data e resumo. Revise os exemplos antes de publicar."
              summary: "{{fields.titulo}} — {{fields.data}}"
              fields:
                - { label: "Data", name: "data", widget: "string", hint: "Formato: AAAA-MM-DD" }
                - { label: "Categoria", name: "categoria", widget: "string", required: false }
                - { label: "Título", name: "titulo", widget: "string" }
                - { label: "Resumo", name: "resumo", widget: "text", required: false }
                - { label: "Conteúdo completo", name: "conteudo", widget: "text", required: false, hint: "Texto que aparece no detalhamento. Se ficar vazio, o site usa o resumo." }
                - { label: "Link da fonte original", name: "url", widget: "string", required: false }
                - { label: "Imagem", name: "imagem", widget: "image", required: false }
        - label: "Agenda e eventos"
          name: "eventos"
          file: "data/eventos.yml"
          fields:
            - label: "Agenda e eventos"
              name: "itens"
              widget: "list"
              collapsed: true
              label_singular: "evento"
              hint: "Use a data no formato AAAA-MM-DD. Eventos passados deixam de aparecer em próximos eventos."
              summary: "{{fields.data}} - {{fields.titulo}}"
              fields:
                - { label: "Data", name: "data", widget: "string", hint: "Formato: AAAA-MM-DD" }
                - { label: "Tipo", name: "tipo", widget: "string", required: false }
                - { label: "Título", name: "titulo", widget: "string" }
                - { label: "Local", name: "local", widget: "string", required: false }
                - { label: "Link", name: "url", widget: "string", required: false }
  - name: "pesquisa"
    label: "02 · Pesquisa e produção científica"
    files:
        - label: "Linhas de pesquisa"
          name: "linhas"
          file: "data/linhas.yml"
          fields:
            - label: "Linhas"
              name: "itens"
              widget: "list"
              collapsed: true
              label_singular: "linha de pesquisa"
              summary: "{{fields.nome}} — ID {{fields.id}}"
              fields:
                - { label: "ID", name: "id", widget: "string", hint: "Código curto, usado em Projetos e Publicações. Não mude depois de criado." }
                - { label: "Nome", name: "nome", widget: "string" }
                - { label: "Descrição", name: "descricao", widget: "text", required: false }
                - { label: "Palavras-chave", name: "palavras_chave", widget: "string", required: false }
        - label: "Projetos"
          name: "projetos"
          file: "data/projetos.yml"
          fields:
            - label: "Projetos"
              name: "itens"
              widget: "list"
              collapsed: true
              label_singular: "projeto"
              summary: "{{fields.titulo}} — {{fields.situacao}}"
              fields:
                - { label: "Título", name: "titulo", widget: "string" }
                - { label: "Tipo", name: "tipo", widget: "string", required: false }
                - { label: "Situação", name: "situacao", widget: "string", required: false }
                - { label: "Coordenador", name: "coordenador", widget: "string", required: false }
                - { label: "Início", name: "inicio", widget: "string", required: false }
                - { label: "Fim", name: "fim", widget: "string", required: false }
                - { label: "ID da linha de pesquisa", name: "linha_id", widget: "string", required: false }
                - { label: "Financiamento", name: "financiamento", widget: "string", required: false }
        - label: "Publicações"
          name: "publicacoes"
          file: "data/publicacoes.yml"
          fields:
            - label: "Publicações"
              name: "itens"
              widget: "list"
              collapsed: true
              label_singular: "publicação"
              summary: "{{fields.titulo}} — {{fields.ano}}"
              fields:
                - { label: "Ano", name: "ano", widget: "string" }
                - { label: "Tipo", name: "tipo", widget: "string", required: false }
                - { label: "Autores", name: "autores", widget: "string", required: false }
                - { label: "Título", name: "titulo", widget: "string" }
                - { label: "Veículo", name: "veiculo", widget: "string", required: false }
                - { label: "DOI", name: "doi", widget: "string", required: false }
                - { label: "Link", name: "url", widget: "string", required: false }
                - { label: "ID da linha de pesquisa", name: "linha_id", widget: "string", required: false }
        - label: "Livros"
          name: "livros"
          file: "data/livros.yml"
          fields:
            - label: "Livros"
              name: "itens"
              widget: "list"
              collapsed: true
              label_singular: "livro"
              summary: "{{fields.ano}} - {{fields.titulo}}"
              fields:
                - { label: "Ano", name: "ano", widget: "string" }
                - { label: "Título", name: "titulo", widget: "string" }
                - { label: "Autores", name: "autores", widget: "string", required: false }
                - { label: "Editora", name: "editora", widget: "string", required: false }
                - { label: "Link", name: "url", widget: "string", required: false }
        - label: "Defesas e bancas"
          name: "defesas"
          file: "data/defesas.yml"
          fields:
            - label: "Defesas e bancas"
              name: "itens"
              widget: "list"
              collapsed: true
              label_singular: "defesa"
              summary: "{{fields.titulo}} — {{fields.autor}}"
              fields:
                - { label: "Data", name: "data", widget: "string", hint: "Formato: AAAA-MM-DD" }
                - { label: "Nível", name: "nivel", widget: "string", required: false }
                - { label: "Etapa", name: "etapa", widget: "string", required: false }
                - { label: "Autor", name: "autor", widget: "string" }
                - { label: "Título", name: "titulo", widget: "string" }
                - { label: "Orientador", name: "orientador", widget: "string", required: false }
                - { label: "Link", name: "url", widget: "string", required: false }
  - name: "ensino_equipe"
    label: "03 · Ensino e equipe"
    files:
        - label: "Equipe e integrantes"
          name: "equipe"
          file: "data/equipe.yml"
          fields:
            - label: "Membros"
              name: "itens"
              widget: "list"
              collapsed: true
              label_singular: "membro"
              hint: "Cadastre integrantes reais e mantenha a categoria atualizada. Divulgue fotos e links apenas com autorização."
              summary: "{{fields.nome}} — {{fields.categoria}}"
              fields:
                - { label: "Nome", name: "nome", widget: "string" }
                - { label: "Categoria na equipe", name: "categoria", widget: "select", options: ["Coordenação", "Docentes e pesquisadores", "Pós-graduandos", "Graduandos", "Colaboradores e egressos", "Outros integrantes"], required: false, hint: "Usada para agrupar os perfis na página pública." }
                - { label: "Papel", name: "papel", widget: "string", required: false }
                - { label: "Formação", name: "formacao", widget: "string", required: false }
                - { label: "Foto", name: "foto", widget: "image", required: false }
                - { label: "Lattes", name: "lattes", widget: "string", required: false }
                - { label: "ORCID", name: "orcid", widget: "string", required: false }
        - label: "Disciplinas e ensino"
          name: "disciplinas"
          file: "data/disciplinas.yml"
          fields:
            - label: "Disciplinas e ensino"
              name: "itens"
              widget: "list"
              collapsed: true
              label_singular: "disciplina"
              summary: "{{fields.nome}} — {{fields.codigo}}"
              fields:
                - { label: "Nível", name: "nivel", widget: "string", required: false }
                - { label: "Código", name: "codigo", widget: "string", required: false }
                - { label: "Nome", name: "nome", widget: "string" }
                - { label: "Docente", name: "docente", widget: "string", required: false }
                - { label: "Período", name: "periodo", widget: "string", required: false }
                - { label: "Ementa", name: "ementa", widget: "text", required: false }
  - name: "midia_parcerias"
    label: "04 · Mídia, galeria e parcerias"
    files:
        - label: "Galeria de fotos"
          name: "galeria"
          file: "data/galeria.yml"
          fields:
            - label: "Fotos (seleção múltipla)"
              name: "itens"
              widget: "galeria-multipla-v2"
              hint: "Selecione várias fotos, abra Ajustar recorte em cada foto para mudar o foco/zoom e confira a prévia antes de salvar."
        - label: "GPENSC no Ar"
          name: "noar"
          file: "data/noar.yml"
          fields:
            - label: "Episódios"
              name: "itens"
              widget: "list"
              collapsed: true
              label_singular: "episódio"
              summary: "{{fields.titulo}} — Ep. {{fields.episodio}}"
              fields:
                - { label: "Episódio", name: "episodio", widget: "string" }
                - { label: "Título", name: "titulo", widget: "string" }
                - { label: "Convidado", name: "convidado", widget: "string", required: false }
                - { label: "Data", name: "data", widget: "string", hint: "Formato: AAAA-MM-DD", required: false }
                - { label: "Link", name: "link", widget: "string", required: false }
                - { label: "Observação", name: "obs", widget: "text", required: false }
        - label: "Vídeos publicados"
          name: "videos"
          file: "data/videos.yml"
          fields:
            - label: "Vídeos publicados"
              name: "itens"
              widget: "list"
              collapsed: true
              label_singular: "vídeo"
              summary: "{{fields.titulo}}"
              fields:
                - { label: "Data", name: "data", widget: "string", hint: "Formato: AAAA-MM-DD", required: false }
                - { label: "Título", name: "titulo", widget: "string" }
                - { label: "Descrição", name: "descricao", widget: "text", required: false }
                - { label: "Link", name: "url", widget: "string" }
        - label: "Sites recomendados"
          name: "sites"
          file: "data/sites.yml"
          fields:
            - label: "Sites"
              name: "itens"
              widget: "list"
              collapsed: true
              label_singular: "site"
              summary: "{{fields.nome}}"
              fields:
                - { label: "Nome", name: "nome", widget: "string" }
                - { label: "Descrição", name: "descricao", widget: "text", required: false }
                - { label: "Link", name: "url", widget: "string" }
        - label: "Instituições parceiras"
          name: "apoio"
          file: "data/apoio.yml"
          fields:
            - label: "Instituições"
              name: "itens"
              widget: "list"
              collapsed: true
              label_singular: "instituição"
              summary: "{{fields.nome}}"
              fields:
                - { label: "Nome", name: "nome", widget: "string" }
                - { label: "Logo", name: "logo", widget: "image" }
                - { label: "Link", name: "url", widget: "string", required: false }
  - name: "configuracoes"
    label: "⚙️ Configurações do site · Avançado"
    files:
        - label: "Textos, links e controles do site"
          name: "configuracoes_site"
          file: "_variables.yml"
          fields:
            - { label: "01 · Identidade — Sigla", name: "sigla", widget: "string" }
            - { label: "01 · Identidade — Nome completo do grupo", name: "nome_completo", widget: "string" }
            - { label: "01 · Identidade — Instituição", name: "instituicao", widget: "string" }
            - { label: "01 · Identidade — Unidade", name: "unidade", widget: "string" }
            - { label: "01 · Identidade — Departamento", name: "departamento", widget: "string" }
            - { label: "02 · Vínculos institucionais — Link PPGSN", name: "link_ppgsn", widget: "string" }
            - { label: "02 · Vínculos institucionais — Link Escola de Nutrição", name: "link_escola", widget: "string" }
            - { label: "02 · Vínculos institucionais — Link UFOP", name: "link_ufop", widget: "string" }
            - { label: "02 · Vínculos institucionais — Link Diretório CNPq", name: "link_dgp", widget: "string" }
            - { label: "03 · História, missão e objetivos — Resumo da página inicial", name: "resumo", widget: "text" }
            - { label: "03 · História, missão e objetivos — Histórico", name: "historico", widget: "text" }
            - { label: "03 · História, missão e objetivos — Missão", name: "missao", widget: "text" }
            - { label: "03 · História, missão e objetivos — Visão", name: "visao", widget: "text" }
            - { label: "03 · História, missão e objetivos — Objetivo 1", name: "objetivo1", widget: "text" }
            - { label: "03 · História, missão e objetivos — Objetivo 2", name: "objetivo2", widget: "text" }
            - { label: "03 · História, missão e objetivos — Objetivo 3", name: "objetivo3", widget: "text" }
            - { label: "03 · História, missão e objetivos — Objetivo 4", name: "objetivo4", widget: "text" }
            - { label: "04 · Página inicial — Título: pesquisas na página inicial", name: "titulo_home_pesquisas", widget: "string" }
            - { label: "04 · Página inicial — Título: notícias na página inicial", name: "titulo_home_noticias", widget: "string" }
            - { label: "04 · Página inicial — Aviso: título das notícias de demonstração", name: "texto_aviso_noticias_home_titulo", widget: "string" }
            - { label: "04 · Página inicial — Aviso: texto das notícias de demonstração", name: "texto_aviso_noticias_home", widget: "text" }
            - { label: "04 · Página inicial — Chamada da agenda na página inicial", name: "titulo_home_agenda", widget: "string" }
            - { label: "04 · Página inicial — Título GPENSC no Ar na página inicial", name: "titulo_home_noar", widget: "string" }
            - { label: "04 · Página inicial — Descrição GPENSC no Ar na página inicial", name: "texto_home_noar", widget: "text" }
            - { label: "04 · Página inicial — Texto do botão Sobre nós", name: "botao_sobre", widget: "string" }
            - { label: "05 · Página Quem somos — Título da missão", name: "titulo_missao", widget: "string" }
            - { label: "05 · Página Quem somos — Título da visão", name: "titulo_visao", widget: "string" }
            - { label: "05 · Página Quem somos — Título dos objetivos", name: "titulo_objetivos", widget: "string" }
            - { label: "05 · Página Quem somos — Título dos vínculos", name: "titulo_vinculos", widget: "string" }
            - { label: "05 · Página Quem somos — Título da equipe", name: "titulo_equipe", widget: "string" }
            - { label: "05 · Página Quem somos — Aviso: título da equipe", name: "texto_aviso_equipe_titulo", widget: "string" }
            - { label: "05 · Página Quem somos — Aviso: texto da equipe", name: "texto_aviso_equipe", widget: "text" }
            - { label: "05 · Página Quem somos — Chamada final da página Quem somos", name: "texto_cta_sobre", widget: "text" }
            - { label: "05 · Página Quem somos — Botão Diretório CNPq", name: "botao_dgp", widget: "string" }
            - { label: "06 · Pesquisa, ensino e extensão — Introdução da página Projetos", name: "intro_projetos", widget: "text" }
            - { label: "06 · Pesquisa, ensino e extensão — Introdução da página Extensão", name: "intro_extensao", widget: "text" }
            - { label: "07 · Agenda — Introdução da Agenda", name: "intro_agenda", widget: "text" }
            - { label: "07 · Agenda — Título Próximos eventos", name: "titulo_proximos_eventos", widget: "string" }
            - { label: "07 · Agenda — Título Eventos sem data", name: "titulo_eventos_sem_data", widget: "string" }
            - { label: "07 · Agenda — Botão Eventos anteriores", name: "botao_eventos_anteriores", widget: "string" }
            - { label: "08 · GPENSC no Ar — Nome do podcast", name: "podcast_nome", widget: "string" }
            - { label: "08 · GPENSC no Ar — Descrição do podcast", name: "podcast_descricao", widget: "text" }
            - { label: "08 · GPENSC no Ar — Link do podcast", name: "link_podcast", widget: "string", required: false }
            - { label: "08 · GPENSC no Ar — Introdução GPENSC no Ar", name: "intro_noar", widget: "text" }
            - { label: "09 · Contato e redes — E-mail", name: "email", widget: "string" }
            - { label: "09 · Contato e redes — Telefone", name: "telefone", widget: "string" }
            - { label: "09 · Contato e redes — Instagram (URL)", name: "instagram", widget: "string" }
            - { label: "09 · Contato e redes — Usuário Instagram", name: "instagram_user", widget: "string" }
            - { label: "09 · Contato e redes — YouTube", name: "youtube", widget: "string", required: false }
            - { label: "09 · Contato e redes — Spotify", name: "spotify", widget: "string", required: false }
            - { label: "09 · Contato e redes — Introdução Contato", name: "intro_contato", widget: "text" }
            - { label: "09 · Contato e redes — Título do cartão E-mail", name: "titulo_email", widget: "string" }
            - { label: "09 · Contato e redes — Título do cartão Instagram", name: "titulo_instagram", widget: "string" }
            - { label: "09 · Contato e redes — Título do cartão Localização", name: "titulo_localizacao", widget: "string" }
            - { label: "09 · Contato e redes — Título do cartão Telefone", name: "titulo_telefone", widget: "string" }
            - { label: "09 · Contato e redes — Botão Enviar e-mail", name: "botao_enviar_email", widget: "string" }
            - { label: "09 · Contato e redes — Botão Instagram", name: "botao_instagram", widget: "string" }
            - { label: "09 · Contato e redes — Botão mapa", name: "botao_mapa", widget: "string" }

            - { label: "10 · Endereço — Endereço completo (exibido no site e usado no mapa)", name: "endereco_completo", widget: "string", hint: "Concentre aqui o endereço inteiro, incluindo cidade/UF e CEP quando necessário." }
            - label: "10 · Endereço — Tópicos adicionais do endereço"
              name: "topicos_endereco"
              widget: "list"
              collapsed: true
              required: false
              label_singular: "tópico"
              summary: "{{fields.titulo}}"
              hint: "Use para adicionar informações extras, como sala, horário de atendimento ou referência. Cada tópico pode ser removido individualmente."
              fields:
                - { label: "Nome do tópico", name: "titulo", widget: "string" }
                - { label: "Informação", name: "valor", widget: "string" }
            - { label: "11 · Visibilidade das páginas — Ativar conteúdo da página Agenda", name: "mostrar_agenda", widget: "boolean", default: true }
            - { label: "11 · Visibilidade das páginas — Ativar conteúdo da página Linhas de pesquisa", name: "mostrar_linhas", widget: "boolean", default: true }
            - { label: "11 · Visibilidade das páginas — Ativar conteúdo da página Projetos", name: "mostrar_projetos", widget: "boolean", default: true }
            - { label: "11 · Visibilidade das páginas — Ativar conteúdo da página Publicações", name: "mostrar_publicacoes", widget: "boolean", default: true }
            - { label: "11 · Visibilidade das páginas — Ativar conteúdo da página Extensão", name: "mostrar_extensao", widget: "boolean", default: true }
            - { label: "11 · Visibilidade das páginas — Ativar conteúdo da página GPENSC no Ar", name: "mostrar_noar", widget: "boolean", default: true }
            - { label: "11 · Visibilidade das páginas — Ativar conteúdo da página Notícias", name: "mostrar_noticias", widget: "boolean", default: true }
            - { label: "11 · Visibilidade das páginas — Ativar conteúdo da página Contato", name: "mostrar_contato", widget: "boolean", default: true }
            - { label: "11 · Visibilidade das páginas — Ativar conteúdo da página Disciplinas", name: "mostrar_disciplinas", widget: "boolean", default: true }
            - { label: "11 · Visibilidade das páginas — Ativar conteúdo da página Teses e dissertações", name: "mostrar_teses", widget: "boolean", default: true }
            - { label: "11 · Visibilidade das páginas — Ativar conteúdo da página Livros", name: "mostrar_livros", widget: "boolean", default: true }
            - { label: "11 · Visibilidade das páginas — Ativar conteúdo da página Vídeos", name: "mostrar_videos", widget: "boolean", default: true }
            - { label: "11 · Visibilidade das páginas — Ativar conteúdo da página Sites recomendados", name: "mostrar_sites", widget: "boolean", default: true }
            - { label: "12 · Rodapé — Texto de direitos autorais", name: "copyright", widget: "string" }