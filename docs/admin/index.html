<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Administração - Decap CMS</title>
  <!-- 1. Carrega o widget do Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script>
    // 2. Configura a URL da API do Netlify PRIMEIRO
    if (window.netlifyIdentity) {
      window.netlifyIdentity.init({
        APIUrl: "https://sitegpensc.netlify.app/.netlify/identity"
      });

      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.reload();
          });
        }
      });
    }
  </script>

  <!-- 3. Carrega o Decap CMS DEPOIS que o Identity já está configurado -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
